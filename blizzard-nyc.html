/* ───────────────────────── src/world/weathering.js ───────────────────────── */
/* REBOND DE LA NEIGE sur les façades (image modèle : on y lit la brique rouge et les
   escaliers de secours jusqu'au 2e-3e étage). Dans la réalité, la neige au sol renvoie
   la lumière des lampadaires vers le haut ; chez nous les façades tombaient au noir
   dès le premier étage. Deux termes, calculés par pixel, SANS lumière en plus :
   - chaud : la flaque de lumière de chaque lampadaire (grille connue : LAMP_Z0,
     LAMP_PITCH, côté droit décalé d'un demi-pas) éclaire le mur en face, fort au pied,
     qui s'éteint en montant et en s'éloignant du lampadaire le long de la rue ;
   - froid : la lueur du ciel renvoyée par toute la rue enneigée, faible, plus
     présente en bas.
   Seules les faces tournées vers la rue ou vers le sol (dessous des appuis, des
   corniches) le reçoivent. Uniformes PARTAGÉS : un seul réglage pour toute la rue. */
const snowBounce = {
  uBounceWarm: { value: new THREE.Vector3(0.26, 0.17, 0.095) },
  uBounceCool: { value: new THREE.Vector3(0.03, 0.04, 0.062) },
};

/* =====================================================================
   6 quater. VIEILLISSEMENT DES FAÇADES (dans le shader, dans le repère de la rue)
   Une façade new-yorkaise n'est jamais propre et jamais uniforme : la suie noircit
   le haut sous la corniche, la pluie qui ruisselle des appuis de fenêtre dessine
   des coulures sombres sous chacun d'eux, les briques changent de ton par plaques.
   Faire ça dans la texture de brique la rendrait identique tous les 5,5 m ; on le
   fait ici, par pixel, d'après sa POSITION DANS LE MONDE et la géométrie réelle de
   l'immeuble (grille des fenêtres, hauteur). Coût : une lecture de texture et une
   vingtaine d'opérations par pixel de mur.
   ===================================================================== */

/** Greffe le vieillissement sur un MeshStandardMaterial. `p` (tout optionnel) :
 *  top (hauteur du haut de mur, suie sous la corniche), et pour les coulures sous
 *  appuis : z0, pitch, cols (grille des colonnes le long de Z), y0 (premier appui),
 *  floorH, rows, winW. `strength` règle l'ensemble (1 = brique).
 *  `frame` : repère de la rue (Street.frame : cos, sin, x0, z0) — tout le calcul se fait dans
 *  ce repère (façades à x = ±FACADE_X, grille des lampadaires le long de z), donc il vaut
 *  aussi pour une rue tournée ; par défaut celui du monde (rue principale).
 *  `warm` : part du rebond chaud des lampadaires (0 sur une façade sans lampadaires devant :
 *  la grille analytique en inventerait). `faceX` : plan des façades dans ce repère (±FACADE_X par
 *  défaut ; brownstones : reculées de AREA_W derrière leur cour). Uniformes, pas texte du shader :
 *  un seul programme. */
function weather(mat, p = {}) {
  const u = {
    uGrime: { value: grimeTex },
    uTop: { value: p.top ?? 1e4 },                 // par défaut : pas de suie de corniche
    uWin: { value: p.pitch ? 1 : 0 },
    uZ0: { value: p.z0 ?? 0 }, uPitch: { value: p.pitch ?? 1 }, uCols: { value: p.cols ?? 0 },
    uY0: { value: p.y0 ?? 0 }, uFloorH: { value: p.floorH ?? 1 }, uRows: { value: p.rows ?? 0 }, uWinW: { value: p.winW ?? 1 },
    uStrength: { value: p.strength ?? 1 },
    uEscZ: { value: p.escZ ?? 0 }, uEscW: { value: p.escW ?? 0 }, uEscY0: { value: p.escY0 ?? 0 }, uEscN: { value: p.escN ?? 0 },
    uFrame: { value: p.frame ?? new THREE.Vector4(1, 0, 0, 0) }, uWarm: { value: p.warm ?? 1 },
    uFaceX: { value: p.faceX ?? FACADE_X },          // plan des façades de la rue (brownstones : reculées derrière leur cour)
  };
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, u, snowBounce);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos; varying vec3 vWNrm; uniform vec4 uFrame;')
      // vWPos / vWNrm : position et normale dans le REPÈRE DE LA RUE (le monde, pour la rue principale)
      .replace('#include <project_vertex>', `#include <project_vertex>
        {
          vec4 wpF = modelMatrix * vec4(transformed, 1.0);
          vec2 dF = wpF.xz - uFrame.zw;
          vWPos = vec3(uFrame.x * dF.x - uFrame.y * dF.y, wpF.y, uFrame.y * dF.x + uFrame.x * dF.y);
          vec3 nF = normalize(mat3(modelMatrix) * objectNormal);
          vWNrm = vec3(uFrame.x * nF.x - uFrame.y * nF.z, nF.y, uFrame.y * nF.x + uFrame.x * nF.z);
        }`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; varying vec3 vWNrm;
        uniform sampler2D uGrime;
        uniform float uTop, uWin, uZ0, uPitch, uCols, uY0, uFloorH, uRows, uWinW, uStrength, uEscZ, uEscW, uEscY0, uEscN, uWarm, uFaceX;
        uniform vec3 uBounceWarm, uBounceCool;`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          float sideB = vWPos.x < 0.0 ? -1.0 : 1.0;
          // faces vers la rue (normale opposée au côté) ou vers le sol
          float faceB = max(max(-sideB * vWNrm.x, 0.0), max(-vWNrm.y, 0.0));
          float yB = max(vWPos.y, 0.0);
          // lampadaire le plus proche de ce côté-ci : écart le long de la rue
          float z0B = ${LAMP_Z0.toFixed(2)} + (sideB > 0.0 ? ${(LAMP_PITCH / 2).toFixed(2)} : 0.0);
          float dzB = vWPos.z - z0B - ${LAMP_PITCH.toFixed(2)} * floor((vWPos.z - z0B) / ${LAMP_PITCH.toFixed(2)} + 0.5);
          // distance à la façade : le rebond concerne les murs de rue, pas l'intérieur des îlots
          float nearB = 1.0 - smoothstep(1.5, 4.0, abs(abs(vWPos.x) - uFaceX));
          float warmB = exp(-dzB * dzB / 24.0) / (1.0 + yB * yB / 14.0);
          float coolB = exp(-yB / 9.0);
          reflectedLight.indirectDiffuse += diffuseColor.rgb * faceB * nearB * (uBounceWarm * warmB * uWarm + uBounceCool * coolB);
        }`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        {
          bool facadeX = abs(vWNrm.x) > 0.5;                      // façade sur rue (plan YZ) ?
          vec2 wuv = facadeX ? vWPos.zy : vWPos.xy;
          vec3 gm = texture2D(uGrime, wuv / 17.0).rgb;
          float f = mix(0.7, 1.16, gm.r);                        // plaques : casse la répétition de la brique
          f *= 1.0 - 0.28 * gm.g;                                 // coulures verticales partout
          float soot = smoothstep(uTop - 3.2, uTop - 0.2, vWPos.y); // suie sous la corniche
          f *= 1.0 - 0.5 * soot * (0.55 + 0.45 * gm.g);
          if (uWin > 0.5 && facadeX) {
            // coulures sous les appuis : colonne et étage de la fenêtre la plus proche au-dessus
            float zl = (vWPos.z - uZ0) / uPitch, col = floor(zl);
            float dz = abs(fract(zl) - 0.5) * uPitch;            // écart horizontal à l'axe de la fenêtre
            float r = ceil((vWPos.y - uY0) / uFloorH);           // appui situé au-dessus du point
            float dy = uY0 + r * uFloorH - vWPos.y;               // distance sous cet appui
            if (col >= 0.0 && col < uCols && r >= 0.0 && r < uRows) {
              float n = texture2D(uGrime, vec2(vWPos.z * 0.9, vWPos.y * 0.05)).b;        // irrégularité, étirée en hauteur
              float ends = exp(-pow((dz - uWinW * 0.46) / 0.07, 2.0));                   // deux traînées aux bouts de l'appui
              float wash = 1.0 - smoothstep(uWinW * 0.25, uWinW * 0.55, dz);             // voile plus large au milieu
              float fall = exp(-dy / (0.9 + 1.5 * n));                                   // s'efface en descendant
              f *= 1.0 - 0.7 * clamp((1.0 * ends + 0.55 * wash) * fall * (0.45 + 0.9 * n), 0.0, 1.0);
            }
          }
          diffuseColor.rgb *= mix(1.0, f, uStrength);
          // rouille de l'escalier de secours : l'eau qui ruisselle des paliers en fonte
          // teinte la brique en brun-orangé sous chacun d'eux, en traînées verticales
          if (uEscN > 0.5 && facadeX && abs(vWPos.z - uEscZ) < uEscW * 0.5 + 0.15) {
            float re = ceil((vWPos.y - uEscY0) / 3.2), dyE = uEscY0 + re * 3.2 - vWPos.y;
            if (re >= 0.0 && re < uEscN) {
              float streak = smoothstep(0.12, 0.55, texture2D(uGrime, vec2(vWPos.z * 1.9, vWPos.y * 0.04)).g);
              float ends = exp(-pow((abs(vWPos.z - uEscZ) - uEscW * 0.5 + 0.05) / 0.12, 2.0));   // sous les consoles
              float rust = clamp((0.8 * streak + 0.9 * ends) * exp(-dyE / 1.8), 0.0, 1.0) * uStrength;
              diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.3, 0.12, 0.05), rust * 0.72);
            }
          }
        }`);
  };
  return mat;
}

/** Variante pour le SOL (trottoirs, chaussée) : la tuile de trottoir se répète tous
 *  les 4,5 m, ses flaques et ses pistes aussi. On module donc, en coordonnées monde
 *  (x, z), la teinte (plaques plus ou moins piétinées) et on ajoute des zones plus
 *  humides — plus sombres et plus lisses, donc qui accrochent les reflets des
 *  lampadaires — là où la carte de salissure est basse. */
function groundWeather(mat, strength = 1) {
  const u = {
    uGrime: { value: grimeTex }, uGStrength: { value: strength },
    // mode PHOTO (voir groundPhoto) : la photo devient la texture de base, et l'ancienne
    // texture canvas (zones, empreintes, ornières, sel) est MULTIPLIÉE par-dessus
    uPhotoOn: { value: 0 }, uPhotoRepeat: { value: new THREE.Vector2(1, 1) },
    uOverlay: { value: mat.map }, uOverlayRepeat: { value: new THREE.Vector2(1, 1) },
    uSnowB: { value: mat.map }, uBlendOn: { value: 0 },
    uGainA: { value: new THREE.Vector3(1, 1, 1) }, uGainB: { value: new THREE.Vector3(1, 1, 1) },   // normalisation des photos
    // trottoir : bande (u) où la 2e photo prend le relais, contraste de la 1re photo,
    // relief tiré du canvas (empreintes) ajouté à celui de la photo
    uBlendU: { value: new THREE.Vector2(0.6, 0.88) }, uMeanA: { value: new THREE.Vector3(1, 1, 1) }, uContrastA: { value: 1 },
    uOvNrmK: { value: 0 },
  };
  mat.userData.groundUniforms = u;
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, u);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vGPos;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvGPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vGPos; uniform sampler2D uGrime, uOverlay, uSnowB; uniform float uGStrength, uPhotoOn, uBlendOn;
        uniform vec2 uPhotoRepeat, uOverlayRepeat, uBlendU; uniform vec3 uGainA, uGainB, uMeanA; uniform float uContrastA, uOvNrmK;`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        float gOvH = 0.0;                                                     // « hauteur » lue dans le canvas (relief des traces)
        #ifdef USE_MAP
        if (uPhotoOn > 0.5) {
          vec2 uv0 = vMapUv / uPhotoRepeat;                                   // UV d'origine du plan
          diffuseColor.rgb *= uGainA;                                         // photo ramenée à la teinte voulue
          diffuseColor.rgb = mix(uMeanA * diffuse, diffuseColor.rgb, uContrastA);   // contraste réduit (grains sombres de la neige tassée)
          // trottoir : neige fraîche (2e photo) sur presque toute la largeur, neige tassée
          // seulement le long de la bordure ; limite irrégulière (bruit monde), jamais un trait net
          if (uBlendOn > 0.5) {
            float nB = texture2D(uGrime, vGPos.xz / 6.0).b;
            float wB = smoothstep(uBlendU.x, uBlendU.y, uv0.x + (nB - 0.5) * 0.2);
            diffuseColor.rgb = mix(diffuseColor.rgb, texture2D(uSnowB, vMapUv).rgb * uGainB * diffuse, wB);
          }
          // détails du canvas (empreintes, ornières, gadoue, sel) ; sa neige propre ≈ 1
          vec3 ov = texture2D(uOverlay, uv0 * uOverlayRepeat).rgb / vec3(0.76, 0.807, 0.871);
          diffuseColor.rgb *= clamp(ov, 0.0, 1.15);
          gOvH = dot(ov, vec3(0.3, 0.4, 0.3));                                // empreintes = creux sombres, rebords clairs
        }
        #endif
        vec3 gGm = texture2D(uGrime, vGPos.xz / 9.0).rgb;
        float gWet = (1.0 - smoothstep(0.0, 0.1, gGm.r)) * uGStrength;            // zones humides (rares)
        diffuseColor.rgb *= mix(1.0, mix(0.93, 1.04, gGm.r), uGStrength) * (1.0 - 0.15 * gWet);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor *= 1.0 - 0.4 * gWet;`)
      // relief : en mode photo, la normal map est celle de la photo et les traces de pas du
      // canvas n'étaient plus que des taches. On leur rend du volume par « bump » en dérivées
      // écran de la teinte du canvas (déjà lue) : AUCUNE texture en plus — le shader du sol
      // est à la limite des 16 textures (cartes d'ombre des lampadaires comprises).
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        if (uOvNrmK > 0.0) {
          vec2 dH = vec2(dFdx(gOvH), dFdy(gOvH)) * 0.06 * uOvNrmK;
          vec3 sX = dFdx(-vViewPosition), sY = dFdy(-vViewPosition);
          vec3 R1 = cross(sY, normal), R2 = cross(normal, sX);
          float det = dot(sX, R1);
          normal = normalize(abs(det) * normal - sign(det) * (dH.x * R1 + dH.y * R2));
        }`);
  };
  return mat;
}

/** Passe un matériau de sol (déjà traité par groundWeather) en mode photo : la photo
 *  `name` en texture de base, répétée ru × rv sur le plan ; l'ancienne texture canvas
 *  multipliée par-dessus avec sa répétition d'origine ; `blendWith` : 2e photo mélangée
 *  côté façade (trottoir). Si les photos ne chargent pas, rien ne change. */
function groundPhoto(mat, name, ru, rv, blendWith = null, target = [0.8, 0.83, 0.88], opts = {}) {
  const u = mat.userData.groundUniforms, overlay = mat.map, ovRepeat = mat.map.repeat.clone();
  if (opts.blendU) u.uBlendU.value.set(...opts.blendU);
  u.uMeanA.value.set(...target); u.uContrastA.value = opts.contrast ?? 1;
  // gain par canal = teinte voulue / moyenne de la photo (borné : on corrige, on ne réinvente pas)
  const gain = (tex, out) => { const m = photoMean(tex); out.set(...target.map((t, i) => Math.min(2.5, Math.max(0.4, t / Math.max(1e-3, m.getComponent(i)))))); };
  const apply = setB => usePhoto(mat, name, ru, rv, (mm, s) => {
    u.uOverlay.value = overlay; u.uOverlayRepeat.value.copy(ovRepeat);
    u.uOvNrmK.value = opts.overlayRelief ?? 0;
    u.uPhotoRepeat.value.set(ru, rv); u.uPhotoOn.value = 1;
    gain(s.map, u.uGainA.value);
    if (setB) { const b = setB.map.clone(); b.repeat.set(ru, rv); b.needsUpdate = true; u.uSnowB.value = b; u.uBlendOn.value = 1; gain(setB.map, u.uGainB.value); }
  });
  if (blendWith) loadPhotoSet(blendWith).then(apply).catch(() => apply(null)); else apply(null);
}

/* ───────────────────────── src/world/street.js ───────────────────────── */
/* =====================================================================
   5 bis. RUES : un repère par rue
   Tout le code du décor raisonne dans le repère d'UNE rue : x en travers (façades à
   ±FACADE_X, côté −1 / +1), z le long de la rue, le joueur regardant vers −z. La rue
   principale est ce repère lui-même ; une autre rue est ce même repère TOURNÉ d'un quart
   de tour (les boîtes de collision restent alors alignées sur les axes du monde) et
   déplacé. Ses objets sont rangés dans un groupe qui porte cette transformation : le
   même code construit les deux rues. Ce qui vit en coordonnées MONDE passe par les
   méthodes ci-dessous : collisions, emprises des sujets photo, sources de lumière,
   ombres de contact, et le vieillissement des façades (uniforme `frame`, weathering.js).
   ===================================================================== */
class Street {
  constructor(name, { angle = 0, x0 = 0, z0 = 0 } = {}) {
    this.name = name;
    this.angle = angle;
    this.c = Math.round(Math.cos(angle)); this.s = Math.round(Math.sin(angle));   // quarts de tour seulement
    this.x0 = x0; this.z0 = z0;
    this.group = new THREE.Group(); this.group.name = `rue-${name}`;
    this.group.rotation.y = angle; this.group.position.set(x0, 0, z0);
    this.group.updateMatrix(); this.group.updateMatrixWorld(true);
    this.frame = new THREE.Vector4(this.c, this.s, x0, z0);   // monde → rue, pour les shaders
    this.doorZones = [];                                        // perrons et portes à garder libres (props.js)
    // objets de la rue posés en coordonnées MONDE (ombres de contact) : groupe sans transformation,
    // à part pour être masqué avec la rue (voir updateStreetVisibility)
    this.worldGroup = new THREE.Group(); this.worldGroup.name = `rue-${name}-monde`;
    scene.add(this.group); scene.add(this.worldGroup);
  }
  /** Repère de la rue → monde. */
  wx(lx, lz) { return this.c * lx + this.s * lz + this.x0; }
  wz(lx, lz) { return -this.s * lx + this.c * lz + this.z0; }
  /** Monde → repère de la rue. */
  lx(x, z) { return this.c * (x - this.x0) - this.s * (z - this.z0); }
  lz(x, z) { return this.s * (x - this.x0) + this.c * (z - this.z0); }
  toWorld(v) { return new THREE.Vector3(this.wx(v.x, v.z), v.y, this.wz(v.x, v.z)); }
  add(o) { this.group.add(o); return o; }
  /** Boîte de collision donnée dans le repère de la rue (centre, demi-largeurs). */
  collider(cx, cz, hw, hd) {
    const x = this.wx(cx, cz), z = this.wz(cx, cz);
    if (this.s !== 0) addCollider(x, z, hd, hw); else addCollider(x, z, hw, hd);
  }
  /** Box3 du repère de la rue → Box3 monde. */
  box(b) {
    const a = this.toWorld(b.min), c = this.toWorld(b.max);
    return new THREE.Box3(a.clone().min(c), a.max(c));
  }
}

// La rue principale (repère du monde) et la rue de gauche, au-delà des feux : un quart de
// tour, son axe sur celui de la transversale (z = CROSS_Z). Son côté −1 est celui des feux
// (façades à z = CROSS_Z + FACADE_X), son côté +1 celui d'en face ; elle file vers −x.
const MAIN = new Street('principale');
const LEFT = new Street('gauche', { angle: Math.PI / 2, z0: CROSS_Z });
// Fond de la rue de gauche : une rangée de façades qui la ferme (impasse), construite comme un
// côté −1 d'une rue parallèle à la rue principale, décalée pour que ses façades tombent à x = LEFT_END_X.
const LEFT_END = new Street('fond-gauche', { x0: LEFT_END_X + FACADE_X });
// Rue de droite (brownstones) : le quart de tour inverse, même axe. Elle file vers +x (z de la rue
// = −x monde) ; son côté −1 est celui d'en face (z = CROSS_Z − FACADE_X), son côté +1 celui des feux.
const RIGHT = new Street('droite', { angle: -Math.PI / 2, z0: CROSS_Z });
// Tronçons de la rue de gauche (repère de la rue, z = x monde) : ses fusions d'objets (pierre,
// fonte, fenêtres…) sont faites par tronçon, pour pouvoir masquer ceux qu'on ne peut pas voir.
const LEFT_CHUNKS = [-80, -50, -20];
// Tronçons de la rue de droite (z de la rue = −x monde)
const RIGHT_CHUNKS = [-56, -34];

/* --- Ce qui ne peut pas se voir n'est pas dessiné ----------------------------------------
   Les rues secondaires sont sur l'axe de la transversale ; la rue principale y débouche entre
   deux immeubles d'angle. Selon l'endroit où se trouve la caméra :
   - DANS LA RUE PRINCIPALE, on ne voit une rue secondaire que par l'OUVERTURE du carrefour.
     Au mieux — depuis le trottoir opposé —, la droite qui passe par le coin de l'immeuble d'angle
     atteint l'alignement d'en face (zF : la ligne de façades la plus reculée de cette rue) en
       xFar = FACADE_X − 2·FACADE_X·(z − zF) / (z − façade côté feux)   (rue de gauche, symétrique à droite) :
     −16,5 m depuis le départ, −45 m depuis z = −70, tout au coin. Ce qui est entièrement au-delà
     (bord le plus proche du carrefour) est masqué.
   - DANS UNE RUE SECONDAIRE, c'est la rue principale qu'on ne voit que par le carrefour : un point
     (x, z) de la rue principale n'est visible que si la droite qui y mène passe devant l'immeuble
     d'angle, soit au mieux (point sur l'alignement d'en face) z ≤ zc + (|xc| + FACADE_X)·(façade
     côté feux − zc) / (|xc| − FACADE_X). Depuis le milieu de la rue de droite, toute la rue
     principale au-delà des premiers mètres est masquée.
   - PARTOUT, ce que la brume efface (au-delà de 100 m : 99,5 % de brouillard) est masqué : les
     deux rues secondaires sont dans le même axe et se voient l'une l'autre de loin.
   Bords d'après les sphères englobantes (celles du test de champ de Three, déjà calculées à la
   1re image) : une boîte exacte parcourait les sommets de 600 objets — 1 s figée au départ.
   Appelé à chaque image APRÈS la préparation (preload.js compile et prépare tout, masqué ou
   non) ; ne coûte qu'une comparaison par objet quand la caméra a bougé de 40 cm. */
const ZONED = [MAIN, LEFT, LEFT_END, RIGHT];
const FOG_CULL = 100;
let zoneItems = null, zoneLast = new THREE.Vector2(1e9, 1e9);
const zoneSphere = new THREE.Sphere();
const streetZones = { where: '', xFarL: -Infinity, xFarR: Infinity, zMain: Infinity, hidden: 0, onChange: null };
function updateStreetVisibility(camera) {
  const cx = camera.position.x, cz = camera.position.z;
  if (Math.abs(cx - zoneLast.x) + Math.abs(cz - zoneLast.y) < 0.4) return;
  zoneLast.set(cx, cz);
  if (!zoneItems) {                                      // bords monde, calculés une fois (matrices figées)
    zoneItems = [];
    for (const st of ZONED) for (const grp of [st.group, st.worldGroup]) for (const o of grp.children) {
      let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
      o.traverse(m => {
        if (!m.isMesh && !m.isPoints) return;
        const s = m.isInstancedMesh ? (m.boundingSphere ?? (m.computeBoundingSphere(), m.boundingSphere)) : (m.geometry.boundingSphere ?? (m.geometry.computeBoundingSphere(), m.geometry.boundingSphere));
        zoneSphere.copy(s).applyMatrix4(m.matrixWorld);
        const c = zoneSphere.center, r = zoneSphere.radius;
        x0 = Math.min(x0, c.x - r); x1 = Math.max(x1, c.x + r); z0 = Math.min(z0, c.z - r); z1 = Math.max(z1, c.z + r);
      });
      if (x1 > -Infinity) zoneItems.push({ o, main: st === MAIN, side: st === MAIN ? 0 : st === RIGHT ? 1 : -1, x0, x1, z0, z1 });
    }
  }
  const F = FACADE_X, nearZ = CROSS_Z + F, farL = CROSS_Z - F, farR = CROSS_Z - F - AREA_W;
  let where = 'carrefour', xFarL = -Infinity, xFarR = Infinity, zMain = Infinity;
  if (cz > nearZ + 0.3 && Math.abs(cx) < F) {
    where = 'principale';
    xFarL = F - 2 * F * (cz - farL) / (cz - nearZ);
    xFarR = -F + 2 * F * (cz - farR) / (cz - nearZ);
  } else if (Math.abs(cx) > F + 0.3 && cz < nearZ) {
    where = cx < 0 ? 'gauche' : 'droite';
    zMain = cz + (Math.abs(cx) + F) * (nearZ - cz) / (Math.abs(cx) - F);
  }
  const was = streetZones.where;
  Object.assign(streetZones, { where, xFarL, xFarR, zMain });
  let hidden = 0;
  for (const it of zoneItems) {
    // distance horizontale de la caméra à la boîte (0 dedans)
    const dx = Math.max(it.x0 - cx, 0, cx - it.x1), dz = Math.max(it.z0 - cz, 0, cz - it.z1);
    let vis = dx * dx + dz * dz < FOG_CULL * FOG_CULL;
    if (vis) {
      if (it.side < 0) vis = it.x1 >= xFarL - 1;
      else if (it.side > 0) vis = it.x0 <= xFarR + 1;
      else vis = it.z0 <= zMain + 1;
    }
    it.o.visible = vis; if (!vis) hidden++;
  }
  streetZones.hidden = hidden;
  if (was && was !== where && streetZones.onChange) streetZones.onChange(where);   // ombres de la lune à refaire (lightPool)
}

/* ───────────────────────── src/world/ground.js ───────────────────────── */
/* =====================================================================
   5. SOL : neige déformée (congères, sillons de pneus), trottoirs, bordures
   ===================================================================== */
/* Lueur propre de la neige : une nuit de tempête en ville, la neige renvoie la lueur
   orangée-bleutée du ciel bas de tous côtés, et elle reste LISIBLE même loin des
   lampadaires — gris-bleu, jamais noire (voir la référence). Émissif très faible,
   modulé par la texture (les empreintes restent visibles) ; ne rehausse rien d'autre
   que la neige, donc la scène reste aussi nocturne. */
const SNOW_SKYGLOW = new THREE.Color(0.05, 0.06, 0.085);
/** Plaques d'égout (x, z monde) : la vapeur chaude fait fondre la neige autour, la
 *  plaque reste à nu sur l'asphalte mouillé. Partagé avec fx/steam.js, qui pose les
 *  plaques et les panaches exactement là où la chaussée a été creusée. */
const MANHOLES = [[-1.6, -7], [1.7, -31], [-1.3, -57]];

// Carrefour : bordures et façades de la transversale (z), lignes de façade de la rue principale (x)
const CURB_N = CROSS_Z + ROAD_HALF, CURB_F = CROSS_Z - ROAD_HALF;      // −90 (côté joueur) / −102
const FACE_N = CROSS_Z + FACADE_X, FACE_F = CROSS_Z - FACADE_X;        // −84,8 / −107,2
// Origine du bruit le long de chaque rue (la rue principale garde la sienne : même relief qu'avant)
MAIN.noiseZ0 = -25; LEFT.noiseZ0 = 40; RIGHT.noiseZ0 = -70;
RIGHT.area = true;                                     // cours anglaises entre la grille (±FACADE_X) et les maisons
// Longueur de RÉFÉRENCE des matériaux de sol : leur répétition de texture est réglée pour elle,
// et chaque plan met ses UV à l'échelle de sa propre longueur. Une seule série de matériaux
// pour toutes les rues, des tuiles de même taille partout.
const GROUND_REF = 152;

/* Hauteur de la neige, dans le repère d'une rue (x en travers, zl le long, relatif à
   l'origine du bruit). Ces fonctions servent à la fois à déplacer les vertex des plans et
   à poser au sol tout ce qui doit épouser le relief (ombres de contact) : une seule
   source de vérité, sinon les décalques flottent ou s'enterrent dans les creux. */
function roadSnowY(x, zl, manholes) {
  // trois octaves : grandes ondulations, mottes, granulé — la chaussée de la
  // référence est de la neige labourée, pas une surface lisse
  // couche de neige épaisse (~8 cm de base) et bosselée : sur la référence la
  // chaussée est BLANCHE, labourée, pas une gadoue grise et plate
  let y = 0.06 + smoothNoise(x * 0.5, zl * 0.5) * 0.12 + smoothNoise(x * 1.7, zl * 1.4) * 0.06
        + smoothNoise(x * 4.5, zl * 4.5) * 0.025 + smoothNoise(x * 11, zl * 11) * 0.008;
  // ornières : deux voies, deux traces par voie — EXACTEMENT là où la texture de
  // chaussée dessine l'asphalte mouillé (x = ±0,8 et ±2,4)
  for (const rx of [-2.4, -0.8, 0.8, 2.4]) { const d = Math.abs(x - rx); y -= 0.09 * Math.exp(-d * d * 18); }
  for (const bx of [-3.4, -1.6, 0, 1.6, 3.4]) { const d = Math.abs(x - bx); y += 0.05 * Math.exp(-d * d * 6); }   // bourrelets repoussés entre les traces
  y -= 0.03 * Math.exp(-x * x * 0.35);                                      // léger creux au milieu de la chaussée
  // cratère de fonte autour des plaques d'égout (rue principale) : la neige retombe à zéro en ~1 m
  if (manholes) for (const [mx, mz] of MANHOLES) {
    const d = Math.hypot(x - mx, zl + MAIN.noiseZ0 - mz);
    if (d < 1.5) y *= THREE.MathUtils.smoothstep(d, 0.5, 1.45);
  }
  // La chaussée reste BASSE jusqu'à la bordure : c'est le décrochement (face de la
  // bordure + bourrelet de déneigement) qui sépare route et trottoir, pas une pente.
  return y;
}
/* Neige du trottoir, comme sur la référence : une couche épaisse, des CONGÈRES qui
   montent contre les façades (jusqu'à ~40 cm, plus ou moins selon l'endroit), un
   SENTIER piétiné un peu creusé au milieu, des mottes partout. */
function walkSnowY(lx, zl, s) {
  // 0 côté rue, 1 côté façade — BORNÉ : le plan déborde de 10 cm et Math.pow(u < 0, 2.4) = NaN
  const u = Math.min(1, Math.max(0, (lx * s + SIDEWALK_W / 2) / SIDEWALK_W));
  const drift = Math.pow(u, 2.4) * 0.34 * (0.55 + 0.9 * smoothNoise(zl * 0.22 + s * 7, 3.1));
  const path = -0.06 * Math.exp(-Math.pow((u - 0.45) / 0.17, 2)) * (0.6 + 0.8 * smoothNoise(zl * 0.5, s * 5));
  return 0.05 + drift + path
       + smoothNoise(lx * 0.8 + s * 9, zl * 0.6) * 0.09 + smoothNoise(lx * 2.2, zl * 2.2) * 0.05
       + smoothNoise(lx * 6 + s * 4, zl * 6) * 0.02 + smoothNoise(lx * 14, zl * 14) * 0.007;
}
/* Neige d'une COUR ANGLAISE de brownstone (rue de droite), entre la grille et la maison : personne
   n'y marche — une couche épaisse et lisse, une congère contre la façade, un bourrelet le long du
   muret de la grille. d : distance à la grille (0 → AREA_W au pied de la maison). */
function areaSnowY(d, zl, s) {
  const u = Math.min(1, Math.max(0, d / AREA_W));
  return SIDEWALK_H + 0.2 + 0.36 * Math.pow(u, 3) * (0.55 + 0.9 * smoothNoise(zl * 0.25 + s * 3, 1.7))
       + 0.12 * Math.exp(-d * 3) + smoothNoise(d * 1.1 + s * 5, zl * 0.7) * 0.08 + smoothNoise(d * 3.2, zl * 3.1) * 0.025;
}
/** Hauteur du sol d'une rue, dans son repère (lx, lz), hors raccords de carrefour. */
function streetGroundY(st, lx, lz) {
  const zl = lz - st.noiseZ0;
  if (Math.abs(lx) < ROAD_HALF) return roadSnowY(lx, zl, st === MAIN);
  const s = lx < 0 ? -1 : 1;
  if (st.area && Math.abs(lx) > FACADE_X) return areaSnowY(Math.abs(lx) - FACADE_X, zl, s);
  return SIDEWALK_H + walkSnowY(lx - s * (ROAD_HALF + SIDEWALK_W / 2), zl, s);
}
const leftY = (x, z) => streetGroundY(LEFT, LEFT.lx(x, z), LEFT.lz(x, z));
const rightY = (x, z) => streetGroundY(RIGHT, RIGHT.lx(x, z), RIGHT.lz(x, z));
/** Chaussée de la rue principale, prolongée telle quelle dans le carrefour. */
const mainRoadY = (x, z) => roadSnowY(x, z - MAIN.noiseZ0, true);
/** Chaussée de la rue de gauche : ses 3 derniers mètres se fondent dans celle du carrefour. */
function leftRoadY(x, z) {
  const hL = roadSnowY(LEFT.lx(x, z), LEFT.lz(x, z) - LEFT.noiseZ0, false);
  const t = THREE.MathUtils.smoothstep(x, -ROAD_HALF - 3.15, -ROAD_HALF - 0.15);
  return t > 0 ? THREE.MathUtils.lerp(hL, mainRoadY(x, z), t) : hL;
}
/** Idem pour la rue de droite. */
function rightRoadY(x, z) {
  const hR = roadSnowY(RIGHT.lx(x, z), RIGHT.lz(x, z) - RIGHT.noiseZ0, false);
  const t = 1 - THREE.MathUtils.smoothstep(x, ROAD_HALF + 0.15, ROAD_HALF + 3.15);
  return t > 0 ? THREE.MathUtils.lerp(hR, mainRoadY(x, z), t) : hR;
}
/* Parc, derrière la grille : neige intacte (personne n'y est passé), grandes ondulations douces,
   un peu plus épaisse que dans la rue. Personne n'y marche : sert aux décalques et au sol du parc. */
function parkY(x, z) {
  return 0.24 + smoothNoise(x * 0.09, z * 0.09) * 0.42 + smoothNoise(x * 0.37 + 4, z * 0.33) * 0.12
       + smoothNoise(x * 1.6, z * 1.5) * 0.025;
}
/* Les deux coins de trottoir du carrefour : la neige y passe en fondu de celle d'une rue à
   celle de l'autre. Poids w = 1 sur le bord qui touche le trottoir de la rue de gauche, 0 sur
   celui qui touche la rue principale, quelle que soit la position le long de ces bords : les
   raccords sont exacts, sans marche. a, b : 0 → 1 en travers de chaque trottoir. */
function cornerNearY(x, z) {     // coin côté feux, à gauche : bordures sur deux côtés
  const a = (-ROAD_HALF - x) / SIDEWALK_W, b = (z - CURB_N) / SIDEWALK_W;
  const w = a * (1 - b) / (a * (1 - b) + b * (1 - a) + 1e-6);
  return THREE.MathUtils.lerp(streetGroundY(MAIN, x, z), leftY(x, z), w);
}
function cornerNearRY(x, z) {    // son symétrique, au coin de la rue de droite
  const a = (x - ROAD_HALF) / SIDEWALK_W, b = (z - CURB_N) / SIDEWALK_W;
  const w = a * (1 - b) / (a * (1 - b) + b * (1 - a) + 1e-6);
  return THREE.MathUtils.lerp(streetGroundY(MAIN, x, z), rightY(x, z), w);
}
/** Trottoir d'en face, en face de la rue principale : celui de la rue de gauche (jusqu'à
 *  x = ROAD_HALF) passe en fondu à celui de la rue de droite (dès x = FACADE_X), sans marche. */
function farBlendY(x, z) {
  return THREE.MathUtils.lerp(leftY(x, z), rightY(x, z), THREE.MathUtils.smoothstep(x, ROAD_HALF, FACADE_X));
}

/** Hauteur du sol en coordonnées MONDE (rue principale, carrefour, rues de gauche et de droite, parc). */
function groundY(x, z) {
  const ax = Math.abs(x);
  // rues secondaires, au-delà des façades de la rue principale (cours anglaises de la rue de droite
  // comprises : côté feux, elles dépassent l'alignement z = FACE_N)
  if (ax > FACADE_X && z < FACE_N + (x > 0 ? AREA_W : 0)) {
    if (x > RIGHT_END_X) return parkY(x, z);
    return x < 0 ? leftY(x, z) : rightY(x, z);
  }
  if (z > FACE_N) return streetGroundY(MAIN, x, z);
  if (z >= CURB_N) {                                      // bande du trottoir côté feux
    if (ax <= ROAD_HALF) return streetGroundY(MAIN, x, z);
    return x < 0 ? cornerNearY(x, z) : cornerNearRY(x, z);
  }
  if (z >= CURB_F) {                                      // chaussée de la transversale
    if (ax <= ROAD_HALF + 0.15) return mainRoadY(x, z);   // carrefour
    return x < 0 ? leftRoadY(x, z) : rightRoadY(x, z);
  }
  if (z >= FACE_F) return x <= ROAD_HALF ? leftY(x, z) : farBlendY(x, z);   // trottoir d'en face
  return 0;
}
/** Distance (m) au bord de chaussée le plus proche, côté trottoir (< 0 sur la chaussée) :
 *  sert à la hauteur des yeux du joueur (player/controls.js), même découpage que groundY. */
function curbDistance(x, z) {
  const ax = Math.abs(x);
  if (z > FACE_N) return ax - ROAD_HALF;
  if (z >= CURB_N) {
    if (ax <= ROAD_HALF) return ax - ROAD_HALF;
    if (ax <= FACADE_X) return Math.min(ax - ROAD_HALF, z - CURB_N);
    return z - CURB_N;
  }
  if (z >= CURB_F) return -Math.min(z - CURB_F, CURB_N - z);
  return CURB_F - z;
}

/* ---------------------------------------------------------------------
   Matériaux partagés (répétitions réglées pour GROUND_REF)
   --------------------------------------------------------------------- */
// Chaussée : neige tassée, ornières grises ; la texture couvre toute la largeur, tuile de 12,3 m en long
for (const t of [snowRoad.map, snowRoad.normal, snowRoad.rough]) t.repeat.set(1, GROUND_REF / 12.3);
const roadMat = groundWeather(new THREE.MeshStandardMaterial({
  map: snowRoad.map, normalMap: snowRoad.normal, normalScale: new THREE.Vector2(0.9, 0.9), roughnessMap: snowRoad.rough, roughness: 1, color: 0xdce2eb, emissiveMap: snowRoad.map, emissive: SNOW_SKYGLOW }));
// photo : neige damée sur asphalte (tuile de 2 m) ; ornières et gadoue du canvas par-dessus
groundPhoto(roadMat, 'asphalt_snow', (2 * ROAD_HALF + 0.3) / 2, GROUND_REF / 2, null, [0.62, 0.65, 0.7]);   // plus grise que le trottoir
// Trottoirs : neige vallonnée, plus épaisse près des façades — et nettement plus BLANCHE que la chaussée
// la texture couvre toute la largeur du trottoir (bordure → façade), tuile de 4,5 m en long (3 dalles)
for (const t of [snowWalk.map, snowWalk.normal, snowWalk.rough]) t.repeat.set(1, GROUND_REF / 4.5);
const walkMat = groundWeather(new THREE.MeshStandardMaterial({ map: snowWalk.map, normalMap: snowWalk.normal, normalScale: new THREE.Vector2(0.9, 0.9), roughnessMap: snowWalk.rough, roughness: 1, color: 0xf2f5fa, emissiveMap: snowWalk.map, emissive: SNOW_SKYGLOW }));   // la surface la plus claire du cadre
// photo : neige tassée (sentier, côté rue) mélangée à la neige fraîche côté façade (tuiles de 2 m)
// comme sur le modèle : neige fraîche blanche sur presque toute la largeur (la neige tassée, grise
// et granuleuse, ne reste qu'en bande étroite contre la bordure, contraste réduit de moitié),
// traces de pas du canvas creusées en relief
groundPhoto(walkMat, 'snow_floor', (SIDEWALK_W + 0.2) / 2, GROUND_REF / 2, 'snow_02', [0.8, 0.83, 0.88], { blendU: [0.06, 0.28], contrast: 0.5, overlayRelief: 1 });
// Bourrelet de déneigement : neige sale poussée par la lame contre la bordure, irrégulier,
// avec des trouées (passages piétons dégagés, places où une voiture stationnait).
const ridgeMat = groundWeather(new THREE.MeshStandardMaterial({ map: snowRoad.map.clone(), normalMap: snowRoad.normal.clone(), normalScale: new THREE.Vector2(0.9, 0.9), color: 0xe2e7ef, roughness: 1, emissiveMap: snowRoad.map.clone(), emissive: SNOW_SKYGLOW }), 0.6);   // neige repoussée, blanche
for (const tx of [ridgeMat.map, ridgeMat.normalMap]) { tx.repeat.set(0.15, GROUND_REF / 12.3); tx.needsUpdate = true; }   // la bande propre, le long des voitures
groundPhoto(ridgeMat, 'snow_03', 1.8 / 2, GROUND_REF / 2, null, [0.72, 0.75, 0.8]);      // photo : neige grumeleuse, blanchie

/** UV v d'un plan de longueur len mises à l'échelle de la longueur de référence. */
function scaleV(g, len) { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) * len / GROUND_REF); }

/* ---------------------------------------------------------------------
   Sol d'une rue, dans son repère : chaussée, trottoirs, bordures, bourrelets.
   Chaque pièce a sa propre étendue le long de la rue (carrefour, impasse) ; `roadY(lx, lz)`
   donne la hauteur de la chaussée (raccords compris). `chunks` : limites de tronçons (z de la
   rue) — chaque pièce est alors coupée en plans séparés, masquables (voir street.js). Pour
   qu'aucune couture ne se voie entre deux plans, leurs normales sont tirées de la fonction de
   hauteur elle-même (et non des triangles de chaque plan) et leurs UV suivent la position le
   long de la rue.
   --------------------------------------------------------------------- */
function buildStreetGround(st, spec, chunks = []) {
  const cut = (z0, z1) => { const out = []; let a = z0; for (const b of chunks) if (b > a && b < z1) { out.push([a, b]); a = b; } out.push([a, z1]); return out; };
  const vSign = spec.vFlip ? -1 : 1;           // rue de droite : v = x monde, comme la rue de gauche (raccord du trottoir d'en face)
  /** Plan de largeur w posé de z0 à z1 ; h(px, pz, zc) : hauteur en coordonnées du plan (après la
   *  rotation éventuelle, px et pz sont relatifs à son centre, dans le repère de la rue). */
  const strip = (w, z0, z1, segW, step, flip, h, mat, cx, cy) => {
    const len = z1 - z0, zc = (z0 + z1) / 2;
    const g = new THREE.PlaneGeometry(w, len, segW, Math.max(1, Math.round(len / step))); g.rotateX(-Math.PI / 2);
    if (flip) g.rotateY(Math.PI);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) p.setY(i, h(p.getX(i), p.getZ(i), zc));
    if (chunks.length) {
      const n = g.attributes.normal, uv = g.attributes.uv, e = 0.05;
      for (let i = 0; i < p.count; i++) {
        const px = p.getX(i), pz = p.getZ(i);
        const dx = (h(px + e, pz, zc) - h(px - e, pz, zc)) / (2 * e), dz = (h(px, pz + e, zc) - h(px, pz - e, zc)) / (2 * e), l = Math.hypot(dx, 1, dz);
        n.setXYZ(i, -dx / l, 1 / l, -dz / l);
        uv.setY(i, vSign * (zc + pz) / GROUND_REF);
      }
    } else { g.computeVertexNormals(); scaleV(g, len); }
    const m = shadowed(new THREE.Mesh(g, mat), false, true);
    m.position.set(cx, cy, zc); m.userData.noOcclude = true; st.add(m);   // (noOcclude : ignoré par les rayons de la notation photo)
  };
  // Chaussée : plan subdivisé, vertex déplacés (bruit + sillons)
  for (const [z0, z1] of cut(...spec.road)) strip(2 * ROAD_HALF + 0.3, z0, z1, 64, 0.245, false, (px, pz, zc) => spec.roadY(px, zc + pz), roadMat, 0, 0);
  for (const s of [-1, 1]) {
    const side = s < 0 ? spec.left : spec.right;
    // Trottoir : u = 0 de la texture (neige grise) doit toujours tomber côté rue
    for (const [z0, z1] of cut(...side.walk))
      strip(SIDEWALK_W + 0.2, z0, z1, 30, 0.22, s < 0, (px, pz, zc) => walkSnowY(px, zc + pz - st.noiseZ0, s), walkMat, s * (ROAD_HALF + SIDEWALK_W / 2), SIDEWALK_H);
    // Bordure en granit : 22 cm de haut, face côté rue visible (15–20 cm au-dessus de la gadoue)
    for (const [z0, z1] of cut(...side.curb)) {
      const len = z1 - z0, zc = (z0 + z1) / 2;
      const curbMat = MAT.granite.clone(); usePhoto(curbMat, 'concrete_wall_008', len / 2.7, 0.1);   // pierre taillée, gris granit (couleur du matériau)
      const curb = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.32, SIDEWALK_H + 0.06, len), curbMat), false, true);
      curb.position.set(s * (ROAD_HALF + 0.04), (SIDEWALK_H + 0.06) / 2 - 0.01, zc); st.add(curb);
      const curbSnow = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, len), MAT.snow);          // fine pellicule sur le dessus
      curbSnow.position.set(s * (ROAD_HALF + 0.1), SIDEWALK_H + 0.07, zc); st.add(curbSnow);
    }
    // Bourrelet : bande subdivisée, profil en cloche centré juste devant la bordure,
    // hauteur qui varie le long de la rue (0,2 → 0,7 m), s'effondre dans les trouées et
    // s'amenuise à ses deux bouts (passages piétons du carrefour)
    const [r0, r1] = side.ridge;
    const ridgeH = (lx, z) => {
      const bell = Math.exp(-(lx * lx) / (0.5 * 0.5));
      const gap = smoothNoise(z * 0.11 + s * 13, 2.5);                                          // trouées : bruit lent
      const along = 0.2 + 0.5 * smoothNoise(z * 0.45 + s * 5, 7.3);
      const ends = THREE.MathUtils.smoothstep(z, r0, r0 + 1.6) * (1 - THREE.MathUtils.smoothstep(z, r1 - 1.6, r1));
      return ((gap < 0.3 ? 0.06 : along) * bell + (smoothNoise(lx * 4 + s, z * 3) * 0.09 + smoothNoise(lx * 9, z * 8) * 0.03) * bell) * ends;   // mottes
    };
    for (const [z0, z1] of cut(r0, r1)) strip(1.8, z0, z1, 12, 0.27, false, (px, pz, zc) => ridgeH(px, zc + pz), ridgeMat, s * (ROAD_HALF - 0.42), 0.06);
    // cours anglaises (rue de droite) : entre la grille et les maisons, neige fraîche que personne ne
    // foule — celle des rebords et des congères (grain photo projeté en coordonnées monde, sans
    // empreintes), pas celle du trottoir
    if (side.area) for (const [z0, z1] of cut(...side.area))
      strip(AREA_W + 0.1, z0, z1, 16, 0.25, s < 0, (px, pz, zc) => areaSnowY(Math.abs(s * (FACADE_X + AREA_W / 2) + px) - FACADE_X, zc + pz - st.noiseZ0, s), MAT.snow, s * (FACADE_X + AREA_W / 2), 0);
  }
}

// Rue principale : la chaussée descend jusqu'à la bordure d'en face de la transversale (le
// carrefour lui appartient) ; ses deux trottoirs s'arrêtent aux coins. Bourrelets interrompus aux passages piétons.
buildStreetGround(MAIN, {
  road: [CURB_F, STREET_Z_MAX + 10], roadY: (lx, lz) => mainRoadY(lx, lz),
  left: { walk: [FACE_N, STREET_Z_MAX + 10], curb: [CURB_N - 0.12, STREET_Z_MAX + 10], ridge: [CURB_N + 4, STREET_Z_MAX + 10] },
  right: { walk: [FACE_N, STREET_Z_MAX + 10], curb: [CURB_N - 0.12, STREET_Z_MAX + 10], ridge: [CURB_N + 2, STREET_Z_MAX + 10] },
});
// Rue de gauche (dans son repère : z le long de la rue, vers −x monde) : de l'impasse au carrefour.
// La chaussée finit au bord de celle de la rue principale ; le trottoir côté feux au coin, celui
// d'en face au trottoir de droite de la rue principale (fond du T).
buildStreetGround(LEFT, {
  road: [LEFT_END_X, -ROAD_HALF - 0.15], roadY: (lx, lz) => leftRoadY(LEFT.wx(lx, lz), LEFT.wz(lx, lz)),
  left: { walk: [LEFT_END_X, -FACADE_X], curb: [LEFT_END_X, -ROAD_HALF + 0.12], ridge: [LEFT_END_X + 2, -FACADE_X - 1] },

}, LEFT_CHUNKS);

/* Parc, derrière la grille d'entrée : un grand champ de neige intacte (grain photo projeté, sans

{

/* Coins de trottoir du carrefour : petits plans en coordonnées monde, hauteur = groundY
   (fondu entre les deux trottoirs), UV raccordées à celles des trottoirs voisins : u = 0 contre
   les bordures (neige tassée), 1 contre les façades. */
function cornerPatch(x0, x1, z0, z1, uOf, vOf) {
  const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0, 24, 24); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, uv = g.attributes.uv, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  for (let i = 0; i < p.count; i++) {
    const x = cx + p.getX(i), z = cz + p.getZ(i);
    p.setY(i, groundY(x, z)); uv.setXY(i, uOf(x, z), vOf(x, z));
  }
  g.computeVertexNormals();
  const m = shadowed(new THREE.Mesh(g, walkMat), false, true);
  m.position.set(cx, 0, cz); m.userData.noOcclude = true; MAIN.add(m);
}
const clamp01 = v => Math.min(1, Math.max(0, v));
cornerPatch(-FACADE_X, -ROAD_HALF, CURB_N, FACE_N,
  (x, z) => Math.min(clamp01((-ROAD_HALF - x) / SIDEWALK_W), clamp01((z - CURB_N) / SIDEWALK_W)), (x, z) => (z - FACE_N) / GROUND_REF);
cornerPatch(ROAD_HALF, FACADE_X, CURB_N, FACE_N,
  (x, z) => Math.min(clamp01((x - ROAD_HALF) / SIDEWALK_W), clamp01((z - CURB_N) / SIDEWALK_W)), (x, z) => (STREET_Z_MAX + 10 - z) / GROUND_REF);
// trottoir d'en face, en face de la rue principale : bande droite qui passe de la rue de gauche à

cornerPatch(ROAD_HALF, FACADE_X, FACE_F, CURB_F, (x, z) => clamp01((CURB_F - z) / SIDEWALK_W), (x, z) => x / GROUND_REF);

/** Enseigne de boutique : caisson lumineux (rétro-éclairé, tubes inégaux) ou panneau éteint et encrassé.
 *  1024×192 pour une bande d'environ 8 m × 0,8 m : les lettres restent nettes de près. */
function makeSignTexture(text, lit) {
  const W = 1024, H = 192, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const palettes = [['#8f1a12', '#fff2e0'], ['#1a2a6a', '#ffe36a'], ['#f2c21a', '#1a1a1a'], ['#1c1c1c', '#ff5a3a'], ['#2a5a2a', '#f4f4e0'], ['#f4f0e6', '#b3121a'], ['#0e3a6a', '#ffffff']];
  const [bg, fg] = palettes[Math.floor(Math.random() * palettes.length)];

  // fond : caisson rétro-éclairé (centre plus clair, bords qui tombent) ou panneau mat éteint
  if (lit) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.62);
    g.addColorStop(0, bg); g.addColorStop(1, shade(bg, 0.55));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // tubes fatigués : quelques zones plus sombres, une bande faiblarde
    for (let i = 0; i < 3; i++) { ctx.fillStyle = `rgba(0,0,0,${0.08 + Math.random() * 0.14})`; ctx.fillRect(Math.random() * W, 0, 60 + Math.random() * 160, H); }
  } else {
    ctx.fillStyle = shade(bg, 0.28); ctx.fillRect(0, 0, W, H);
  }
  // cadre en aluminium : bord sombre + filet clair
  ctx.strokeStyle = '#1c1c1e'; ctx.lineWidth = 16; ctx.strokeRect(8, 8, W - 16, H - 16);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.strokeRect(17, 17, W - 34, H - 34);

  // nom : taille ajustée à la largeur disponible
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sub = Math.random() < 0.45 ? SUBTITLES[Math.floor(Math.random() * SUBTITLES.length)] : null;
  let size = sub ? 96 : 118;
  do { ctx.font = `bold ${size}px Impact, "Arial Narrow", sans-serif`; size -= 4; } while (ctx.measureText(text).width > W - 120 && size > 40);
  const ty = sub ? H * 0.42 : H / 2;
  ctx.fillStyle = lit ? fg : shade(fg, 0.42);
  if (lit) { ctx.shadowColor = fg; ctx.shadowBlur = 18; }
  ctx.fillText(text, W / 2, ty);
  ctx.shadowBlur = 0;
  if (sub) {
    ctx.font = `bold 34px Arial, Helvetica, sans-serif`;
    ctx.fillStyle = lit ? fg : shade(fg, 0.4);
    ctx.fillText(sub, W / 2, H * 0.78);
  }
  // encrassement : coulures depuis le haut, poussière dans les angles
  ctx.fillStyle = `rgba(0,0,0,${lit ? 0.12 : 0.32})`;
  for (let i = 0; i < 18; i++) ctx.fillRect(Math.random() * W, 16, 3 + Math.random() * 8, 20 + Math.random() * (lit ? 40 : 120));
  addGrain(ctx, W, H, lit ? 10 : 18);
  return toTexture(c, true, false);
}

/** Assombrit / éclaircit une couleur hexa (#rrggbb) d'un facteur. */
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * k | 0), g = Math.min(255, ((n >> 8) & 255) * k | 0), b = Math.min(255, (n & 255) * k | 0);
  return `rgb(${r},${g},${b})`;
}

const SUBTITLES = ['OPEN 24 HOURS', 'WE DELIVER', 'ATM INSIDE', 'SINCE 1979', 'LOTTO • BEER • ICE', 'COLD CUTS • SANDWICHES', 'WASH & FOLD', 'SAME DAY SERVICE', 'KEYS MADE', 'TEL. 212-555-0148'];

const SHOP_NAMES = ['LAUNDROMAT', 'DELI GROCERY', '24 HR PHARMACY', 'NAILS SPA', 'TAILOR', 'LIQUORS', 'BODEGA', 'DRY CLEANERS', 'LOCKSMITH', 'BARBER SHOP', 'DISCOUNT', 'CHECK CASHING',
  'PIZZA', 'HARDWARE', 'SMOKE SHOP', 'FLORIST', 'SHOE REPAIR', 'MINI MARKET', 'WINE & SPIRITS', 'THAI KITCHEN', 'BAGELS', 'COFFEE SHOP'];

/* =====================================================================
   PORTES D'IMMEUBLE (brownstones) — textures d'un VANTAIL entier, à l'échelle
   Un vantail de 0,63 × 2,35 m sur 256 × 1024 px (≈ 4,3 px/cm). Découpe classique
   d'une porte new-yorkaise à double vantail :
     - montants de 10 cm, traverse basse 15 cm, traverse haute 35 cm ;
     - panneau bas SURÉLEVÉ (0,15 → 0,65 m) : moulure, gorge, chanfrein, table en relief ;
     - traverse de serrure (0,65 → 0,9 m) ;
     - baie vitrée (0,9 → 2,0 m) bordée d'une moulure saillante — la vitre elle-même
       est un plan posé devant (voir buildEntrance), la texture n'y est pas vue.
   Relief en carte de hauteur → normal map (Sobel) : les moulures accrochent la lumière
   de la lanterne. Couleur : fil du bois vertical sur les montants, horizontal sur les
   traverses, vernis plus sombre dans les creux, usure claire autour de la poignée,
   frottements en bas, et la TRACE DE SEL blanchâtre laissée par la neige au pied.
   Deux variantes : bois verni (chêne teinté) ou peinture (grise, multipliée par la
   couleur du matériau) écaillée sur le bois.
   ===================================================================== */
const DOOR_W = 256, DOOR_H = 1024, DPU = DOOR_W / 0.63, DPV = DOOR_H / 2.35;
const dX = m => m * DPU, dY = m => DOOR_H - m * DPV;           // mètres depuis le bas → px depuis le haut

// zones du vantail en mètres : [x0, y0, x1, y1] (depuis le bas à gauche)
const D_STILE = 0.1;
const D_PANEL = [D_STILE, 0.15, 0.63 - D_STILE, 0.65];
const D_GLASS = [D_STILE, 0.9, 0.63 - D_STILE, 2.0];

/** Rectangle en mètres → px, avec un retrait `i` px de chaque côté. */
function dRectPx(ctx, r, i) { const x = dX(r[0]) + i, y = dY(r[3]) + i, w = dX(r[2] - r[0]) - 2 * i, h = (dY(r[1]) - dY(r[3])) - 2 * i; if (w > 0 && h > 0) ctx.fillRect(x, y, w, h); }
const dGrey = v => { const c = Math.max(0, Math.min(255, Math.round(v * 255))); return `rgb(${c},${c},${c})`; };

function makeDoorLeafTextures(kind) {
  const c = makeCanvas(DOOR_W, DOOR_H), ctx = c.getContext('2d');
  const h = makeCanvas(DOOR_W, DOOR_H), hctx = h.getContext('2d');
  const r = makeCanvas(DOOR_W, DOOR_H), rctx = r.getContext('2d');
  const wood = kind === 'wood';

  // ---------- COULEUR : bois (ou sous-couche) avec son fil
  const base = wood ? [118, 72, 42] : [178, 176, 172];
  ctx.fillStyle = `rgb(${base})`; ctx.fillRect(0, 0, DOOR_W, DOOR_H);
  const grain = (x0, y0, x1, y1, vertical) => {
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    const n = vertical ? (x1 - x0) * 0.9 : (y1 - y0) * 0.9;
    for (let i = 0; i < n; i++) {
      const t = Math.random(), dark = Math.random() < 0.55, a = (wood ? 0.1 : 0.035) + Math.random() * (wood ? 0.16 : 0.05);
      ctx.strokeStyle = dark ? `rgba(40,20,8,${a})` : `rgba(150,96,58,${a})`;
      if (!wood) ctx.strokeStyle = dark ? `rgba(90,90,90,${a})` : `rgba(230,230,230,${a})`;
      ctx.lineWidth = 0.6 + Math.random() * 1.8; ctx.beginPath();
      if (vertical) { const x = x0 + t * (x1 - x0), wob = Math.random() * 3; for (let y = y0; y <= y1; y += 16) ctx.lineTo(x + Math.sin(y * 0.02 + i) * wob, y); }
      else { const y = y0 + t * (y1 - y0), wob = Math.random() * 3; for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, y + Math.sin(x * 0.05 + i) * wob); }
      ctx.stroke();
    }
    // quelques nœuds / flammes sur le bois verni
    if (wood) for (let k = 0; k < 2; k++) {
      const cx = x0 + Math.random() * (x1 - x0), cy = y0 + Math.random() * (y1 - y0), g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10 + Math.random() * 14);
      g.addColorStop(0, 'rgba(40,20,8,0.3)'); g.addColorStop(1, 'rgba(40,20,8,0)'); ctx.fillStyle = g; ctx.fillRect(cx - 30, cy - 30, 60, 60);
    }
    ctx.restore();
  };
  const sL = dX(D_STILE), sR = dX(0.63 - D_STILE);
  grain(0, 0, sL, DOOR_H, true); grain(sR, 0, DOOR_W, DOOR_H, true);                               // montants : fil vertical
  for (const [y0, y1] of [[0, 0.15], [0.65, 0.9], [2.0, 2.35]]) grain(sL, dY(y1), sR, dY(y0), false);   // traverses : fil horizontal
  grain(dX(D_PANEL[0]), dY(D_PANEL[3]), dX(D_PANEL[2]), dY(D_PANEL[1]), true);                             // panneau : fil vertical

  // ---------- RELIEF
  hctx.fillStyle = dGrey(0.55); hctx.fillRect(0, 0, DOOR_W, DOOR_H);
  // panneau surélevé : moulure (petite saillie), gorge, chanfrein qui remonte, table plate
  const panelProfile = i => i < 4 ? 0.68 : i < 8 ? 0.28 : i < 30 ? 0.34 + (i - 8) / 22 * 0.4 : 0.74;
  for (let i = 0; i < 60; i++) { hctx.fillStyle = dGrey(panelProfile(i)); dRectPx(hctx, D_PANEL, i); }
  // moulure saillante (bolection) autour de la vitre : bourrelet sur 10 px à l'extérieur de la baie
  for (let i = -10; i <= 0; i++) { const t = (i + 10) / 10; hctx.fillStyle = dGrey(0.55 + 0.3 * Math.sin(t * Math.PI)); dRectPx(hctx, D_GLASS, i); }
  hctx.fillStyle = dGrey(0.3); dRectPx(hctx, D_GLASS, 1);
  // assemblages traverse / montant : fente sombre
  hctx.fillStyle = dGrey(0.42);
  for (const [y0, y1] of [[0, 0.15], [0.65, 0.9], [2.0, 2.35]]) { hctx.fillRect(sL - 1, dY(y1), 2, dY(y0) - dY(y1)); hctx.fillRect(sR - 1, dY(y1), 2, dY(y0) - dY(y1)); }
  // fil du bois à peine en relief
  for (let i = 0; i < 400; i++) { hctx.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},0.05)`; hctx.fillRect(Math.random() * DOOR_W, Math.random() * DOOR_H, 1, 20 + Math.random() * 60); }

  // ---------- Vernis / peinture plus sombre dans les creux (lecture de la hauteur)
  {
    const hd = hctx.getImageData(0, 0, DOOR_W, DOOR_H).data, img = ctx.getImageData(0, 0, DOOR_W, DOOR_H), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = hd[i] / 255, k = 0.72 + 0.5 * Math.min(1, v / 0.55); d[i] *= k; d[i + 1] *= k; d[i + 2] *= k; }
    ctx.putImageData(img, 0, 0);
  }

  // ---------- Usure : écaillures (peinture), poignée, bas de porte, sel
  if (!wood) {
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * DOOR_W, y = DOOR_H * (0.55 + 0.45 * Math.pow(Math.random(), 0.6)), rw = 2 + Math.random() * 7, rh = 1 + Math.random() * 5;
      ctx.fillStyle = 'rgba(58,40,26,0.9)'; ctx.beginPath(); ctx.ellipse(x, y, rw, rh, Math.random() * 3, 0, Math.PI * 2); ctx.fill();   // bois à nu
      rctx.fillStyle = 'rgba(245,245,245,0.9)'; rctx.beginPath(); rctx.ellipse(x, y, rw, rh, 0, 0, Math.PI * 2); rctx.fill();
    }
  }
  // patine des mains autour de la poignée (côté intérieur du vantail, x = 0.63 m)
  const gh = ctx.createRadialGradient(DOOR_W - 18, dY(1.05), 0, DOOR_W - 18, dY(1.05), 60);
  gh.addColorStop(0, wood ? 'rgba(20,10,4,0.45)' : 'rgba(40,40,40,0.35)'); gh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gh; ctx.fillRect(DOOR_W - 90, dY(1.05) - 70, 90, 140);
  // coups de pied et frottements en bas
  for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(20,14,10,${0.08 + Math.random() * 0.15})`; ctx.fillRect(Math.random() * DOOR_W, dY(0.05 + Math.random() * 0.35), 4 + Math.random() * 18, 1 + Math.random() * 2); }
  // trace de sel : liseré blanchâtre irrégulier à 8–22 cm, voile en dessous (la neige fond contre la porte)
  for (let x = 0; x < DOOR_W; x += 2) {
    const yLine = dY(0.12 + 0.07 * Math.sin(x * 0.045) * Math.sin(x * 0.013 + 1.3) + Math.random() * 0.01);
    ctx.fillStyle = 'rgba(225,228,232,0.35)'; ctx.fillRect(x, yLine, 2, 2 + Math.random() * 2);
    ctx.fillStyle = 'rgba(210,214,220,0.12)'; ctx.fillRect(x, yLine, 2, DOOR_H - yLine);
  }
  addGrain(ctx, DOOR_W, DOOR_H, wood ? 10 : 7);

  // ---------- RUGOSITÉ : vernis lustré (0,35), usé mat aux coins et au bas
  rctx.globalCompositeOperation = 'destination-over';
  rctx.fillStyle = dGrey(wood ? 0.38 : 0.5); rctx.fillRect(0, 0, DOOR_W, DOOR_H);
  rctx.globalCompositeOperation = 'source-over';
  const gb = rctx.createLinearGradient(0, dY(0.5), 0, DOOR_H); gb.addColorStop(0, 'rgba(230,230,230,0)'); gb.addColorStop(1, 'rgba(230,230,230,0.7)');
  rctx.fillStyle = gb; rctx.fillRect(0, dY(0.5), DOOR_W, DOOR_H - dY(0.5));

  const map = toTexture(c, true, false), normal = toTexture(heightToNormal(h, 3.5), false, false), rough = toTexture(r, false, false);
  return { map, normal, rough };
}

/** Vitre du hall : verre dépoli éclairé de l'intérieur (plus clair en haut, vers le plafonnier),
 *  liseré gravé à 3 cm du bord, ombres floues de l'escalier et de la rampe derrière. */
function makeHallGlassTexture() {
  const W = 128, H = 256, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fff0d0'); g.addColorStop(0.45, '#d9b88a'); g.addColorStop(1, '#8a6a48');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // silhouettes floues : limon d'escalier en diagonale, barreaux, porte du fond
  ctx.filter = 'blur(6px)';
  ctx.strokeStyle = 'rgba(60,38,20,0.55)'; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(-10, H * 0.95); ctx.lineTo(W * 0.9, H * 0.35); ctx.stroke();
  ctx.lineWidth = 4; for (let k = 0; k < 6; k++) { const x = k * 22; ctx.beginPath(); ctx.moveTo(x, H * 0.95 - x * 0.66); ctx.lineTo(x, H * 0.72 - x * 0.66); ctx.stroke(); }
  ctx.fillStyle = 'rgba(70,45,24,0.4)'; ctx.fillRect(W * 0.62, H * 0.3, W * 0.26, H * 0.62);
  ctx.filter = 'none';
  // verre dépoli : grain fin, liseré gravé (plus clair) et coins ornés
  addGrain(ctx, W, H, 16);
  ctx.strokeStyle = 'rgba(255,248,230,0.55)'; ctx.lineWidth = 2; ctx.strokeRect(10, 10, W - 20, H - 20);
  ctx.strokeStyle = 'rgba(255,248,230,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(15, 15, W - 30, H - 30);
  for (const [x, y] of [[10, 10], [W - 10, 10], [10, H - 10], [W - 10, H - 10]]) { ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.stroke(); }
  return toTexture(c, true, false);
}

/** Imposte : une seule vitre éclairée, le NUMÉRO de l'immeuble peint à la feuille d'or
 *  (lettres cernées de noir), comme sur tous les brownstones. */
function makeTransomTexture(num) {
  const W = 512, H = 196, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ffe9c0'); g.addColorStop(1, '#c79a66');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.filter = 'blur(8px)'; ctx.fillStyle = 'rgba(255,250,235,0.7)'; ctx.beginPath(); ctx.ellipse(W / 2, 20, 90, 40, 0, 0, Math.PI * 2); ctx.fill(); ctx.filter = 'none';   // plafonnier du hall
  addGrain(ctx, W, H, 12);
  ctx.font = 'bold 118px Georgia, "Times New Roman", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = '#1a0e06'; ctx.strokeText(String(num), W / 2, H / 2 + 6);
  const gold = ctx.createLinearGradient(0, H * 0.2, 0, H * 0.8); gold.addColorStop(0, '#fff2b0'); gold.addColorStop(0.5, '#d4a23c'); gold.addColorStop(1, '#8a5c14');
  ctx.fillStyle = gold; ctx.fillText(String(num), W / 2, H / 2 + 6);
  return toTexture(c, true, false);
}

/* ───────────────────────── src/textures/shop.js ───────────────────────── */
/** Intérieur de boutique vu à travers la vitrine : plafond de néons, rayonnages,
 *  produits, comptoir. Trois ambiances selon le type de commerce. La texture se
 *  répète horizontalement (~4 m par tuile) pour suivre la largeur de la baie. */
// palettes d'emballages : couleurs franches de marques, mais pas l'arc-en-ciel
const GROCERY = ['#c8202a', '#e8b81a', '#1a4fa0', '#efe9dc', '#e2641a', '#2a7a34', '#5a2a7a', '#1c1c1c', '#8a1a22', '#f0e04a'];
const PHARMA = ['#f4f4f0', '#e8eef4', '#d8e8f0', '#f0dce4', '#1a4fa0', '#c8202a', '#f4f4f0', '#dfeadf'];
function makeShopInteriorTexture(kind) {
  const W = 1024, H = 384, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);

  if (kind === 'laundry') {
    // laverie : murs pâles, lumière froide, rangée de machines blanches à hublot sombre
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#e9f2ee'); g.addColorStop(1, '#a9b8b3');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ceiling(ctx, W, H, '#f4fbff');
    for (let x = 12; x < W; x += 132) {
      ctx.fillStyle = '#f2f4f2'; roundRect(ctx, x, H * 0.36, 118, H * 0.5, 8); ctx.fill();
      ctx.fillStyle = '#c9ced0'; ctx.fillRect(x + 8, H * 0.38, 102, 22);                        // bandeau de commandes
      ctx.fillStyle = '#1a2026'; ctx.beginPath(); ctx.arc(x + 59, H * 0.66, 34, 0, 7); ctx.fill(); // hublot
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x + 48, H * 0.62, 12, 0, 7); ctx.fill();
    }
    floor(ctx, W, H, '#b9c0c4', '#8e979c');
  } else if (kind === 'bright') {
    // pharmacie / ongles / encaissement : blanc clinique, rayonnages clairsemés, affiche promo
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fbfbf7'); g.addColorStop(1, '#c8c6bf');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ceiling(ctx, W, H, '#ffffff');
    for (let y = H * 0.32; y < H * 0.82; y += H * 0.17) shelf(ctx, W, y, 0.6, H * 0.17, PHARMA);
    ctx.fillStyle = Math.random() < 0.5 ? '#c8202a' : '#1a4fa0'; ctx.fillRect(W * 0.7, H * 0.28, W * 0.22, H * 0.36);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 52px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('SALE', W * 0.81, H * 0.5);
    floor(ctx, W, H, '#d9d9d4', '#a9a9a3');
  } else {
    // épicerie / bodega / liquor : chaleur, rayonnages pleins de couleurs, frigo vitré à droite, comptoir
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#b89a78'); g.addColorStop(1, '#4a3424');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ceiling(ctx, W, H, '#fff1c8');
    // rayonnages : remplissage inégal, couleurs d'emballages ternies par la vitre et la distance
    for (let y = H * 0.3; y < H * 0.86; y += H * 0.185) shelf(ctx, W * 0.72, y, 0.85, H * 0.185, GROCERY);
    // ombre portée des étagères et des montants : casse la régularité du motif
    for (let x = 0; x < W * 0.72; x += 170 + Math.random() * 90) { ctx.fillStyle = 'rgba(20,12,6,0.55)'; ctx.fillRect(x, H * 0.18, 10 + Math.random() * 8, H * 0.7); }
    const sh = ctx.createLinearGradient(0, H * 0.16, 0, H * 0.5); sh.addColorStop(0, 'rgba(0,0,0,0.45)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh; ctx.fillRect(0, H * 0.16, W, H * 0.34);
    // vitrine réfrigérée : panneau bleuté lumineux, montants, canettes en lignes
    ctx.fillStyle = '#dff0ff'; ctx.fillRect(W * 0.74, H * 0.22, W * 0.26, H * 0.66);
    for (let y = H * 0.3; y < H * 0.86; y += 36) {                 // bouteilles par rangées d'une même marque
      for (let x = W * 0.75; x < W * 0.99;) {
        const col = GROCERY[Math.floor(Math.random() * GROCERY.length)], n = 2 + Math.floor(Math.random() * 4);
        for (let k = 0; k < n && x < W * 0.99; k++, x += 13) {
          ctx.fillStyle = col; ctx.fillRect(x, y + 8, 10, 24); ctx.fillRect(x + 3, y, 4, 9);
          ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x, y + 16, 10, 6);
        }
        x += 4;
      }
      ctx.fillStyle = 'rgba(200,210,220,0.9)'; ctx.fillRect(W * 0.74, y + 33, W * 0.26, 3);
    }
    ctx.fillStyle = '#2a2f35'; for (const x of [W * 0.74, W * 0.865, W * 0.99]) ctx.fillRect(x - 3, H * 0.22, 6, H * 0.66);
    floor(ctx, W, H, '#7a6a5a', '#3a3028');
    // comptoir au premier plan, à gauche
    ctx.fillStyle = '#3a2a1e'; ctx.fillRect(0, H * 0.7, W * 0.3, H * 0.3);
    ctx.fillStyle = '#8a7a66'; ctx.fillRect(0, H * 0.7, W * 0.3, 10);
  }
  addGrain(ctx, W, H, 10);
  return toTexture(c, true, true);

  function ceiling(ctx, W, H, col) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H * 0.16);
    for (let x = 30; x < W; x += 210) {
      ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.fillStyle = col; ctx.fillRect(x, H * 0.05, 150, 14); ctx.shadowBlur = 0;
    }
  }
  // Une tablette de produits : des LOTS d'articles identiques côte à côte (les
  // « facings » d'un vrai rayon), chacun avec sa forme — canette, boîte, bouteille,
  // sachet — et sa bande d'étiquette ; bande de prix blanche sur le chant. L'ancienne
  // version tirait des rectangles hauts et fins de teinte aléatoire : on lisait une
  // bibliothèque, pas une épicerie.
  function shelf(ctx, W, y, fill, rowH, palette) {
    const sh = ctx.createLinearGradient(0, y - rowH, 0, y - rowH * 0.55);           // ombre sous la tablette du dessus
    sh.addColorStop(0, 'rgba(0,0,0,0.5)'); sh.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = sh; ctx.fillRect(0, y - rowH, W, rowH * 0.45);
    for (let x = 4; x < W;) {
      const type = Math.random(), col = palette[Math.floor(Math.random() * palette.length)];
      const lab = Math.random() < 0.5 ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.35)';
      let w, h, draw;
      if (type < 0.3) { w = rowH * 0.2; h = rowH * 0.34; draw = (px) => { ctx.fillStyle = col; ctx.fillRect(px, y - h, w, h); ctx.fillStyle = lab; ctx.fillRect(px, y - h * 0.7, w, h * 0.35); ctx.fillStyle = 'rgba(220,220,220,0.8)'; ctx.fillRect(px, y - h, w, 2); }; }
      else if (type < 0.6) { w = rowH * rnd(0.28, 0.42); h = rowH * rnd(0.5, 0.72); draw = (px) => { ctx.fillStyle = col; ctx.fillRect(px, y - h, w, h); ctx.fillStyle = lab; ctx.fillRect(px + 2, y - h * 0.75, w - 4, h * 0.3); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(px + w - 3, y - h, 3, h); }; }
      else if (type < 0.8) { w = rowH * 0.16; h = rowH * rnd(0.6, 0.78); draw = (px) => { ctx.fillStyle = col; ctx.fillRect(px, y - h * 0.68, w, h * 0.68); ctx.fillRect(px + w * 0.3, y - h, w * 0.4, h * 0.34); ctx.fillStyle = lab; ctx.fillRect(px, y - h * 0.5, w, h * 0.22); }; }
      else { w = rowH * 0.38; h = rowH * 0.5; draw = (px) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + 2, y - h); ctx.quadraticCurveTo(px + w / 2, y - h - 6, px + w - 2, y - h); ctx.lineTo(px + w, y); ctx.fill(); ctx.fillStyle = lab; ctx.fillRect(px + 4, y - h * 0.6, w - 8, h * 0.28); }; }
      const n = 2 + Math.floor(Math.random() * 5);
      if (Math.random() > fill) { x += w * n * 0.6; continue; }                    // trou dans le rayon
      for (let k = 0; k < n && x + w < W; k++, x += w + 1) draw(x);
      x += 3;
    }
    ctx.fillStyle = 'rgba(30,20,12,0.9)'; ctx.fillRect(0, y, W, 5);                  // tablette
    ctx.fillStyle = 'rgba(235,235,225,0.9)'; ctx.fillRect(0, y + 5, W, 4);           // bande de prix
    for (let x = 10; x < W; x += rnd(40, 90)) { ctx.fillStyle = '#f2d21a'; ctx.fillRect(x, y + 5, 10, 4); }
  }
  function floor(ctx, W, H, a, b) {
    const g = ctx.createLinearGradient(0, H * 0.86, 0, H); g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, H * 0.86, W, H * 0.14);
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
}

/** Petit néon « OPEN » posé dans la vitrine. Couleur > 1 côté matériau pour le bloom. */
function makeOpenSignTexture() {
  const W = 256, H = 128, c = makeCanvas(W, H), ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0608'; ctx.fillRect(0, 0, W, H);
  ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = 26; ctx.strokeStyle = '#ff5a4a'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(16, 14, W - 32, H - 28, 18) : ctx.rect(16, 14, W - 32, H - 28); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 66px Impact, "Arial Narrow", sans-serif';
  ctx.shadowBlur = 30; ctx.fillStyle = '#ff6a5a'; ctx.fillText('OPEN', W / 2, H / 2 + 2);
  ctx.shadowBlur = 8; ctx.fillStyle = '#fff0ee'; ctx.fillText('OPEN', W / 2, H / 2 + 2);
  return toTexture(c, true, false);
}

/** Planche d'autocollants et de néons de vitrine — ce qui fait qu'une vitrine de
 *  bodega new-yorkaise se reconnaît de loin : LOTTO, ATM, EBT, cartes acceptées,
 *  affiche de promo, et des néons de bière / glace / café. Une seule texture
 *  1024×512 découpée en cases ; `DECALS` donne pour chaque motif sa case (en px),
 *  sa taille réelle (m) et s'il s'agit d'un néon (rendu lumineux, bloom). */
const DECALS = [
  { key: 'lotto',  px: [0, 0, 256, 128],     size: [0.46, 0.23], neon: false },
  { key: 'atm',    px: [256, 0, 128, 128],   size: [0.24, 0.24], neon: false },
  { key: 'ebt',    px: [384, 0, 256, 128],   size: [0.36, 0.18], neon: false },
  { key: 'cards',  px: [640, 0, 256, 128],   size: [0.3, 0.15], neon: false },
  { key: 'promo',  px: [896, 0, 128, 256],   size: [0.42, 0.84], neon: false },
  { key: 'menu',   px: [0, 128, 192, 256],   size: [0.36, 0.48], neon: false },
  { key: 'beer',   px: [192, 128, 320, 128], size: [0.62, 0.25], neon: true },
  { key: 'ice',    px: [512, 128, 192, 128], size: [0.42, 0.28], neon: true },
  { key: 'coffee', px: [704, 128, 192, 128], size: [0.46, 0.3], neon: true },
  { key: 'atmneon',px: [192, 256, 256, 128], size: [0.5, 0.25], neon: true },
];
function makeWindowDecalAtlas() {
  const W = 1024, H = 512, c = makeCanvas(W, H), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const R = k => DECALS.find(d => d.key === k).px;
  const txt = (s, x, y, size, col, font = 'Impact, "Arial Narrow", sans-serif') => { ctx.font = `bold ${size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y); };
  const plate = (k, bg, pad = 6) => { const [x, y, w, h] = R(k); ctx.fillStyle = bg; ctx.fillRect(x + pad, y + pad, w - 2 * pad, h - 2 * pad); return [x, y, w, h]; };
  // autocollants imprimés (fond opaque, un peu passés par le soleil)
  { const [x, y, w, h] = plate('lotto', '#f2c21a'); ctx.fillStyle = '#c8202a'; ctx.fillRect(x + 14, y + 14, w - 28, h - 28); txt('LOTTO', x + w / 2, y + h / 2 + 4, 72, '#ffe24a'); }
  { const [x, y, w, h] = plate('atm', '#1a4fa0'); txt('ATM', x + w / 2, y + h / 2 + 4, 56, '#ffffff'); }
  { const [x, y, w, h] = plate('ebt', '#f4f4ee'); txt('EBT', x + 70, y + h / 2, 60, '#1a6a2a'); txt('ACCEPTED', x + 175, y + h / 2, 30, '#1a1a1a', 'Arial, sans-serif'); }
  { const [x, y, w, h] = plate('cards', '#e8e8e2');
    for (const [i, col] of ['#1a3a8a', '#d8261a', '#f0a018'].entries()) { ctx.fillStyle = col; ctx.fillRect(x + 20 + i * 76, y + 34, 64, 42); }
    txt('WE ACCEPT', x + w / 2, y + 100, 22, '#222', 'Arial, sans-serif'); }
  { const [x, y, w, h] = plate('promo', '#d8261a'); txt('SALE', x + w / 2, y + 60, 44, '#ffffff'); txt('2 FOR', x + w / 2, y + 120, 30, '#ffe24a'); txt('$5', x + w / 2, y + 175, 70, '#ffffff'); }
  { const [x, y, w, h] = plate('menu', '#efe6d0'); txt('MENU', x + w / 2, y + 34, 34, '#8a1a12');
    ctx.fillStyle = 'rgba(40,30,20,0.7)'; for (let k = 0; k < 9; k++) { ctx.fillRect(x + 22, y + 66 + k * 19, 90 + Math.random() * 40, 5); ctx.fillRect(x + w - 50, y + 66 + k * 19, 26, 5); } }
  // néons : tube coloré sur fond transparent, halo par flou
  const neon = (k, lines) => {
    const [x, y, w, h] = R(k);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    for (const [s, dx, dy, size, col] of lines) {
      ctx.font = `bold ${size}px "Brush Script MT", "Segoe Script", cursive`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = col; ctx.shadowBlur = 22; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.strokeText(s, x + w / 2 + dx, y + h / 2 + dy);
      ctx.shadowBlur = 6; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6; ctx.strokeText(s, x + w / 2 + dx, y + h / 2 + dy);
    }
    ctx.restore();
  };
  neon('beer', [['Cold Beer', 0, 4, 76, '#ff9a2a']]);
  neon('ice', [['ICE', 0, 4, 84, '#4ac8ff']]);
  neon('coffee', [['Coffee', 0, 4, 64, '#ff4a8a']]);
  neon('atmneon', [['ATM', 0, 4, 84, '#6aff7a']]);
  return toTexture(c, true, false);
}

/** Lambrequin imprimé : le nom du commerce et un numéro de téléphone en lettres
 *  claires sur la toile, comme sur la quasi-totalité des stores new-yorkais. */
function makeValanceTexture(name, bgHex) {
  const W = 1024, H = 64, c = makeCanvas(W, H), ctx = c.getContext('2d');
  ctx.fillStyle = '#' + bgHex.toString(16).padStart(6, '0'); ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#efe8da';
  ctx.font = 'bold 38px Arial, Helvetica, sans-serif';
  const phone = `TEL. (212) 555-${String(1000 + Math.floor(Math.random() * 8999))}`;
  ctx.fillText(name, W * 0.33, H / 2 + 2);
  ctx.font = 'bold 26px Arial, Helvetica, sans-serif'; ctx.fillText(phone, W * 0.74, H / 2 + 2);
  addGrain(ctx, W, H, 14);
  return toTexture(c, true, false);
}

/** Toile rayée (deux bandes : couleur / crème) répétée sur la largeur du store. */
function makeStripeTexture(bgHex) {
  const c = makeCanvas(8, 64), ctx = c.getContext('2d');
  ctx.fillStyle = '#' + bgHex.toString(16).padStart(6, '0'); ctx.fillRect(0, 0, 8, 32);
  ctx.fillStyle = '#d8d0bc'; ctx.fillRect(0, 32, 8, 32);
  return toTexture(c, true, true);
}

// carrelage photo (dirty_tiles, tuile de 2,3 m) pour le sol des épiceries : uniformes
// PARTAGÉS par tous les intérieurs, remplis quand la photo est chargée (secours : damier)
const floorPhoto = { uFloorTex: { value: null }, uFloorReady: { value: 0 } };
loadPhotoSet('dirty_tiles').then(set => { floorPhoto.uFloorTex.value = set.map; floorPhoto.uFloorReady.value = 1; }).catch(() => {});

/* =====================================================================
   6 bis. INTÉRIEURS DE BOUTIQUE EN FAUSSE 3D (« interior mapping »)
   L'intérieur était une image plate collée 35 cm derrière la vitre : aucune
   profondeur, et dès qu'on se déplaçait on voyait que c'était un poster. Ici le
   plan derrière la vitre ne montre pas une image, il CALCULE ce qu'on verrait dans
   une pièce de 4 m de profond : pour chaque pixel, on prolonge le rayon de vue
   derrière la vitre et on cherche quelle paroi il touche en premier — sol carrelé,
   plafond à tubes fluorescents, murs latéraux, mur du fond (la texture de rayonnages,
   de machines…) — et, devant le fond, une gondole basse qui passe devant le mur.
   Un seul plan, donc un seul appel de dessin, mais une vraie parallaxe : les
   rayons glissent les uns devant les autres quand on longe la vitrine.
   Repère : celui du plan (x le long de la vitrine, y vers le haut, z vers la rue) ;
   la pièce s'étend vers z < 0.
   ===================================================================== */
const interiorVS = `
  varying vec3 vP, vCam;
  #include <fog_pars_vertex>
  void main(){
    vP = position;
    vCam = (inverse(modelMatrix) * vec4(cameraPosition, 1.0)).xyz;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const interiorFS = `
  uniform sampler2D uWall;
  uniform vec3 uTint, uFloorA, uFloorB, uCeil;
  uniform float uHW, uYF, uYC, uDepth, uGondZ, uGondH, uGondOn, uBright, uFloorReady, uFloorUse;
  uniform sampler2D uFloorTex;
  varying vec3 vP, vCam;
  #include <fog_pars_fragment>
  // un rayon qui part du pixel de la vitre, vers l'intérieur
  void main(){
    vec3 d = normalize(vP - vCam);
    if (d.z >= -1e-4) discard;
    vec3 o = vP;
    float xw = uHW + 0.35;                                      // la pièce déborde un peu la vitrine
    float tx = ((d.x > 0.0 ? xw : -xw) - o.x) / d.x;
    float ty = ((d.y > 0.0 ? uYC : uYF) - o.y) / d.y;
    float tz = (-uDepth - o.z) / d.z;
    float t = min(tx, min(ty, tz));
    vec3 h = o + d * t, col;
    float wallV = (h.y - uYF) / (uYC - uYF);
    if (t == tz) {                                              // mur du fond : rayonnages, machines…
      col = texture2D(uWall, vec2((h.x + xw) / 4.2, wallV)).rgb;
    } else if (t == tx) {                                       // murs latéraux : même décor, en retrait et plus sombre
      col = texture2D(uWall, vec2(-h.z / 4.2 + 0.37 * sign(d.x), wallV)).rgb * 0.62;
    } else if (d.y < 0.0) {                                     // sol : carrelage, reflet laiteux des tubes au fond
      vec2 g = floor(h.xz / 0.3);
      col = mix(uFloorA, uFloorB, mod(g.x + g.y, 2.0));
      if (uFloorReady * uFloorUse > 0.5) col = texture2D(uFloorTex, h.xz / 2.3).rgb * 0.85;   // carrelage photo (épiceries)
      col *= 0.8 + 0.5 * smoothstep(0.0, uDepth, -h.z);
    } else {                                                    // plafond : dalles sombres + tubes fluorescents
      float strip = step(0.84, fract(-h.z / 1.3 + 0.2)) * step(abs(h.x), xw - 0.4);
      col = uCeil * 0.35 + uCeil * 2.2 * strip;
    }
    // gondole basse devant le fond : coupe le rayon si elle est touchée avant la paroi
    if (uGondOn > 0.5) {
      float tg = (-uGondZ - o.z) / d.z;
      vec3 hg = o + d * tg;
      float gap = step(0.9, fract((hg.x + xw) / 3.1));          // allées tous les ~3 m
      if (tg < t && hg.y < uYF + uGondH && gap < 0.5) {
        float gv = (hg.y - uYF) / uGondH;
        col = texture2D(uWall, vec2((hg.x + xw) / 3.3 + 0.5, 0.3 + gv * 0.34)).rgb * 0.9;
        col *= step(gv, 0.97) * 0.85 + 0.15;                    // chant supérieur sombre
        t = tg; h = hg;
      }
    }
    // occlusion aux angles de la pièce, lumière qui baisse vers le fond
    float edge = min(min(h.y - uYF, uYC - h.y), xw - abs(h.x));
    col *= 0.55 + 0.45 * smoothstep(0.0, 0.6, edge);
    col *= mix(1.0, 0.65, clamp(-h.z / (uDepth * 1.4), 0.0, 1.0));
    gl_FragColor = vec4(col * uTint * uBright, 1.0);
    #include <fog_fragment>
  }`;

const KIND_STYLE = {
  grocery: { tint: [1.0, 0.88, 0.72], floorA: [0.36, 0.3, 0.24], floorB: [0.22, 0.18, 0.14], ceil: [1.0, 0.92, 0.75], gond: 1, gondH: 1.35 },
  laundry: { tint: [0.86, 0.96, 1.0], floorA: [0.72, 0.74, 0.74], floorB: [0.5, 0.52, 0.54], ceil: [0.9, 0.97, 1.0], gond: 1, gondH: 0.9 },
  bright:  { tint: [1.0, 0.98, 0.94], floorA: [0.78, 0.78, 0.76], floorB: [0.62, 0.62, 0.6], ceil: [1.0, 1.0, 0.98], gond: 1, gondH: 1.2 },
};

/** Matériau d'intérieur pour une vitrine de largeur `w` (m) et de hauteur `h` (m),
 *  dont le bas est à `floorBelow` m au-dessus du sol intérieur. */
function makeInteriorMaterial(wallTex, kind, w, h, floorBelow) {
  const st = KIND_STYLE[kind] ?? KIND_STYLE.grocery;
  const mat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
      uWall: { value: wallTex },
      uTint: { value: new THREE.Vector3(...st.tint) }, uFloorA: { value: new THREE.Vector3(...st.floorA) },
      uFloorB: { value: new THREE.Vector3(...st.floorB) }, uCeil: { value: new THREE.Vector3(...st.ceil) },
      uHW: { value: w / 2 }, uYF: { value: -h / 2 - floorBelow }, uYC: { value: h / 2 + 0.75 },
      uDepth: { value: 4.0 }, uGondZ: { value: 1.5 + Math.random() * 0.5 }, uGondH: { value: st.gondH }, uGondOn: { value: st.gond },
      uBright: { value: 0.85 },
    }]),
    vertexShader: interiorVS, fragmentShader: interiorFS, fog: true,
  });
  Object.assign(mat.uniforms, floorPhoto);                     // après le merge : objets partagés, pas des copies
  mat.uniforms.uFloorUse = { value: kind === 'grocery' ? 1 : 0 };
  return mat;
}

/* ───────────────────────── src/game/subjects.js ───────────────────────── */
/* =====================================================================
   17. SUJETS PHOTOGRAPHIABLES
   Chaque élément de la rue qui peut faire l'objet d'une photo s'inscrit ici au
   moment où il est construit (véhicules, néon, lampadaires, vapeur, feux, portes,
   vitrines, escaliers de secours, châteaux d'eau…). La notation (game/scoring.js)
   ne connaît que ce registre : ajouter un sujet, c'est UN appel à addSubject.

   Champs :
     label   nom lisible (« Le néon DELI – PIZZA »)
     value   intérêt du sujet, 0..1 (le néon du deli vaut plus qu'une voiture garée)
     object  objet 3D dont la boîte englobante sert d'emprise (calculée au 1er besoin,
             quand les matrices sont figées) — OU —
     box     emprise explicite (THREE.Box3, coordonnées monde) : obligatoire pour les
             objets dont la boîte serait faussée (lampadaire : sa sphère de diffusion
             de 4,5 m engloberait la moitié de la rue)
     glows   sujet lumineux : il reste visible dans la brume (néon, feux, vitrine)
     moment  () => { pts, why } | null : bonus de l'instant (gyrophares allumés,
             feu au rouge…), évalué AU DÉCLENCHEMENT
     active  () => bool (facultatif) : sujet présent seulement par moments — prévu
             pour les apparitions temporaires (un oiseau pendant 2 minutes…)
   ===================================================================== */
const photoSubjects = [];

function addSubject(s) { photoSubjects.push(s); return s; }
