/* Décorations de fêtes (photos de l'utilisateur) : chaque maison décorée tire SON assortiment, pour
   qu'aucune ne ressemble à sa voisine — couleur des ampoules (blanc chaud, blanc froid, multicolore,
   rouge et or), rampes (guirlande de sapin avec ou sans boules, ou ampoules seules enroulées),
   grille (festons, boules, ampoules ou rien), porte (couronne lumineuse, couronne à gros nœud et
   baies rouges, guirlande qui encadre la porte, ou deux petits sapins illuminés en pots), fenêtres
   (bougies électriques, guirlandes drapées, contour d'ampoules, couronnes à nœud, ou rien), parfois
   un sapin illuminé dans la cour et un rideau de stalactites lumineuses sous le bandeau.
   Ampoules = petites sphères très lumineuses (le bloom les fait briller) ; tout est fusionné par
   matériau et par tronçon, matériaux sans texture : aucun shader en plus. */
const bsGarlandMat = new THREE.MeshStandardMaterial({ color: 0x1b3220, roughness: 0.85 });
const BS_BULB = { warm: [4.6, 3.3, 1.7], cool: [3.0, 3.5, 4.8], red: [4.6, 0.45, 0.35], green: [0.6, 3.9, 1.0], blue: [0.8, 1.4, 5.0], amber: [4.8, 2.5, 0.5], gold: [4.4, 3.4, 0.9] };
const BS_PALETTES = { blancChaud: ['warm'], blancFroid: ['cool'], multicolore: ['red', 'green', 'blue', 'amber'], rougeOr: ['red', 'gold'] };
const BS_BALLS = [0x8e0f12, 0xb8892e, 0xaeb3ba, 0x1d5a2a, 0x2a3f8a];
const bsBulbMats = new Map(Object.entries(BS_BULB).map(([k, c]) => [k, new THREE.MeshBasicMaterial({ color: new THREE.Color(...c) })]));
let bsGarland = [], bsBulbs = new Map(), bsBalls = new Map(), bsBows = [], bsCandles = [];
function bsFlushDecor() {
  if (bsGarland.length) RIGHT.add(new THREE.Mesh(mergeGeometries(bsGarland), bsGarlandMat));
  for (const [k, l] of bsBulbs) RIGHT.add(new THREE.Mesh(mergeGeometries(l), bsBulbMats.get(k)));
  for (const [c, l] of bsBalls) RIGHT.add(shadowed(new THREE.Mesh(mergeGeometries(l), paintMat(c, 0.22, 0.65)), false, true));
  if (bsBows.length) RIGHT.add(new THREE.Mesh(mergeGeometries(bsBows), paintMat(0x9a0d0d, 0.55, 0.05)));
  if (bsCandles.length) RIGHT.add(new THREE.Mesh(mergeGeometries(bsCandles), paintMat(0xe6e1d6, 0.6, 0)));
  bsGarland = []; bsBulbs = new Map(); bsBalls = new Map(); bsBows = []; bsCandles = [];
}
const bsPick = list => list[Math.floor(Math.random() * list.length)];
function bsBulb(p, col, r = 0.032) {
  if (!bsBulbs.has(col)) bsBulbs.set(col, []);
  const g = new THREE.SphereGeometry(r, 5, 4); g.translate(p.x, p.y, p.z); bsBulbs.get(col).push(g);
}
function bsBall(p, color, r = 0.055) {
  if (!bsBalls.has(color)) bsBalls.set(color, []);
  const g = new THREE.SphereGeometry(r, 8, 6); g.translate(p.x, p.y, p.z); bsBalls.get(color).push(g);
}
/** Ampoules le long d'une courbe, couleurs de la palette en alternance, enroulées à `wrap` m de l'axe. */
function bsBulbsAlong(curve, len, pal, step = 0.065, wrap = 0.065) {
  const nb = Math.max(3, Math.round(len / step));
  for (let k = 0; k <= nb; k++) {
    const p = curve.getPoint(k / nb), t = k * 2.4;
    bsBulb(new THREE.Vector3(p.x + Math.cos(t) * wrap, p.y + Math.sin(t) * wrap, p.z + Math.sin(t * 0.7) * wrap), pal[k % pal.length]);
  }
}
/** Guirlande de sapin entre a et b (tombante de `sag`) ; ampoules et boules selon le kit. */
function bsGarlandSeg(a, b, sag, kit, o = {}) {
  const m = a.clone().add(b).multiplyScalar(0.5); m.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(a, m, b), len = a.distanceTo(b);
  if (!o.bare) bsGarland.push(new THREE.TubeGeometry(curve, Math.max(4, Math.round(len / 0.12)), o.r ?? 0.08, 5, false));
  if (!o.noLights) bsBulbsAlong(curve, len, kit.pal, o.bare ? 0.05 : 0.065, o.bare ? 0.03 : 0.065);
  if (o.balls) { const nb = Math.max(1, Math.round(len / 0.32)); for (let k = 1; k < nb; k++) { const p = curve.getPoint(k / nb); bsBall(new THREE.Vector3(p.x, p.y - 0.12, p.z), kit.balls[k % kit.balls.length]); } }
}
/** Nœud rouge (deux boucles, deux pans) en p ; s : taille. */
function bsBow(p, s = 1) {
  for (const e of [-1, 1]) {
    const l = new THREE.SphereGeometry(0.075 * s, 8, 6); l.scale(0.5, 0.75, 1); l.translate(p.x, p.y + 0.02 * s, p.z + e * 0.07 * s); bsBows.push(l);
    const t = new THREE.BoxGeometry(0.03 * s, 0.2 * s, 0.045 * s); t.rotateX(e * 0.3); t.translate(p.x, p.y - 0.1 * s, p.z + e * 0.04 * s); bsBows.push(t);

}
/** Couronne face à la rue : lumineuse (palette) ou classique (gros nœud, baies rouges). */
function bsWreath(side, x, y, z, r, kit, lit) {
  const g = new THREE.TorusGeometry(r, 0.085, 6, 18); g.rotateY(Math.PI / 2); g.translate(x, y, z); bsGarland.push(g);
  if (lit) for (let k = 0; k < 22; k++) { const a = k / 22 * Math.PI * 2; bsBulb(new THREE.Vector3(x - side * 0.06, y + Math.sin(a) * r, z + Math.cos(a) * r), kit.pal[k % kit.pal.length], 0.03); }
  else for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2 + 0.3; bsBall(new THREE.Vector3(x - side * 0.07, y + Math.sin(a) * r, z + Math.cos(a) * r), 0x8e0f12, 0.035); }   // baies

/** Petit sapin illuminé (pot ou pleine terre) : étages de cônes, ampoules en spirale, étoile. */
function bsLitTree(x, y0, z, h, kit, pot) {
  if (pot) { const p = new THREE.CylinderGeometry(0.2, 0.15, 0.3, 10); p.translate(x, y0 + 0.15, z); bsCandles.push(p); y0 += 0.3; }
  for (let t = 0; t < 3; t++) { const f = t / 3, ch = h * 0.5, c = new THREE.ConeGeometry(h * 0.36 * (1 - f * 0.55), ch, 10); c.translate(x, y0 + 0.1 + f * h * 0.6 + ch / 2, z); bsGarland.push(c); }

  bsBulb(new THREE.Vector3(x, y0 + h + 0.18, z), 'gold', 0.07);
  snowPad(x, y0 + h * 0.62, z, h * 0.3, h * 0.3, 0.06);
}

/** Habille une maison pour les fêtes, avec un assortiment tiré au hasard. h : { zd, yP, rails,
 *  fences, door, wins, za, zb, free }. */
function bsDecorate(side, X, h) {
  const palName = bsPick(Object.keys(BS_PALETTES));
  const kit = { pal: BS_PALETTES[palName], balls: [bsPick(BS_BALLS), bsPick(BS_BALLS), 0xb8892e],
    rail: bsPick(['sapin', 'sapin-boules', 'ampoules']), fence: bsPick(['festons', 'festons-boules', 'ampoules', 'rien']),
    door: bsPick(['couronne', 'couronne-noeud', 'encadrement', 'sapins']), wins: bsPick(['bougies', 'drapé', 'contour', 'couronnes', 'rien']) };
  // rampes du perron
  for (const [a, b] of h.rails) {
    const A = a.clone().setY(a.y - 0.04), B = b.clone().setY(b.y - 0.04);
    if (kit.rail === 'ampoules') bsGarlandSeg(A, B, 0, kit, { bare: true });
    else bsGarlandSeg(A, B, 0.05, kit, { balls: kit.rail === 'sapin-boules' });
  }
  if (kit.rail !== 'ampoules') h.rails.forEach(([a], i) => { if (i % 2 === 0) bsBow(a.clone().setY(a.y - 0.08)); });
  // grille de la cour
  const xf = side * (FACADE_X + 0.15), yf = SIDEWALK_H + 1.38;
  if (kit.fence !== 'rien') for (const [za, zb] of h.fences) {
    if (zb - za < 0.6) continue;
    const n = Math.max(1, Math.round((zb - za) / 1.2));
    for (let k = 0; k < n; k++) {
      const z0 = za + (zb - za) * k / n, z1 = za + (zb - za) * (k + 1) / n, A = new THREE.Vector3(xf, yf, z0 + 0.05), B = new THREE.Vector3(xf, yf, z1 - 0.05);
      if (kit.fence === 'ampoules') bsGarlandSeg(A, B, 0.02, kit, { bare: true });
      else { bsGarlandSeg(A, B, 0.16, kit, { balls: kit.fence === 'festons-boules' }); bsBow(new THREE.Vector3(xf - side * 0.05, yf + 0.02, z0 + 0.05)); }
    }
  }
  // porte
  const D = h.door;
  if (kit.door === 'couronne' || kit.door === 'couronne-noeud') bsWreath(side, D.xWreath, D.yWreath, h.zd, 0.3, kit, kit.door === 'couronne');
  else if (kit.door === 'encadrement') {
    // guirlande qui suit le pourtour de la porte (l'arc pour une porte cintrée), un nœud en haut
    const x = X(0.22), half = D.half, pts = [new THREE.Vector3(x, h.yP + 0.3, h.zd - half)];
    if (D.arch) for (let k = 0; k <= 8; k++) { const a = Math.PI - k * Math.PI / 8; pts.push(new THREE.Vector3(x, D.spring + Math.sin(a) * half, h.zd + Math.cos(a) * half)); }
    else pts.push(new THREE.Vector3(x, D.top, h.zd - half), new THREE.Vector3(x, D.top, h.zd + half));
    pts.push(new THREE.Vector3(x, h.yP + 0.3, h.zd + half));
    for (let k = 0; k < pts.length - 1; k++) bsGarlandSeg(pts[k], pts[k + 1], 0.02, kit, { balls: k % 2 === 0 });
    bsBow(new THREE.Vector3(x - side * 0.04, (D.arch ? D.spring + half : D.top) + 0.05, h.zd), 1.5);
  } else for (const e of [-1, 1]) bsLitTree(X(0.45), h.yP, h.zd + e * 0.78, 0.95, kit, true);
  // fenêtres : parlor floor, et pour les bougies tous les étages
  for (const w of h.wins) {
    const x = X(-BS_REC + 0.12);
    if (kit.wins === 'bougies') {
      const c = new THREE.CylinderGeometry(0.028, 0.03, 0.26, 8); c.translate(x, w.y0 + 0.13, w.z); bsCandles.push(c);
      bsBulb(new THREE.Vector3(x, w.y0 + 0.31, w.z), 'amber', 0.03);
    }
    if (!w.parlor) continue;
    if (kit.wins === 'couronnes') bsWreath(side, x, w.y0 + 1.45, w.z, 0.34, kit, false);
    else if (kit.wins === 'drapé') {
      const a = new THREE.Vector3(X(0.18), w.y1 + 0.05, w.z - w.w / 2 - 0.1), b = new THREE.Vector3(X(0.18), w.y1 + 0.05, w.z + w.w / 2 + 0.1);
      bsGarlandSeg(a, b, 0.32, kit, { balls: true }); bsBow(a, 0.8); bsBow(b, 0.8);
    } else if (kit.wins === 'contour') {
      const x2 = X(0.05), c = [[w.z - w.w / 2 - 0.05, w.y0], [w.z - w.w / 2 - 0.05, w.y1 + 0.05], [w.z + w.w / 2 + 0.05, w.y1 + 0.05], [w.z + w.w / 2 + 0.05, w.y0]];
      for (let k = 0; k < 3; k++) bsGarlandSeg(new THREE.Vector3(x2, c[k][1], c[k][0]), new THREE.Vector3(x2, c[k + 1][1], c[k + 1][0]), 0, kit, { bare: true });
    }

  // parfois un sapin illuminé dans la cour, parfois des stalactites lumineuses sous le bandeau
  if (Math.random() < 0.3 && h.free[1] - h.free[0] > 1.2) bsLitTree(X(1.3), SIDEWALK_H + 0.25, (h.free[0] + h.free[1]) / 2, 1.7, kit, false);
  if (Math.random() < 0.3) for (let z = h.za + 0.2; z < h.zb - 0.2; z += 0.14) {
    if (Math.abs(z - h.zd) < 1.15) continue;                                     // le perron
    const k = 2 + Math.floor(Math.random() * 4);
    for (let j = 0; j < k; j++) bsBulb(new THREE.Vector3(X(0.18), h.yP - 0.36 - j * 0.09, z), 'cool', 0.022);
  }
  addPointSource({ pos: RIGHT.toWorld(new THREE.Vector3(X(AREA_W * 0.6), h.yP + 0.6, h.zd)), color: new THREE.Color(0xffc890), intensity: 3.5, distance: 6 });
  addSubject({ label: 'Une maison décorée pour les fêtes', value: 0.9, glows: true, box: RIGHT.box(boxAt(X(AREA_W / 2), h.zd, AREA_W / 2 + 0.2, 2.2, SIDEWALK_H, h.yP + 2.6)),
    moment: () => ({ pts: 3, why: 'décorations allumées sous la neige' }) });
}

/** Grille de la cour anglaise : muret de grès, barreaux à pointe de lance, lisses, poteaux à boule. */
function bsFence(side, za, zb, h = 1.0) {
  const L = zb - za; if (L < 0.05) return;
  const x = side * (FACADE_X + 0.15), zc = (za + zb) / 2;
  bsBox(bsStoopGeoms, 0.3, 0.44, L, x, SIDEWALK_H + 0.12, zc, 2.15);
  snowPad(x, SIDEWALK_H + 0.34, zc, 0.32, L, 0.11);
  if (L < 0.35) return;
  const y0 = SIDEWALK_H + 0.34;
  for (let z = za + 0.08; z < zb - 0.04; z += 0.125) {
    const g = new THREE.CylinderGeometry(0.012, 0.012, h, 5); g.translate(x, y0 + h / 2, z); fenceGeoms.push(g);
    const tip = new THREE.ConeGeometry(0.024, 0.09, 4); tip.translate(x, y0 + h + 0.045, z); fenceGeoms.push(tip);
  }
  for (const yy of [y0 + 0.1, y0 + h - 0.12]) { const g = new THREE.BoxGeometry(0.03, 0.04, L); g.translate(x, yy, zc); fenceGeoms.push(g); }
  for (const z of [za + 0.04, zb - 0.04]) {
    const g = new THREE.BoxGeometry(0.06, h + 0.1, 0.06); g.translate(x, y0 + (h + 0.1) / 2, z); fenceGeoms.push(g);
    const b = new THREE.SphereGeometry(0.045, 8, 6); b.translate(x, y0 + h + 0.15, z); fenceGeoms.push(b);
  }
  snowPad(x, y0 + h - 0.1, zc, 0.06, L, 0.04, 0, 0.3);

/** Grille de séparation entre deux cours (perpendiculaire à la rue), du muret jusqu'à la façade. */
function bsPartition(side, z) {
  const ox = -side, fx = side * (FACADE_X + AREA_W), X = d => fx + ox * d, y0 = SIDEWALK_H + 0.2;
  for (let d = 0.2; d < AREA_W - 0.25; d += 0.14) { const g = new THREE.CylinderGeometry(0.011, 0.011, 0.85, 5); g.translate(X(d), y0 + 0.42, z); fenceGeoms.push(g); }
  const r = new THREE.BoxGeometry(AREA_W - 0.3, 0.035, 0.03); r.translate(X(AREA_W / 2), y0 + 0.82, z); fenceGeoms.push(r);
  snowPad(X(AREA_W / 2), y0 + 0.84, z, AREA_W - 0.35, 0.05, 0.035, 0, 0.3, 0);
}

/** Une terrace : n maisons de largeur W à partir de z0 (côté side de la rue de droite). */
function buildTerrace(side, z0, n, W, sty) {
  const ox = -side, fx = side * (FACADE_X + AREA_W), X = d => fx + ox * d;
  const L = n * W, zc = z0 + L / 2, yP = stoopGeom(sty).yP, y2 = yP + PARLOR_H, yTop = y2 + sty.floors * UPPER_H;
  const snowStart = snowGeoms.length, face = [], base = [], holesF = [], holesB = [];
  const corn = bsCornice.get(sty.cornice) ?? []; bsCornice.set(sty.cornice, corn);
  const xB = X(-BS_REC);                                          // fond des embrasures
  // corps de la maison, derrière les embrasures ; il monte jusqu'au toit, derrière la corniche
  const bodyX = side * (FACADE_X + AREA_W + BS_REC + (BS_DEPTH - BS_REC) / 2);
  bsBox(face, BS_DEPTH - BS_REC, yTop + 1 - yP, L, bodyX, (yP + yTop + 1) / 2, zc);
  bsBox(base, BS_DEPTH - BS_REC, yP + 0.6, L, bodyX, (yP - 0.6) / 2, zc, 5);
  // bandeau au niveau du parlor floor (sous le palier)
  bsBox(face, 0.16, 0.3, L, X(0.08), yP - 0.17, zc); snowPad(X(0.08), yP - 0.02, zc, 0.16, L, 0.08);

  for (let i = 0; i < n; i++) {
    const za = z0 + i * W, doorEnd = i % 2 === 0, bays = [W / 6, W / 2, 5 * W / 6].map(u => za + u), doorBay = doorEnd ? 2 : 0, zd = bays[doorBay];
    const wins = [];                                              // fenêtres de la maison (décorations)
    bays.forEach((zb, b) => {
      // rez-de-jardin : fenêtres à moitié dans la neige de la cour, derrière une grille
      if (b !== doorBay) {
        const w = 1.05, y1 = Math.min(1.5, yP - 0.4), y0 = Math.min(0.42, y1 - 0.5);
        holesB.push({ z0: zb - w / 2, z1: zb + w / 2, y0, y1 }); bsWindow(side, xB, y0, y1, zb, w, 0.25, 0.45);
        for (let bz = -w / 2 + 0.06; bz < w / 2; bz += 0.11) { const g = new THREE.CylinderGeometry(0.011, 0.011, y1 - y0, 5); g.translate(X(0.04), (y0 + y1) / 2, zb + bz); fenceGeoms.push(g); }
        for (const hy of [y0 + 0.05, y1 - 0.05]) { const g = new THREE.BoxGeometry(0.02, 0.035, w + 0.04); g.translate(X(0.04), hy, zb); fenceGeoms.push(g); }
        // parlor floor : hautes fenêtres sous un fronton
        const wp = 1.15, p0 = yP + 0.35, p1 = yP + 3.0;
        holesF.push({ z0: zb - wp / 2, z1: zb + wp / 2, y0: p0, y1: p1 }); bsWindow(side, xB, p0, p1, zb, wp, 0.38, 0.4);
        wins.push({ z: zb, y0: p0, y1: p1, w: wp, parlor: true });
        bsSill(face, X, p0, zb, wp); bsParlorHood(face, X, p1, zb, wp, sty.hood);
      }
      // étages : trois fenêtres alignées sur les travées, la dernière plus basse
      for (let j = 0; j < sty.floors; j++) {
        const w = 1.1, y0 = y2 + j * UPPER_H + 0.75, y1 = y0 + (j === sty.floors - 1 ? 1.7 : 2.0);
        holesF.push({ z0: zb - w / 2, z1: zb + w / 2, y0, y1 }); bsWindow(side, xB, y0, y1, zb, w, 0.3, 0.45);
        wins.push({ z: zb, y0, y1, w, parlor: false });
        bsSill(face, X, y0, zb, w);
        if (sty.hood === 'segment') { bsParlorHood(face, X, y1, zb, w, 'segment'); continue; }   // frontons cintrés à tous les étages
        bsBox(face, 0.06, 0.12, w + 0.2, X(0.03), y1 + 0.06, zb);                                 // frise
        bsBox(face, 0.2, 0.16, w + 0.44, X(0.1), y1 + 0.2, zb);                                   // larmier
        for (const e of [-1, 1]) bsBox(face, 0.13, 0.26, 0.1, X(0.065), y1 + 0.02, zb + e * (w / 2 + 0.15));
        snowPad(X(0.1), y1 + 0.28, zb, 0.2, w + 0.4, 0.1);
      }
    });
    // porte du parlor floor : entrée complète (encadrement en grès, lanterne loin du voisin)
    let door = { yWreath: yP + 1.55, xWreath: X(0.12), arch: false, half: 0.95, top: yP + 3.05 };
    if (sty.door === 'arch') {
      const d = bsArchedDoor(side, fx, zd, yP, face, sty);
      holesF.push({ z0: zd - d.SW / 2, z1: zd + d.SW / 2, y0: yP, y1: yP + d.SH });
      door = d;
    } else buildEntrance(side, zd, yP, { faceX: fx, trim: face, lanternSide: doorEnd ? -1 : 1 });
    const rails = bsStoop(side, fx, zd, sty, face, doorEnd ? 1 : -1);
    // grille de la cour : interrompue au pied du perron ; séparations entre cours (sauf entre perrons appariés)
    const s0 = zd - STOOP_W / 2 - 0.02, s1 = zd + STOOP_W / 2 + 0.02;
    bsFence(side, za, s0); bsFence(side, s1, za + W);
    const free = doorEnd ? [za + 0.4, s0 - 0.3] : [s1 + 0.3, za + W - 0.4];
    if (Math.random() < 0.38) bsDecorate(side, X, { zd, yP, rails, fences: [[za, s0], [s1, za + W]], door, wins, za, zb: za + W, free });
    if (!doorEnd || i === 0) bsPartition(side, za + 0.02);
    if (i === n - 1) bsPartition(side, za + W - 0.02);
    // cheminée sur le mur mitoyen
    if (i % 2 === 0) { bsBox(base, 0.7, 1.6, 0.9, X(-4), yTop + 1.8, za, 5); snowPad(X(-4), yTop + 2.6, za, 0.72, 0.92, 0.15); }
    // mur mitoyen : un pilastre de grès à peine saillant marque chaque maison de la terrace
    if (i > 0) bsBox(face, 0.08, yTop - yP + 0.2, 0.3, X(0.04), (yP + yTop) / 2 - 0.1, za);
    brownHouses.push({ side, za, zb: za + W, zd, free: doorEnd ? [za + 0.4, s0 - 0.3] : [s1 + 0.3, za + W - 0.4] });
  }
  // façades : couche avant découpée autour des ouvertures
  bsFrontLayer(face, X(-BS_REC / 2), z0, z0 + L, yP, yTop, holesF);
  bsFrontLayer(base, X(-BS_REC / 2), z0, z0 + L, -0.6, yP - 0.32, holesB, 5);
  // corniche peinte : frise, moulure, larmier, consoles à volute, modillons ; neige dessus
  bsBox(corn, 0.12, 0.8, L, X(0.06), yTop + 0.4, zc);
  bsBox(corn, 0.36, 0.14, L + 0.1, X(0.18), yTop + 0.86, zc);
  bsBox(corn, 0.78, 0.2, L + 0.3, X(0.39), yTop + 1.03, zc);
  for (let i = 0; i < n; i++) for (const u of [0.2, W / 3, 2 * W / 3, W - 0.2]) {
    const g = bsBracketGeo.clone(); if (ox < 0) g.rotateY(Math.PI);
    g.translate(X(0.12), yTop + 0.13, z0 + i * W + u); corn.push(g);
  }
  for (let z = z0 + 0.35; z < z0 + L - 0.2; z += 0.38) bsBox(corn, 0.42, 0.07, 0.09, X(0.33), yTop + 0.9, z);
  snowPad(X(0.39), yTop + 1.13, zc, 0.78, L + 0.26, 0.28);
  snowPad(bodyX + ox * 0.3, yTop + 1, zc, BS_DEPTH - 0.8, L - 0.3, 0.32, 0, 1.2);               // toit : invisible de la rue, maillage grossier

  // matériaux de la terrace : grès lisse (même programme que la brique) et grès refendu (soubassements)
  const tint = sty.tint, faceMat = new THREE.MeshStandardMaterial({ map: brownstone.map, normalMap: brownstone.normal, normalScale: new THREE.Vector2(0.8, 0.8), roughnessMap: brownstone.rough, roughness: 1, color: new THREE.Color(...tint) });
  weather(faceMat, { top: yTop, z0, pitch: W / 3, cols: 3 * n, y0: y2 + 0.75, floorH: UPPER_H, rows: sty.floors, winW: 1.1, frame: RIGHT.frame, warm: 1, faceX: FACADE_X + AREA_W });
  const baseMat = new THREE.MeshStandardMaterial({ map: stone.map, normalMap: stone.normal, normalScale: new THREE.Vector2(0.9, 0.9), roughnessMap: stone.rough, roughness: 1, color: new THREE.Color(tint[0] * 2.2, tint[1] * 2.2, tint[2] * 2.2) });
  weather(baseMat, { strength: 0.8, frame: RIGHT.frame, warm: 1, faceX: FACADE_X + AREA_W });
  usePhoto(baseMat, 'large_sandstone_blocks', 5 / 3, 5 / 3, m => m.color.lerp(PHOTO_WHITE, 0.3));
  RIGHT.add(shadowed(new THREE.Mesh(mergeGeometries(face.map(g => g.index ? g.toNonIndexed() : g)), faceMat)));
  RIGHT.add(shadowed(new THREE.Mesh(mergeGeometries(base), baseMat)));
  flushSnowPads(snowStart);
}
function bsSill(list, X, y0, zb, w) {
  bsBox(list, BS_REC + 0.14, 0.12, w + 0.3, X((0.14 - BS_REC) / 2), y0 - 0.06, zb);
  snowPad(X(-0.08), y0, zb, 0.42, w + 0.26, 0.1);
}
/** Couronnement des fenêtres du parlor floor : fronton triangulaire, arc segmentaire ou corniche plate, sur consoles. */
function bsParlorHood(list, X, y1, zb, w, kind) {
  const W2 = w + 0.6, yb = y1 + 0.3;
  bsBox(list, 0.08, 0.22, w + 0.24, X(0.04), y1 + 0.11, zb);                                   // frise
  bsBox(list, 0.28, 0.16, W2, X(0.14), yb, zb);                                                 // larmier
  for (const e of [-1, 1]) bsBox(list, 0.2, 0.44, 0.13, X(0.1), y1 + 0.02, zb + e * (w / 2 + 0.2));   // consoles
  if (kind === 'flat') { bsBox(list, 0.34, 0.1, W2 + 0.1, X(0.17), yb + 0.13, zb); snowPad(X(0.17), yb + 0.18, zb, 0.34, W2 + 0.06, 0.14); return; }
  const n = kind === 'pediment' ? 2 : 7, half = W2 / 2;
  const pts = [];
  for (let k = 0; k <= n; k++) {
    const t = -1 + 2 * k / n, z = zb + t * half;
    const y = kind === 'pediment' ? yb + 0.08 + (1 - Math.abs(t)) * half * 0.42 : yb + 0.08 + Math.sqrt(Math.max(0, 1 - t * t * 0.85)) * 0.42;
    pts.push(new THREE.Vector3(X(0.13), y, z));
  }
  for (let k = 0; k < n; k++) {
    const seg = []; bsStrut(seg, pts[k], pts[k + 1], 0.13); bsPlace(list, seg[0]);
    bsSnowStrip(pts[k].clone().setY(pts[k].y + 0.07), pts[k + 1].clone().setY(pts[k + 1].y + 0.07), 0.24, 0.07);
  }
}

/** Rangée de brownstones du côté `side`, de zFrom à zTo EXACTEMENT (repère de la rue de droite). */
function buildBrownRow(side, zFrom, zTo) {
  let z = zFrom, nb = 0;
  bsFlush();
  while (nb < RIGHT_CHUNKS.length && RIGHT_CHUNKS[nb] <= zFrom) nb++;
  while (zTo - z > 3) {
    if (nb < RIGHT_CHUNKS.length && z >= RIGHT_CHUNKS[nb]) { bsFlush(); while (nb < RIGHT_CHUNKS.length && RIGHT_CHUNKS[nb] <= z) nb++; }
    const R = zTo - z;
    let n = 2 + Math.floor(Math.random() * 4), W = rnd(6.0, 6.9);
    if (R - n * W < 12.2) { n = Math.max(1, Math.round(R / 6.5)); W = R / n; }   // dernière terrace : elle prend le reste
    const sty = { ...BS_STYLES[Math.floor(Math.random() * BS_STYLES.length)], floors: Math.random() < 0.62 ? 2 : 3,
      tint: BS_TINTS[Math.floor(Math.random() * BS_TINTS.length)].map(v => v * rnd(0.9, 1.1)), cornice: BS_CORNICE[Math.floor(Math.random() * BS_CORNICE.length)] };
    buildTerrace(side, z, n, W, sty);
    z += n * W;
  }
}

// Côté −1 (en face, z monde < CROSS_Z) : du parc jusqu'au droit de la rue principale ; côté +1
// (feux) : du parc jusqu'à l'immeuble d'angle de la rue principale (14 m de profondeur).
beginStreet(RIGHT, 1, RIGHT_CHUNKS);
buildBrownRow(-1, BS_ROW_END, -FACADE_X);
buildBrownRow(1, BS_ROW_END, -(FACADE_X + 14));
bsFlush();
endStreet();

/* ───────────────────────── src/world/contactShadows.js ───────────────────────── */
/* =====================================================================
   6 ter. OMBRES DE CONTACT
   Ce qui manquait le plus face à la photo de référence : l'assombrissement au
   pied des objets. Sans lui tout a l'air posé sur la neige plutôt que dedans.

   La scène étant STATIQUE (rien ne bouge à part les flocons, la vapeur et le
   joueur), il n'y a aucune raison de payer un SSAO recalculé 60 fois par
   seconde : on pose des décalques sombres une fois pour toutes. Coût : quelques
   dizaines de quads transparents, aucune passe de post-traitement en plus.

   Chaque décalque est SUBDIVISÉ et ses vertex sont plaqués sur `groundY` : sur
   une neige ondulée, un quad plat s'enterrerait dans les creux et flotterait
   sur les bosses. Les décalques vivent en coordonnées MONDE (groundY aussi).
   ===================================================================== */
const CONTACT_LIFT = 0.015;                 // au-dessus du sol, pour éviter le z-fighting
const contactMats = new Map();
function contactMat(tex, opacity) {
  const k = `${tex.uuid}/${opacity}`;
  if (!contactMats.has(k)) contactMats.set(k, new THREE.MeshBasicMaterial({
    map: tex, color: 0x000000, transparent: true, opacity, depthWrite: false, fog: true,
  }));
  return contactMats.get(k);
}

/** Tache d'ombre au sol, centrée sur (x, z) MONDE, de demi-dimensions (rx, rz) ; `parent` : où la
 *  ranger (par défaut la scène ; le groupe « monde » d'une rue, pour être masquée avec elle). */
function addContactShadow(x, z, rx, rz, opacity = 0.5, rotY = 0, seg = 5, parent = scene) {
  const g = new THREE.PlaneGeometry(rx * 2, rz * 2, seg, seg);
  g.rotateX(-Math.PI / 2);
  if (rotY) g.rotateY(rotY);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, groundY(x + p.getX(i), z + p.getZ(i)) + CONTACT_LIFT);
  const m = new THREE.Mesh(g, contactMat(contactBlobTex, opacity));
  m.position.set(x, 0, z); m.renderOrder = -1;      // avant les autres transparents (neige, vapeur)
  parent.add(m);
  return m;
}
/** Idem, centre et orientation donnés dans le repère de la rue st. */
function addContactShadowIn(st, lx, lz, rx, rz, opacity = 0.5, rotY = 0, seg = 5) {
  return addContactShadow(st.wx(lx, lz), st.wz(lx, lz), rx, rz, opacity, rotY + st.angle, seg, st.worldGroup);
}

/** Bande d'ombre le long de la rue st : centre en travers cx, de z0 à z1 (repère de la rue) ;
 *  `flip` retourne la texture (u = 0, le côté opaque, doit tomber contre le mur ou le bourrelet). */
function band(st, cx, w, z0, z1, segZ, flip, opacity) {
  const len = z1 - z0, zc = (z0 + z1) / 2;
  const g = new THREE.PlaneGeometry(w, len, 2, segZ);
  g.rotateX(-Math.PI / 2);
  if (flip) g.rotateY(Math.PI);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const lx = cx + p.getX(i), lz = zc + p.getZ(i), x = st.wx(lx, lz), z = st.wz(lx, lz);
    p.setXYZ(i, x, groundY(x, z) + CONTACT_LIFT, z);
  }
  const m = new THREE.Mesh(g, contactMat(contactEdgeTex, opacity));
  m.renderOrder = -1; st.worldGroup.add(m);
}

/* --- Jonction mur / trottoir, sur toute la longueur des façades ---------
   C'est la ligne la plus payante de toutes : sur la photo, le bas des murs est
   nettement plus sombre que le milieu du trottoir. Idem le long de la bordure côté
   chaussée : le bourrelet de déneigement projette une ombre continue sur la neige de la rue. */
{
  const w = 1.35, cw = 0.9;
  const NEAR = CROSS_Z + FACADE_X, FAR = CROSS_Z - FACADE_X, CURB_N = CROSS_Z + ROAD_HALF;
  for (const [st, s, z0, z1, r0, r1] of [
    [MAIN, -1, NEAR, STREET_Z_MAX + 12, CURB_N + 4, STREET_Z_MAX + 10],
    [MAIN, 1, NEAR, STREET_Z_MAX + 12, CURB_N + 2, STREET_Z_MAX + 10],
    [LEFT, -1, LEFT_END_X, -FACADE_X, LEFT_END_X + 2, -FACADE_X - 1],
    [LEFT, 1, LEFT_END_X, FACADE_X, LEFT_END_X + 2, ROAD_HALF - 3],
    [RIGHT, -1, BS_ROW_END, -FACADE_X, -RIGHT_END_X + 2, -ROAD_HALF - 3],
    [RIGHT, 1, BS_ROW_END, -FACADE_X, -RIGHT_END_X + 2, -FACADE_X - 1],
  ]) {
    band(st, s * (FACADE_X - w / 2), w, z0, z1, Math.round((z1 - z0) / 0.42), s > 0, 0.55);
    band(st, s * (ROAD_HALF - 0.35 - cw / 2), cw, r0, r1, Math.round((r1 - r0) / 0.62), s < 0, 0.34);
  }
}

/* ───────────────────────── src/world/props.js ───────────────────────── */
/* =====================================================================
   7. LAMPADAIRES ORNEMENTAUX, POUBELLES, BOUCHES D'INCENDIE, CONGÈRES
   ===================================================================== */

// Fonte peinte (vert-noir, éclats, rouille, sel au pied) : partagée par tous les lampadaires
const lampPaintMat = new THREE.MeshStandardMaterial({
  map: lampPaint.map, roughnessMap: lampPaint.roughnessMap, normalMap: lampPaint.normalMap,
  normalScale: new THREE.Vector2(0.7, 0.7), roughness: 1, metalness: 0.15, envMapIntensity: 1.1,   // peinture : diélectrique, presque pas métallique
});
// relief et rugosité d'une fonte piquée de rouille (photo), sans toucher à la couleur de la peinture
usePhoto(lampPaintMat, 'rust_coarse_01', 0.5, 2, m => { m.map = lampPaint.map; });

// Globe en verre dépoli prismatique. Un MeshBasic blanc saturé ne montrait qu'une
// boule plate ; ici le verre est plus lumineux là où on regarde à travers vers
// l'ampoule (face à l'œil, vers le milieu) et plus sourd sur les bords, avec les
// côtes verticales du verre prismatique. Couleurs > 1 : c'est le bloom qui fait la lueur.
const globeVS = `
  varying vec3 vN, vV; varying float vY, vA;
  #include <fog_pars_vertex>
  void main(){
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vN = normalize(normalMatrix * normal); vV = -mvPosition.xyz;
    vY = position.y; vA = atan(position.z, position.x);
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const globeFS = `
  uniform vec3 uColor; uniform float uK, uY0, uY1;
  varying vec3 vN, vV; varying float vY, vA;
  #include <fog_pars_fragment>
  void main(){
    float ndv = abs(dot(normalize(vN), normalize(vV)));
    float t = clamp((vY - uY0) / (uY1 - uY0), 0.0, 1.0);
    float bulb = exp(-pow((t - 0.55) * 2.6, 2.0));                 // l'ampoule, vers le milieu du globe
    float rib = 0.8 + 0.2 * pow(abs(cos(vA * 12.0)), 3.0);         // côtes du verre prismatique
    float c = (0.4 + 1.35 * pow(ndv, 1.8) * (0.45 + 0.85 * bulb)) * rib;
    gl_FragColor = vec4(uColor * c * uK, 1.0);
    #include <fog_fragment>
  }`;

// Cône de lumière dans la neige en suspension : sous chaque lanterne, l'air chargé
// de flocons diffuse la lumière et dessine un cône pâle — c'est LE signe d'un
// lampadaire dans une tempête. Additif, sans écriture de profondeur, bords fondus
// (plus on voit la paroi par la tranche, plus elle s'efface), brouillard calculé à
// la main : en additif, la brume de Three AJOUTERAIT sa couleur au lieu d'éteindre.
const coneVS = `
  uniform float uH, uFog;
  varying float vH, vFog; varying vec3 vN, vV;
  void main(){
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vH = position.y / uH + 0.5;                                     // 0 au sol, 1 à la lanterne
    vN = normalize(normalMatrix * normal); vV = -mv.xyz;
    float d = length(mv.xyz); vFog = exp(-uFog * uFog * d * d);
    gl_Position = projectionMatrix * mv;
  }`;
const coneFS = `
  uniform vec3 uColor; uniform float uK;
  varying float vH, vFog; varying vec3 vN, vV;
  void main(){
    float edge = pow(abs(dot(normalize(vN), normalize(vV))), 3.0);
    float a = (0.1 + 0.9 * pow(vH, 2.2)) * smoothstep(0.0, 0.2, vH) * edge * vFog * uK;
    gl_FragColor = vec4(uColor * a, 1.0);
  }`;

// DIFFUSION de la lanterne dans l'air chargé de neige. Le cône seul faisait
// « projecteur » ; en vrai, chaque flocon et chaque gouttelette renvoie la lumière
// dans toutes les directions, et l'on voit une boule de lumière qui s'éteint
// progressivement autour de la lanterne. Pour chaque pixel, on intègre
// analytiquement la lumière reçue le long du rayon de vue (intensité en 1/d²) :
//   ∫ dt / ((t − tc)² + h²) = [atan((t − tc) / h)] / h
// (tc : point du rayon le plus proche de la lampe, h : distance à ce point).
// On retranche la valeur au bord pour que la contribution tombe à zéro EN DOUCEUR au bord de la
// sphère englobante (pas de contour visible). Plus fort sous la lanterne qu'au-dessus
// (le chapeau coupe la lumière vers le ciel), éteint par la brume avec la distance.
// Sphère en double face : de l'extérieur on ne garde que les faces avant, de
// l'intérieur (joueur sous le lampadaire) il ne reste que les faces arrière.
// Rayon 4,5 m : la sphère ne rentre ni dans les façades (à 4,65 m) ni dans les voitures.
const glowVS = `
  varying vec3 vWorld;
  void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const glowFS = `
  uniform vec3 uCenter, uColor; uniform float uR, uK, uFog;
  varying vec3 vWorld;
  void main(){
    vec3 O = cameraPosition, D = normalize(vWorld - O), L = uCenter - O;
    bool outside = dot(L, L) > uR * uR;
    if (outside && !gl_FrontFacing) discard;                    // une seule traversée comptée
    float tc = dot(L, D), h2 = dot(L, L) - tc * tc;
    float s2 = uR * uR - h2; if (s2 <= 0.0) discard;
    float s = sqrt(s2), t0 = max(tc - s, 0.0), t1 = tc + s;
    // deux termes : diffusion directe en 1/d² (serrée, 30 cm de cœur pour éviter la
    // singularité dans le globe) + diffusion multiple, qui élargit la lueur (1,5 m de
    // cœur) : dans une tempête, la lumière rebondit de flocon en flocon
    float hA = sqrt(h2 + 0.09), hB = sqrt(h2 + 2.25), dt = t1 - t0;
    float IA = (atan((t1 - tc) / hA) - atan((t0 - tc) / hA)) / hA - dt / (uR * uR + 0.09);
    float IB = (atan((t1 - tc) / hB) - atan((t0 - tc) / hB)) / hB - dt / (uR * uR + 2.25);
    float I = 0.3 * IA + 0.5 * IB;                              // diffusion large réduite : la lueur reste autour du globe (modèle)
    vec3 P = O + D * clamp(tc, t0, t1);
    float down = mix(1.0, 0.3, smoothstep(-0.5, 0.35, normalize(P - uCenter).y));   // chapeau : peu de lumière vers le haut
    float fog = exp(-uFog * uFog * dot(L, L));
    gl_FragColor = vec4(uColor * max(I, 0.0) * down * fog * uK, 1.0);
  }`;

/** Géométrie placée : rotation (x, y, z) puis translation, sans index (fusion). */
function placed(geo, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz)).setPosition(x, y, z));
  return g;
}

function buildLamppost(st, x, z, side) {
  const g = new THREE.Group(), metal = [], snow = [];
  // socle tourné (profil ornemental)
  const profile = [[0, 0], [0.36, 0], [0.36, 0.12], [0.3, 0.18], [0.3, 0.4], [0.22, 0.5], [0.2, 0.9], [0.24, 1.0], [0.16, 1.1], [0.1, 1.2]].map(p => new THREE.Vector2(p[0], p[1]));
  metal.push(placed(new THREE.LatheGeometry(profile, 24), 0, 0, 0));
  // fût CANNELÉ : 16 cannelures creusées dans le cylindre (déplacement radial)
  const pole = new THREE.CylinderGeometry(0.08, 0.11, 5.2, 96, 1, true), pp = pole.attributes.position;
  for (let i = 0; i < pp.count; i++) {
    const px = pp.getX(i), pz = pp.getZ(i), a = Math.atan2(pz, px);
    const k = 1 - 0.07 * Math.pow(0.5 + 0.5 * Math.cos(16 * a), 3);
    pp.setX(i, px * k); pp.setZ(i, pz * k);
  }
  pole.computeVertexNormals();
  metal.push(placed(pole, 0, 3.7, 0));
  metal.push(placed(new THREE.TorusGeometry(0.13, 0.03, 8, 20), 0, 6.28, 0, Math.PI / 2));   // collier
  // col de cygne vers la rue + volute décorative
  const armRot = side < 0 ? Math.PI / 2 : 0, lantX = side * -0.85;
  metal.push(placed(new THREE.TorusGeometry(0.85, 0.05, 10, 28, Math.PI / 2), side * -0.85, 6.3, 0, 0, 0, armRot));
  metal.push(placed(new THREE.TorusGeometry(0.2, 0.035, 8, 20, Math.PI * 1.6), side * -0.15, 6.9, 0, 0, 0, side < 0 ? 0.3 : Math.PI - 0.3));
  // neige posée sur le dessus du col (la partie presque horizontale seulement)
  const ridge = new THREE.TorusGeometry(0.85, 0.045, 6, 14, 0.9); ridge.scale(1, 1, 1.15);
  snow.push(placed(ridge, side * -0.85, 6.3 + 0.035, 0, 0, 0, side < 0 ? Math.PI / 2 : Math.PI / 2 - 0.9));

  // --- Lanterne suspendue au bout du col (y = 7,15) : tige, chapeau en cloche,
  // globe en poire cerclé de 6 côtes, fleuron sous le globe
  const Y_TOP = 6.98, Y_RIM = 6.8, Y_BOT = 6.14;
  metal.push(placed(new THREE.CylinderGeometry(0.022, 0.022, 0.2, 8), lantX, 7.07, 0));
  const hood = [[0.04, Y_TOP + 0.04], [0.09, Y_TOP], [0.2, Y_TOP - 0.05], [0.3, Y_TOP - 0.11], [0.36, Y_RIM + 0.02], [0.37, Y_RIM], [0.3, Y_RIM - 0.01]]
    .map(([rr, yy]) => new THREE.Vector2(rr, yy)).reverse();         // de l'intérieur vers le haut : faces vers l'extérieur
  metal.push(placed(new THREE.LatheGeometry(hood, 24), lantX, 0, 0));
  const globeProf = [[0.001, Y_BOT], [0.08, Y_BOT + 0.03], [0.2, Y_BOT + 0.14], [0.3, Y_BOT + 0.3], [0.33, Y_BOT + 0.44], [0.31, Y_RIM - 0.08], [0.28, Y_RIM]];
  const gpts = globeProf.map(([rr, yy]) => new THREE.Vector2(rr, yy));
  for (let k = 0; k < 6; k++) {                                       // côtes du cerclage, collées au verre
    const a = k / 6 * Math.PI * 2 + 0.26;
    const curve = new THREE.CatmullRomCurve3(globeProf.slice(1).map(([rr, yy]) => new THREE.Vector3(lantX + Math.cos(a) * (rr + 0.012), yy, Math.sin(a) * (rr + 0.012))));
    metal.push(placed(new THREE.TubeGeometry(curve, 14, 0.011, 4), 0, 0, 0));
  }
  metal.push(placed(new THREE.SphereGeometry(0.05, 10, 8), lantX, Y_BOT - 0.03, 0));
  metal.push(placed(new THREE.ConeGeometry(0.03, 0.1, 8), lantX, Y_BOT - 0.12, 0, Math.PI));
  const metalMesh = shadowed(new THREE.Mesh(mergeGeometries(metal), lampPaintMat)); g.add(metalMesh);

  const uK = { value: 1 };                                            // scintillement, partagé globe / cône
  const globeMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uColor: { value: new THREE.Color(1.36, 0.92, 0.44) }, uY0: { value: Y_BOT }, uY1: { value: Y_RIM } }]),
    vertexShader: globeVS, fragmentShader: globeFS, fog: true,
  });
  globeMat.uniforms.uK = uK;
  const globe = new THREE.Mesh(new THREE.LatheGeometry(gpts, 28), globeMat); globe.position.x = lantX; g.add(globe);
  // neige sur le chapeau
  const cs = new THREE.SphereGeometry(1, 16, 6, 0, Math.PI * 2, 0, Math.PI / 2); cs.scale(0.3, 0.1 + Math.random() * 0.05, 0.3);
  snow.push(placed(cs, lantX, Y_TOP - 0.07, 0));
  const snowMesh = new THREE.Mesh(mergeGeometries(snow.map(s => s.index ? s.toNonIndexed() : s)), MAT.snow); snowMesh.receiveShadow = true; g.add(snowMesh);

  const LAMP_Y = 6.5;                                                 // centre du globe
  // Halo en deux couches : un cœur serré + une large diffusion dans la neige en
  // suspension, comme la glare autour du luminaire sur l'image de référence.
  const halos = [];
  for (const [scale, opacity, col] of [[3.6, 0.18, 0xffc27e], [7.5, 0.06, 0xffc88a]]) {
    const h = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
    h.scale.set(scale, scale, 1); h.position.set(lantX, LAMP_Y, 0); g.add(h);
    halos.push({ sprite: h, base: opacity });
  }
  // cône de lumière (voir coneVS) : sommet au globe, s'ouvre jusqu'au trottoir
  const CONE_H = LAMP_Y - 0.25;
  const coneMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(0.1, 0.07, 0.04) }, uH: { value: CONE_H }, uFog: { value: FOG_DENSITY } },   // discret : il ne fait que relier la diffusion au sol
    vertexShader: coneVS, fragmentShader: coneFS,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
  coneMat.uniforms.uK = uK;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(2.7, CONE_H, 32, 1, true), coneMat);
  cone.position.set(lantX, LAMP_Y - 0.25 - CONE_H / 2, 0); g.add(cone);
  // diffusion tout autour de la lanterne (voir glowFS)
  const GLOW_R = 4.5;
  const glowMat = new THREE.ShaderMaterial({
    uniforms: { uCenter: { value: st.toWorld(new THREE.Vector3(x + lantX, SIDEWALK_H + LAMP_Y, z)) }, uColor: { value: new THREE.Color(0.3, 0.23, 0.15) }, uR: { value: GLOW_R }, uFog: { value: FOG_DENSITY } },
    vertexShader: glowVS, fragmentShader: glowFS,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
  glowMat.uniforms.uK = uK;
  const glow = new THREE.Mesh(new THREE.SphereGeometry(GLOW_R, 24, 16), glowMat);
  glow.position.set(lantX, LAMP_Y, 0); glow.frustumCulled = true; g.add(glow);

  // Éclairage : spot chaud vers le trottoir + point doux pour les façades. Ce sont des
  // SOURCES : les vraies lumières (et les ombres) vont aux lampadaires les plus proches du
  // joueur, voir world/lightPool.js.
  const flick = { lights: [], base: [], halos, uK, seed: Math.random() * 10 };
  flickerLights.push(flick);
  addSpotSource({ pos: st.toWorld(new THREE.Vector3(x + lantX, SIDEWALK_H + LAMP_Y, z)), target: st.toWorld(new THREE.Vector3(x + lantX * 1.4, SIDEWALK_H, z)),
    color: new THREE.Color(0xffcc94), intensity: 82, distance: 30, angle: 1.1, penumbra: 0.8, flick });
  // Remplissage : c'est lui qui décolle les façades du noir. Sur la référence, la
  // brique autour de chaque lampadaire est nettement lisible ; sans ce point, on
  // n'a qu'un mur noir et une flaque de lumière au sol.
  addPointSource({ pos: st.toWorld(new THREE.Vector3(x + lantX, SIDEWALK_H + LAMP_Y + 0.1, z)), color: new THREE.Color(0xffb266), intensity: 14, distance: 24, flick });

  g.position.set(x, SIDEWALK_H, z); st.add(g);
  // emprise explicite : la boîte du groupe engloberait la sphère de diffusion de 4,5 m
  addSubject({ label: 'Un lampadaire dans la tempête', value: 0.65, glows: true, box: st.box(boxAt(x + lantX / 2, z, Math.abs(lantX) / 2 + 0.45, 0.45, SIDEWALK_H, SIDEWALK_H + 7.4)) });
  lampPositions.push({ pos: st.toWorld(new THREE.Vector3(x + lantX, SIDEWALK_H + LAMP_Y, z)), col: new THREE.Color(0xffcc94).multiplyScalar(0.56) });   // les flocons suivent la baisse des lampes
  st.collider(x, z, 0.38, 0.38);
  addContactShadowIn(st, x, z, 1.05, 1.05, 0.5);
  // neige au pied
  buildDrift(st, x, SIDEWALK_H, z, 0.7, 0.7);
}

function buildTrashCan(st, x, z, rot) {
  const g = new THREE.Group();
  const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.33, 0.98, 20), MAT.trash)); body.position.y = 0.49; g.add(body);
  // cannelures verticales
  for (let k = 0; k < 10; k++) {
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.9, 0.035), MAT.trash);
    const a = (k / 10) * Math.PI * 2; rib.position.set(Math.cos(a) * 0.365, 0.49, Math.sin(a) * 0.365); rib.rotation.y = -a; g.add(rib);
  }
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.37, 0.028, 8, 24), MAT.iron); rim.rotation.x = Math.PI / 2; rim.position.y = 0.98; g.add(rim);
  // tas de neige sur le couvercle : épais et bosselé comme sur la référence (une calotte lisse faisait bonnet)
  const sg = new THREE.SphereGeometry(0.44, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), sp = sg.attributes.position, seed = Math.random() * 20;
  for (let i = 0; i < sp.count; i++) { const x = sp.getX(i), y = sp.getY(i), z = sp.getZ(i); const k = 1 + (smoothNoise(x * 6 + seed, z * 6) - 0.5) * 0.35 * (y / 0.44); sp.setXYZ(i, x * k, y * k, z * k); }
  sg.computeVertexNormals();
  const snow = new THREE.Mesh(sg, MAT.snow); snow.scale.set(1, 0.75 + Math.random() * 0.4, 1); snow.position.y = 0.95; g.add(snow);
  // coulée de neige sur le côté
  const drip = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), MAT.snow); drip.scale.set(0.7, 1.6, 0.5); drip.position.set(0.3, 0.85, 0.15); g.add(drip);
  g.position.set(x, SIDEWALK_H, z); g.rotation.y = rot; st.add(g);
  st.collider(x, z, 0.42, 0.42);
  addContactShadowIn(st, x, z, 0.62, 0.62, 0.55);
}

function buildHydrant(st, x, z) {
  const g = new THREE.Group();
  const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.72, 12), MAT.hydrant)); body.position.y = 0.36; g.add(body);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.025, 8, 16), MAT.hydrant); ring.rotation.x = Math.PI / 2; ring.position.y = 0.7; g.add(ring);
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), MAT.hydrant); top.position.y = 0.76; g.add(top);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.16, 8), MAT.hydrant); cap.position.y = 0.96; g.add(cap);
  for (const s of [-1, 1]) {
    const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.24, 10), MAT.hydrant); noz.rotation.z = Math.PI / 2; noz.position.set(s * 0.23, 0.52, 0); g.add(noz);
    const nc = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 0.08, 6), MAT.iron); nc.rotation.z = Math.PI / 2; nc.position.set(s * 0.37, 0.52, 0); g.add(nc);
  }
  const snow = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), MAT.snow); snow.scale.set(1, 0.55, 1); snow.position.y = 0.86; g.add(snow);
  g.position.set(x, SIDEWALK_H, z); g.rotation.y = Math.PI / 2; st.add(g);

  st.collider(x, z, 0.3, 0.3);
  addContactShadowIn(st, x, z, 0.5, 0.5, 0.5);
  buildDrift(st, x, SIDEWALK_H, z, 0.55, 0.55);
}

function buildDrift(st, x, y, z, sx, sz, sy = rnd(0.28, 0.55)) {
  // congère bosselée (une demi-sphère lisse faisait oreiller), profil qui s'étale au pied
  const g = new THREE.SphereGeometry(1, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), p = g.attributes.position, seed = Math.random() * 50;
  for (let i = 0; i < p.count; i++) {
    const px = p.getX(i), py = p.getY(i), pz = p.getZ(i), k = 1 + (smoothNoise(px * 2.5 + seed, pz * 2.5) - 0.5) * 0.4 * py;
    p.setXYZ(i, px * (1 + 0.25 * (1 - py)), Math.pow(py, 1.3) * k, pz * (1 + 0.25 * (1 - py)));
  }
  g.computeVertexNormals();
  const d = new THREE.Mesh(g, MAT.snow);
  d.scale.set(sx, sy, sz); d.position.set(x, y, z); d.receiveShadow = true; st.add(d);
}

// Placement, rue par rue (repère de la rue). `sides` : pour chaque côté, l'étendue le long de la
// rue où poser lampadaires, poubelles, bouches d'incendie et congères de façade.
/** Lampadaires de la grille LAMP_Z0 / LAMP_PITCH (côté +1 décalé d'un demi-pas) : c'est aussi elle
 *  que le rebond sur les façades suppose (weathering.js), dans le repère de chaque rue. */
function furnishStreet(st, sides) {
  for (const s of [-1, 1]) {
    const S = sides[s < 0 ? 0 : 1], [l0, l1] = S.lamps;
    const first = LAMP_Z0 + (s > 0 ? LAMP_PITCH / 2 : 0);
    for (let z = first + LAMP_PITCH * Math.ceil((l0 - first) / LAMP_PITCH); z < l1; z += LAMP_PITCH) buildLamppost(st, s * (ROAD_HALF + 0.55), z, s);
  }
  for (const s of [-1, 1]) {
    const S = sides[s < 0 ? 0 : 1], [w0, w1] = S.wall;
    for (let z = w0 + 3; z < w1; z += rnd(8, 15)) {
      if (Math.random() < 0.5) continue;                           // un côté sur deux en moyenne, comme avant
      const n = 1 + Math.floor(Math.random() * 3);
      for (let k = 0; k < n; k++) {
        const zk = z + k * 0.85;
        if (zk > w1 - 0.5 || doorGap(st, s, zk) < 0.45) continue;  // jamais dans les marches d'un perron ni devant une porte
        buildTrashCan(st, s * (FACADE_X - 0.6 - (k % 2) * 0.1), zk, Math.random() * 6);
      }
    }
    for (const z of S.hydrants) buildHydrant(st, s * (ROAD_HALF + 0.75), z);
    for (let z = w0; z < w1; z += rnd(2.5, 6)) {
      // congère raccourcie pour s'arrêter avant un perron ou une porte (elle s'étale sur ~1,25 × sz)
      const gap = Math.min(doorGap(st, s, z), (w1 - z) * 2, (z - w0) * 2), sz = Math.min(rnd(1.5, 3.8), gap / 1.3);
      if (sz > 0.6) buildDrift(st, s * (FACADE_X - 0.25), SIDEWALK_H + 0.12, z, rnd(0.8, 1.8), sz);
    }
  }
}
const hydrantsEvery = (z0, z1, offset) => { const out = []; for (let z = z0 + offset; z < z1; z += 26) out.push(z); return out; };

// Rue principale : à gauche, le mobilier s'arrête au coin (pas de façade au-delà) ; à droite il

]);

]);

  { lamps: [BS_ROW_END + 2, -FACADE_X - 2], wall: [BS_ROW_END + 0.5, -FACADE_X - 0.5], hydrants: hydrantsEvery(BS_ROW_END, -FACADE_X - 4, 19) },
]);
// Poubelles rangées dans les cours anglaises, derrière la grille (une maison sur deux)
for (const h of brownHouses) {
  if (Math.random() < 0.5 || h.free[1] - h.free[0] < 0.9) continue;

  for (let k = 0; k < n; k++) buildTrashCan(RIGHT, h.side * (FACADE_X + 0.75), z + k * 0.85, Math.random() * 6);
}
// Fond de l'impasse : la neige que les chasse-neige ont poussée contre les façades, une
// longue congère d'un trottoir à l'autre (la chaussée arrive au pied des immeubles).
for (let lx = -FACADE_X + 0.6; lx < FACADE_X - 0.4; lx += rnd(1.3, 2.1)) {
  if (doorGap(LEFT_END, -1, LEFT.wz(lx, 0)) < 0.5) continue;      // devant les portes : passage dégagé à la pelle
  const onRoad = Math.abs(lx) < ROAD_HALF;
  buildDrift(LEFT, lx, onRoad ? 0.08 : SIDEWALK_H + 0.1, LEFT_END_X + 0.9, rnd(1.0, 1.7), rnd(1.1, 1.6), onRoad ? rnd(0.65, 1.1) : rnd(0.4, 0.7));
}

const LIV_W = 1024, LIV_H = 384;   // noms uniques : le build colle tous les modules dans une même portée
const livTxt = (ctx, s, x, y, size, col, font = 'bold {s}px Arial, Helvetica, sans-serif') => {

/** Ambulance : bandeau rouge et liseré orange, AMBULANCE en rouge, étoile de vie bleue. */
function makeAmbulanceLivery() {
  const W = LIV_W, H = LIV_H;

  ctx.fillStyle = '#c8161a'; ctx.fillRect(0, H * 0.62, W, H * 0.13);
  ctx.fillStyle = '#f28a1a'; ctx.fillRect(0, H * 0.76, W, H * 0.04);
  livTxt(ctx, 'AMBULANCE', W * 0.58, H * 0.38, 120, '#c8161a', 'bold {s}px Impact, "Arial Narrow", sans-serif');
  // étoile de vie : trois barres croisées, bâton au centre
  ctx.save(); ctx.translate(W * 0.12, H * 0.4); ctx.fillStyle = '#1a4fb4';
  for (let k = 0; k < 3; k++) { ctx.save(); ctx.rotate(k * Math.PI / 3); ctx.fillRect(-18, -62, 36, 124); ctx.restore(); }
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-3, -40, 6, 80); ctx.restore();
  livTxt(ctx, 'EMERGENCY MEDICAL SERVICES  •  UNIT 27', W * 0.5, H * 0.69, 30, '#ffffff');

}

/** Camion de glaces : bandes pastel, ICE CREAM, cornets, et le guichet de service. */
function makeIceCreamLivery() {
  const W = LIV_W, H = LIV_H;
  const c = makeCanvas(LIV_W, LIV_H), ctx = c.getContext('2d');
  ctx.fillStyle = '#7ab8e8'; ctx.fillRect(0, H * 0.78, W, H * 0.22);
  ctx.fillStyle = '#f27aa8'; ctx.fillRect(0, H * 0.72, W, H * 0.05);
  // guichet : vitre sombre + petit auvent rayé
  ctx.fillStyle = '#1a2230'; ctx.fillRect(W * 0.36, H * 0.2, W * 0.3, H * 0.44);
  ctx.strokeStyle = '#d8dde4'; ctx.lineWidth = 8; ctx.strokeRect(W * 0.36, H * 0.2, W * 0.3, H * 0.44);
  for (let k = 0; k < 10; k++) { ctx.fillStyle = k % 2 ? '#ffffff' : '#f27aa8'; ctx.fillRect(W * 0.34 + k * W * 0.034, H * 0.12, W * 0.034, H * 0.07); }
  livTxt(ctx, 'ICE CREAM', W * 0.17, H * 0.3, 70, '#1a4fb4', 'bold {s}px Impact, "Arial Narrow", sans-serif');
  livTxt(ctx, 'SOFT SERVE', W * 0.17, H * 0.48, 38, '#f27aa8');
  livTxt(ctx, 'SHAKES • SUNDAES', W * 0.84, H * 0.5, 34, '#1a4fb4');
  // cornets : gaufre en triangle quadrillé, volute blanche
  for (const cx of [W * 0.79, W * 0.9]) {
    ctx.fillStyle = '#e0a860'; ctx.beginPath(); ctx.moveTo(cx - 34, H * 0.2); ctx.lineTo(cx + 34, H * 0.2); ctx.lineTo(cx, H * 0.42); ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,30,0.6)'; ctx.lineWidth = 2; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(cx + k * 14 - 20, H * 0.2); ctx.lineTo(cx + k * 14 + 20, H * 0.38); ctx.stroke(); }
    ctx.fillStyle = '#fbf6ee'; for (const [dy, r] of [[0.16, 34], [0.1, 26], [0.05, 16]]) { ctx.beginPath(); ctx.arc(cx, H * dy + 12, r, 0, Math.PI * 2); ctx.fill(); }
  }
  return toTexture(c, true, false);
}

/* ---------------------------------------------------------------------
   HIVER SUR LES VOITURES (tout dans les shaders, repère local de la voiture :
   u le long de z, y vers le haut). Une voiture garée une nuit de tempête n'a ni
   vitres propres ni carrosserie propre — c'est ce qui trahissait les nôtres.
   --------------------------------------------------------------------- */
const carLocalVS = (shader, extra = '') => {
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
varying vec3 vCarP; varying vec3 vCarN; varying float vCarSeed;`)
    .replace('#include <project_vertex>', `#include <project_vertex>
      vCarP = position; vCarN = normal;
      vCarSeed = fract(sin(dot(modelMatrix[3].xz, vec2(12.9898, 78.233))) * 43758.5453);   // une valeur par voiture`);
};
/** Vitres givrées et enneigées : un voile de givre laiteux (cristaux fins) sur toutes
 *  les vitres, plus fort sur certaines voitures que d'autres ; de la NEIGE COLLÉE en
 *  plaques sur le pare-brise et la lunette (tournés vers le ciel) et au bas des vitres
 *  latérales. Là où il y a givre ou neige, le verre devient mat. Un seul matériau
 *  pour toutes les voitures (la quantité varie avec la position de chaque voiture). */
const carGlassMat = new THREE.MeshStandardMaterial({ color: 0x0a1220, roughness: 0.08, metalness: 0, envMapIntensity: 1.6 });
carGlassMat.onBeforeCompile = shader => {
  shader.uniforms.uGrime = { value: grimeTex };
  carLocalVS(shader);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
varying vec3 vCarP; varying vec3 vCarN; varying float vCarSeed; uniform sampler2D uGrime;
float cFrost, cSnow;`)
    .replace('#include <map_fragment>', `#include <map_fragment>
      {
        float amt = 0.5 + 0.5 * vCarSeed;
        float nSlow = texture2D(uGrime, vCarP.zy * 0.45 + vec2(vCarP.x * 0.31 + vCarSeed * 7.0, 0.0)).r;
        float nFine = texture2D(uGrime, vCarP.zy * 3.5 + vec2(vCarP.x * 0.9, vCarSeed * 3.0)).b;
        float up = clamp(normalize(vCarN).y, 0.0, 1.0);                      // pare-brise, lunette
        float low = 1.0 - smoothstep(1.02, 1.3, vCarP.y);                    // bas des vitres latérales
        cFrost = clamp(amt * (0.35 + 0.65 * nFine) * (0.7 + 0.3 * nSlow), 0.0, 1.0);
        cSnow = smoothstep(0.5, 0.62, nSlow * 0.55 + up * 0.5 * amt + low * 0.3 + nFine * 0.12);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.58, 0.63, 0.71), cFrost * 0.9);     // givre : blanc-bleu laiteux
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.88, 0.91, 0.96), cSnow);           // neige collée
      }`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(mix(roughnessFactor, 0.5, cFrost), 0.95, cSnow);`);
};

/** Sel et gadoue sur le bas de caisse : croûte poudreuse gris clair qui monte depuis
 *  le bas et autour des roues (projections des pneus), éclaboussures plus sombres
 *  au-dessus. Uniformes propres au gabarit (hauteur du plancher, position des roues). */
function saltPaint(mat, P) {
  const u = { uGrime: { value: grimeTex }, uFloor: { value: P.floor }, uWF: { value: P.wheels[0] }, uWR: { value: P.wheels[1] } };
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, u);
    carLocalVS(shader);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vCarP; varying vec3 vCarN; varying float vCarSeed; uniform sampler2D uGrime; uniform float uFloor, uWF, uWR;
float cSalt;`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        {
          float h = vCarP.y;
          float low = 1.0 - smoothstep(uFloor + 0.05, uFloor + 0.62, h);
          float arch = max(exp(-pow((vCarP.z - uWF) / 0.62, 2.0)), exp(-pow((vCarP.z - uWR) / 0.62, 2.0))) * (1.0 - smoothstep(uFloor, uFloor + 0.8, h));
          float n = texture2D(uGrime, vCarP.zy * 1.4 + vec2(vCarP.x * 0.5 + vCarSeed * 9.0, 0.0)).r;
          float sp = texture2D(uGrime, vCarP.zy * 4.5 + vec2(vCarP.x, vCarSeed * 5.0)).b;
          cSalt = clamp((low * 0.85 + arch * 0.55) * (0.45 + 0.8 * n), 0.0, 1.0);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.5, 0.51, 0.5), cSalt * 0.75);               // croûte de sel
          float splash = smoothstep(0.6, 0.74, sp) * (1.0 - smoothstep(uFloor + 0.2, uFloor + 0.55, h)) * (1.0 - clamp(abs(normalize(vCarN).y) * 1.5, 0.0, 1.0));   // flancs seulement, pas le capot
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.16, 0.15, 0.14), splash * 0.55);            // gadoue projetée
        }`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.95, cSalt);`)
      // le vernis ne brille pas sous la croûte de sel
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        #ifdef USE_CLEARCOAT
          material.clearcoat *= 1.0 - cSalt;
        #endif`);
  };
  return mat;
}

/** Boîte posée sur la portion [t0, t1] d'un segment de profil (u1,y1)→(u2,y2), décalée
 *  vers l'extérieur de `offset`, d'épaisseur `thick` et de largeur `w`. Sert pour les
 *  plaques et dômes de neige sur capot / malle / pied de vitre. */
function onSegment(list, seg, t0, t1, thick, w, offset, pillow = false) {
  const [[u1, y1], [u2, y2]] = seg, du = u2 - u1, dy = y2 - y1, len = Math.hypot(du, dy);
  let nu = -dy / len, ny = du / len; if (ny < 0) { nu = -nu; ny = -ny; }          // normale sortante (vers le haut)
  const L = (t1 - t0) * len;
  let g;
  if (pillow) {
    // dôme : demi-ellipsoïde dont la base épouse la tôle — épais au centre, nul aux bords
    g = new THREE.SphereGeometry(1, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    g.scale(w / 2, thick, L / 2); g.rotateX(Math.PI / 2);           // hauteur le long de +z (= la normale après le rotateX suivant)
  } else g = new THREE.BoxGeometry(w, L, thick);
  // l'axe « hauteur » (+z à ce stade) doit pointer sur la normale sortante (ny, nu).
  // L'ancien angle atan2(du, dy) n'était juste que pour le pare-brise : sur le capot,
  // la malle et la lunette il RETOURNAIT le dôme, enfoui dans la carrosserie — seul
  // son bord dépassait, en arc sombre sur le capot.
  g.rotateX(Math.atan2(-ny, nu));
  const tm = (t0 + t1) / 2;
  g.translate(nu * offset, y1 + dy * tm + ny * offset, u1 + du * tm);
  list.push(g);
}
// SphereGeometry / Lathe sont indexées ou non selon le cas : on aligne tout avant fusion
const mergeAny = list => mergeGeometries(list.map(g => g.index ? g.toNonIndexed() : g));
const box = (list, w, h, d, x, y, z) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); list.push(g); return g; };

/* ---------------------------------------------------------------------
   Coque par SECTIONS (loft)
   L'ancienne coque était le profil latéral extrudé tout droit : flancs plans et
   verticaux, habitacle aussi large que la caisse, coins à angle vif vus de dessus —
   une plaque découpée, pas une voiture. Ici on empile des sections transversales le
   long de la voiture ; chacune est calculée à partir du profil et de trois règles
   qui font « voiture » au premier coup d'œil :
   - flanc légèrement bombé (épaule vers 45 % de la hauteur, bas de caisse rentré) ;
   - au-dessus de la ceinture de caisse, l'habitacle RENTRE vers le toit (tumblehome) :
     les vitres latérales sont inclinées, le toit est bien plus étroit que la caisse ;
   - arêtes supérieures arrondies, capot et toit légèrement bombés, coins arrondis
     vus de dessus, boucliers galbés (« nez » refermé par des anneaux).
   Vitres, montants, feux et joints de portière sont des GROUPES de faces de cette
   même coque : ils épousent la tôle au lieu d'être des boîtes posées dessus.
   --------------------------------------------------------------------- */
const CROWN = 0.03, EDGE_R = 0.09, TUMBLE = 0.2, NOSE = 0.07;
const NS1 = 6, NS2 = 3, NC = 4, NT = 7, NK = 6;      // points : flanc bas, flanc haut, arrondi, dessus ; anneaux du nez
const HALF = NS1 + NS2 + NC + NT + 1;                   // points d'une demi-section
const PAINT = 0, GLASS = 1, TRIM = 2, HEAD = 3, TAIL = 4;

/** Hauteur de la silhouette (profil latéral) à l'abscisse u. */
function profileTop(P, u) {
  let y = -Infinity;
  for (let i = 0; i < P.body.length - 1; i++) {
    const [u1, y1] = P.body[i], [u2, y2] = P.body[i + 1];
    if (u1 === u2 || u < Math.min(u1, u2) - 1e-6 || u > Math.max(u1, u2) + 1e-6) continue;
    y = Math.max(y, y1 + (y2 - y1) * (u - u1) / (u2 - u1));
  }
  return y;
}
/** Point (u, y) dans le polygone du vitrage latéral ? */
function inPoly(u, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, yi] = poly[i], [uj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && u < (uj - ui) * (y - yi) / (yj - yi) + ui) inside = !inside;
  }
  return inside;
}

/** Prépare une fois par gabarit : bornes, ceinture de caisse et demi-largeur hw(u, y). */
function prepareProfile(P) {
  if (P.hwAt) return P;
  const uR = P.body[0][0], uF = P.body[P.body.length - 1][0], W2 = P.W / 2;
  const belt = P.glass[0][1], roofMax = Math.max(...P.body.map(p => p[1]));
  const span = belt - P.floor, beltDrop = 0.06 * 0.55 * 0.55;
  Object.assign(P, { uR, uF, belt, roofMax });
  P.hwAt = (u, y) => {
    const v = (y - P.floor) / span - 0.45;
    const h = y <= belt ? W2 - 0.06 * v * v                                   // flanc bombé
                        : W2 - beltDrop - (P.tumble ?? TUMBLE) * (y - belt) / (roofMax - belt);   // habitacle qui rentre
    const e = Math.min(1, (uF - u) / 0.45, (u - uR) / 0.45);                  // coins arrondis vus de dessus
    return h * (0.8 + 0.2 * Math.sqrt(Math.max(0, 1 - (1 - e) ** 2)));
  };
  return P;
}

/** Demi-section à l'abscisse u : du bas du flanc (passage de roue compris) jusqu'au milieu du dessus. */
function carSection(P, u) {
  let yBot = P.floor;
  for (const wu of P.wheels) { const d = u - wu; if (Math.abs(d) < P.archR) yBot = Math.max(yBot, P.floor + Math.sqrt(P.archR ** 2 - d * d)); }
  const yTop = profileTop(P, u), r = Math.min(EDGE_R, 0.4 * (yTop - yBot));
  const ySide = yTop - r, yBreak = Math.min(P.belt, yBot + 0.75 * (ySide - yBot));   // un rang pile sur la ceinture
  const pts = [];
  for (let k = 0; k < NS1; k++) { const y = yBot + (yBreak - yBot) * k / NS1; pts.push([P.hwAt(u, y), y]); }
  for (let k = 0; k < NS2; k++) { const y = yBreak + (ySide - yBreak) * k / NS2; pts.push([P.hwAt(u, y), y]); }
  const hwS = P.hwAt(u, ySide), x0 = Math.max(0.05, hwS - r);
  for (let k = 0; k < NC; k++) { const a = k / NC * Math.PI / 2; pts.push([x0 + (hwS - x0) * Math.cos(a), ySide + r * Math.sin(a)]); }
  for (let k = 0; k <= NT; k++) { const x = x0 * (1 - k / NT); pts.push([x, yTop + CROWN * (1 - (x / x0) ** 2)]); }
  return pts;
}

/** Coque complète : géométrie indexée avec un groupe par matériau (PAINT…TAIL). */
function buildHull(P) {
  // abscisses des sections : pas régulier + tous les points singuliers (cassures du
  // profil, bords des vitres et du montant, joints de portière, arcs de roue serrés)
  const us = [];
  for (let u = P.uR; u < P.uF; u += 0.09) us.push(u);
  us.push(P.uF, ...P.body.map(p => p[0]), ...P.glass.map(p => p[0]), P.pillar - 0.05, P.pillar + 0.05);
  for (const s of P.seams) us.push(s - 0.007, s + 0.007);
  for (let i = 1; i < P.body.length - 2; i++) if (P.body[i][0] === P.body[i + 1][0]) us.push(P.body[i][0] - 0.015, P.body[i][0] + 0.015);   // marche cabine / caisse : arête nette
  if (P.gap !== undefined) us.push(P.gap - 0.04, P.gap + 0.04);
  for (const wu of P.wheels) for (let k = -4; k <= 4; k++) us.push(wu + P.archR * Math.sin(k * Math.PI / 8));
  const sorted = us.filter(u => u >= P.uR && u <= P.uF).sort((a, b) => a - b);
  const slices = sorted.filter((u, i) => i === 0 || u - sorted[i - 1] > 0.01);
  if (P.uF - slices[slices.length - 1] > 1e-6) slices.push(P.uF);

  // section complète : côté droit de bas en haut, puis côté gauche en miroir
  const full = u => { const h = carSection(P, u), f = h.map(([x, y]) => [x, y, u]); for (let j = HALF - 2; j >= 0; j--) f.push([-h[j][0], h[j][1], u]); return f; };
  const secs = slices.map(full);
  // nez : la section d'extrémité se referme en quelques anneaux (bouclier galbé)
  const nose = (sec, dir) => {
    const yMid = (sec[0][1] + sec[HALF - 1][1]) / 2, out = [];
    for (let k = 1; k <= NK; k++) {
      // anneaux d'échelle régulière (facettes égales), bombé en quart de cercle
      const c = 1 - k / NK, du = dir * NOSE * Math.sqrt(1 - c * c);
      out.push(sec.map(([x, y, u]) => [x * c, yMid + (y - yMid) * c, u + du]));
    }
    return out;
  };
  const rings = [...nose(secs[0], -1).reverse(), ...secs, ...nose(secs[secs.length - 1], 1)];

  const N = 2 * HALF - 1, W2 = P.W / 2, pos = [], groups = [[], [], [], [], []];
  const yF = profileTop(P, P.uF), yR = profileTop(P, P.uR), yT = P.tailY ?? yR + 0.16;   // feux arrière : à hauteur de pare-chocs sur les utilitaires
  const inSeg = (seg, uc) => uc > Math.min(seg[0][0], seg[1][0]) + 0.02 && uc < Math.max(seg[0][0], seg[1][0]) - 0.02;
  for (const r of rings) for (const [x, y, u] of r) pos.push(x, y, u);
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < N; j++) {
    const j1 = (j + 1) % N, q = [rings[i][j], rings[i + 1][j], rings[i + 1][j1], rings[i][j1]];
    const xc = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, yc = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
    const uc = (q[0][2] + q[1][2] + q[2][2] + q[3][2]) / 4, ax = Math.abs(xc);
    const hj = j < HALF - 1 ? j : j === N - 1 ? -1 : 2 * HALF - 3 - j;         // indice dans la demi-section
    const isNose = i < NK || i >= rings.length - 1 - NK;
    const region = isNose ? 'nose' : hj < 0 ? 'under' : hj < NS1 + NS2 ? 'side' : hj < NS1 + NS2 + NC ? 'corner' : 'top';
    let m = PAINT;
    if (region === 'under') m = TRIM;
    else if (region === 'side' && inPoly(uc, yc, P.glass)) m = Math.abs(uc - P.pillar) < 0.05 ? TRIM : GLASS;   // vitres, montant B noir
    else if (region === 'top' && (inSeg(P.windshield, uc) || inSeg(P.rear, uc))) m = GLASS;                     // pare-brise, lunette
    else if (P.gap !== undefined && region !== 'nose' && region !== 'under' && Math.abs(uc - P.gap) < 0.04) m = TRIM;   // joint cabine / caisse
    else if (region === 'side' && yc < P.belt - 0.03 && P.seams.some(s => Math.abs(uc - s) < 0.008)) m = TRIM;  // joints de portière
    else if (uc > P.uF - 0.3 && yc > yF - 0.12 && yc < yF + 0.1 && ax > 0.34 * W2 && ax < 0.96 * W2) m = HEAD;
    else if (uc < P.uR + 0.24 && Math.abs(yc - yT) < 0.14 && ax > 0.42 * W2) m = TAIL;
    else if ((uc > P.uF - 0.4 || uc < P.uR + 0.4) && yc < P.floor + 0.1) m = TRIM;                             // bas des boucliers
    const a = i * N + j, b = (i + 1) * N + j, c = (i + 1) * N + j1, d = i * N + j1;
    groups[m].push(a, c, b, a, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const idx = []; let start = 0;
  groups.forEach((list, mi) => { if (list.length) { g.addGroup(start, list.length, mi); idx.push(...list); start += list.length; } });
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Pneu au flanc arrondi (révolution), axe le long de X. */
function tireGeometry(R, w) {
  const pts = [new THREE.Vector2(R * 0.6, -w / 2)];
  for (let k = 0; k <= 8; k++) {
    const a = -Math.PI / 2 + Math.PI * k / 8;
    pts.push(new THREE.Vector2(R - 0.05 + 0.05 * Math.pow(Math.cos(a), 0.4), (w / 2) * Math.sin(a)));   // bande de roulement plate, épaules rondes
  }
  pts.push(new THREE.Vector2(R * 0.6, w / 2));
  const g = new THREE.LatheGeometry(pts, 20); g.rotateZ(Math.PI / 2);
  return g;
}

/** Construit la carrosserie dans le groupe g. Retourne le profil (avec hwAt) pour les extras. */
function buildCarBody(g, kind, paint, snowDepth, tailMat = carMats.tail) {
  const P = prepareProfile(CAR_PROFILES[kind]), W = P.W, yF = profileTop(P, P.uF);
  const dark = [], snow = [];

  if (!paint.userData.salted) { saltPaint(paint, P); paint.userData.salted = true; }   // MAT.taxi : partagé, une seule fois
  g.add(shadowed(new THREE.Mesh(buildHull(P), [paint, carGlassMat, MAT.iron, carMats.head, tailMat])));

  // rétroviseurs, poignées (posés sur la tôle grâce à hwAt), plancher sombre entre les
  // roues : les passages de roue traversent la coque, il ne faut pas voir au travers
  const uM = P.glass[0][0] - 0.3;
  for (const sx of [-1, 1]) {
    box(dark, 0.1, 0.09, 0.17, sx * (P.hwAt(uM, P.belt + 0.08) + 0.06), P.belt + 0.08, uM);
    for (const su of P.seams.slice(0, P.seams.length > 2 ? 2 : 1)) {
      const hu = su - 0.4, hy = P.floor + 0.55;
      box(dark, 0.02, 0.03, 0.14, sx * (P.hwAt(hu, hy) + 0.008), hy, hu);
    }
  }
  box(dark, W - 0.52, P.archR, P.uF - P.uR - 0.4, 0, P.floor + P.archR / 2 - 0.05, (P.uF + P.uR) / 2);
  box(dark, 0.3 * W, 0.11, 0.03, 0, yF - 0.075, P.uF + NOSE * 0.84);                       // calandre, entre les phares
  const yRm = P.plateY ?? (P.floor + profileTop(P, P.uR)) / 2;
  g.add(new THREE.Mesh(box([], 0.32, 0.15, 0.02, 0, yRm, P.uR - NOSE - 0.004), carMats.plate));

  // --- Roues : pneu + enjoliveur, toutes fusionnées
  const tires = [], hubs = [];
  for (const wu of P.wheels) for (const sx of [-1, 1]) {
    const t = tireGeometry(P.wheelR, 0.22); t.translate(sx * (W / 2 - 0.13), P.floor, wu); tires.push(t);
    const h = new THREE.CylinderGeometry(P.wheelR * 0.56, P.wheelR * 0.56, 0.2, 14); h.rotateZ(Math.PI / 2); h.translate(sx * (W / 2 - 0.13), P.floor, wu); hubs.push(h);
  }
  g.add(shadowed(new THREE.Mesh(mergeAny(tires), MAT.iron)));
  g.add(new THREE.Mesh(mergeGeometries(hubs), MAT.metal));

  // --- Neige : toit, capot, malle, bas de pare-brise et de lunette ; congères contre les flancs
  // (toit plus étroit que la caisse désormais : le manteau suit la largeur réelle du toit)
  const [r0, r1] = P.roof, rm = (r0 + r1) / 2, roofY = profileTop(P, rm) + CROWN, roofW = 2 * P.hwAt(rm, roofY - CROWN);
  const dome = (w, h, L, x, y, z) => { const d = new THREE.SphereGeometry(1, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2); d.scale(w / 2, h, L / 2); d.translate(x, y, z); snow.push(d); };
  const hRoof = 0.2 + 0.24 * snowDepth, rl = r1 - r0;
  dome(roofW + 0.04, hRoof, rl + 0.2, 0, roofY - 0.07, rm);                                  // manteau principal, déborde un peu du toit
  dome(roofW * 0.7, hRoof * 0.85, rl * 0.7, (Math.random() - 0.5) * 0.25, roofY - 0.02, rm + (Math.random() - 0.5) * 0.4 * rl);
  const hHood = 0.1 + 0.12 * snowDepth;
  onSegment(snow, P.hood, 0.0, 1.0, hHood, W - 0.16, -0.01, true);
  onSegment(snow, P.hood, 0.25, 0.95, hHood * 0.8, W * 0.58, 0.04, true);
  if (P.trunk) { onSegment(snow, P.trunk, 0.0, 1.0, hHood, W - 0.16, -0.01, true); onSegment(snow, P.trunk, 0.1, 0.8, hHood * 0.8, W * 0.6, 0.04, true); }
  onSegment(snow, P.windshield, -0.05, 0.55, 0.13, W - 0.36, 0.01, true);                    // bourrelet au pied du pare-brise
  onSegment(snow, P.rear, -0.05, 0.6, 0.13, W - 0.4, 0.01, true);
  // bourrelet contre les flancs : une nappe continue à profil en cloche, adossée à la
  // caisse (sa moitié intérieure est cachée dedans), bouts effilés, hauteur ondulée.
  // Un demi-ellipsoïde allongé se lisait comme un aileron, un chapelet de sphères
  // comme des boules de coton.
  for (const sx of [-1, 1]) {
    const bw = 0.9, bl = P.L + 0.4, bank = new THREE.PlaneGeometry(bw, bl, 8, 28); bank.rotateX(-Math.PI / 2);
    const p = bank.attributes.position, hB = 0.28 + 0.18 * snowDepth, seedB = Math.random() * 50;
    for (let i = 0; i < p.count; i++) {
      const lx = p.getX(i), lz = p.getZ(i), e = Math.min(1, (bl / 2 - Math.abs(lz)) / 0.9);
      const n = smoothNoise(lz * 0.9 + seedB, sx * 3);                                  // mottes : hauteur ET largeur varient
      const a = (2 * lx) / (bw * (0.65 + 0.45 * n));
      p.setY(i, hB * (0.45 + 0.8 * n) * Math.pow(Math.max(0, 1 - a * a), 1.6) * Math.pow(Math.max(0, e), 0.7));
    }
    bank.translate(sx * (W / 2 + 0.02), 0, 0); snow.push(bank);
  }

  // La neige n'est jamais plane : on bosselle les faces supérieures avec un bruit
  // lisse (épaisseur inégale, bourrelets), les flancs restent collés à la tôle.
  const nrm = new THREE.Vector3(), seedN = Math.random() * 40;
  for (const sg of snow) {
    const pos = sg.attributes.position, nor = sg.attributes.normal;
    for (let i = 0; i < pos.count; i++) {
      nrm.fromBufferAttribute(nor, i);
      const up = Math.max(0, nrm.y);
      const px = pos.getX(i), pz = pos.getZ(i);
      const d = (smoothNoise(px * 2.6 + seedN, pz * 2.2) - 0.5) * 0.16 + (smoothNoise(px * 8 + seedN, pz * 8) - 0.5) * 0.04;
      pos.setXYZ(i, px + nrm.x * d * up, pos.getY(i) + nrm.y * d * up, pz + nrm.z * d * up);
    }
    sg.computeVertexNormals();
  }

  g.add(new THREE.Mesh(mergeAny(dark), MAT.iron));
  const sn = new THREE.Mesh(mergeAny(snow), MAT.snow); sn.receiveShadow = true; g.add(sn);
  return P;
}

function buildTaxi(x, z, rotY = 0, st = MAIN) {
  const g = new THREE.Group();
  const tailMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.4, 0.15, 0.1) });   // feux allumés (bloom)
  const P = buildCarBody(g, 'sedan', MAT.taxi, 1, tailMat);
  // bandeau damier / « NYC TAXI » sur les portières, entre les passages de roue ;
  // plan subdivisé dont chaque sommet est plaqué sur le flanc bombé
  for (const s of [-1, 1]) {
    const pg = new THREE.PlaneGeometry(2.0, 0.5, 1, 8); pg.rotateY(s * Math.PI / 2); pg.translate(0, P.floor + 0.38, 0);
    const p = pg.attributes.position;
    for (let i = 0; i < p.count; i++) p.setX(i, s * (P.hwAt(p.getZ(i), p.getY(i)) + 0.006));
    g.add(new THREE.Mesh(pg, MAT.taxiSide));
  }
  const topSign = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.16, 0.24), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.3, 0.7) })); topSign.position.set(0, P.roofMax + CROWN + 0.08, 0.1); g.add(topSign);
  g.position.set(x, 0, z); g.rotation.y = rotY; st.add(g);
  st.collider(x, z, P.W / 2 + 0.34, P.L / 2 + 0.4);
  addContactShadowIn(st, x, z, P.W / 2 + 0.45, P.L / 2 + 0.35, 0.6, rotY, 6);
  addSubject({ label: 'Un taxi jaune enseveli', value: 0.9, object: g });
}

/** Voiture garée le long du trottoir, ensevelie : sur l'image de référence les
 *  voitures ne sont plus que des volumes sombres coiffés d'une épaisse couche de
 *  neige, roues à moitié prises dans la congère du chasse-neige. C'est cette file
 *  de véhicules qui donne l'échelle et la profondeur de la rue. */
function buildParkedCar(x, z, rotY, bodyColor, snowDepth = 1, kind = 'sedan', st = MAIN) {
  const g = new THREE.Group();
  // vernis (clearcoat) : une 2e couche brillante par-dessus la peinture — les lampadaires y glissent en reflets nets
  const paint = new THREE.MeshPhysicalMaterial({ color: bodyColor, roughness: 0.4, metalness: 0.45, clearcoat: 1, clearcoatRoughness: 0.1 });
  const P = buildCarBody(g, kind, paint, snowDepth);
  g.position.set(x, 0, z); g.rotation.y = rotY; st.add(g);
  st.collider(x, z, P.W / 2 + 0.34, P.L / 2 + 0.4);   // jusqu'aux congères latérales et aux pare-chocs
  addContactShadowIn(st, x, z, P.W / 2 + 0.45, P.L / 2 + 0.35, 0.6, rotY, 6);
  addSubject({ label: 'Une voiture ensevelie sous la neige', value: 0.4, object: g });
}

/* ---------------------------------------------------------------------
   VÉHICULES UTILITAIRES garés dans la neige : camionnette, camion de livraison,
   ambulance, camion de glaces. Même coque par sections que les voitures (profils
   van / truck / ambulance / icecream), même neige, même sel, même givre ; en plus
   une décoration plaquée sur chaque flanc et quelques accessoires.
   --------------------------------------------------------------------- */
const liveryTex = {};
const SPECIALS = {
  van:       { color: 0xdfe2e4, livery: makeVanLivery,       area: [-2.2, 1.2, 1.05, 1.95] },
  truck:     { color: 0xeeeeea, livery: makeTruckLivery,     area: [-3.25, 0.35, 1.15, 2.95] },
  ambulance: { color: 0xf0f0ec, livery: makeAmbulanceLivery, area: [-3.0, 0.8, 0.95, 2.55] },
  icecream:  { color: 0xf4f2ee, livery: makeIceCreamLivery,  area: [-2.75, 1.15, 0.9, 2.5] },
};
// rampe lumineuse de l'ambulance : deux matériaux qui alternent (rouge / blanc), animés dans updateVehicles
const beaconMats = [new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 0.02, 0.02) }), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.25, 0.25, 0.25) })];

/** Plan de décoration plaqué sur le flanc (chaque sommet suit hwAt) ; lisible des deux côtés. */
function liveryPlanes(g, P, tex, [u0, u1, y0, y1]) {
  const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.45, roughness: 0.5, metalness: 0 });
  for (const s of [-1, 1]) {
    const pg = new THREE.PlaneGeometry(u1 - u0, y1 - y0, 24, 6); pg.rotateY(s * Math.PI / 2);
    pg.translate(0, (y0 + y1) / 2, (u0 + u1) / 2);
    const p = pg.attributes.position;
    for (let i = 0; i < p.count; i++) p.setX(i, s * (P.hwAt(p.getZ(i), p.getY(i)) + 0.008));
    pg.computeVertexNormals();
    g.add(new THREE.Mesh(pg, mat));
  }
}

function buildSpecialVehicle(kind, x, z, rotY, snowDepth = 1, st = MAIN) {
  const S = SPECIALS[kind], g = new THREE.Group();
  const paint = new THREE.MeshPhysicalMaterial({ color: S.color, roughness: 0.4, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.12 });
  const P = buildCarBody(g, kind, paint, snowDepth);
  liveryTex[kind] = liveryTex[kind] || S.livery();
  liveryPlanes(g, P, liveryTex[kind], S.area);
  const extra = [];
  if (kind === 'ambulance') {
    // rampe sur la cabine + feux d'angle sur la cellule, en alternance rouge / blanc
    const yCab = profileTop(P, 1.2) + CROWN;
    for (let k = 0; k < 4; k++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.12, 0.26), beaconMats[k % 2]);
      m.position.set(-0.6 + k * 0.4, yCab + 0.07, 1.25); g.add(m);
    }
    for (const sx of [-1, 1]) for (const [u, k] of [[0.85, 0], [-3.05, 1]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.12), beaconMats[(k + (sx > 0 ? 1 : 0)) % 2]);
      m.position.set(sx * (P.W / 2 - 0.1), P.roofMax - 0.12, u); g.add(m);
    }
  } else if (kind === 'icecream') {
    // cornet géant sur l'avant du toit (gaufre + volute), à moitié enneigé
    const cone = new THREE.ConeGeometry(0.28, 0.75, 16); cone.rotateX(Math.PI); cone.translate(0, P.roofMax + 0.6, 0.8);
    const swirl = []; for (const [dy, r] of [[1.1, 0.34], [1.33, 0.26], [1.51, 0.17], [1.65, 0.08]]) { const sp = new THREE.SphereGeometry(r, 14, 10); sp.scale(1, 0.75, 1); sp.translate(0, P.roofMax + dy, 0.8); swirl.push(sp); }
    g.add(new THREE.Mesh(cone, new THREE.MeshStandardMaterial({ color: 0xc88a48, roughness: 0.8 })));
    const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.12, 0.3, 10), MAT.metal); stand.position.set(0, P.roofMax + 0.12, 0.8); g.add(stand);   // socle : le cornet ne tient pas sur sa pointe
    g.add(new THREE.Mesh(mergeGeometries(swirl), new THREE.MeshStandardMaterial({ color: 0xf6efe4, roughness: 0.6 })));
  } else if (kind === 'truck') {
    // porte roulante à l'arrière de la caisse
    const door = new THREE.Mesh(new THREE.PlaneGeometry(P.W * 0.8, 2.1), MAT.shutter); door.rotation.y = Math.PI; door.position.set(0, 1.95, P.uR - NOSE - 0.01); g.add(door);
  }
  g.position.set(x, 0, z); g.rotation.y = rotY; st.add(g);
  st.collider(x, z, P.W / 2 + 0.34, P.L / 2 + 0.4);
  addContactShadowIn(st, x, z, P.W / 2 + 0.45, P.L / 2 + 0.35, 0.62, rotY, 8);
  const sub = SPECIAL_SUBJECTS[kind];
  addSubject({ label: sub.label, value: sub.value, object: g, moment: sub.moment });
}

// sujets photo des utilitaires : l'ambulance vaut surtout gyrophares ALLUMÉS (instant à saisir)
let beaconLit = false;
const SPECIAL_SUBJECTS = {
  ambulance: { label: 'Une ambulance dans la tempête', value: 0.95, moment: () => (beaconLit ? { pts: 5, why: 'gyrophares allumés' } : { pts: 0, why: 'gyrophares éteints au déclenchement' }) },
  icecream:  { label: 'Un camion de glaces sous le blizzard', value: 0.9, moment: () => ({ pts: 3, why: 'un marchand de glaces en pleine tempête' }) },
  truck:     { label: 'Un camion de livraison enneigé', value: 0.6 },
  van:       { label: "Une camionnette d'artisan", value: 0.55 },
};

/** Animation (seulement des couleurs de matériau : les matrices restent figées).
 *  Gyrophares de l'ambulance : alternance rouge / blanc, deux éclats rapides par seconde. */
function updateVehicles(t) {
  const ph = (t * 2.2) % 1, a = ph < 0.18 || (ph > 0.3 && ph < 0.46);
  beaconLit = a;
  beaconMats[0].color.setRGB(a ? 3.2 : 0.3, a ? 0.2 : 0.02, a ? 0.12 : 0.02);
  beaconMats[1].color.setScalar(a ? 0.25 : 2.6);
}

buildTaxi(ROAD_HALF - 1.3, 4.5, 0.02);
