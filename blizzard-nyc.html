    scDir.subVectors(p, camera.position).normalize();
    scRay.set(camera.position, scDir); scRay.far = d + 0.5;
    const hit = scRay.intersectObjects(list, false)[0];
    if (!hit || hit.distance >= d - 0.35 || grow.containsPoint(hit.point)) seen++;
  }
  return seen / n;
}

/** Lecture « esthétique » des pixels de la photo (image réduite, valeurs affichées 0..1). */
function readPixels(img) {
  const d = img.data, n = d.length / 4;
  let sum = 0, sum2 = 0, high = 0, blown = 0, warm = 0, cool = 0;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255, l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    sum += l; sum2 += l * l;
    if (l > 0.82) high++;
    if (l > 0.97) blown++;
    if (r - b > 0.12 && l > 0.25) warm++;
    if (b - r > 0.04 && l > 0.12) cool++;
  }
  const mean = sum / n, std = Math.sqrt(Math.max(0, sum2 / n - mean * mean));
  return { mean, std, high: high / n, blown: blown / n, warm: warm / n, cool: cool / n };
}

/**
 * @param camera  caméra au moment du déclenchement (matrices à jour : juste après le rendu)
 * @param img     ImageData de la photo réduite (≈ 96 × 54)
 * @param lens    neige sur l'objectif (0,1 propre → 0,65 couvert)
 * @param angVel  vitesse de rotation de la caméra (rad/s), speed : vitesse de marche (m/s)
 */
function evaluatePhoto({ camera, img, lens, angVel, speed, t }) {
  // --- sujets dans le cadre ; rayons d'occlusion seulement pour les 6 plus présents
  const cands = [];
  for (const s of photoSubjects) {
    if (s.active && !s.active()) continue;
    const m = measureSubject(s, camera);
    if (m && m.pre * s.value > 0.01) cands.push(m);
  }
  cands.sort((a, b) => b.pre * b.s.value - a.pre * a.s.value);
  const top = cands.slice(0, 6);
  for (const m of top) m.vis = visibility(m, camera);
  for (const m of top) m.presence = m.pre * m.vis;
  top.sort((a, b) => b.presence * b.s.value - a.presence * a.s.value);
  const main = top[0] && top[0].presence > 0.05 ? top[0] : null;
  const others = top.slice(1).filter(m => main && m.presence * m.s.value > 0.12 * main.presence * main.s.value);

  const pix = readPixels(img);
  const remarks = [], good = [];

  // --- Sujet /15
  let sujet = 2;
  if (main) {
    sujet = 15 * main.s.value * Math.pow(main.presence, 0.8);
    if (main.size < 0.5) remarks.push('Sujet trop petit : approche-toi ou zoome (molette).');
    if (main.completeness < 0.7) remarks.push('Sujet coupé par le bord du cadre.');
    if (main.vis < 0.7) remarks.push('Sujet en partie masqué par un obstacle.');
    if (main.fog < 0.6) remarks.push('Sujet noyé dans la brume : rapproche-toi.');
  } else remarks.push('Pas de vrai sujet : cadre un élément de la rue.');

  // --- Composition /10 : points et lignes de tiers
  let compo = 0.3;
  if (main) {
    const { cu, cv } = main;
    let dPt = Infinity;
    for (const px of [1 / 3, 2 / 3]) for (const py of [1 / 3, 2 / 3]) dPt = Math.min(dPt, Math.hypot(cu - px, cv - py));
    const onPt = 1 - scSmooth(0.03, 0.2, dPt);
    const onLineU = 0.65 * (1 - scSmooth(0.02, 0.12, Math.min(Math.abs(cu - 1 / 3), Math.abs(cu - 2 / 3))));
    const onLineV = 0.5 * (1 - scSmooth(0.02, 0.12, Math.min(Math.abs(cv - 1 / 3), Math.abs(cv - 2 / 3))));
    compo = Math.max(onPt, onLineU, onLineV, 0.1);
    if (compo > 0.8) good.push('Bien placé sur les lignes de tiers.');
    else if (Math.hypot(cu - 0.5, cv - 0.5) < 0.1) remarks.push('Composition trop centrée : décale le sujet sur un tiers.');
  }

  // --- Lumière / esthétique /10
  const e1 = scSmooth(0.04, 0.14, pix.mean) * (1 - scSmooth(0.5, 0.75, pix.mean));
  const e2 = scSmooth(0.06, 0.2, pix.std);
  const e3 = scSmooth(0.002, 0.015, pix.high) * (1 - scSmooth(0.06, 0.2, pix.blown));
  const e4 = scSmooth(0.01, 0.06, Math.min(pix.warm, pix.cool));
  const e5 = Math.min(1, others.length / 2);
  const esth = 0.22 * e1 + 0.24 * e2 + 0.2 * e3 + 0.17 * e4 + 0.17 * e5;
  if (e1 < 0.4) remarks.push(pix.mean < 0.1 ? 'Image trop sombre : cherche la lumière d\'un lampadaire.' : 'Image trop claire.');
  if (pix.blown > 0.08) remarks.push('Lumière brûlée : évite de viser une lampe en plein cadre.');
  if (e4 > 0.7) good.push('Beau contraste entre lumière chaude et nuit bleue.');
  if (e5 >= 1) good.push('Cadre riche : plusieurs éléments de la rue.');

  // --- Netteté /10
  const lensK = THREE.MathUtils.clamp((lens - 0.12) / 0.5, 0, 1);
  const motion = scSmooth(0.25, 2.0, angVel), walk = Math.min(1, speed / WALK_SPEED);
  const sharp = (1 - 0.8 * lensK) * (1 - 0.7 * motion) * (1 - 0.3 * walk);
  if (lensK > 0.35) remarks.push('Objectif couvert de neige : essuie-le (E) ou tourne le dos au vent.');
  if (motion > 0.4) remarks.push('Bougé : immobilise la visée avant de déclencher.');
  else if (walk > 0.5) remarks.push('Photo prise en marchant : arrête-toi pour plus de netteté.');

  // --- Moment /5
  let moment = 0;
  const bonus = [];
  const mm = main && main.s.moment ? main.s.moment() : null;
  if (mm) { moment += mm.pts; (mm.pts > 0 ? bonus : remarks).push(mm.pts > 0 ? mm.why : `Dommage : ${mm.why}.`); }
  for (const o of others) { const om = o.s.moment ? o.s.moment() : null; if (om && om.pts > 0) { moment += om.pts * 0.5; bonus.push(om.why); } }
  if (windGust(t) > 1.45) { moment += 2; bonus.push('en pleine rafale'); }
  moment = Math.min(5, moment);
  if (bonus.length) good.push('Bonus : ' + bonus.join(', ') + '.');

  const parts = { sujet: Math.round(sujet), compo: Math.round(10 * compo), esth: Math.round(10 * esth), net: Math.round(10 * sharp), moment: Math.round(moment) };
  const total = THREE.MathUtils.clamp(parts.sujet + parts.compo + parts.esth + parts.net + parts.moment, 0, 50);
  return {
    total, parts,
    subject: main ? main.s.label : 'La rue sous la neige',
    remarks: [...good.slice(0, 2), ...remarks.slice(0, 2)],
  };
}

/* ───────────────────────── src/core/preload.js ───────────────────────── */
/* =====================================================================
   1 quater. PRÉPARATION PENDANT LE MENU
   Au chargement, la page se figeait plusieurs secondes : la toute première image
   compilait d'un coup les ~48 shaders de la scène, puis les photos arrivaient et
   figeaient encore une image ~3 s (envoi des textures à la carte graphique et
   recompilation des matériaux qui gagnaient une carte). On fait maintenant tout ça
   AVANT de lancer la boucle, pendant que l'écran de choix est affiché :
     1. attendre que les photos soient chargées et appliquées (photosSettled) ;
     2. envoyer chaque texture à la carte graphique (renderer.initTexture), par
        paquets de ~20 ms par image : la page reste réactive ;
     3. compiler tous les shaders en PARALLÈLE (renderer.compileAsync, extension
        KHR_parallel_shader_compile) : la carte graphique compile sans bloquer la page ;
     4. un PREMIER DESSIN de chaque matériau, hors écran, un paquet par image : sous
        Windows (ANGLE / Direct3D), la carte graphique finit de préparer chaque shader à
        son premier dessin, même compilé d'avance — c'était l'essentiel du blocage
        (une seule grande image figée) ;
     5. une première vraie image derrière le menu (ombres calculées une fois, passes
        de post-traitement).
   Les boutons de mode ne s'activent qu'une fois prêt : le verrouillage de la souris
   exige un clic de l'utilisateur, on ne peut donc pas « démarrer plus tard tout seul ».
   ===================================================================== */
const startup = { ready: false, ms: 0, phases: {} };   // phases : durée de chaque étape (ms), pour mesurer
const loadFill = document.querySelector('#loadBar > div'), loadText = document.getElementById('loadText');

function showProgress(k, label) {
  const pc = Math.round(Math.min(1, k) * 100);
  if (loadFill) loadFill.style.width = pc + '%';
  if (loadText) loadText.textContent = `${label} ${pc} %`;
}
/** Image suivante (ou 50 ms si l'onglet est masqué : requestAnimationFrame n'y tourne plus). */
const nextFrame = () => new Promise(r => { let done = false; const go = () => { if (!done) { done = true; r(); } }; requestAnimationFrame(go); setTimeout(go, 50); });

/** Un objet représentatif par couple (matériau, disposition des attributs de géométrie) :
 *  c'est ce couple que la carte graphique prépare au premier dessin. */
function warmupList(scene) {
  const reps = new Map();
  scene.traverse(o => {
    if (!(o.isMesh || o.isPoints || o.isSprite || o.isLine) || !o.visible || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const attrs = o.geometry ? Object.keys(o.geometry.attributes).sort().join(',') : '';
    const key = mats.map(m => m.uuid).join('|') + '/' + attrs + (o.isInstancedMesh ? '/inst' : '') + (o.isSkinnedMesh ? '/skin' : '');
    if (!reps.has(key)) reps.set(key, o);
  });
  return [...reps.values()];
}
/** Premier dessin de chaque représentant, seul, dans une petite cible au format de celle du
 *  post-traitement (RGBA demi-flottant) ; toutes les lumières restent en place, sinon les
 *  shaders préparés ne seraient pas ceux du jeu. Budget ~20 ms par image. */
async function warmupDraws(renderer, scene, camera, onProgress) {
  const all = [];
  scene.traverse(o => { if ((o.isMesh || o.isPoints || o.isSprite || o.isLine) && o.visible) all.push(o); });
  const reps = warmupList(scene);
  const rt = new THREE.WebGLRenderTarget(64, 64, { type: THREE.HalfFloatType });
  const prevTarget = renderer.getRenderTarget(), prevShadow = renderer.shadowMap.needsUpdate;
  renderer.shadowMap.needsUpdate = false;                   // les ombres seront calculées à la vraie première image
  for (const o of all) o.visible = false;
  renderer.setRenderTarget(rt);
  let longest = 0;
  try {
    for (let i = 0; i < reps.length;) {
      const tf = performance.now();
      while (i < reps.length && performance.now() - tf < 20) {
        const o = reps[i++], culled = o.frustumCulled, td = performance.now();
        o.visible = true; o.frustumCulled = false;
        renderer.render(scene, camera);
        o.visible = false; o.frustumCulled = culled;
        longest = Math.max(longest, performance.now() - td);
      }
      onProgress(i / reps.length);
      renderer.setRenderTarget(prevTarget); await nextFrame(); renderer.setRenderTarget(rt);
    }
  } finally {
    for (const o of all) o.visible = true;
    renderer.setRenderTarget(prevTarget);
    renderer.shadowMap.needsUpdate = prevShadow;
    rt.dispose();
  }
  return { draws: reps.length, longest: Math.round(longest) };
}

/** Toutes les textures utilisées par les matériaux de la scène (propriétés et uniformes). */
function sceneTextures(scene) {
  const found = new Set();
  const add = v => { if (v && v.isTexture && !v.isRenderTargetTexture && v.image) found.add(v); };
  scene.traverse(o => {
    for (const m of Array.isArray(o.material) ? o.material : o.material ? [o.material] : []) {
      for (const k in m) add(m[k]);
      if (m.uniforms) for (const k in m.uniforms) add(m.uniforms[k]?.value);
    }
  });
  return [...found];
}

export async function prepareScene({ renderer, scene, camera, composer }) {
  const t0 = performance.now();
  startup.lights = padPointLights(scene);                   // AVANT toute compilation : même texte de shader à chaque visite
  showProgress(0.02, 'Préparation de la rue…');
  await nextFrame();                                        // laisse le menu s'afficher

  let tp = performance.now();
  const phase = name => { const n = performance.now(); startup.phases[name] = Math.round(n - tp); tp = n; };
  await photosSettled((done, total) => showProgress(0.02 + 0.38 * (total ? done / total : 1), 'Chargement des photos…'));

  phase('photos');
  const texs = sceneTextures(scene);
  for (let i = 0; i < texs.length;) {
    const tf = performance.now();
    while (i < texs.length && performance.now() - tf < 20) {
      const tt = performance.now(); renderer.initTexture(texs[i++]);
      startup.texLongest = Math.max(startup.texLongest ?? 0, Math.round(performance.now() - tt));
    }
    showProgress(0.4 + 0.3 * i / texs.length, 'Envoi des textures…');
    await nextFrame();
  }

  phase('textures');
  let k = 0.72;   // (les shaders vont de 72 à 94 %)
  showProgress(k, 'Préparation des shaders…');
  let lastTick = performance.now(); startup.shaderStall = 0;       // plus long blocage de la page pendant la compilation
  const creep = setInterval(() => {
    const n = performance.now(); startup.shaderStall = Math.max(startup.shaderStall, Math.round(n - lastTick - 120)); lastTick = n;
    showProgress(k = Math.min(0.94, k + 0.012), 'Préparation des shaders…');
  }, 120);
  try { await renderer.compileAsync(scene, camera); } finally { clearInterval(creep); }

  phase('shaders');
  startup.warmup = await warmupDraws(renderer, scene, camera, p => showProgress(0.94 + 0.04 * p, 'Premiers dessins…'));
  phase('premiers-dessins');
  showProgress(0.98, 'Dernière touche…');
  await nextFrame();
  composer.render();                                        // ombres + post-traitement, derrière le menu
  await nextFrame();

  phase('premiere-image');
  startup.ready = true; startup.ms = Math.round(performance.now() - t0);
  document.getElementById('loadBox').hidden = true;
  for (const b of document.querySelectorAll('.mode-btn')) b.disabled = false;
}

/* ───────────────────────── src/game/photoGame.js ───────────────────────── */
/* =====================================================================
   19. LE JEU : PHOTOGRAPHE DE PRESSE, UNE NUIT DE BLIZZARD
   10 minutes pour rapporter à la rédaction 3 à 5 photos de la rue sous la neige.
   - Viseur : clic droit maintenu (ou V pour basculer), molette = zoom.
   - Déclencher : clic gauche ou Espace (viseur levé). Note /50 immédiate.
   - Essuyer l'objectif : E (1 seconde, pas de photo pendant ce temps). Face au vent,
     la neige s'accumule sur l'objectif et floute les photos (et leur note).
   - Album : I. On y coche jusqu'à 5 photos à garder ; la carte mémoire tient 24 vues
     (on peut en supprimer). Avec 5 photos cochées, « Envoyer à la rédaction » termine
     la nuit ; sinon, à la fin des 10 minutes, les photos cochées partent d'office
     (complétées par les meilleures de la carte s'il en manque pour arriver à 3).
   - Fin : l'édition du matin — les photos envoyées, leur note, le verdict, le record.
   Le chrono ne tourne que pendant qu'on joue (pas dans l'album ni l'écran de pause).
   ===================================================================== */
const NIGHT_S = 600, CARD_SIZE = 24, KEEP_MAX = 5, KEEP_MIN = 3;
const FOV_WALK = 68, FOV_MIN = 14, FOV_MAX = 60;

const pg = {
  photos: [], timeLeft: NIGHT_S, started: false, ended: false, albumOpen: false,
  aimHold: false, aimLatch: false, zoomFov: 40, shotPending: false,
  angVel: 0, lastSpeed: 0, nextId: 1,
};
const pgPrevQ = new THREE.Quaternion();

/* --- Choix du mode, sur l'écran d'entrée ------------------------------
   « normal » : promenade libre, sans chrono ni appareil photo ; « photo » : le jeu.
   Le bouton choisi lance aussi la partie : son clic remonte jusqu'à l'écran d'entrée,
   dont le gestionnaire (controls.js) verrouille la souris — le choix est fait avant,
   dans le gestionnaire du bouton. Changer de mode = recharger (nouvelle nuit).
   ?mode=photo ou ?mode=normal dans l'URL saute le choix (tests). */
let gameMode = null;
function chooseMode(m) {
  gameMode = m; document.body.dataset.mode = m;
  document.getElementById('modeChoice').hidden = true;
  document.getElementById('changeMode').hidden = false;
  document.getElementById('entryHint').textContent = m === 'photo'
    ? "Mode photo — cliquez n'importe où pour reprendre."
    : "Mode normal — cliquez n'importe où pour reprendre.";
}
setEntryGate(() => gameMode !== null && startup.ready);
for (const b of document.querySelectorAll('.mode-btn')) b.addEventListener('click', () => chooseMode(b.dataset.mode));
document.getElementById('changeMode').addEventListener('click', e => { e.stopPropagation(); location.reload(); });
{ const m = new URLSearchParams(location.search).get('mode'); if (m === 'photo' || m === 'normal') chooseMode(m); }
const $ = id => document.getElementById(id);
const pgHud = $('photoHud'), pgVf = $('viewfinder'), pgVfInfo = $('vfInfo'), pgFlash = $('flash'), pgWipe = $('wipe'), pgToast = $('toast');
const pgAlbum = $('album'), pgReport = $('report');
const pgThumb = document.createElement('canvas'), pgSmall = document.createElement('canvas');
pgSmall.width = 96; pgSmall.height = 54;

const aiming = () => gameMode === 'photo' && (pg.aimHold || pg.aimLatch) && playerActive() && !pg.ended;
const selected = () => pg.photos.filter(p => p.keep);
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const focal = fov => Math.round(12 / Math.tan(THREE.MathUtils.degToRad(fov) / 2));   // équivalent 24 × 36, en mm

let toastTimer = 0;
function toast(msg, ms = 2600) {
  pgToast.textContent = msg; pgToast.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => pgToast.classList.remove('on'), ms);
}
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

/* --- Commandes ------------------------------------------------------- */
function canPlay() { return gameMode === 'photo' && playerActive() && !pg.ended && !pg.albumOpen; }
function shoot() {
  if (!aiming() || pg.shotPending) return;
  if (lens.wiping > 0) return toast('Essuyage en cours…', 1200);
  if (pg.photos.length >= CARD_SIZE) return toast('Carte mémoire pleine : ouvre l\'album (I) pour faire de la place.');
  pg.shotPending = true;                                   // capturé juste après le prochain rendu (afterRenderPhoto)
}
function wipeLens() {
  if (!canPlay() || lens.wiping > 0) return;
  lens.wiping = 1;                                         // main.js ramène la neige à zéro en 1 s
  replay(pgWipe, 'go');
}
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousedown', e => {
  if (!canPlay()) return;
  if (e.button === 2) pg.aimHold = true;
  else if (e.button === 0) shoot();
});
window.addEventListener('mouseup', e => { if (e.button === 2) pg.aimHold = false; });
window.addEventListener('wheel', e => {
  if (!aiming()) return;
  pg.zoomFov = THREE.MathUtils.clamp(pg.zoomFov * Math.exp(e.deltaY * 0.0012), FOV_MIN, FOV_MAX);
  e.preventDefault();
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyI') { if (pg.albumOpen) closeAlbum(true); else if (canPlay()) openAlbum(); return; }
  if (e.code === 'Escape' && pg.albumOpen) { closeAlbum(false); return; }
  if (!canPlay()) return;
  if (e.code === 'KeyV') pg.aimLatch = !pg.aimLatch;
  else if (e.code === 'KeyE') wipeLens();
  else if (e.code === 'Space') { shoot(); e.preventDefault(); }
});

/* --- Boucle ------------------------------------------------------------ */
/** Chaque image, avant le rendu. Renvoie true si le champ de vision a changé (flocons à recaler). */
function updatePhotoGame(dt, t, speed) {
  if (gameMode !== 'photo') { pgHud.textContent = ''; return false; }   // mode normal : ni chrono, ni appareil
  pg.lastSpeed = speed;
  if (playerActive() && !pg.ended) {
    pg.started = true;
    pg.timeLeft = Math.max(0, pg.timeLeft - dt);
    if (pg.timeLeft <= 0) endNight(true);
  }
  // vitesse de rotation de la caméra (pour le bougé), lissée
  const ang = 2 * Math.acos(Math.min(1, Math.abs(pgPrevQ.dot(camera.quaternion))));
  pg.angVel = THREE.MathUtils.lerp(pg.angVel, dt > 0 ? ang / dt : 0, 1 - Math.exp(-dt * 12));
  pgPrevQ.copy(camera.quaternion);

  // hors jeu (pause, album, fenêtre qui perd le focus) : le viseur se baisse — sinon un clic
  // droit relâché hors de la fenêtre, ou V resté enclenché, le laissait levé au retour
  if (!playerActive()) pg.aimHold = pg.aimLatch = false;
  // viseur, zoom, marche ralentie, souris moins sensible au téléobjectif
  const aim = aiming();
  pgVf.classList.toggle('on', aim);
  setMoveScale(aim ? 0.45 : 1);
  const target = aim ? pg.zoomFov : FOV_WALK;
  let changed = false;
  if (Math.abs(camera.fov - target) > 0.01) {
    camera.fov = THREE.MathUtils.lerp(camera.fov, target, 1 - Math.exp(-dt * 14));
    if (Math.abs(camera.fov - target) < 0.02) camera.fov = target;
    camera.updateProjectionMatrix(); changed = true;
  }
  controls.pointerSpeed = camera.fov / FOV_WALK;
  if (aim) {
    const snowy = lens.accum > 0.3 ? 'objectif enneigé — E pour essuyer' : lens.accum > 0.18 ? 'objectif un peu humide' : 'objectif propre';
    pgVfInfo.textContent = lens.wiping > 0 ? 'essuyage…' : `${focal(camera.fov)} mm · ${snowy}`;
  }
  // HUD
  if (!pg.ended) {
    const low = pg.timeLeft < 60 ? ' class="low"' : '';
    pgHud.innerHTML = `<span${low}>${fmtTime(pg.timeLeft)}</span> · ${pg.photos.length}/${CARD_SIZE} photos · gardées ${selected().length}/${KEEP_MAX}` +
      (pg.started ? '' : ' · <em>clic droit pour viser</em>');
  }
  return changed;
}

/** Juste après le rendu : l'image est encore dans le tampon, on la capture. */
function afterRenderPhoto(t) {
  if (!pg.shotPending) return;
  pg.shotPending = false;
  const src = renderer.domElement, W = 960, H = Math.round(W * src.height / src.width);
  pgThumb.width = W; pgThumb.height = H;
  pgThumb.getContext('2d').drawImage(src, 0, 0, W, H);
  const sctx = pgSmall.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(src, 0, 0, pgSmall.width, pgSmall.height);
  const r = evaluatePhoto({ camera, img: sctx.getImageData(0, 0, pgSmall.width, pgSmall.height), lens: lens.accum, angVel: pg.angVel, speed: pg.lastSpeed, t });
  const photo = { id: pg.nextId++, url: pgThumb.toDataURL('image/jpeg', 0.88), ...r, keep: false };
  pg.photos.push(photo);
  replay(pgFlash, 'go'); playShutter();
  toast(`Photo ${photo.id} — ${photo.total}/50 · ${photo.subject}`);
}

/* --- Album (inventaire) ------------------------------------------------ */
const partsLine = p => `Sujet ${p.parts.sujet}/15 · Compo ${p.parts.compo}/10 · Lumière ${p.parts.esth}/10 · Netteté ${p.parts.net}/10 · Moment ${p.parts.moment}/5`;
function openAlbum() {
  pg.albumOpen = true; pg.aimHold = false; openUi();
  renderAlbum(); pgAlbum.classList.add('open');
}
function closeAlbum(resume) {
  pg.albumOpen = false; pgAlbum.classList.remove('open');
  if (!pg.ended) closeUi(resume);
}
function renderAlbum() {
  const n = selected().length;
  pgAlbum.innerHTML = `
    <div class="al-head">
      <div><h2>Carte mémoire</h2><p>${pg.photos.length}/${CARD_SIZE} photos · ${fmtTime(pg.timeLeft)} restantes (chrono en pause) · clique une photo pour la garder</p></div>
      <div class="al-actions">
        <button class="btn" data-act="resume">Reprendre (I)</button>
        <button class="btn main" data-act="send" ${n === KEEP_MAX ? '' : 'disabled'}>Envoyer à la rédaction (${n}/${KEEP_MAX})</button>
      </div>
    </div>
    ${pg.photos.length ? '' : '<p class="al-empty">Aucune photo pour l\'instant. Clic droit pour lever le viseur, clic gauche pour déclencher.</p>'}
    <div class="cards">${pg.photos.map(p => `
      <div class="card${p.keep ? ' sel' : ''}" data-id="${p.id}">
        <img src="${p.url}" alt="">
        <span class="score">${p.total}/50</span>
        <button class="del" data-del="${p.id}" title="Supprimer">×</button>
        ${p.keep ? '<span class="tick">✓ gardée</span>' : ''}
        <div class="subj">${p.subject}</div>
        <div class="parts">${partsLine(p)}</div>
        <div class="rem">${p.remarks.join(' ')}</div>
      </div>`).join('')}</div>`;
}
pgAlbum.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'resume') return closeAlbum(true);
  if (act === 'send') return endNight(false);
  const del = e.target.closest('[data-del]');
  if (del) { pg.photos = pg.photos.filter(p => p.id !== +del.dataset.del); return renderAlbum(); }
  const card = e.target.closest('.card');
  if (!card) return;
  const p = pg.photos.find(q => q.id === +card.dataset.id);
  if (!p.keep && selected().length >= KEEP_MAX) { toast(`${KEEP_MAX} photos maximum : décoche-en une d'abord.`); return; }
  p.keep = !p.keep; renderAlbum();
});

/* --- Fin de la nuit : l'édition du matin ------------------------------- */
function endNight(timeUp) {
  if (pg.ended) return;
  pg.ended = true; pg.aimHold = pg.aimLatch = false;
  pgVf.classList.remove('on'); pgAlbum.classList.remove('open'); pg.albumOpen = false;
  openUi();
  let sent = selected();
  if (sent.length < KEEP_MIN) {                            // la rédaction pioche dans la carte pour boucler
    const rest = pg.photos.filter(p => !p.keep).sort((a, b) => b.total - a.total);
    sent = [...sent, ...rest.slice(0, KEEP_MIN - sent.length)];
  }
  const total = sent.reduce((s, p) => s + p.total, 0), best = sent.reduce((b, p) => (!b || p.total > b.total ? p : b), null);
  const verdict = !sent.length ? 'Aucune photo rendue : la rédaction boucle sans toi.'
    : total >= 200 ? 'À la une ! La rédaction fait sa couverture avec ta photo.'
    : total >= 150 ? 'Publié : un beau portfolio en pages intérieures.'
    : total >= 100 ? 'Publié en petit format, page 14.'
    : 'Refusé : la rédaction attendait mieux de cette nuit de blizzard.';
  let record = 0;
  try { record = +localStorage.getItem('blizzard-record') || 0; if (total > record) localStorage.setItem('blizzard-record', String(total)); } catch (e) { /* stockage bloqué */ }
  pgHud.textContent = '';
  pgReport.innerHTML = `
    <div class="rep-head">
      <p class="rep-kicker">${timeUp ? 'Fin de la nuit — 10 minutes écoulées' : 'Envoyé à la rédaction'}</p>
      <h2>L'édition du matin</h2>
      <p class="rep-verdict">${verdict}</p>
      <p class="rep-total"><strong>${total}</strong> / ${KEEP_MAX * 50}${sent.length < KEEP_MAX ? ` · ${sent.length} photo${sent.length > 1 ? 's' : ''} rendue${sent.length > 1 ? 's' : ''} sur ${KEEP_MAX}` : ''}
        ${best ? ` · meilleure photo ${best.total}/50` : ''} · record ${Math.max(record, total)}</p>
      <button class="btn main" data-act="again">Nouvelle nuit</button>
    </div>
    ${sent.map(p => `
      <figure class="rep-photo">
        <img src="${p.url}" alt="">
        <figcaption>
          <div class="rep-score">${p.total}<span>/50</span></div>
          <div class="subj">${p.subject}</div>
          <div class="parts">${partsLine(p)}</div>
          <div class="rem">${p.remarks.join(' ')}</div>
          <a class="btn" href="${p.url}" download="blizzard-nyc-photo-${p.id}.jpg">Télécharger</a>
        </figcaption>
      </figure>`).join('')}`;
  pgReport.classList.add('open');
}
pgReport.addEventListener('click', e => { if (e.target.closest('[data-act="again"]')) location.reload(); });

// inspection / tests depuis la console
const photoDebug = { state: pg, shoot: () => { pg.aimLatch = true; pg.shotPending = true; }, endNight };

/* ───────────────────────── src/main.js ───────────────────────── */
// EN PREMIER : remplace le calcul des lumières dans les shaders avant toute compilation (voir le module)

// Modules de décor : importés pour leurs effets de bord, dans l'ordre de construction.


// Point de vue forçable par l'URL, pour les tests visuels : ?x=-6.5&z=deli&yaw=90&pitch=-5
// (yaw en degrés, 0 = vers −Z, 90 = vers −X ; « z=deli » vise l'enseigne néon).
{
  const q = new URLSearchParams(location.search);
  if (q.has('x')) camera.position.x = parseFloat(q.get('x'));
  if (q.has('z')) camera.position.z = q.get('z') === 'deli' ? neonZ + 3 : parseFloat(q.get('z'));
  // si le point demandé tombe dans un obstacle (voiture, lampadaire…), on glisse
  // vers le trottoir le plus proche jusqu'à être libre
  if (q.has('x') || q.has('z')) {
    const p = camera.position, dir = p.x <= 0 ? -1 : 1;
    for (let k = 0; k < 40 && collides(p.x, p.z, PLAYER_RADIUS); k++) p.x += dir * 0.25;
  }
  if (q.has('yaw') || q.has('pitch')) {
    camera.quaternion.setFromEuler(new THREE.Euler(THREE.MathUtils.degToRad(parseFloat(q.get('pitch') ?? '0')), THREE.MathUtils.degToRad(parseFloat(q.get('yaw') ?? '0')), 0, 'YXZ'));
  }
}

// Matrices FIGÉES : à chaque image, Three recompose la matrice de chacun des ~1 600
// objets de la scène, alors que seule la caméra bouge (flocons et vapeur s'animent
// dans leurs tampons ou leurs shaders, pas par leur position ; les lampes et les feux
// ne changent que d'intensité ou de couleur). On calcule tout une fois et on fige.
// ⚠ Un objet qu'on voudrait déplacer plus tard devra repasser matrixAutoUpdate = true.
scene.updateMatrixWorld(true);
scene.traverse(o => { if (o !== camera && o !== scene) o.matrixAutoUpdate = false; });

// Crochet de débogage / tests visuels : position de la caméra et test de collision
// lisibles depuis la console (le reste vit en portée module).
window.__blizzard = { camera, scene, renderer, composer, collides, step: updatePlayer, keys, adaptiveRes, wind: windDebug, snowBounce, photo: photoDebug, startup, lightLoop };

// Touche P : « qu'est-ce que je regarde ? » — position, orientation et objet visé au
// centre de l'écran, affichés dans le HUD et en console. Pour signaler un artefact.
{
  const rc = new THREE.Raycaster(), e = new THREE.Euler(0, 0, 0, 'YXZ');
  window.addEventListener('keydown', ev => {
    if (ev.code !== 'KeyP') return;
    rc.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hit = rc.intersectObjects(scene.children, true).find(h => h.object.isMesh);
    e.setFromQuaternion(camera.quaternion);
    const p = camera.position, deg = THREE.MathUtils.radToDeg;
    let what = 'rien';
    if (hit) {
      const o = hit.object, c = o.material?.color;
      what = `${o.geometry?.type ?? o.type} / ${o.material?.type ?? '?'} #${c ? c.getHexString() : '------'} à ${hit.distance.toFixed(1)} m`;
    }
    const msg = `x=${p.x.toFixed(2)} z=${p.z.toFixed(2)} yaw=${deg(e.y).toFixed(0)} pitch=${deg(e.x).toFixed(0)} — visé : ${what}`;
    hud.textContent = msg; console.log('[P]', msg, hit?.object);
    hud.dataset.hold = String(performance.now() + 6000);           // la boucle laisse le message 6 s
  });
}

/* =====================================================================
   14. BOUCLE
   ===================================================================== */
const clock = new THREE.Clock();
let fpsTimer = 0, frames = 0;
const windDir = WIND.clone().normalize();

function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05), t = clock.elapsedTime;   // rawDt non borné : sert à mesurer les ips
  const speed = updatePlayer(dt);
  if (updatePhotoGame(dt, t, speed)) updateScale();             // viseur / zoom : le champ de vision a changé

  updateLampUniforms();
  updateSnow(snowFar, dt, t); updateSnow(snowMid, dt, t);
  updateSteam(dt);
  updateTrafficLights(t);
  updateVehicles(t);                                            // gyrophares de l'ambulance
  updateWind(t, camera);                                        // son du vent (si activé)

  // accumulation sur le visage : face au vent / vers le ciel / en marchant ; fonte lente
  camera.getWorldDirection(fwdDir);
  const facing = THREE.MathUtils.clamp(-fwdDir.dot(windDir), 0, 1), lookUp = THREE.MathUtils.clamp(fwdDir.y, 0, 1);
  const gain = (0.22 + 0.9 * facing + 0.5 * lookUp) * (1 + 0.6 * speed / WALK_SPEED) * 0.07;
  const melt = 0.05 + 0.03 * (1 - facing);
  if (lens.wiping > 0) {                                        // essuyage (jeu photo) : objectif propre en 1 s
    lens.accum -= (lens.accum - 0.1) * Math.min(1, dt / lens.wiping);
    lens.wiping = Math.max(0, lens.wiping - dt);
  } else lens.accum = THREE.MathUtils.clamp(lens.accum + (gain - melt) * dt, 0.1, 0.65);
  facePass.uniforms.uAccum.value = lens.accum; facePass.uniforms.uTime.value = t;

  // scintillement des lanternes, clignotement du néon
  for (const f of flickerLights) {
    const k = f.neon
      ? (Math.random() < 0.015 ? 0.35 : 1) * (0.93 + 0.07 * Math.sin(t * 43.0))
      : 0.92 + 0.08 * Math.sin(t * 8.0 + f.seed) + 0.03 * Math.sin(t * 27.0 + f.seed * 3);
    f.lights.forEach((l, i) => (l.intensity = f.base[i] * k));
    if (f.halos) for (const h of f.halos) h.sprite.material.opacity = h.base * k;
    f.k = k;                                                    // lu par la notation des photos (néon allumé ?)
    if (f.uK) f.uK.value = k;                                   // globe et cône de lumière des lampadaires
    if (f.neon) neonMat.color.setScalar(1.9 * k);
  }

  composer.render();
  afterRenderPhoto(t);                                          // capture d'une photo demandée (tampon encore plein)
  adaptiveRes.update(rawDt);

  frames++; fpsTimer += dt;
  if (fpsTimer > 0.5 && !(hud.dataset.hold > performance.now())) { hud.textContent = `${Math.round(frames / fpsTimer)} ips — rendu ${Math.round(adaptiveRes.scale * 100)} % — neige sur le visage ${Math.round(lens.accum * 100)} %`; frames = 0; fpsTimer = 0; }
}

/* =====================================================================
   15. REDIMENSIONNEMENT
   ===================================================================== */
function updateScale() {
  const h = window.innerHeight;
  const s = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const sys of [snowFar, snowMid]) { sys.mat.uniforms.uScale.value = s; sys.mat.uniforms.uPixelRatio.value = renderer.getPixelRatio(); }
  for (const m of steamMats) { m.uniforms.uScale.value = s; m.uniforms.uPixelRatio.value = renderer.getPixelRatio(); }
  renderer.getDrawingBufferSize(facePass.uniforms.uBuffer.value);
}
// la résolution adaptative change le rapport pixels/écran : taille des flocons et de la
// vapeur (en pixels calculés) et pente des gouttes de la passe visage à recaler
adaptiveRes.onChange = updateScale;
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
  facePass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
  updateScale();
}
window.addEventListener('resize', onResize);
updateScale();
// photos, textures et shaders préparés pendant le menu, PUIS la boucle (voir core/preload.js)
prepareScene({ renderer, scene, camera, composer }).then(animate, e => { console.error('préparation', e); animate(); });
</script>
