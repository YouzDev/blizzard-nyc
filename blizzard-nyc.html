{

<script type="module">
/* FICHIER GÉNÉRÉ — ne pas éditer à la main.
   Sources : src/*.js — régénérer avec « node build.js ». */

import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ───────────────────────── src/core/lightLoop.js ───────────────────────── */
/* =====================================================================
   1 quinquies. ÉCLAIRAGE EN BOUCLE (shaders compacts, image identique)
   Three.js r160 écrit le calcul de CHAQUE lumière en toutes lettres dans chaque
   shader (« #pragma unroll_loop_start » : la boucle est recopiée autant de fois qu'il
   y a de lumières). Avec 36 PointLight + 17 SpotLight, chaque matériau standard
   contenait 53 copies du même calcul : les 81 shaders étaient énormes, longs à
   compiler et à préparer au premier dessin (l'essentiel du temps de chargement).

   On remplace ce morceau (ShaderChunk.lights_fragment_begin) AVANT toute compilation :
     - les lumières qui projettent une ombre (ici les 7 projecteurs des lampadaires
       proches + aucune PointLight) restent recopiées : lire une carte d'ombre exige
       un indice constant ;
     - toutes les autres passent dans une VRAIE boucle, une seule copie du calcul ;
     - la boucle saute une lumière au-delà de sa portée (`distance`) : Three y
       multiplie déjà sa contribution par zéro (atténuation coupée), le résultat est
       donc le même, mais le pixel ne paie plus le calcul de 46 lumières lointaines.
   Même fonctions (getPointLightInfo, getSpotLightInfo, RE_Direct), même ordre : même image.
   Three range les lumières à ombre en premier : elles occupent les indices
   0 … NUM_*_SHADOWS − 1, la boucle prend la suite.
   Non géré : les projecteurs à texture (SpotLight.map) — le shader refuserait de
   compiler avec un message clair (#error) si on en ajoutait un.
   INTENSITÉ D'OMBRE des projecteurs : `light.shadow.radius` (0 → pas d'ombre, 1 → ombre
   pleine). Avec les ombres PCFSoft, Three r160 ne se sert pas de ce rayon (vérifié dans
   getShadow) : on le réutilise pour faire apparaître / disparaître en fondu l'ombre d'un
   lampadaire quand world/lightPool.js la confie à un autre. ⚠ Garder radius dans [0, 1] sur
   tout projecteur à ombre (le néon : 1) ; en PCF simple ou VSM il redeviendrait un rayon.

   Mesures / tests (URL) : ?lightloop=0 remet le morceau d'origine ; ?lightcompare
   compile les deux versions (bascule par le define BLZ_LIGHTS_ORIGINAL) pour comparer
   l'image pixel par pixel ; ?shaderbust=xxx change le texte des shaders, donc force
   une vraie « première visite » (le navigateur garde les shaders compilés en cache).
   ===================================================================== */
const LIGHTS_ORIGINAL = THREE.ShaderChunk.lights_fragment_begin;

const POINT_BLOCK = `#if ( NUM_POINT_LIGHTS > 0 ) && defined( RE_Direct )
	PointLight pointLight;
	#if defined( USE_SHADOWMAP ) && NUM_POINT_LIGHT_SHADOWS > 0
	PointLightShadow pointLightShadow;
	#pragma unroll_loop_start
	for ( int i = 0; i < NUM_POINT_LIGHT_SHADOWS; i ++ ) {
		pointLight = pointLights[ i ];
		getPointLightInfo( pointLight, geometryPosition, directLight );
		pointLightShadow = pointLightShadows[ i ];
		directLight.color *= ( directLight.visible && receiveShadow ) ? getPointShadow( pointShadowMap[ i ], pointLightShadow.shadowMapSize, pointLightShadow.shadowBias, pointLightShadow.shadowRadius, vPointShadowCoord[ i ], pointLightShadow.shadowCameraNear, pointLightShadow.shadowCameraFar ) : 1.0;
		RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );
	}
	#pragma unroll_loop_end
	#define BLZ_POINT_FIRST NUM_POINT_LIGHT_SHADOWS
	#else
	#define BLZ_POINT_FIRST 0
	#endif
	for ( int i = BLZ_POINT_FIRST; i < NUM_POINT_LIGHTS; i ++ ) {
		pointLight = pointLights[ i ];
		vec3 blzL = pointLight.position - geometryPosition;
		if ( pointLight.distance > 0.0 && dot( blzL, blzL ) >= pointLight.distance * pointLight.distance ) continue;
		getPointLightInfo( pointLight, geometryPosition, directLight );
		RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );
	}
	#undef BLZ_POINT_FIRST
#endif
`;

const SPOT_BLOCK = `#if ( NUM_SPOT_LIGHTS > 0 ) && defined( RE_Direct )
	#if NUM_SPOT_LIGHT_MAPS > 0
	#error lightLoop: SpotLight.map is not supported by the compact light loop
	#endif
	SpotLight spotLight;
	#if defined( USE_SHADOWMAP ) && NUM_SPOT_LIGHT_SHADOWS > 0
	SpotLightShadow spotLightShadow;
	#pragma unroll_loop_start
	for ( int i = 0; i < NUM_SPOT_LIGHT_SHADOWS; i ++ ) {
		spotLight = spotLights[ i ];
		getSpotLightInfo( spotLight, geometryPosition, directLight );
		spotLightShadow = spotLightShadows[ i ];
		directLight.color *= ( directLight.visible && receiveShadow ) ? mix( 1.0, getShadow( spotShadowMap[ i ], spotLightShadow.shadowMapSize, spotLightShadow.shadowBias, spotLightShadow.shadowRadius, vSpotLightCoord[ i ] ), clamp( spotLightShadow.shadowRadius, 0.0, 1.0 ) ) : 1.0;
		RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );
	}
	#pragma unroll_loop_end
	#define BLZ_SPOT_FIRST NUM_SPOT_LIGHT_SHADOWS
	#else
	#define BLZ_SPOT_FIRST 0
	#endif
	for ( int i = BLZ_SPOT_FIRST; i < NUM_SPOT_LIGHTS; i ++ ) {
		spotLight = spotLights[ i ];
		vec3 blzS = spotLight.position - geometryPosition;
		if ( spotLight.distance > 0.0 && dot( blzS, blzS ) >= spotLight.distance * spotLight.distance ) continue;
		getSpotLightInfo( spotLight, geometryPosition, directLight );
		RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );
	}
	#undef BLZ_SPOT_FIRST
#endif
`;

/** Morceau d'origine avec les deux blocs remplacés ; null si Three a changé (on garde l'origine). */
function compactChunk(src) {
  const p0 = src.indexOf('#if ( NUM_POINT_LIGHTS > 0 ) && defined( RE_Direct )');
  const s0 = src.indexOf('#if ( NUM_SPOT_LIGHTS > 0 ) && defined( RE_Direct )');
  const d0 = src.indexOf('#if ( NUM_DIR_LIGHTS > 0 ) && defined( RE_Direct )');
  if (p0 < 0 || s0 < p0 || d0 < s0) return null;
  return src.slice(0, p0) + POINT_BLOCK + SPOT_BLOCK + src.slice(d0);
}

const lightParams = new URLSearchParams(location.search);
const compact = compactChunk(LIGHTS_ORIGINAL);
if (!compact) console.warn('lightLoop : morceau lights_fragment_begin inattendu (version de Three ?), éclairage d\'origine conservé');
const lightLoop = {
  mode: !compact || lightParams.get('lightloop') === '0' ? 'origine' : lightParams.has('lightcompare') ? 'comparaison' : 'boucle',
  original: LIGHTS_ORIGINAL, compact,
};
let lightChunk = lightLoop.mode === 'origine' ? LIGHTS_ORIGINAL
  : lightLoop.mode === 'comparaison' ? `#ifdef BLZ_LIGHTS_ORIGINAL\n${LIGHTS_ORIGINAL}\n#else\n${compact}\n#endif\n`
  : compact;
if (lightParams.has('shaderbust')) lightChunk += `\n// shaderbust ${String(lightParams.get('shaderbust')).replace(/[^\w-]/g, '')}\n`;
THREE.ShaderChunk.lights_fragment_begin = lightChunk;

/* --- Nombre de lumières FIXE, pour que le navigateur réutilise ses shaders d'une visite à l'autre.
   Le nombre de PointLight est écrit dans le texte de chaque shader (NUM_POINT_LIGHTS). Or il
   varie d'une rue à l'autre (lanternes d'entrée, boutiques ouvertes, enseignes allumées, tirées
   au hasard : 36, 38…) : chaque visite tombait sur un autre texte, le cache de shaders du
   navigateur ne servait jamais, et la 2e visite était aussi lente que la 1re. On complète donc
   jusqu'à un nombre fixe avec des lumières ÉTEINTES (noires, intensité 0, portée minuscule,
   loin sous le sol) : la boucle les écarte au premier test, elles n'éclairent rien.
   Au-delà de POINT_LIGHT_SLOTS (rue exceptionnelle), on arrondit au multiple de 8 suivant :
   seule une telle rue recompile. Les SpotLight (16 lampadaires + néon) sont en nombre fixe. */
const POINT_LIGHT_SLOTS = 48;
function padPointLights(scene) {
  let n = 0;
  scene.traverse(o => { if (o.isPointLight) n++; });
  const target = n <= POINT_LIGHT_SLOTS ? POINT_LIGHT_SLOTS : Math.ceil(n / 8) * 8;
  for (let i = n; i < target; i++) {
    const l = new THREE.PointLight(0x000000, 0, 0.001, 2);
    l.position.set(0, -1000, 0); l.name = 'lumiere-de-remplissage';
    scene.add(l);
  }
  return { avant: n, apres: target };
}

/* ───────────────────────── src/core/constants.js ───────────────────────── */
/* =====================================================================
   0. CONSTANTES
   La rue est alignée sur l'axe Z, le joueur regarde vers -Z.
   ===================================================================== */
const ROAD_HALF     = 6;
const SIDEWALK_W    = 5.2;   // large trottoir new-yorkais : le mobilier reste au bord, le couloir piéton fait ~2,7 m
const FACADE_X      = ROAD_HALF + SIDEWALK_W;   // ±11.2
const SIDEWALK_H    = 0.18;
const STREET_Z_MIN  = -90;
const STREET_Z_MAX  = 40;
const EYE_HEIGHT    = 1.72;
const WALK_SPEED    = 3.2;
const PLAYER_RADIUS = 0.42;
const FOG_DENSITY   = 0.023;
// lampadaires : un tous les 17 m de chaque côté, côté droit décalé d'un demi-pas
const LAMP_Z0       = STREET_Z_MIN + 6;
const LAMP_PITCH    = 17;
// Carrefour au bout de la rue : la transversale a le même profil (chaussée de 12 m,
// trottoirs de 5,2 m), sa bordure côté joueur à z = STREET_Z_MIN. À gauche des feux, elle
// devient la RUE DE GAUCHE, fermée au fond par des façades (impasse) à x = LEFT_END_X ;
// à droite, elle devient la RUE DE DROITE, bordée de brownstones, qui finit à x = RIGHT_END_X
// sur l'entrée d'un parc (grille fermée).
const CROSS_Z       = STREET_Z_MIN - ROAD_HALF;    // −96 : axe de la transversale
const LEFT_END_X    = -110;
const RIGHT_END_X   = 78;                           // ligne du portail du parc
// Brownstones : la grille de la cour anglaise suit l'alignement des autres rues (±FACADE_X : le
// trottoir garde sa largeur), les maisons sont RECULÉES derrière, de la profondeur de leur perron.
const AREA_W        = 3.6;
// Entrée du parc : piliers et grilles sur ±PARK_GATE_W autour de l'axe de la rue, puis deux murets
// en quart de cercle qui rejoignent les grilles des cours (rayon FACADE_X − PARK_GATE_W) : les
// rangées de brownstones s'arrêtent là, 5,5 m avant la ligne du portail.
const PARK_GATE_W   = 5.7;

/* ───────────────────────── src/world/collisions.js ───────────────────────── */
/* =====================================================================
   4. COLLISIONS (AABB au sol)
   ===================================================================== */
const colliders = [];
function addCollider(cx, cz, hw, hd) { colliders.push({ minX: cx - hw, maxX: cx + hw, minZ: cz - hd, maxZ: cz + hd }); }
function collides(x, z, r) {
  for (const c of colliders) {
    const nx = Math.max(c.minX, Math.min(x, c.maxX)), nz = Math.max(c.minZ, Math.min(z, c.maxZ));
    const dx = x - nx, dz = z - nz;
    if (dx * dx + dz * dz < r * r) return true;
  }
  return false;
}
/** Remet le cercle (x, z, r) hors de tout obstacle qu'il chevauche, par la plus
 *  petite poussée possible. Filet de sécurité appelé après CHAQUE déplacement de la
 *  caméra (marche, balancement des pas) : un joueur ne peut plus « être dedans »,
 *  donc plus de garde-fou « déjà coincé → mouvement libre » à exploiter pour traverser.
 *  Quelques itérations suffisent pour les coins où deux boîtes se touchent. */
function pushOut(p, r) {
  for (let it = 0; it < 4; it++) {
    let moved = false;
    for (const c of colliders) {
      const nx = Math.max(c.minX, Math.min(p.x, c.maxX)), nz = Math.max(c.minZ, Math.min(p.z, c.maxZ));
      let dx = p.x - nx, dz = p.z - nz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      if (d2 > 1e-8) {                                   // centre hors de la boîte : on s'écarte du point le plus proche
        const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k;
      } else {                                           // centre dans la boîte : on sort par la face la plus proche
        const ex = [p.x - c.minX + r, c.maxX - p.x + r], ez = [p.z - c.minZ + r, c.maxZ - p.z + r];
        const m = Math.min(ex[0], ex[1], ez[0], ez[1]);
        if (m === ex[0]) p.x -= ex[0]; else if (m === ex[1]) p.x += ex[1]; else if (m === ez[0]) p.z -= ez[0]; else p.z += ez[1];
      }
      moved = true;
    }
    if (!moved) return;
  }
}
// Murs : les façades (plans x = ±FACADE_X de la rue principale, z = CROSS_Z ± FACADE_X de la
// transversale — dans la rue de droite, ce sont les grilles des cours anglaises), le fond de
// l'impasse de gauche et l'entrée du parc (grille fermée) ; derrière le départ, une limite à z = STREET_Z_MAX + 2.
{
  const near = CROSS_Z + FACADE_X, far = CROSS_Z - FACADE_X, x0 = LEFT_END_X - 20, x1 = RIGHT_END_X + 30;
  addCollider(-FACADE_X - 10, (near + 200) / 2, 10, (200 - near) / 2);          // gauche de la rue principale, jusqu'au coin
  addCollider( FACADE_X + 10, (near + 200) / 2, 10, (200 - near) / 2);          // droite de la rue principale, jusqu'au coin
  addCollider(0, STREET_Z_MAX + 2, 40, 2);                                      // derrière le départ
  addCollider((x0 - FACADE_X) / 2, near + 10, (-FACADE_X - x0) / 2, 10);        // rue de gauche, côté feux
  addCollider((FACADE_X + x1) / 2, near + 10, (x1 - FACADE_X) / 2, 10);         // rue de droite, côté feux
  addCollider((x0 + x1) / 2, far - 10, (x1 - x0) / 2, 10);                      // en face : rues de gauche et de droite, fond du T
  addCollider(LEFT_END_X - 10, CROSS_Z, 10, FACADE_X + 10);                     // fond de l'impasse
  addCollider(RIGHT_END_X + 10, CROSS_Z, 10, FACADE_X + 10);                    // entrée du parc
}

const shadowCasters = [];
function shadowed(mesh, cast = true, receive = true) { mesh.castShadow = cast; mesh.receiveShadow = receive; return mesh; }

/* ───────────────────────── src/core/renderer.js ───────────────────────── */
/* =====================================================================
   1. RENDU / SCÈNE / CAMÉRA / BROUILLARD
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Ombres STATIQUES : rien de ce qui projette une ombre ne bouge (immeubles, voitures,
// mobilier), les lampes sont fixes (le scintillement ne change que leur intensité) et
// la caméra d'ombre de la lune ne suit pas le joueur. Les 8 cartes d'ombre sont donc
// calculées à la première image puis réutilisées, au lieu de redessiner la scène
// 8 fois de plus à chaque image. ⚠ Si un jour quelque chose de MOBILE doit projeter
// une ombre (voiture qui roule, ombre du joueur), il faudra repasser
// `renderer.shadowMap.needsUpdate = true` à chaque image où il bouge.
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;

document.body.appendChild(renderer.domElement);

/* ───────────────────────── src/core/scene.js ───────────────────────── */
/* =====================================================================
   1 bis. SCÈNE / CAMÉRA / BROUILLARD / VOÛTE CÉLESTE
   ===================================================================== */

const scene = new THREE.Scene();
// Brume de blizzard : dans une chute de neige nocturne en ville, la lueur urbaine
// est diffusée par les flocons — le fond de rue est donc un voile gris-bleu CLAIR,
// pas du noir. C'est ce qui donne la profondeur de l'image de référence.
const FOG_COLOR = new THREE.Color(0x1a2336);   // même luminosité que 0x1b2230, un peu plus bleue (image modèle)
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.05, 260);
camera.position.set(-8.2, SIDEWALK_H + EYE_HEIGHT, 10);   // milieu du couloir piéton (entre lampadaires et clôtures)
scene.add(camera);

// Voûte céleste : dégradé nuit avec lueur urbaine à l'horizon.
// Le matériau est exporté : il sert aussi à cuire la carte d'environnement (voir
// core/environment.js), pour que ciel et réflexions ne puissent pas diverger.
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    // L'horizon EST la brume, littéralement : on passe `FOG_COLOR` en uniforme au
    // lieu de recopier des valeurs à la main. Sinon un objet lointain, fondu à
    // 99,99 % dans le brouillard, se découpe en silhouette sur un ciel qui n'a pas
    // la même couleur — c'est ce qui faisait apparaître les tours du fond en
    // masses NOIRES. Piège : `new THREE.Color(0x…)` est converti en LINÉAIRE par
    // Three, alors que le shader écrit du linéaire ; recopier les chiffres hexa
    // donnait un horizon 8,7× trop clair.
    uHorizon: { value: FOG_COLOR },
    uTop:     { value: FOG_COLOR.clone().multiplyScalar(0.3) },
  },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
      uniform vec3 uHorizon, uTop;
      varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        // la brume éclairée monte haut : le ciel ne s'assombrit que vers le zénith
        vec3 c = mix(uHorizon, uTop, smoothstep(0.08, 0.95, h));
        // lueur de la ville diffusée par la neige : gris-bleu, pas orange (sur le modèle le fond
        // de rue est un voile bleuté ; l'ancienne lueur chaude rougissait le point de fuite)
        // plus large que le reste de la voûte : c'est le ciel qu'on voit dans l'ouverture de la rue,
        // et c'est sur lui que se détachent les silhouettes (tours du fond, corniches) comme sur le modèle
        c += uHorizon * vec3(0.9, 1.0, 1.25) * (pow(max(0.0, 1.0 - abs(h)), 10.0) + 0.9 * pow(max(0.0, 1.0 - abs(h)), 4.0));
        gl_FragColor = vec4(c, 1.0);
      }`,
});
// la voûte suit la caméra (main.js) : loin de l'origine (rue de gauche), une sphère fixe se
// déformait (horizon de travers) et son bord le plus éloigné sortait du champ de la caméra
const sky = new THREE.Mesh(new THREE.SphereGeometry(230, 24, 16), skyMat);
scene.add(sky);

/* ───────────────────────── src/core/environment.js ───────────────────────── */
/* =====================================================================
   1 ter. CARTE D'ENVIRONNEMENT (réflexions)
   En PBR, un matériau métallique n'a PAS de composante diffuse : il ne rend
   que ce qu'il réfléchit. Sans carte d'environnement, il ne réfléchit rien et
   rend donc NOIR PUR, quelles que soient les lumières de la scène. C'est ce
   qui transformait les vitres, la ferronnerie et les lampadaires en trous noirs.

   On cuit donc une petite carte à partir du shader de ciel lui-même : ciel et
   réflexions ne peuvent pas diverger, et ça reste cohérent si on retouche la
   nuit. Coût : une seule cuisson au chargement, zéro par frame.
   ===================================================================== */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 24, 16), skyMat));
  const target = pmrem.fromScene(envScene, 0, 1, 100);
  scene.environment = target.texture;
  pmrem.dispose();
}

/* ───────────────────────── src/core/noise.js ───────────────────────── */
/* =====================================================================
   0 bis. BRUIT ET ALÉA
   ===================================================================== */

// petit bruit lisse en JS (déformation du sol)
function hash1(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function smoothNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash1(ix, iy), b = hash1(ix + 1, iy), c = hash1(ix, iy + 1), d = hash1(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
const rnd = (a, b) => a + Math.random() * (b - a);

/* ───────────────────────── src/textures/canvas.js ───────────────────────── */
/* =====================================================================
   2. TEXTURES PROCÉDURALES (canvas) : couleur + relief
   ===================================================================== */
const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function toTexture(canvas, srgb = true, repeat = true) {
  const t = new THREE.CanvasTexture(canvas);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();

}
/** Carte de hauteur (gris) → normal map tangente (Sobel, tuile raccord). Une normal
 *  map donne des arêtes de mortier et de joints nettes sous la lumière rasante des
 *  lampadaires, là où une bumpMap ne fait qu'un flou. Convention OpenGL (+Y = +V),
 *  celle de Three.js : le sens vertical du canvas est donc inversé. */
function heightToNormal(canvas, strength = 2) {
  const w = canvas.width, h = canvas.height;
  const src = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const out = makeCanvas(w, h), octx = out.getContext('2d'), img = octx.createImageData(w, h), d = img.data;
  const H = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength, dy = (H(x, y - 1) - H(x, y + 1)) * strength;
    const inv = 1 / Math.hypot(dx, dy, 1), i = (y * w + x) * 4;
    d[i] = (-dx * inv * 0.5 + 0.5) * 255; d[i + 1] = (-dy * inv * 0.5 + 0.5) * 255; d[i + 2] = (inv * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  return out;
}
function addGrain(ctx, w, h, amount) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * amount; d[i] += n; d[i+1] += n; d[i+2] += n; }
  ctx.putImageData(img, 0, 0);
}

/* ───────────────────────── src/textures/brick.js ───────────────────────── */
/** Briques à l'échelle réelle. La tuile couvre 5,5 m (cf. `worldBox`) : à 2048 px
 *  une brique de 19,4 cm fait 72 px, un rang de 6,7 cm fait 25 px — l'ancienne
 *  texture avait des briques de 52 cm. Appareil à rangs de boutisses, palette de
 *  brique new-yorkaise (orangé → marron → clinker noirâtre), mortier irrégulier,
 *  éclats d'angle, efflorescences, coulures de suie et patine par zones.
 *  Retourne couleur + normal map + rugosité. */
function makeBrickTextures() {
  const S = 2048, c = makeCanvas(S, S), ctx = c.getContext('2d');
  const h = makeCanvas(S, S), hctx = h.getContext('2d');
  const r = makeCanvas(S, S), rctx = r.getContext('2d');
  const bw = 72, bh = 21, gap = 4;
  // mortier : ton sable-gris avec variation, en creux et très rugueux
  ctx.fillStyle = '#8a8076'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 2500; i++) { ctx.fillStyle = `rgba(${60 + Math.random() * 40 | 0},${52 + Math.random() * 36 | 0},${44 + Math.random() * 30 | 0},0.5)`; ctx.fillRect(Math.random() * S, Math.random() * S, 6, 6); }
  hctx.fillStyle = '#4a4a4a'; hctx.fillRect(0, 0, S, S);
  rctx.fillStyle = '#f2f2f2'; rctx.fillRect(0, 0, S, S);

  // palette : trois familles de brique, mélangées par rang et par brique
  const TONES = [[176, 82, 58], [142, 62, 50], [118, 52, 46], [196, 104, 72], [90, 44, 40]];
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

  for (let y = -bh, row = 0; y < S + bh; y += bh + gap, row++) {
    const header = row % 6 === 5;                          // rang de boutisses tous les 6 rangs
    const bwr = header ? (bw - gap) / 2 : bw;
    const off = (row % 2) * ((bwr + gap) / 2) + (header ? 0 : 0);
    const rowT = Math.random();
    for (let x = -bw + off; x < S + bw; x += bwr + gap) {
      const t = Math.random(), clinker = Math.random() < 0.07, pale = Math.random() < 0.06;
      let col = mix(TONES[Math.floor(rowT * 3)], TONES[Math.floor(t * TONES.length)], 0.5);
      if (clinker) col = [58, 36, 32]; else if (pale) col = mix(col, [214, 160, 128], 0.6);
      col = col.map(v => v + (Math.random() - 0.5) * 14);
      const bx = Math.round(x), by = Math.round(y), bwi = Math.round(bwr) - (Math.random() < 0.3 ? 1 : 0);
      ctx.fillStyle = `rgb(${col.map(v => v | 0).join(',')})`; ctx.fillRect(bx, by, bwi, bh);
      // faces : arête haute plus claire, arête basse en ombre (relief en couleur)
      ctx.fillStyle = 'rgba(255,235,220,0.14)'; ctx.fillRect(bx, by, bwi, 2);
      ctx.fillStyle = 'rgba(20,10,8,0.35)'; ctx.fillRect(bx, by + bh - 2, bwi, 2);
      // texture de la brique : taches, grain plus grossier
      for (let k = 0; k < 4; k++) { ctx.fillStyle = `rgba(${Math.random() < 0.5 ? '20,10,8' : '255,230,210'},${Math.random() * 0.12})`; ctx.fillRect(bx + Math.random() * bwi, by + Math.random() * bh, 4 + Math.random() * 14, 2 + Math.random() * 5); }
      // éclat d'angle : on rend un coin au mortier
      if (Math.random() < 0.05) { ctx.fillStyle = '#7e746a'; hctx.fillStyle = '#4a4a4a'; const cw = 4 + Math.random() * 8, ch = 3 + Math.random() * 6, cx = Math.random() < 0.5 ? bx : bx + bwi - cw, cy = Math.random() < 0.5 ? by : by + bh - ch; ctx.fillRect(cx, cy, cw, ch); hctx.fillRect(cx, cy, cw, ch); }
      // hauteur : brique en relief, très légèrement bombée, bords adoucis
      const v = 165 + t * 40 + (clinker ? 25 : 0) | 0;
      const gr = hctx.createLinearGradient(bx, by, bx, by + bh);
      gr.addColorStop(0, `rgb(${v - 30},${v - 30},${v - 30})`); gr.addColorStop(0.4, `rgb(${v},${v},${v})`); gr.addColorStop(1, `rgb(${v - 22},${v - 22},${v - 22})`);
      hctx.fillStyle = gr; hctx.fillRect(bx, by, bwi, bh);
      // rugosité : brique moins rugueuse que le mortier, clinker vitrifié presque lisse, pâle très poreuse
      const rv = clinker ? 120 : pale ? 235 : 185 + t * 35 | 0;
      rctx.fillStyle = `rgb(${rv},${rv},${rv})`; rctx.fillRect(bx, by, bwi, bh);
    }
  }
  // patine par zones : suie, pluie, mousse — grands nuages sombres et quelques clairs
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * S, y = Math.random() * S, rad = 120 + Math.random() * 380, dark = Math.random() < 0.72;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, dark ? `rgba(18,12,10,${0.18 + Math.random() * 0.2})` : 'rgba(255,240,225,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // coulures verticales de suie et traînées blanches d'efflorescence
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * S, y0 = Math.random() * S, len = 80 + Math.random() * 500, white = Math.random() < 0.3;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + len);
    g.addColorStop(0, white ? 'rgba(240,235,225,0.32)' : 'rgba(15,10,8,0.28)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y0, 2 + Math.random() * 7, len);
    if (white) { rctx.fillStyle = 'rgba(255,255,255,0.5)'; rctx.fillRect(x, y0, 6, len); }
  }
  addGrain(ctx, S, S, 22); addGrain(hctx, S, S, 18);
  return { map: toTexture(c), normal: toTexture(heightToNormal(h, 2.4), false), rough: toTexture(r, false) };
}

/* ───────────────────────── src/textures/stone.js ───────────────────────── */
/** Pierre de soubassement, appareil REFENDU (rustication) : c'est le rez-de-chaussée
 *  de presque tous les immeubles de la rue, donc le mur que le joueur voit de plus
 *  près. L'ancienne version alignait des blocs identiques, au joint plat : on lisait
 *  un carrelage. Ici :
 *   - assises de 30 à 40 cm (les premières, de 42 à 62 cm, donnaient un mur de
 *     parpaings géants) et blocs de longueur variable (0,5 à 1,1 m) ;
 *   - REFEND HORIZONTAL : joints d'assise larges et creusés en V profond, joints
 *     verticaux fins et peu marqués — l'appareil des soubassements new-yorkais, qui
 *     dessine de longues lignes horizontales plutôt qu'une grille ;
 *   - teinte propre à chaque bloc (pierres de carrières différentes), taille de la
 *     pierre en fines stries, piqûres, veines, épaufrures aux angles ;
 *   - patine : coulures sombres qui partent des joints, crasse qui monte du trottoir,
 *     voile de sel tout en bas.
 *  Couleur presque neutre : la teinte (calcaire, brownstone, granit gris) est donnée
 *  par immeuble via `material.color`. La tuile couvre 5 m × 5 m. */
function makeStoneTextures() {

  ctx.fillStyle = '#34302c'; ctx.fillRect(0, 0, S, S);             // fond des joints
  hctx.fillStyle = '#202020'; hctx.fillRect(0, 0, S, S);
  rctx.fillStyle = '#ffffff'; rctx.fillRect(0, 0, S, S);

  const CH = 12, CV = 3;                                              // chanfreins : horizontal (≈ 6 cm) / vertical (≈ 1,5 cm)
  // assises : hauteurs 0,30–0,40 m, la dernière recalée pour boucler la tuile
  const rows = []; let y = 0;

  rows[rows.length - 1][1] += S - y;
  for (const [y0, hh] of rows) {
    // blocs : longueurs variables, dernier bloc recalé pour que la ligne boucle
    let x = -Math.random() * px;
    const blocks = [];
    while (x < S) { const w = Math.round((0.5 + Math.random() * 0.6) * px); blocks.push([x, w]); x += w; }
    // chaque bloc est dessiné aussi décalé de ±S (raccord horizontal) : ses tirages
    // aléatoires viennent d'un générateur réamorcé à l'identique pour chaque copie
    for (const [x0, w] of blocks) { const seed = Math.random() * 4294967296 >>> 0; for (const dx of [0, -S, S]) {
      const bx = x0 + dx; if (bx > S || bx + w < 0) continue;
      let st = seed; const rand = () => (st = (Math.imul(st, 1664525) + 1013904223) >>> 0) / 4294967296;
      const t = rand(), base = 132 + t * 76;
      const tint = [base + 6 + (rand() - 0.5) * 16, base + (rand() - 0.5) * 12, base - 8 + (rand() - 0.5) * 12];
      // hauteur : rampe du chanfrein (rectangles emboîtés de plus en plus hauts), puis face
      for (let k = 0; k < CH; k++) {                                  // rampe : rapide sur les côtés, lente en haut et en bas
        const v = 40 + (k / CH) * 150 | 0, kx = Math.min(k, CV);
        hctx.fillStyle = `rgb(${v},${v},${v})`; hctx.fillRect(bx + kx, y0 + k, w - 2 * kx, hh - 2 * k);
      }
      const fv = 190 + t * 35 | 0;
      hctx.fillStyle = `rgb(${fv},${fv},${fv})`; hctx.fillRect(bx + CV, y0 + CH, w - 2 * CV, hh - 2 * CH);
      // couleur : chanfrein un peu plus sombre (moins lavé par la pluie), face teintée
      ctx.fillStyle = `rgb(${tint.map(v => v * 0.8 | 0).join(',')})`; ctx.fillRect(bx + 1, y0 + 2, w - 2, hh - 4);
      ctx.fillStyle = `rgb(${tint.map(v => v | 0).join(',')})`; ctx.fillRect(bx + CV, y0 + CH - 2, w - 2 * CV, hh - 2 * CH + 4);
      rctx.fillStyle = '#d8d8d8'; rctx.fillRect(bx + 2, y0 + 2, w - 4, hh - 4);
      // taille de la pierre : fines stries parallèles (sens aléatoire par bloc)
      const vert = rand() < 0.5;
      for (let k = 0; k < (vert ? w : hh) - 2 * CH; k += 3) {
        const a = rand() * 0.08;
        ctx.fillStyle = `rgba(0,0,0,${a})`; hctx.fillStyle = `rgba(0,0,0,${a * 1.5})`;
        if (vert) { ctx.fillRect(bx + CH + k, y0 + CH, 1, hh - 2 * CH); hctx.fillRect(bx + CH + k, y0 + CH, 1, hh - 2 * CH); }
        else { ctx.fillRect(bx + CH, y0 + CH + k, w - 2 * CH, 1); hctx.fillRect(bx + CH, y0 + CH + k, w - 2 * CH, 1); }
      }
      // piqûres, taches, veines
      for (let k = 0; k < 12; k++) {                                  // peu de piqûres : trop, et on lit une dalle de faux plafond
        const qx = bx + CH + rand() * (w - 2 * CH), qy = y0 + CH + rand() * (hh - 2 * CH), s = 1 + rand() * 2;
        const dark = rand() < 0.85;
        ctx.fillStyle = dark ? `rgba(20,16,12,${rand() * 0.3})` : `rgba(255,248,235,${rand() * 0.08})`; ctx.fillRect(qx, qy, s, s);
        if (dark) { hctx.fillStyle = 'rgba(0,0,0,0.2)'; hctx.fillRect(qx, qy, s, s); }
      }
      const blot = ctx.createRadialGradient(bx + w * rand(), y0 + hh * rand(), 0, bx + w / 2, y0 + hh / 2, w * 0.6);
      blot.addColorStop(0, `rgba(${rand() < 0.5 ? '30,24,18' : '240,232,215'},${rand() * 0.18})`); blot.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = blot; ctx.fillRect(bx, y0, w, hh);
      if (rand() < 0.3) {
        ctx.strokeStyle = 'rgba(25,20,15,0.4)'; ctx.lineWidth = 1; ctx.beginPath();
        let vx = bx + CH + rand() * (w - 2 * CH), vy = y0 + CH; ctx.moveTo(vx, vy);
        while (vy < y0 + hh - CH) { vx += (rand() - 0.5) * 10; vy += 4 + rand() * 8; ctx.lineTo(vx, vy); }
        ctx.stroke();
      }
      // épaufrure : un angle cassé retombe au niveau du joint
      if (rand() < 0.18) {
        const cw = 8 + rand() * 18, cy = rand() < 0.5 ? y0 : y0 + hh - cw * 0.7, cx = rand() < 0.5 ? bx : bx + w - cw;
        ctx.fillStyle = 'rgba(70,62,54,0.9)'; ctx.beginPath(); ctx.ellipse(cx + cw / 2, cy + cw * 0.35, cw / 2, cw * 0.35, 0, 0, Math.PI * 2); ctx.fill();
        hctx.fillStyle = 'rgb(90,90,90)'; hctx.beginPath(); hctx.ellipse(cx + cw / 2, cy + cw * 0.35, cw / 2, cw * 0.35, 0, 0, Math.PI * 2); hctx.fill();
      }
      // coulure sombre qui part du joint supérieur
      if (rand() < 0.35) {
        const sx = bx + rand() * w, len = hh * (0.3 + rand() * 0.9);
        const g = ctx.createLinearGradient(0, y0, 0, y0 + len); g.addColorStop(0, 'rgba(15,10,6,0.4)'); g.addColorStop(1, 'rgba(15,10,6,0)');
        ctx.fillStyle = g; ctx.fillRect(sx, y0, 3 + rand() * 10, len);
      }
    } }
  }
  // patine d'ensemble : crasse qui monte du trottoir, voile de sel tout en bas
  const gd = ctx.createLinearGradient(0, S * 0.5, 0, S); gd.addColorStop(0, 'rgba(12,9,6,0)'); gd.addColorStop(1, 'rgba(12,9,6,0.5)');
  ctx.fillStyle = gd; ctx.fillRect(0, S * 0.5, S, S * 0.5);
  const gs = ctx.createLinearGradient(0, S * 0.88, 0, S); gs.addColorStop(0, 'rgba(232,228,218,0)'); gs.addColorStop(1, 'rgba(232,228,218,0.4)');
  ctx.fillStyle = gs; ctx.fillRect(0, S * 0.88, S, S * 0.12);
  for (let i = 0; i < 500; i++) {                                     // cristaux de sel épars
    const sx = Math.random() * S, sy = S - Math.pow(Math.random(), 2) * S * 0.14, s = 1 + Math.random() * 3;
    ctx.fillStyle = `rgba(235,232,225,${0.1 + Math.random() * 0.3})`; ctx.fillRect(sx, sy, s, s);
  }
  addGrain(ctx, S, S, 16); addGrain(hctx, S, S, 10);
  return { map: toTexture(c), normal: toTexture(heightToNormal(h, 3.2), false), rough: toTexture(r, false) };
}

/* ───────────────────────── src/textures/brownstone.js ───────────────────────── */
/** BROWNSTONE : le grès brun des maisons de Brooklyn et de Harlem, posé en grands blocs LISSES à
 *  joints fins (appareil réglé) — rien à voir avec le soubassement refendu de stone.js. Ce qui le
 *  rend reconnaissable :
 *   - une surface presque mate et unie, des joints à peine marqués (un trait, pas un creux) ;
 *   - l'ÉCAILLAGE propre à ce grès stratifié : des plaques de surface tombées, à bord net, qui
 *     laissent voir une pierre plus claire, plus rouge et plus rugueuse ;
 *   - des RÉPARATIONS au mortier teinté, d'un ton légèrement différent, plus lisses ;
 *   - des coulures sombres sous les joints, quelques veines.
 *  Couleur presque neutre et chaude : la teinte (chocolat, brun-rouge, grès peint) est donnée par
 *  le matériau, comme pour la pierre des soubassements. La tuile couvre 5,5 m × 5,5 m : l'échelle
 *  des UV de worldBox (buildings.js). Couleur + normal map + rugosité. */
function makeBrownstoneTextures() {
  const S = 1024, px = S / 5.5;                                       // ≈ 186 px par mètre
  const c = makeCanvas(S, S), ctx = c.getContext('2d');
  const h = makeCanvas(S, S), hctx = h.getContext('2d');
  const r = makeCanvas(S, S), rctx = r.getContext('2d');
  ctx.fillStyle = '#9c8c80'; ctx.fillRect(0, 0, S, S);                // joints : mortier gris-brun
  hctx.fillStyle = '#8c8c8c'; hctx.fillRect(0, 0, S, S);
  rctx.fillStyle = '#f0f0f0'; rctx.fillRect(0, 0, S, S);
  /** dessine f(dx) pour les trois copies horizontales qui assurent le raccord de la tuile */
  const wrap3 = f => { for (const dx of [-S, 0, S]) f(dx); };

  // assises de 0,42 à 0,56 m, la dernière recalée pour boucler la tuile ; blocs de 0,9 à 1,7 m
  const rows = []; let y = 0;
  while (y < S - 0.42 * px) { const hh = Math.round((0.42 + Math.random() * 0.14) * px); rows.push([y, hh]); y += hh; }
  rows[rows.length - 1][1] += S - y;
  for (const [y0, hh] of rows) {
    let x = -Math.random() * px;
    const blocks = [];
    while (x < S) { const w = Math.round((0.9 + Math.random() * 0.8) * px); blocks.push([x, w]); x += w; }
    for (const [x0, w] of blocks) {
      const t = Math.random(), base = 178 + t * 30;
      const tint = [base + 8 + (Math.random() - 0.5) * 10, base + (Math.random() - 0.5) * 8, base - 10 + (Math.random() - 0.5) * 8];
      const fh = 196 + t * 24 | 0;
      wrap3(dx => {
        const bx = x0 + dx;
        // joint fin : 2 px de mortier, arête adoucie d'1 px (la pierre est tendre, ses angles s'usent)
        ctx.fillStyle = `rgb(${tint.map(v => v * 0.93 | 0).join(',')})`; ctx.fillRect(bx + 1, y0 + 1, w - 2, hh - 2);
        ctx.fillStyle = `rgb(${tint.map(v => v | 0).join(',')})`; ctx.fillRect(bx + 2, y0 + 2, w - 4, hh - 4);
        hctx.fillStyle = `rgb(${fh - 14},${fh - 14},${fh - 14})`; hctx.fillRect(bx + 1, y0 + 1, w - 2, hh - 2);
        hctx.fillStyle = `rgb(${fh},${fh},${fh})`; hctx.fillRect(bx + 2, y0 + 2, w - 4, hh - 4);
        rctx.fillStyle = '#dadada'; rctx.fillRect(bx + 2, y0 + 2, w - 4, hh - 4);
      });
      // nuances douces dans le bloc (le grès est veiné de bancs plus ou moins rouges)
      for (let k = 0; k < 3; k++) {
        const gx = x0 + Math.random() * w, gy = y0 + Math.random() * hh, gr = 20 + Math.random() * 60, warm = Math.random() < 0.5;
        wrap3(dx => {
          const g = ctx.createRadialGradient(gx + dx, gy, 0, gx + dx, gy, gr);
          g.addColorStop(0, warm ? 'rgba(150,90,60,0.08)' : 'rgba(60,50,45,0.08)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(gx + dx - gr, gy - gr, gr * 2, gr * 2);
        });
      }
      // coulure sombre sous le joint supérieur
      if (Math.random() < 0.3) {
        const sx = x0 + Math.random() * w, len = Math.min(hh * (0.4 + Math.random() * 1.4), S - y0), sw = 3 + Math.random() * 12;
        wrap3(dx => {
          const g = ctx.createLinearGradient(0, y0, 0, y0 + len); g.addColorStop(0, 'rgba(25,18,14,0.22)'); g.addColorStop(1, 'rgba(25,18,14,0)');
          ctx.fillStyle = g; ctx.fillRect(sx + dx, y0, sw, len);
        });
      }
    }
  }

  /** contour irrégulier autour de (cx, cy), rayon moyen rad (bord net : éclat de pierre) */
  const blob = (g, cx, cy, rad, ex = 1) => {
    g.beginPath();
    const n = 14, ph = Math.random() * 6.28;
    for (let i = 0; i <= n; i++) {
      const a = i / n * 6.283, k = rad * (0.6 + 0.4 * Math.sin(a * 3 + ph) * Math.random() + 0.3 * Math.random());
      const px2 = cx + Math.cos(a) * k * ex, py2 = cy + Math.sin(a) * k;
      i ? g.lineTo(px2, py2) : g.moveTo(px2, py2);
    }
    g.closePath();
  };
  // (taches et éclats tenus loin du haut et du bas de la tuile : pas de raccord vertical à gérer)
  // RÉPARATIONS au mortier teinté : plaques plus lisses, d'un ton un peu différent, contour visible
  for (let i = 0; i < 4; i++) {
    const rad = (0.2 + Math.random() * 0.35) * px, cx = Math.random() * S, cy = rad * 1.4 + Math.random() * (S - rad * 2.8), tone = Math.random() < 0.5;
    wrap3(dx => {
      blob(ctx, cx + dx, cy, rad, 1.6); ctx.fillStyle = tone ? 'rgba(120,80,62,0.22)' : 'rgba(150,140,132,0.18)'; ctx.fill();
      ctx.strokeStyle = 'rgba(40,30,24,0.2)'; ctx.lineWidth = 1.5; ctx.stroke();
      blob(rctx, cx + dx, cy, rad, 1.6); rctx.fillStyle = '#b4b4b4'; rctx.fill();
      blob(hctx, cx + dx, cy, rad, 1.6); hctx.fillStyle = 'rgba(214,214,214,0.8)'; hctx.fill();
    });
  }
  // ÉCAILLAGE : la croûte est tombée, la pierre dessous est plus claire, plus rouge, plus rugueuse,
  // EN CREUX avec un bord net (la normal map en fait une petite marche sous la lumière rasante)
  for (let i = 0; i < 9; i++) {
    const rad = (0.06 + Math.random() * 0.22) * px, cx = Math.random() * S, cy = rad * 1.4 + Math.random() * (S - rad * 2.8);
    wrap3(dx => {
      blob(ctx, cx + dx, cy, rad, 1.3); ctx.fillStyle = 'rgba(214,170,140,0.5)'; ctx.fill();
      blob(hctx, cx + dx, cy, rad, 1.3); hctx.fillStyle = 'rgb(150,150,150)'; hctx.fill();
      blob(rctx, cx + dx, cy, rad, 1.3); rctx.fillStyle = '#ffffff'; rctx.fill();
      for (let k = 0; k < rad * 1.5; k++) {                          // grain grossier de la pierre à nu
        const qx = cx + dx + (Math.random() - 0.5) * rad * 1.6, qy = cy + (Math.random() - 0.5) * rad * 1.2;
        ctx.fillStyle = `rgba(${Math.random() < 0.5 ? '90,60,45' : '235,200,170'},0.25)`; ctx.fillRect(qx, qy, 2, 2);
        hctx.fillStyle = `rgba(${Math.random() < 0.5 ? '120,120,120' : '175,175,175'},0.6)`; hctx.fillRect(qx, qy, 2, 2);
      }
    });
  }
  // piqûres et veines fines, très peu : la pierre doit rester LISSE
  for (let i = 0; i < 260; i++) {
    const qx = Math.random() * S, qy = Math.random() * S, s = 1 + Math.random() * 1.5;
    ctx.fillStyle = `rgba(40,28,20,${Math.random() * 0.25})`; ctx.fillRect(qx, qy, s, s);
    hctx.fillStyle = 'rgba(120,120,120,0.4)'; hctx.fillRect(qx, qy, s, s);
  }
  addGrain(ctx, S, S, 10); addGrain(hctx, S, S, 6);
  return { map: toTexture(c), normal: toTexture(heightToNormal(h, 2.2), false), rough: toTexture(r, false) };
}

/* ───────────────────────── src/textures/snow.js ───────────────────────── */
/* Neige au sol, à L'ÉCHELLE RÉELLE. Deux textures :
   - TROTTOIR : couvre toute la largeur du trottoir (u = 0 bordure → u = 1 façade) sur
     4,5 m de long (3 dalles). Trois bandes, comme dans une vraie rue après une nuit
     de neige : gadoue grise et salée contre la bordure, passage piétiné au milieu
     (neige tassée, joints de dalles qui transparaissent, empreintes de semelles),
     neige fraîche intacte contre les façades.
   - CHAUSSÉE : couvre toute la largeur de la chaussée (12,3 m) sur 12,3 m de long.
     Deux voies, chacune avec sa paire d'ORNIÈRES : la neige y est chassée jusqu'à
     l'asphalte mouillé, sombre et LISSE (rugosité basse → les lampadaires s'y
     reflètent), bordée de gadoue brune remuée ; entre les ornières, neige tassée
     sale ; le long des voitures garées, neige plus propre.
   Chaque texture : couleur + normal map + rugosité (neige très mate, piquée de
   cristaux lisses qui scintillent sous les lampes quand on se déplace).
   Les motifs aléatoires sont redessinés décalés d'une tuile pour rester raccord. */

/** Semelle de chaussure (vue de dessus), orientée vers +y local. l : longueur en px. */
function sole(ctx, l, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.ellipse(0, -l * 0.18, l * 0.19, l * 0.32, 0, 0, Math.PI * 2); ctx.fill();   // avant-pied
  ctx.beginPath(); ctx.ellipse(0, l * 0.3, l * 0.15, l * 0.2, 0, 0, Math.PI * 2); ctx.fill();      // talon
  ctx.fillRect(-l * 0.12, -l * 0.02, l * 0.24, l * 0.26);                                         // cambrure
}

/** Empreinte complète (rebord, creux, crampons) en couleur, hauteur et rugosité. */
function footprint(c, h, r, x, y, ang, l, depth) {
  for (const [ctx, kind] of [[c, 0], [h, 1], [r, 2]]) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    if (kind === 1) {                                                   // relief : rebord relevé, creux, crampons
      ctx.save(); ctx.scale(1.25, 1.12); sole(ctx, l, `rgba(200,200,200,${0.5 * depth})`); ctx.restore();
      sole(ctx, l, `rgba(40,40,40,${0.85 * depth})`);
      ctx.fillStyle = `rgba(95,95,95,${0.7 * depth})`;
      for (let k = -0.42; k < 0.5; k += 0.09) ctx.fillRect(-l * 0.14, k * l, l * 0.28, l * 0.035);
    } else if (kind === 0) {                                            // couleur : creux bleuté (ombre), rebord clair
      ctx.save(); ctx.scale(1.25, 1.12); sole(ctx, l, `rgba(255,255,255,${0.35 * depth})`); ctx.restore();
      sole(ctx, l, `rgba(104,116,140,${0.32 * depth})`);
    } else {                                                            // rugosité : neige tassée dans l'empreinte, plus lisse
      sole(ctx, l, `rgba(150,150,150,${0.6 * depth})`);
    }
    ctx.restore();
  }
}

/** Dessine f(dx) pour dx ∈ {−W, 0, +W} : raccord horizontal des motifs qui débordent. */
const wrapX = (W, f) => { for (const dx of [-W, 0, W]) f(dx); };

function makeSnowTextures(isRoad) {
  const S = 1024, c = makeCanvas(S, S), ctx = c.getContext('2d');
  const h = makeCanvas(S, S), hctx = h.getContext('2d'), r = makeCanvas(S, S), rctx = r.getContext('2d');
  // échelle : px par mètre sur chaque axe (la tuile n'est pas carrée en mètres)
  const WU = isRoad ? 12.3 : 5.4, WV = isRoad ? 12.3 : 4.5, pu = S / WU, pv = S / WV;
  const X = m => m * pu, Y = m => m * pv;

  // --- fond : neige, relief moyen, très mate
  ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 0, S, S);
  hctx.fillStyle = '#808080'; hctx.fillRect(0, 0, S, S);
  rctx.fillStyle = '#ebebeb'; rctx.fillRect(0, 0, S, S);              // rugosité ≈ 0,92

  // ondulations douces : creux bleutés, crêtes chaudes
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * S, y = Math.random() * S, rad = 30 + Math.random() * 90, dip = Math.random() < 0.55;
    for (const dy of [-S, 0, S]) wrapX(S, dx => {
      const g = ctx.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, rad);
      g.addColorStop(0, dip ? 'rgba(150,166,194,0.25)' : 'rgba(255,250,242,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x + dx - rad, y + dy - rad, rad * 2, rad * 2);
      const gh = hctx.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, rad);
      gh.addColorStop(0, dip ? 'rgba(70,70,70,0.5)' : 'rgba(190,190,190,0.5)'); gh.addColorStop(1, 'rgba(128,128,128,0)');
      hctx.fillStyle = gh; hctx.fillRect(x + dx - rad, y + dy - rad, rad * 2, rad * 2);
    });
  }

  if (!isRoad) {
    // ================= TROTTOIR =================
    const uCurbSlush = 0.13, uPathEnd = 0.74;
    // passage piétiné : neige tassée, plus grise, relief écrasé
    const gp = ctx.createLinearGradient(0, 0, S, 0);
    gp.addColorStop(0, 'rgba(150,158,172,0.18)'); gp.addColorStop(uCurbSlush, 'rgba(160,168,182,0.07)');
    gp.addColorStop(0.45, 'rgba(170,178,192,0.05)');   // à peine grisé : sur le modèle le passage reste blanc gp.addColorStop(uPathEnd, 'rgba(180,188,200,0.04)'); gp.addColorStop(0.85, 'rgba(180,188,200,0)');
    ctx.fillStyle = gp; ctx.fillRect(0, 0, S, S);
    const rp = rctx.createLinearGradient(0, 0, S, 0);                   // tassé = un peu plus lisse
    rp.addColorStop(0, 'rgba(170,170,170,0.8)'); rp.addColorStop(uPathEnd, 'rgba(200,200,200,0.4)'); rp.addColorStop(0.85, 'rgba(235,235,235,0)');
    rctx.fillStyle = rp; rctx.fillRect(0, 0, S, S);
    // joints des dalles (1,5 m) : transparaissent là où la neige est piétinée
    const joint = (x0, y0, w, hh, a) => {
      ctx.fillStyle = `rgba(92,100,116,${a})`; ctx.fillRect(x0, y0, w, hh);
      hctx.fillStyle = `rgba(50,50,50,${a * 2.4})`; hctx.fillRect(x0, y0, w, hh);
    };
    for (let k = 1; k * 1.5 < WU; k++) {
      const x = X(k * 1.5 - 0.2), a = 0.26 * (1 - Math.min(1, Math.max(0, (x / S - 0.2) / 0.6)));
      joint(x, 0, 3, S, a + 0.04);
    }
    for (let k = 0; k < 3; k++) {
      const y = Y(k * 1.5 + 0.4);
      for (let x = 0; x < S; x += 4) joint(x, y, 4, 3, 0.3 * Math.max(0.1, 1 - x / (S * 0.8)));
    }
    // gadoue grise contre la bordure, flaques de fonte (sel), sombres et lisses
    // (discrètes : sur le trottoir devenu blanc, les anciennes — sombres, lisses, 16 par tuile —
    // se lisaient comme une file de disques noirs le long de la bordure ; le modèle n'en montre pas)
    for (let i = 0; i < 7; i++) {
      const x = Math.random() * X(0.6), y = Math.random() * S, rw = X(0.1 + Math.random() * 0.2), rh = Y(0.15 + Math.random() * 0.5);
      for (const dy of [-S, 0, S]) {
        ctx.fillStyle = `rgba(120,128,142,${0.1 + Math.random() * 0.12})`; ctx.beginPath(); ctx.ellipse(x, y + dy, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
        rctx.fillStyle = 'rgba(150,150,150,0.5)'; rctx.beginPath(); rctx.ellipse(x, y + dy, rw * 0.8, rh * 0.8, 0, 0, Math.PI * 2); rctx.fill();
        hctx.fillStyle = 'rgba(90,90,90,0.5)'; hctx.beginPath(); hctx.ellipse(x, y + dy, rw, rh, 0, 0, Math.PI * 2); hctx.fill();
      }
    }
    // sel de déneigement : granulés bleu pâle et blancs, plus denses côté bordure
    for (let i = 0; i < 900; i++) {
      const x = Math.pow(Math.random(), 1.8) * S * 0.8, y = Math.random() * S, s = 1.5 + Math.random() * 2;
      ctx.fillStyle = Math.random() < 0.5 ? 'rgba(168,196,228,0.55)' : 'rgba(236,240,246,0.5)'; ctx.fillRect(x, y, s, s);
      hctx.fillStyle = 'rgba(200,200,200,0.6)'; hctx.fillRect(x, y, s, s);
      rctx.fillStyle = 'rgba(90,90,90,0.8)'; rctx.fillRect(x, y, s, s);
      if (Math.random() < 0.25) { ctx.fillStyle = 'rgba(70,78,92,0.22)'; ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s * 2.5, 0, Math.PI * 2); ctx.fill(); }   // auréole de fonte
    }
    // pistes d'empreintes le long du trottoir (périodes entières sur la tuile → raccord)
    const lengthPx = Y(0.29);
    const trail = (u0, amp, k, phase, dir, depth, stride) => {
      let n = 0;
      for (let y = 0; y < S; y += Y(stride), n++) {
        const a = 6.283 * k * y / S + phase, cx = X(u0 * WU) + X(amp) * Math.sin(a);
        const heading = Math.atan2(X(amp) * 6.283 * k * Math.cos(a) / S, 1) * dir;
        const lat = ((n % 2) * 2 - 1) * X(0.09);
        const px = cx + lat, ang = -heading + (dir > 0 ? Math.PI : 0) + (Math.random() - 0.5) * 0.25;
        wrapX(S, dx => footprint(ctx, hctx, rctx, px + dx, y, ang, lengthPx, depth));
      }
    };
    for (let t = 0; t < 10; t++) trail(0.2 + Math.random() * 0.5, 0.05 + Math.random() * 0.25, 1 + Math.floor(Math.random() * 2), Math.random() * 6.28, Math.random() < 0.5 ? 1 : -1, 0.35 + Math.random() * 0.45, 0.36 + Math.random() * 0.08);
    for (let t = 0; t < 2; t++) trail(0.82 + Math.random() * 0.1, 0.03, 1, Math.random() * 6.28, Math.random() < 0.5 ? 1 : -1, 0.9, 0.4);   // quelques pas dans la neige fraîche : profonds
  } else {
    // ================= CHAUSSÉE =================
    // neige tassée sale partout, plus propre le long des voitures garées
    const gr = ctx.createLinearGradient(0, 0, S, 0);
    gr.addColorStop(0, 'rgba(140,148,160,0.08)'); gr.addColorStop(0.19, 'rgba(140,148,160,0.1)');
    gr.addColorStop(0.3, 'rgba(130,134,142,0.2)'); gr.addColorStop(0.5, 'rgba(134,138,146,0.18)'); gr.addColorStop(0.7, 'rgba(130,134,142,0.2)');
    gr.addColorStop(0.81, 'rgba(140,148,160,0.1)'); gr.addColorStop(1, 'rgba(140,148,160,0.08)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, S, S);
    // ornières : deux voies, deux traces par voie (écartement 1,6 m), qui ondulent un peu
    for (const xc of [-2.4, -0.8, 0.8, 2.4]) {
      const u0 = X(xc + WU / 2), wob = X(0.06 + Math.random() * 0.08), ph = Math.random() * 6.28, k = 1 + Math.floor(Math.random() * 2);
      for (let y = 0; y < S; y += 2) {
        const cx = u0 + wob * Math.sin(6.283 * k * y / S + ph);
        const tw = X(0.3 + 0.05 * Math.sin(y * 0.05 + ph));
        // gadoue brune remuée sur les bords de l'ornière
        ctx.fillStyle = `rgba(120,118,116,${0.08 + Math.random() * 0.1})`; ctx.fillRect(cx - tw * 1.1, y, tw * 2.2, 2);
        hctx.fillStyle = 'rgba(160,160,160,0.25)'; hctx.fillRect(cx - tw * 1.05, y, tw * 0.35, 2); hctx.fillRect(cx + tw * 0.7, y, tw * 0.35, 2);
        // fond de l'ornière : asphalte mouillé, sombre, lisse
        ctx.fillStyle = Math.random() < 0.06 ? 'rgba(40,44,52,0.55)' : `rgba(118,126,142,${0.35 + Math.random() * 0.15})`; ctx.fillRect(cx - tw / 2, y, tw, 2);   // neige damée grise, rares taches mouillées
        hctx.fillStyle = 'rgba(55,55,55,0.9)'; hctx.fillRect(cx - tw / 2, y, tw, 2);
        rctx.fillStyle = `rgba(${110 + Math.random() * 40 | 0},${110 + Math.random() * 40 | 0},${110 + Math.random() * 40 | 0},0.9)`; rctx.fillRect(cx - tw / 2, y, tw, 2);   // damé = un peu lustré
        // sculptures du pneu imprimées dans la neige résiduelle
        if (y % 6 === 0) { ctx.fillStyle = 'rgba(120,124,132,0.3)'; ctx.fillRect(cx - tw * 0.45, y, tw * 0.25, 1.5); ctx.fillRect(cx + tw * 0.2, y + 3, tw * 0.25, 1.5); }
      }
    }
    // plaques de glace et de gadoue, grains de sable et de sel
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * S, y = Math.random() * S, rw = X(0.08 + Math.random() * 0.25), rh = Y(0.1 + Math.random() * 0.5);
      const ice = Math.random() < 0.3;
      for (const dy of [-S, 0, S]) wrapX(S, dx => {
        ctx.fillStyle = ice ? 'rgba(60,66,76,0.16)' : `rgba(82,74,64,${0.05 + Math.random() * 0.1})`;
        ctx.beginPath(); ctx.ellipse(x + dx, y + dy, rw, rh, Math.random() * 3, 0, Math.PI * 2); ctx.fill();
        if (ice) { rctx.fillStyle = 'rgba(70,70,70,0.7)'; rctx.beginPath(); rctx.ellipse(x + dx, y + dy, rw, rh, 0, 0, Math.PI * 2); rctx.fill(); }
      });
    }
    for (let i = 0; i < 5000; i++) {
      const s = 1 + Math.random() * 1.8;
      ctx.fillStyle = Math.random() < 0.3 ? `rgba(90,80,70,${0.15 + Math.random() * 0.25})` : 'rgba(225,232,244,0.6)';
      ctx.fillRect(Math.random() * S, Math.random() * S, s, s);
    }
    // quelques traversées piétonnes
    for (let t = 0; t < 2; t++) {
      const y0 = Math.random() * S, ang = Math.PI / 2 + (Math.random() - 0.5) * 0.3;
      for (let x = X(0.8); x < S - X(0.8); x += X(0.38)) wrapX(S, dx => footprint(ctx, hctx, rctx, x + dx, y0 + (x - S / 2) * Math.tan(ang - Math.PI / 2) * 0.1 + ((x / X(0.38)) % 2 ? 6 : -6), ang, Y(0.29), 0.4));
    }
  }

  // --- cristaux : grain fin partout, et quelques paillettes LISSES qui scintillent
  for (let i = 0; i < 16000; i++) {
    const v = 205 + Math.random() * 50, s = 1 + Math.random() * 2.5, x = Math.random() * S, y = Math.random() * S;
    ctx.fillStyle = `rgba(${v - 8},${v},${v + 12},${Math.random() * 0.45})`; ctx.fillRect(x, y, s, s);
    hctx.fillStyle = `rgba(${90 + Math.random() * 170 | 0},128,128,0.4)`; hctx.fillRect(x, y, s, s);
  }
  for (let i = 0; i < (isRoad ? 1500 : 4000); i++) {
    const x = Math.random() * S, y = Math.random() * S;
    rctx.fillStyle = `rgb(${20 + Math.random() * 40 | 0},${20 + Math.random() * 40 | 0},${20 + Math.random() * 40 | 0})`; rctx.fillRect(x, y, 1.5, 1.5);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x, y, 1.5, 1.5);
  }
  addGrain(ctx, S, S, 8);
  return { map: toTexture(c), normal: toTexture(heightToNormal(h, 2.2), false), rough: toTexture(r, false) };
}

function makeDarkWindowTextures() {

    ctx.fillStyle = '#16181c'; ctx.fillRect(0, 0, 64, 96); draw(ctx); return toTexture(c, true, false); };
  const shade = mk(ctx => {                                           // store à enrouleur, arrêté à mi-hauteur

/* ───────────────────────── src/textures/grime.js ───────────────────────── */
/** Carte de SALISSURE des façades, échantillonnée en coordonnées monde (tuile de
 *  17 m, volontairement sans rapport avec la tuile de brique de 5,5 m : les deux
 *  répétitions ne retombent jamais ensemble, la grille disparaît). Tuile raccord.
 *  Trois canaux indépendants (données, pas de la couleur) :
 *   R — grandes taches lentes (suie, lavage par la pluie, lots de briques différents)
 *   G — coulures verticales (bruit très étiré en hauteur)
 *   B — bruit moyen, pour rendre irrégulières les coulures sous les appuis */
function makeGrimeTexture() {
  const S = 512, cv = makeCanvas(S, S), ctx = cv.getContext('2d'), img = ctx.createImageData(S, S), d = img.data;
  // bruit de valeur PÉRIODIQUE (période px × py cellules) → tuile raccord
  const seed = Math.random() * 1000;
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7 + seed) * 43758.5453; return s - Math.floor(s); };
  const vnoise = (u, v, px, py) => {
    const x = u * px, y = v * py, ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const h = (a, b) => hash(((a % px) + px) % px, ((b % py) + py) % py);
    const a = h(ix, iy), b = h(ix + 1, iy), c = h(ix, iy + 1), e = h(ix + 1, iy + 1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + e) * sx * sy;
  };
  const fbm = (u, v, p, oct) => { let s = 0, amp = 0.5, n = 0; for (let o = 0; o < oct; o++) { s += amp * vnoise(u, v, p << o, p << o); n += amp; amp *= 0.5; } return s / n; };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    const R = Math.min(1, Math.max(0, (fbm(u, v, 3, 4) - 0.28) * 2.2));
    const col = Math.pow(vnoise(u, 0, 90, 1), 2.5);                 // quelles colonnes coulent
    const G = Math.min(1, col * (0.35 + 0.9 * vnoise(u, v, 90, 3)) * 1.6);
    const B = fbm(u, v, 12, 3);
    d[i] = R * 255; d[i + 1] = G * 255; d[i + 2] = B * 255; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ───────────────────────── src/textures/shutter.js ───────────────────────── */
/** Rideau métallique à lames horizontales : peinture grise fatiguée, coulures de
 *  rouille, crasse au pied, tags et affiche. Se répète en largeur (une tuile ≈ 2,5 m)
 *  pour rester net sur une baie de 8 m. */
function makeShutterTexture() {
  const W = 512, H = 512, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const base = ['#5a5e64', '#4c5058', '#6a6560'][Math.floor(Math.random() * 3)];
  // lames : chacune bombée (clair au sommet, ombre à la charnière)
  for (let y = 0; y < H; y += 12) {
    const g = ctx.createLinearGradient(0, y, 0, y + 12);
    g.addColorStop(0, shadeHex(base, 0.7)); g.addColorStop(0.35, shadeHex(base, 1.35)); g.addColorStop(0.65, base); g.addColorStop(0.92, shadeHex(base, 0.55)); g.addColorStop(1, '#24262a');
    ctx.fillStyle = g; ctx.fillRect(0, y, W, 12);
  }
  // coulures de rouille depuis des points d'accroche, s'élargissant vers le bas
  for (let i = 0; i < 9; i++) {
    const x = Math.random() * W, y0 = Math.random() * H * 0.5, len = 60 + Math.random() * 260;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + len);
    g.addColorStop(0, 'rgba(120,60,25,0.55)'); g.addColorStop(1, 'rgba(120,60,25,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 2, y0); ctx.lineTo(x + 2, y0); ctx.lineTo(x + 7, y0 + len); ctx.lineTo(x - 7, y0 + len); ctx.fill();
  }
  // taches de rouille éparses
  for (let i = 0; i < 26; i++) { ctx.fillStyle = `rgba(110,60,30,${Math.random() * 0.3})`; ctx.beginPath(); ctx.ellipse(Math.random() * W, Math.random() * H, 5 + Math.random() * 14, 8 + Math.random() * 30, 0, 0, 7); ctx.fill(); }
  // crasse projetée par la rue au pied du rideau
  const gr = ctx.createLinearGradient(0, H * 0.7, 0, H); gr.addColorStop(0, 'rgba(20,18,16,0)'); gr.addColorStop(1, 'rgba(20,18,16,0.55)');
  ctx.fillStyle = gr; ctx.fillRect(0, H * 0.7, W, H * 0.3);
  // tags : un trait épais fond + un trait fin clair par-dessus, courbes libres
  const tags = 1 + Math.floor(Math.random() * 2);
  for (let t = 0; t < tags; t++) {
    const hue = Math.random() * 360, x0 = Math.random() * W * 0.7, y0 = H * (0.35 + Math.random() * 0.4);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [col, lw] of [[`hsla(${hue},70%,45%,0.75)`, 13], [`hsla(${(hue + 40) % 360},80%,80%,0.8)`, 4]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x0, y0);
      for (let k = 0; k < 4; k++) ctx.bezierCurveTo(x0 + Math.random() * 160, y0 - 60 + Math.random() * 120, x0 + Math.random() * 160, y0 - 60 + Math.random() * 120, x0 + 40 + k * 35, y0 + (Math.random() - 0.5) * 50);
      ctx.stroke();
    }
  }
  // affiche collée, à moitié arrachée
  if (Math.random() < 0.7) {
    const x = Math.random() * (W - 90), y = H * (0.25 + Math.random() * 0.3);
    ctx.fillStyle = ['#e8dcc4', '#d94b3a', '#2a4c9a'][Math.floor(Math.random() * 3)]; ctx.fillRect(x, y, 80, 110);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; for (let k = 0; k < 6; k++) ctx.fillRect(x + 10, y + 14 + k * 15, 40 + Math.random() * 25, 4);
    ctx.fillStyle = base; ctx.beginPath(); ctx.moveTo(x + 80, y + 110); ctx.lineTo(x + 80, y + 60); ctx.lineTo(x + 45, y + 110); ctx.fill();   // coin arraché
  }
  addGrain(ctx, W, H, 22);
  return toTexture(c, true, true);
}

function shadeHex(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.min(255, ((n >> 16) & 255) * k | 0)},${Math.min(255, ((n >> 8) & 255) * k | 0)},${Math.min(255, (n & 255) * k | 0)})`;
}

/* ───────────────────────── src/textures/concrete.js ───────────────────────── */
/** Béton / pierre reconstituée des linteaux, appuis, bordures, soubassements de
 *  vitrine : gris chaud granuleux, traces de banche horizontales, coulures. */
function makeConcreteTextures() {
  const S = 512, c = makeCanvas(S, S), ctx = c.getContext('2d'), h = makeCanvas(S, S), hctx = h.getContext('2d');
  ctx.fillStyle = '#6e6b64'; ctx.fillRect(0, 0, S, S);
  hctx.fillStyle = '#808080'; hctx.fillRect(0, 0, S, S);
  // nuages de teinte : zones plus claires / plus sombres
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * S, y = Math.random() * S, r = 40 + Math.random() * 120;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const k = Math.random() < 0.5 ? '0,0,0' : '255,250,240';
    g.addColorStop(0, `rgba(${k},${0.05 + Math.random() * 0.1})`); g.addColorStop(1, `rgba(${k},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // reprises de banche : fines lignes horizontales, légèrement en creux
  for (let y = 40; y < S; y += 128 + Math.random() * 60) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, y, S, 2);
    hctx.fillStyle = '#5a5a5a'; hctx.fillRect(0, y, S, 3);
  }
  // coulures verticales
  for (let i = 0; i < 12; i++) {
    const x = Math.random() * S, y0 = Math.random() * S * 0.6, len = 40 + Math.random() * 200;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + len); g.addColorStop(0, 'rgba(30,26,22,0.35)'); g.addColorStop(1, 'rgba(30,26,22,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y0, 3 + Math.random() * 6, len);
  }
  // piqûres et cailloux affleurants
  for (let i = 0; i < 1400; i++) {
    const x = Math.random() * S, y = Math.random() * S, s = 1 + Math.random() * 3, v = 90 + Math.random() * 60 | 0;
    ctx.fillStyle = `rgba(${v},${v - 4},${v - 10},0.6)`; ctx.fillRect(x, y, s, s);
    hctx.fillStyle = Math.random() < 0.5 ? 'rgba(60,60,60,0.7)' : 'rgba(170,170,170,0.7)'; hctx.fillRect(x, y, s, s);
  }
  addGrain(ctx, S, S, 16); addGrain(hctx, S, S, 24);
  return { map: toTexture(c), normal: toTexture(heightToNormal(h, 1.6), false) };
}

/* ───────────────────────── src/textures/contact.js ───────────────────────── */
/** Tache d'ombre de contact : noir opaque au centre, transparent au bord.
 *  Seul le canal alpha compte, le matériau est noir. */
function makeContactBlobTexture() {
  const S = 128, c = makeCanvas(S, S), ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.4, 'rgba(0,0,0,0.72)');
  g.addColorStop(0.72, 'rgba(0,0,0,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  return toTexture(c, false, false);
}

/** Dégradé de bord : opaque en u = 0, transparent en u = 1. Pour la jonction
 *  mur / sol, qui est une ligne et non une tache. */
function makeContactEdgeTexture() {
  const W = 64, H = 4, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.22, 'rgba(0,0,0,0.55)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  return toTexture(c, false, false);
}

/* ───────────────────────── src/textures/lamppost.js ───────────────────────── */
/** Fonte peinte des lampadaires : vert-noir new-yorkais, coups de pinceau verticaux,
 *  éclats de peinture (fer nu, rouille) qui coulent vers le bas, crasse et croûte
 *  de sel sur le bas du fût (la neige salée des trottoirs remonte par éclaboussures).
 *  La texture couvre le fût une fois sur sa hauteur : v = 0 au pied, v = 1 en haut.
 *  Retourne { map, roughnessMap, normalMap }. */
function makeLamppostTextures() {
  const W = 256, H = 1024;
  const col = makeCanvas(W, H), c = col.getContext('2d');
  const hgt = makeCanvas(W, H), h = hgt.getContext('2d');
  const rgh = makeCanvas(W, H), r = rgh.getContext('2d');
  // fonds : peinture satinée
  c.fillStyle = '#1c2621'; c.fillRect(0, 0, W, H);
  h.fillStyle = '#b0b0b0'; h.fillRect(0, 0, W, H);
  r.fillStyle = '#7a7a7a'; r.fillRect(0, 0, W, H);       // rugosité ~0,48
  // coups de pinceau verticaux (couches repeintes au fil des ans)
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * W, y = Math.random() * H, len = 40 + Math.random() * 260, w = 1 + Math.random() * 3;
    const l = Math.random() < 0.5 ? 'rgba(40,54,46,0.18)' : 'rgba(10,14,12,0.2)';
    c.fillStyle = l; c.fillRect(x, y, w, len); c.fillRect(x - W, y, w, len);
    const v = Math.random() < 0.5 ? 190 : 150;
    h.fillStyle = `rgba(${v},${v},${v},0.12)`; h.fillRect(x, y, w, len);
  }
  // éclats : fer nu → rouille qui coule vers le bas (vers v = 0, donc vers le bas du canvas)
  const chip = (x, y, s) => {
    c.fillStyle = 'rgba(92,52,30,0.85)'; h.fillStyle = '#707070'; r.fillStyle = '#d0d0d0';
    for (const ctx of [c, h, r]) {
      ctx.beginPath();
      for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2, rr = s * (0.5 + Math.random() * 0.7); ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8); }
      ctx.fill();
    }
    c.fillStyle = 'rgba(58,62,64,0.9)'; c.beginPath(); c.arc(x, y, s * 0.35, 0, Math.PI * 2); c.fill();   // fer nu au cœur
    const g = c.createLinearGradient(0, y, 0, y + s * (4 + Math.random() * 10));
    g.addColorStop(0, 'rgba(110,56,26,0.5)'); g.addColorStop(1, 'rgba(110,56,26,0)');
    c.fillStyle = g; c.fillRect(x - s * 0.3, y, s * 0.6, s * 14);
  };
  for (let i = 0; i < 70; i++) {
    const y = Math.pow(Math.random(), 0.6) * H;          // plus d'éclats vers le bas (chocs, pelles, chiens)
    chip(Math.random() * W, y, 1.5 + Math.random() * 4.5);
  }
  // crasse puis croûte de sel sur le premier mètre (bas du canvas)
  const grime = c.createLinearGradient(0, H, 0, H * 0.72);
  grime.addColorStop(0, 'rgba(20,18,15,0.7)'); grime.addColorStop(1, 'rgba(20,18,15,0)');
  c.fillStyle = grime; c.fillRect(0, H * 0.72, W, H * 0.28);
  for (let i = 0; i < 900; i++) {
    const y = H - Math.pow(Math.random(), 2.2) * H * 0.22, x = Math.random() * W, s = 0.6 + Math.random() * 2.4;
    c.fillStyle = `rgba(200,202,198,${0.08 + Math.random() * 0.3})`; c.fillRect(x, y, s, s * (1 + Math.random() * 2));
    r.fillStyle = '#e0e0e0'; r.fillRect(x, y, s, s);
    h.fillStyle = '#c8c8c8'; h.fillRect(x, y, s, s);
  }
  const rg = r.createLinearGradient(0, H, 0, H * 0.75);          // bas plus mat (crasse)
  rg.addColorStop(0, 'rgba(230,230,230,0.6)'); rg.addColorStop(1, 'rgba(230,230,230,0)');
  r.fillStyle = rg; r.fillRect(0, H * 0.75, W, H * 0.25);
  addGrain(c, W, H, 10); addGrain(h, W, H, 14);

  const map = toTexture(col), roughnessMap = toTexture(rgh, false), normalMap = toTexture(heightToNormal(hgt, 3), false);
  for (const t of [map, roughnessMap, normalMap]) { t.wrapT = THREE.ClampToEdgeWrapping; }
  return { map, roughnessMap, normalMap };
}

/** Halo de lampe dans la neige : décroissance exponentielle, sans plateau. L'ancien
 *  halo réutilisait la texture de flocon (disque plein à 30 %), et à 10 m de large
 *  on voyait le bord du disque. */
function makeGlowTexture() {
  const S = 256, cv = makeCanvas(S, S), ctx = cv.getContext('2d'), img = ctx.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const rr = Math.hypot(x - S / 2 + 0.5, y - S / 2 + 0.5) / (S / 2);
    const a = rr >= 1 ? 0 : (0.75 * Math.exp(-rr * 7) + 0.25 * Math.exp(-rr * 2.6)) * (1 - rr * rr);
    const i = (y * S + x) * 4; d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = Math.min(255, a * 255);
  }
  ctx.putImageData(img, 0, 0);
  return toTexture(cv, true, false);
}

/* ───────────────────────── src/textures/photo.js ───────────────────────── */
/* =====================================================================
   2 ter. TEXTURES PHOTO (Poly Haven, CC0 — voir assets/textures/SOURCES.md)
   Le jeu démarre avec les textures générées en canvas, puis bascule sur les photos
   dès qu'elles sont chargées : aucune attente au lancement, et SECOURS automatique —
   si une image manque ou ne se charge pas, le matériau garde sa texture canvas.
   En file:// on ne tente même pas : le navigateur y considère chaque fichier comme
   une origine étrangère et refuse de l'envoyer à la carte graphique (texture noire,
   erreur de sécurité) — blizzard-nyc.html reste donc jouable, avec le canvas.
   Chaque jeu de textures = couleur (sRGB) + relief OpenGL + rugosité, en 1K.
   ===================================================================== */
const PHOTO_ENABLED = location.protocol !== 'file:' && !new URLSearchParams(location.search).has('nophoto');
const texLoader = new THREE.TextureLoader();
const photoCache = new Map();
let photoSetsDone = 0;                       // jeux terminés (chargés ou en échec), pour la progression

/** Charge (une seule fois) les trois cartes d'une texture : Promise<{ map, normal, rough }>. */
function loadPhotoSet(name) {
  if (!PHOTO_ENABLED) return Promise.reject(new Error('photos désactivées'));
  if (!photoCache.has(name)) {
    const one = (suffix, srgb) => new Promise((ok, ko) => texLoader.load(`assets/textures/${name}/${name}_${suffix}_1k.jpg`, t => {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      ok(t);
    }, undefined, ko));
    const p = Promise.all([one('diff', true), one('nor_gl', false), one('rough', false)]).then(([map, normal, rough]) => ({ map, normal, rough }));
    p.then(() => photoSetsDone++, () => photoSetsDone++);
    photoCache.set(name, p);
  }
  return photoCache.get(name);
}

/** Couleur moyenne (linéaire) d'une texture chargée : l'image est réduite à 16×16 dans
 *  un canvas. Sert à normaliser les photos de neige — chacune a été prise sous une
 *  lumière différente (snow_floor est grise, snow_03 brunâtre), alors que dans le jeu
 *  la neige doit garder le blanc bleuté choisi, quelle que soit la photo. */
function photoMean(tex) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(tex.image, 0, 0, 16, 16);
  const d = ctx.getImageData(0, 0, 16, 16).data, m = [0, 0, 0];
  for (let i = 0; i < d.length; i += 4) for (let k = 0; k < 3; k++) m[k] += Math.pow(d[i + k] / 255, 2.2);
  return new THREE.Vector3(m[0] / 256, m[1] / 256, m[2] / 256);
}

/** Copie d'un jeu (même image, répétition propre) : chaque usage a son échelle. */
function withRepeat(set, ru, rv) {
  const c = t => { const k = t.clone(); k.repeat.set(ru, rv); k.needsUpdate = true; return k; };
  return { map: c(set.map), normal: c(set.normal), rough: c(set.rough) };
}

/** Bascule un MeshStandardMaterial sur la photo `name` dès qu'elle est prête.
 *  ru / rv : répétition à appliquer (dépend des UV de la géométrie).
 *  `after(mat, set)` : réglages propres à l'usage (teinte, uniformes du shader…). */
function usePhoto(mat, name, ru, rv, after) {
  loadPhotoSet(name).then(set => {
    const s = withRepeat(set, ru, rv);
    mat.map = s.map; mat.normalMap = s.normal; mat.roughnessMap = s.rough; mat.roughness = 1;
    if (after) after(mat, s);
    mat.needsUpdate = true;
  }).catch(() => { /* secours : on garde la texture canvas */ });
}

/** Attend que TOUTES les photos demandées soient arrivées (ou en échec) ET appliquées aux
 *  matériaux : les .then des appelants passent avant nous, et certains en demandent
 *  d'autres en cascade (sol : 2e photo après la 1re) — on boucle tant que la liste grandit.
 *  onProgress(faits, total) ; renvoie false si le délai est dépassé (les retardataires
 *  basculeront plus tard, avec un petit à-coup). Sans photos (file://), résout aussitôt. */
export async function photosSettled(onProgress, timeoutMs = 8000) {
  const t0 = performance.now();
  for (;;) {
    const n = photoCache.size;
    await Promise.race([Promise.allSettled([...photoCache.values()]), new Promise(r => setTimeout(r, 120))]);
    onProgress?.(photoSetsDone, photoCache.size);
    await new Promise(r => setTimeout(r, 0));             // laisse les matériaux basculer
    if (photoSetsDone === photoCache.size && photoCache.size === n) return true;
    if (performance.now() - t0 > timeoutMs) return false;
  }
}

/* ───────────────────────── src/world/snowPhoto.js ───────────────────────── */
/* =====================================================================
   6 quinquies. NEIGE PHOTO SUR LES OBJETS (projection triplanaire)
   La neige posée sur les voitures, les rebords, les poubelles, les congères… était
   un blanc uni et lisse. Ces objets ont des UV de toutes sortes (sphères, nappes
   étirées sur 3 m, dômes) : plaquer la photo dessus la déformerait. On la PROJETTE
   donc depuis les trois axes du monde, en tuiles de 2 m, et on mélange les trois
   projections selon l'orientation de la surface (le dessus prend la vue d'en haut,
   les flancs les vues de côté). Idem pour le relief (mélange « whiteout »). Le grain
   de la neige est ainsi continu d'un objet à l'autre et à la bonne échelle partout.
   Même principe de secours que le reste : tant que la photo n'est pas chargée (ou en
   file://), le matériau reste en blanc uni.
   ===================================================================== */
const snowTri = {
  uSnowOn: { value: 0 }, uSnowMap: { value: grimeTex }, uSnowNrm: { value: grimeTex },
  uSnowScale: { value: 0.5 }, uSnowGain: { value: new THREE.Vector3(1, 1, 1) },
};
// une seule fois : les matériaux de neige partagent ces uniformes
loadPhotoSet('snow_02').then(set => {
  const m = photoMean(set.map), target = [0.9, 0.92, 0.96];
  snowTri.uSnowGain.value.set(...target.map((t, i) => Math.min(2.5, Math.max(0.4, t / Math.max(1e-3, m.getComponent(i))))));
  snowTri.uSnowMap.value = set.map; snowTri.uSnowNrm.value = set.normal; snowTri.uSnowOn.value = 1;
}).catch(() => {});

/** Greffe la neige photo triplanaire sur un MeshStandardMaterial de neige. */
function snowPhoto(mat) {
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, snowTri);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vSP; varying vec3 vSN;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vSP = (modelMatrix * vec4(transformed, 1.0)).xyz;
        vSN = normalize(mat3(modelMatrix) * objectNormal);`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vSP; varying vec3 vSN;
        uniform sampler2D uSnowMap, uSnowNrm; uniform float uSnowOn, uSnowScale; uniform vec3 uSnowGain;`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec3 snN = normalize(vSN) * (gl_FrontFacing ? 1.0 : -1.0);
        vec3 snW = pow(abs(snN), vec3(4.0)); snW /= (snW.x + snW.y + snW.z);
        vec2 snUX = vSP.zy * uSnowScale, snUY = vSP.xz * uSnowScale, snUZ = vSP.xy * uSnowScale;
        if (uSnowOn > 0.5) {
          vec3 snC = texture2D(uSnowMap, snUX).rgb * snW.x + texture2D(uSnowMap, snUY).rgb * snW.y + texture2D(uSnowMap, snUZ).rgb * snW.z;
          diffuseColor.rgb *= snC * uSnowGain;
        }`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        if (uSnowOn > 0.5) {
          // relief : mélange « whiteout » des trois projections, exprimé dans le monde puis ramené en repère vue
          vec3 tX = texture2D(uSnowNrm, snUX).xyz * 2.0 - 1.0, tY = texture2D(uSnowNrm, snUY).xyz * 2.0 - 1.0, tZ = texture2D(uSnowNrm, snUZ).xyz * 2.0 - 1.0;
          tX = vec3(tX.xy * 0.8 + snN.zy, abs(tX.z) * snN.x);
          tY = vec3(tY.xy * 0.8 + snN.xz, abs(tY.z) * snN.y);
          tZ = vec3(tZ.xy * 0.8 + snN.xy, abs(tZ.z) * snN.z);
          vec3 snWorld = normalize(tX.zyx * snW.x + tY.xzy * snW.y + tZ.xyz * snW.z);
          normal = normalize(mat3(viewMatrix) * snWorld);
        }`);
  };
  return mat;
}
