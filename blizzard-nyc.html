/** Boîte posée sur la portion [t0, t1] d'un segment de profil (u1,y1)→(u2,y2), décalée
 *  vers l'extérieur de `offset`, d'épaisseur `thick` et de largeur `w`. Sert pour les
 *  plaques et dômes de neige sur capot / malle / pied de vitre. */
function onSegment(list, seg, t0, t1, thick, w, offset, pillow = false) {
  const [[u1, y1], [u2, y2]] = seg, du = u2 - u1, dy = y2 - y1, len = Math.hypot(du, dy);
  let nu = -dy / len, ny = du / len; if (ny < 0) { nu = -nu; ny = -ny; }          // normale sortante (vers le haut)
  const L = (t1 - t0) * len;
  let g;
  if (pillow) {
    // dôme : demi-ellipsoïde dont la base épouse la tôle — épais au centre, nul aux bords
    g = new THREE.SphereGeometry(1, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    g.scale(w / 2, thick, L / 2); g.rotateX(Math.PI / 2);           // hauteur le long de +z (= la normale après le rotateX suivant)
  } else g = new THREE.BoxGeometry(w, L, thick);
  // l'axe « hauteur » (+z à ce stade) doit pointer sur la normale sortante (ny, nu).
  // L'ancien angle atan2(du, dy) n'était juste que pour le pare-brise : sur le capot,
  // la malle et la lunette il RETOURNAIT le dôme, enfoui dans la carrosserie — seul
  // son bord dépassait, en arc sombre sur le capot.
  g.rotateX(Math.atan2(-ny, nu));
  const tm = (t0 + t1) / 2;
  g.translate(nu * offset, y1 + dy * tm + ny * offset, u1 + du * tm);
  list.push(g);
}
// SphereGeometry / Lathe sont indexées ou non selon le cas : on aligne tout avant fusion
const mergeAny = list => mergeGeometries(list.map(g => g.index ? g.toNonIndexed() : g));
const box = (list, w, h, d, x, y, z) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); list.push(g); return g; };

/* ---------------------------------------------------------------------
   Coque par SECTIONS (loft)
   L'ancienne coque était le profil latéral extrudé tout droit : flancs plans et
   verticaux, habitacle aussi large que la caisse, coins à angle vif vus de dessus —
   une plaque découpée, pas une voiture. Ici on empile des sections transversales le
   long de la voiture ; chacune est calculée à partir du profil et de trois règles
   qui font « voiture » au premier coup d'œil :
   - flanc légèrement bombé (épaule vers 45 % de la hauteur, bas de caisse rentré) ;
   - au-dessus de la ceinture de caisse, l'habitacle RENTRE vers le toit (tumblehome) :
     les vitres latérales sont inclinées, le toit est bien plus étroit que la caisse ;
   - arêtes supérieures arrondies, capot et toit légèrement bombés, coins arrondis
     vus de dessus, boucliers galbés (« nez » refermé par des anneaux).
   Vitres, montants, feux et joints de portière sont des GROUPES de faces de cette
   même coque : ils épousent la tôle au lieu d'être des boîtes posées dessus.
   --------------------------------------------------------------------- */
const CROWN = 0.03, EDGE_R = 0.09, TUMBLE = 0.2, NOSE = 0.07;
const NS1 = 6, NS2 = 3, NC = 4, NT = 7, NK = 6;      // points : flanc bas, flanc haut, arrondi, dessus ; anneaux du nez
const HALF = NS1 + NS2 + NC + NT + 1;                   // points d'une demi-section
const PAINT = 0, GLASS = 1, TRIM = 2, HEAD = 3, TAIL = 4;

/** Hauteur de la silhouette (profil latéral) à l'abscisse u. */
function profileTop(P, u) {
  let y = -Infinity;
  for (let i = 0; i < P.body.length - 1; i++) {
    const [u1, y1] = P.body[i], [u2, y2] = P.body[i + 1];
    if (u1 === u2 || u < Math.min(u1, u2) - 1e-6 || u > Math.max(u1, u2) + 1e-6) continue;
    y = Math.max(y, y1 + (y2 - y1) * (u - u1) / (u2 - u1));
  }
  return y;
}
/** Point (u, y) dans le polygone du vitrage latéral ? */
function inPoly(u, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ui, yi] = poly[i], [uj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && u < (uj - ui) * (y - yi) / (yj - yi) + ui) inside = !inside;
  }
  return inside;
}

/** Prépare une fois par gabarit : bornes, ceinture de caisse et demi-largeur hw(u, y). */
function prepareProfile(P) {
  if (P.hwAt) return P;
  const uR = P.body[0][0], uF = P.body[P.body.length - 1][0], W2 = P.W / 2;
  const belt = P.glass[0][1], roofMax = Math.max(...P.body.map(p => p[1]));
  const span = belt - P.floor, beltDrop = 0.06 * 0.55 * 0.55;
  Object.assign(P, { uR, uF, belt, roofMax });
  P.hwAt = (u, y) => {
    const v = (y - P.floor) / span - 0.45;
    const h = y <= belt ? W2 - 0.06 * v * v                                   // flanc bombé
                        : W2 - beltDrop - (P.tumble ?? TUMBLE) * (y - belt) / (roofMax - belt);   // habitacle qui rentre
    const e = Math.min(1, (uF - u) / 0.45, (u - uR) / 0.45);                  // coins arrondis vus de dessus
    return h * (0.8 + 0.2 * Math.sqrt(Math.max(0, 1 - (1 - e) ** 2)));
  };
  return P;
}

/** Demi-section à l'abscisse u : du bas du flanc (passage de roue compris) jusqu'au milieu du dessus. */
function carSection(P, u) {
  let yBot = P.floor;
  for (const wu of P.wheels) { const d = u - wu; if (Math.abs(d) < P.archR) yBot = Math.max(yBot, P.floor + Math.sqrt(P.archR ** 2 - d * d)); }
  const yTop = profileTop(P, u), r = Math.min(EDGE_R, 0.4 * (yTop - yBot));
  const ySide = yTop - r, yBreak = Math.min(P.belt, yBot + 0.75 * (ySide - yBot));   // un rang pile sur la ceinture
  const pts = [];
  for (let k = 0; k < NS1; k++) { const y = yBot + (yBreak - yBot) * k / NS1; pts.push([P.hwAt(u, y), y]); }
  for (let k = 0; k < NS2; k++) { const y = yBreak + (ySide - yBreak) * k / NS2; pts.push([P.hwAt(u, y), y]); }
  const hwS = P.hwAt(u, ySide), x0 = Math.max(0.05, hwS - r);
  for (let k = 0; k < NC; k++) { const a = k / NC * Math.PI / 2; pts.push([x0 + (hwS - x0) * Math.cos(a), ySide + r * Math.sin(a)]); }
  for (let k = 0; k <= NT; k++) { const x = x0 * (1 - k / NT); pts.push([x, yTop + CROWN * (1 - (x / x0) ** 2)]); }
  return pts;
}

/** Coque complète : géométrie indexée avec un groupe par matériau (PAINT…TAIL). */
function buildHull(P) {
  // abscisses des sections : pas régulier + tous les points singuliers (cassures du
  // profil, bords des vitres et du montant, joints de portière, arcs de roue serrés)
  const us = [];
  for (let u = P.uR; u < P.uF; u += 0.09) us.push(u);
  us.push(P.uF, ...P.body.map(p => p[0]), ...P.glass.map(p => p[0]), P.pillar - 0.05, P.pillar + 0.05);
  for (const s of P.seams) us.push(s - 0.007, s + 0.007);
  for (let i = 1; i < P.body.length - 2; i++) if (P.body[i][0] === P.body[i + 1][0]) us.push(P.body[i][0] - 0.015, P.body[i][0] + 0.015);   // marche cabine / caisse : arête nette
  if (P.gap !== undefined) us.push(P.gap - 0.04, P.gap + 0.04);
  for (const wu of P.wheels) for (let k = -4; k <= 4; k++) us.push(wu + P.archR * Math.sin(k * Math.PI / 8));
  const sorted = us.filter(u => u >= P.uR && u <= P.uF).sort((a, b) => a - b);
  const slices = sorted.filter((u, i) => i === 0 || u - sorted[i - 1] > 0.01);
  if (P.uF - slices[slices.length - 1] > 1e-6) slices.push(P.uF);

  // section complète : côté droit de bas en haut, puis côté gauche en miroir
  const full = u => { const h = carSection(P, u), f = h.map(([x, y]) => [x, y, u]); for (let j = HALF - 2; j >= 0; j--) f.push([-h[j][0], h[j][1], u]); return f; };
  const secs = slices.map(full);
  // nez : la section d'extrémité se referme en quelques anneaux (bouclier galbé)
  const nose = (sec, dir) => {
    const yMid = (sec[0][1] + sec[HALF - 1][1]) / 2, out = [];
    for (let k = 1; k <= NK; k++) {
      // anneaux d'échelle régulière (facettes égales), bombé en quart de cercle
      const c = 1 - k / NK, du = dir * NOSE * Math.sqrt(1 - c * c);
      out.push(sec.map(([x, y, u]) => [x * c, yMid + (y - yMid) * c, u + du]));
    }
    return out;
  };
  const rings = [...nose(secs[0], -1).reverse(), ...secs, ...nose(secs[secs.length - 1], 1)];

  const N = 2 * HALF - 1, W2 = P.W / 2, pos = [], groups = [[], [], [], [], []];
  const yF = profileTop(P, P.uF), yR = profileTop(P, P.uR), yT = P.tailY ?? yR + 0.16;   // feux arrière : à hauteur de pare-chocs sur les utilitaires
  const inSeg = (seg, uc) => uc > Math.min(seg[0][0], seg[1][0]) + 0.02 && uc < Math.max(seg[0][0], seg[1][0]) - 0.02;
  for (const r of rings) for (const [x, y, u] of r) pos.push(x, y, u);
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < N; j++) {
    const j1 = (j + 1) % N, q = [rings[i][j], rings[i + 1][j], rings[i + 1][j1], rings[i][j1]];
    const xc = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, yc = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
    const uc = (q[0][2] + q[1][2] + q[2][2] + q[3][2]) / 4, ax = Math.abs(xc);
    const hj = j < HALF - 1 ? j : j === N - 1 ? -1 : 2 * HALF - 3 - j;         // indice dans la demi-section
    const isNose = i < NK || i >= rings.length - 1 - NK;
    const region = isNose ? 'nose' : hj < 0 ? 'under' : hj < NS1 + NS2 ? 'side' : hj < NS1 + NS2 + NC ? 'corner' : 'top';
    let m = PAINT;
    if (region === 'under') m = TRIM;
    else if (region === 'side' && inPoly(uc, yc, P.glass)) m = Math.abs(uc - P.pillar) < 0.05 ? TRIM : GLASS;   // vitres, montant B noir
    else if (region === 'top' && (inSeg(P.windshield, uc) || inSeg(P.rear, uc))) m = GLASS;                     // pare-brise, lunette
    else if (P.gap !== undefined && region !== 'nose' && region !== 'under' && Math.abs(uc - P.gap) < 0.04) m = TRIM;   // joint cabine / caisse
    else if (region === 'side' && yc < P.belt - 0.03 && P.seams.some(s => Math.abs(uc - s) < 0.008)) m = TRIM;  // joints de portière
    else if (uc > P.uF - 0.3 && yc > yF - 0.12 && yc < yF + 0.1 && ax > 0.34 * W2 && ax < 0.96 * W2) m = HEAD;
    else if (uc < P.uR + 0.24 && Math.abs(yc - yT) < 0.14 && ax > 0.42 * W2) m = TAIL;
    else if ((uc > P.uF - 0.4 || uc < P.uR + 0.4) && yc < P.floor + 0.1) m = TRIM;                             // bas des boucliers
    const a = i * N + j, b = (i + 1) * N + j, c = (i + 1) * N + j1, d = i * N + j1;
    groups[m].push(a, c, b, a, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const idx = []; let start = 0;
  groups.forEach((list, mi) => { if (list.length) { g.addGroup(start, list.length, mi); idx.push(...list); start += list.length; } });
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Pneu au flanc arrondi (révolution), axe le long de X. */
function tireGeometry(R, w) {
  const pts = [new THREE.Vector2(R * 0.6, -w / 2)];
  for (let k = 0; k <= 8; k++) {
    const a = -Math.PI / 2 + Math.PI * k / 8;
    pts.push(new THREE.Vector2(R - 0.05 + 0.05 * Math.pow(Math.cos(a), 0.4), (w / 2) * Math.sin(a)));   // bande de roulement plate, épaules rondes
  }
  pts.push(new THREE.Vector2(R * 0.6, w / 2));
  const g = new THREE.LatheGeometry(pts, 20); g.rotateZ(Math.PI / 2);
  return g;
}

/** Construit la carrosserie dans le groupe g. Retourne le profil (avec hwAt) pour les extras. */
function buildCarBody(g, kind, paint, snowDepth, tailMat = carMats.tail) {
  const P = prepareProfile(CAR_PROFILES[kind]), W = P.W, yF = profileTop(P, P.uF);
  const dark = [], snow = [];

  if (!paint.userData.salted) { saltPaint(paint, P); paint.userData.salted = true; }   // MAT.taxi : partagé, une seule fois
  g.add(shadowed(new THREE.Mesh(buildHull(P), [paint, carGlassMat, MAT.iron, carMats.head, tailMat])));

  // rétroviseurs, poignées (posés sur la tôle grâce à hwAt), plancher sombre entre les
  // roues : les passages de roue traversent la coque, il ne faut pas voir au travers
  const uM = P.glass[0][0] - 0.3;
  for (const sx of [-1, 1]) {
    box(dark, 0.1, 0.09, 0.17, sx * (P.hwAt(uM, P.belt + 0.08) + 0.06), P.belt + 0.08, uM);
    for (const su of P.seams.slice(0, P.seams.length > 2 ? 2 : 1)) {
      const hu = su - 0.4, hy = P.floor + 0.55;
      box(dark, 0.02, 0.03, 0.14, sx * (P.hwAt(hu, hy) + 0.008), hy, hu);
    }
  }
  box(dark, W - 0.52, P.archR, P.uF - P.uR - 0.4, 0, P.floor + P.archR / 2 - 0.05, (P.uF + P.uR) / 2);
  box(dark, 0.3 * W, 0.11, 0.03, 0, yF - 0.075, P.uF + NOSE * 0.84);                       // calandre, entre les phares
  const yRm = P.plateY ?? (P.floor + profileTop(P, P.uR)) / 2;
  g.add(new THREE.Mesh(box([], 0.32, 0.15, 0.02, 0, yRm, P.uR - NOSE - 0.004), carMats.plate));

  // --- Roues : pneu + enjoliveur, toutes fusionnées
  const tires = [], hubs = [];
  for (const wu of P.wheels) for (const sx of [-1, 1]) {
    const t = tireGeometry(P.wheelR, 0.22); t.translate(sx * (W / 2 - 0.13), P.floor, wu); tires.push(t);
    const h = new THREE.CylinderGeometry(P.wheelR * 0.56, P.wheelR * 0.56, 0.2, 14); h.rotateZ(Math.PI / 2); h.translate(sx * (W / 2 - 0.13), P.floor, wu); hubs.push(h);
  }
  g.add(shadowed(new THREE.Mesh(mergeAny(tires), MAT.iron)));
  g.add(new THREE.Mesh(mergeGeometries(hubs), MAT.metal));

  // --- Neige : toit, capot, malle, bas de pare-brise et de lunette ; congères contre les flancs
  // (toit plus étroit que la caisse désormais : le manteau suit la largeur réelle du toit)
  const [r0, r1] = P.roof, rm = (r0 + r1) / 2, roofY = profileTop(P, rm) + CROWN, roofW = 2 * P.hwAt(rm, roofY - CROWN);
  const dome = (w, h, L, x, y, z) => { const d = new THREE.SphereGeometry(1, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2); d.scale(w / 2, h, L / 2); d.translate(x, y, z); snow.push(d); };
  const hRoof = 0.2 + 0.24 * snowDepth, rl = r1 - r0;
  dome(roofW + 0.04, hRoof, rl + 0.2, 0, roofY - 0.07, rm);                                  // manteau principal, déborde un peu du toit
  dome(roofW * 0.7, hRoof * 0.85, rl * 0.7, (Math.random() - 0.5) * 0.25, roofY - 0.02, rm + (Math.random() - 0.5) * 0.4 * rl);
  const hHood = 0.1 + 0.12 * snowDepth;
  onSegment(snow, P.hood, 0.0, 1.0, hHood, W - 0.16, -0.01, true);
  onSegment(snow, P.hood, 0.25, 0.95, hHood * 0.8, W * 0.58, 0.04, true);
  if (P.trunk) { onSegment(snow, P.trunk, 0.0, 1.0, hHood, W - 0.16, -0.01, true); onSegment(snow, P.trunk, 0.1, 0.8, hHood * 0.8, W * 0.6, 0.04, true); }
  onSegment(snow, P.windshield, -0.05, 0.55, 0.13, W - 0.36, 0.01, true);                    // bourrelet au pied du pare-brise
  onSegment(snow, P.rear, -0.05, 0.6, 0.13, W - 0.4, 0.01, true);
  // bourrelet contre les flancs : une nappe continue à profil en cloche, adossée à la
  // caisse (sa moitié intérieure est cachée dedans), bouts effilés, hauteur ondulée.
  // Un demi-ellipsoïde allongé se lisait comme un aileron, un chapelet de sphères
  // comme des boules de coton.
  for (const sx of [-1, 1]) {
    const bw = 0.9, bl = P.L + 0.4, bank = new THREE.PlaneGeometry(bw, bl, 8, 28); bank.rotateX(-Math.PI / 2);
    const p = bank.attributes.position, hB = 0.28 + 0.18 * snowDepth, seedB = Math.random() * 50;
    for (let i = 0; i < p.count; i++) {
      const lx = p.getX(i), lz = p.getZ(i), e = Math.min(1, (bl / 2 - Math.abs(lz)) / 0.9);
      const n = smoothNoise(lz * 0.9 + seedB, sx * 3);                                  // mottes : hauteur ET largeur varient
      const a = (2 * lx) / (bw * (0.65 + 0.45 * n));
      p.setY(i, hB * (0.45 + 0.8 * n) * Math.pow(Math.max(0, 1 - a * a), 1.6) * Math.pow(Math.max(0, e), 0.7));
    }
    bank.translate(sx * (W / 2 + 0.02), 0, 0); snow.push(bank);
  }

  // La neige n'est jamais plane : on bosselle les faces supérieures avec un bruit
  // lisse (épaisseur inégale, bourrelets), les flancs restent collés à la tôle.
  const nrm = new THREE.Vector3(), seedN = Math.random() * 40;
  for (const sg of snow) {
    const pos = sg.attributes.position, nor = sg.attributes.normal;
    for (let i = 0; i < pos.count; i++) {
      nrm.fromBufferAttribute(nor, i);
      const up = Math.max(0, nrm.y);
      const px = pos.getX(i), pz = pos.getZ(i);
      const d = (smoothNoise(px * 2.6 + seedN, pz * 2.2) - 0.5) * 0.16 + (smoothNoise(px * 8 + seedN, pz * 8) - 0.5) * 0.04;
      pos.setXYZ(i, px + nrm.x * d * up, pos.getY(i) + nrm.y * d * up, pz + nrm.z * d * up);
    }
    sg.computeVertexNormals();
  }

  g.add(new THREE.Mesh(mergeAny(dark), MAT.iron));
  const sn = new THREE.Mesh(mergeAny(snow), MAT.snow); sn.receiveShadow = true; g.add(sn);
  return P;
}

function buildTaxi(x, z, rotY = 0) {
  const g = new THREE.Group();
  const tailMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.4, 0.15, 0.1) });   // feux allumés (bloom)
  const P = buildCarBody(g, 'sedan', MAT.taxi, 1, tailMat);
  // bandeau damier / « NYC TAXI » sur les portières, entre les passages de roue ;
  // plan subdivisé dont chaque sommet est plaqué sur le flanc bombé
  for (const s of [-1, 1]) {
    const pg = new THREE.PlaneGeometry(2.0, 0.5, 1, 8); pg.rotateY(s * Math.PI / 2); pg.translate(0, P.floor + 0.38, 0);
    const p = pg.attributes.position;
    for (let i = 0; i < p.count; i++) p.setX(i, s * (P.hwAt(p.getZ(i), p.getY(i)) + 0.006));
    g.add(new THREE.Mesh(pg, MAT.taxiSide));
  }
  const topSign = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.16, 0.24), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.3, 0.7) })); topSign.position.set(0, P.roofMax + CROWN + 0.08, 0.1); g.add(topSign);
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  addCollider(x, z, P.W / 2 + 0.34, P.L / 2 + 0.4);
  addContactShadow(x, z, P.W / 2 + 0.45, P.L / 2 + 0.35, 0.6, rotY, 6);
  addSubject({ label: 'Un taxi jaune enseveli', value: 0.9, object: g });
}

/** Voiture garée le long du trottoir, ensevelie : sur l'image de référence les
 *  voitures ne sont plus que des volumes sombres coiffés d'une épaisse couche de
 *  neige, roues à moitié prises dans la congère du chasse-neige. C'est cette file
 *  de véhicules qui donne l'échelle et la profondeur de la rue. */
function buildParkedCar(x, z, rotY, bodyColor, snowDepth = 1, kind = 'sedan') {
  const g = new THREE.Group();
  // vernis (clearcoat) : une 2e couche brillante par-dessus la peinture — les lampadaires y glissent en reflets nets
  const paint = new THREE.MeshPhysicalMaterial({ color: bodyColor, roughness: 0.4, metalness: 0.45, clearcoat: 1, clearcoatRoughness: 0.1 });
  const P = buildCarBody(g, kind, paint, snowDepth);
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  addCollider(x, z, P.W / 2 + 0.34, P.L / 2 + 0.4);   // jusqu'aux congères latérales et aux pare-chocs
  addContactShadow(x, z, P.W / 2 + 0.45, P.L / 2 + 0.35, 0.6, rotY, 6);
  addSubject({ label: 'Une voiture ensevelie sous la neige', value: 0.4, object: g });
}

/* ---------------------------------------------------------------------
   VÉHICULES UTILITAIRES garés dans la neige : camionnette, camion de livraison,
   ambulance, camion de glaces. Même coque par sections que les voitures (profils
   van / truck / ambulance / icecream), même neige, même sel, même givre ; en plus
   une décoration plaquée sur chaque flanc et quelques accessoires.
   --------------------------------------------------------------------- */
const liveryTex = {};
const SPECIALS = {
  van:       { color: 0xdfe2e4, livery: makeVanLivery,       area: [-2.2, 1.2, 1.05, 1.95] },
  truck:     { color: 0xeeeeea, livery: makeTruckLivery,     area: [-3.25, 0.35, 1.15, 2.95] },
  ambulance: { color: 0xf0f0ec, livery: makeAmbulanceLivery, area: [-3.0, 0.8, 0.95, 2.55] },
  icecream:  { color: 0xf4f2ee, livery: makeIceCreamLivery,  area: [-2.75, 1.15, 0.9, 2.5] },
};
// rampe lumineuse de l'ambulance : deux matériaux qui alternent (rouge / blanc), animés dans updateVehicles
const beaconMats = [new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 0.02, 0.02) }), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.25, 0.25, 0.25) })];

/** Plan de décoration plaqué sur le flanc (chaque sommet suit hwAt) ; lisible des deux côtés. */
function liveryPlanes(g, P, tex, [u0, u1, y0, y1]) {
  const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.45, roughness: 0.5, metalness: 0 });
  for (const s of [-1, 1]) {
    const pg = new THREE.PlaneGeometry(u1 - u0, y1 - y0, 24, 6); pg.rotateY(s * Math.PI / 2);
    pg.translate(0, (y0 + y1) / 2, (u0 + u1) / 2);
    const p = pg.attributes.position;
    for (let i = 0; i < p.count; i++) p.setX(i, s * (P.hwAt(p.getZ(i), p.getY(i)) + 0.008));
    pg.computeVertexNormals();
    g.add(new THREE.Mesh(pg, mat));
  }
}

function buildSpecialVehicle(kind, x, z, rotY, snowDepth = 1) {
  const S = SPECIALS[kind], g = new THREE.Group();
  const paint = new THREE.MeshPhysicalMaterial({ color: S.color, roughness: 0.4, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.12 });
  const P = buildCarBody(g, kind, paint, snowDepth);
  liveryTex[kind] = liveryTex[kind] || S.livery();
  liveryPlanes(g, P, liveryTex[kind], S.area);
  const extra = [];
  if (kind === 'ambulance') {
    // rampe sur la cabine + feux d'angle sur la cellule, en alternance rouge / blanc
    const yCab = profileTop(P, 1.2) + CROWN;
    for (let k = 0; k < 4; k++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.12, 0.26), beaconMats[k % 2]);
      m.position.set(-0.6 + k * 0.4, yCab + 0.07, 1.25); g.add(m);
    }
    for (const sx of [-1, 1]) for (const [u, k] of [[0.85, 0], [-3.05, 1]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.12), beaconMats[(k + (sx > 0 ? 1 : 0)) % 2]);
      m.position.set(sx * (P.W / 2 - 0.1), P.roofMax - 0.12, u); g.add(m);
    }
  } else if (kind === 'icecream') {
    // cornet géant sur l'avant du toit (gaufre + volute), à moitié enneigé
    const cone = new THREE.ConeGeometry(0.28, 0.75, 16); cone.rotateX(Math.PI); cone.translate(0, P.roofMax + 0.6, 0.8);
    const swirl = []; for (const [dy, r] of [[1.1, 0.34], [1.33, 0.26], [1.51, 0.17], [1.65, 0.08]]) { const sp = new THREE.SphereGeometry(r, 14, 10); sp.scale(1, 0.75, 1); sp.translate(0, P.roofMax + dy, 0.8); swirl.push(sp); }
    g.add(new THREE.Mesh(cone, new THREE.MeshStandardMaterial({ color: 0xc88a48, roughness: 0.8 })));
    const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.12, 0.3, 10), MAT.metal); stand.position.set(0, P.roofMax + 0.12, 0.8); g.add(stand);   // socle : le cornet ne tient pas sur sa pointe
    g.add(new THREE.Mesh(mergeGeometries(swirl), new THREE.MeshStandardMaterial({ color: 0xf6efe4, roughness: 0.6 })));
  } else if (kind === 'truck') {
    // porte roulante à l'arrière de la caisse
    const door = new THREE.Mesh(new THREE.PlaneGeometry(P.W * 0.8, 2.1), MAT.shutter); door.rotation.y = Math.PI; door.position.set(0, 1.95, P.uR - NOSE - 0.01); g.add(door);
  }
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  addCollider(x, z, P.W / 2 + 0.34, P.L / 2 + 0.4);
  addContactShadow(x, z, P.W / 2 + 0.45, P.L / 2 + 0.35, 0.62, rotY, 8);
  const sub = SPECIAL_SUBJECTS[kind];
  addSubject({ label: sub.label, value: sub.value, object: g, moment: sub.moment });
}

// sujets photo des utilitaires : l'ambulance vaut surtout gyrophares ALLUMÉS (instant à saisir)
let beaconLit = false;
const SPECIAL_SUBJECTS = {
  ambulance: { label: 'Une ambulance dans la tempête', value: 0.95, moment: () => (beaconLit ? { pts: 5, why: 'gyrophares allumés' } : { pts: 0, why: 'gyrophares éteints au déclenchement' }) },
  icecream:  { label: 'Un camion de glaces sous le blizzard', value: 0.9, moment: () => ({ pts: 3, why: 'un marchand de glaces en pleine tempête' }) },
  truck:     { label: 'Un camion de livraison enneigé', value: 0.6 },
  van:       { label: "Une camionnette d'artisan", value: 0.55 },
};

/** Animation (seulement des couleurs de matériau : les matrices restent figées).
 *  Gyrophares de l'ambulance : alternance rouge / blanc, deux éclats rapides par seconde. */
function updateVehicles(t) {
  const ph = (t * 2.2) % 1, a = ph < 0.18 || (ph > 0.3 && ph < 0.46);
  beaconLit = a;
  beaconMats[0].color.setRGB(a ? 3.2 : 0.3, a ? 0.2 : 0.02, a ? 0.12 : 0.02);
  beaconMats[1].color.setScalar(a ? 0.25 : 2.6);
}

buildTaxi(ROAD_HALF - 1.3, 4.5, 0.02);
buildTaxi(-(ROAD_HALF - 1.3), -40, -0.03);
buildTaxi(ROAD_HALF - 1.3, -62, 0.01);

// File de voitures garées des deux côtés, avec des trous — une rangée continue
// ferait décor de jeu ; les intervalles irréguliers et le mélange de gabarits font vrai.
const CAR_COLORS = [0x1b232e, 0x2c2320, 0x353a41, 0x1f2a33, 0x101215, 0x4a1f1b, 0x28322c];
{
  let ci = 0;
  const kinds = ['sedan', 'suv', 'sedan', 'hatch', 'sedan', 'suv', 'hatch', 'sedan', 'suv'];
  const park = (side, z, snowDepth) => {
    // les voitures garées regardent toutes dans le sens de la circulation de leur côté
    buildParkedCar(side * (ROAD_HALF - 1.3), z, (side < 0 ? 0 : Math.PI) + side * 0.01 * ((ci % 3) - 1),
      CAR_COLORS[ci % CAR_COLORS.length], snowDepth, kinds[ci % kinds.length]); ci++;
  };
  // emplacements de la rue ; à gauche, on laisse la devanture du deli dégagée (et le point de vue « z=deli » libre)
  const slots = [...[-9, -21.5, -34, -53, -75].map(z => [1, z]),
                 ...[-15, -28, -47, -68].filter(z => Math.abs(z - deliZ) > 7).map(z => [-1, z])];
  // les 4 utilitaires prennent 4 emplacements tirés au hasard À CHAQUE LANCEMENT (mélange de
  // Fisher-Yates) : on les croise un peu partout d'une partie à l'autre. Tous les emplacements
  // sont espacés d'au moins 12,5 m et à 7 m au moins des taxis : même le camion (7 m) y tient.
  const order = slots.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const specialAt = new Map(['van', 'truck', 'icecream', 'ambulance'].map((k, n) => [order[n], k]));
  slots.forEach(([side, z], i) => {
    const depth = 0.8 + Math.random() * 0.5, sp = specialAt.get(i);
    if (sp) buildSpecialVehicle(sp, side * (ROAD_HALF - 1.35), z, side < 0 ? 0 : Math.PI, depth); else park(side, z, depth);
  });
}

let neonMat;
{
  const signW = 1.55, signH = 3.1, sx = -FACADE_X + 0.2 + signW / 2, sy = 6.4;
  neonMat = new THREE.MeshBasicMaterial({ map: neonTex, side: THREE.DoubleSide, color: new THREE.Color(1.9, 1.9, 1.9) });

  const sign2 = sign.clone(); sign2.position.z = neonZ - 0.2; sign2.rotation.y = Math.PI; scene.add(sign2);
  for (const yy of [sy + signH / 2 + 0.08, sy - signH / 2 - 0.08]) {
    const br = new THREE.Mesh(new THREE.BoxGeometry(signW + 0.3, 0.07, 0.07), MAT.iron); br.position.set(-FACADE_X + 0.15 + signW / 2, yy, neonZ - 0.1); scene.add(br);
  }
  const signSnow = new THREE.Mesh(new RoundedBoxGeometry(signW, 0.2, 0.34, 2, 0.08), MAT.snow); signSnow.position.set(sx, sy + signH / 2 + 0.18, neonZ - 0.1); scene.add(signSnow);

  // portée 13 m (et non 24) : sur le modèle le rouge du néon reste une flaque locale. À 24 m
  // il atteignait le lampadaire suivant et en projetait l'ombre (congère, socle) vers le
  // joueur : des disques sombres bien visibles depuis que le trottoir est blanc
  const red = new THREE.SpotLight(0xff2e1c, 220, 13, 1.25, 0.9, 2);

  red.target.position.set(-FACADE_X + 3.5, 0, neonZ + 1.5); scene.add(red); scene.add(red.target);
  red.castShadow = true; red.shadow.mapSize.set(1024, 1024); red.shadow.bias = -0.0005; red.shadow.radius = 4;
  const redFill = new THREE.PointLight(0xff3a24, 26, 16, 2); redFill.position.set(-FACADE_X + 1.2, sy, neonZ); scene.add(redFill);
  const neonFlicker = { lights: [red, redFill], base: [220, 26], neon: true, seed: 0, k: 1 };
  flickerLights.push(neonFlicker);

    moment: () => (neonFlicker.k > 0.8 ? { pts: 2, why: 'néon bien allumé' } : { pts: 0, why: 'néon saisi pendant un clignotement' }) });

/* =====================================================================
   10. LUMIÈRE D'AMBIANCE FROIDE + lune + lueur de la ville + gratte-ciel lointains
   ===================================================================== */
// Ciel de neige : la couche nuageuse renvoie la lueur de la ville vers le sol.
// C'est cette lumière-là — pas les lampadaires — qui fait « lire » la neige comme
// blanche ; les briques, elles, restent sombres (roughness élevée, albédo faible).
scene.add(new THREE.HemisphereLight(0x4a5f84, 0x1c2431, 0.24));   // couleur « sol » relevée : aucune sous-face ne doit rendre noir pur
const moon = new THREE.DirectionalLight(0x8ea6d4, 0.17);
moon.position.set(-25, 45, -20); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -45; moon.shadow.camera.right = 45; moon.shadow.camera.top = 45; moon.shadow.camera.bottom = -45;
moon.shadow.camera.near = 5; moon.shadow.camera.far = 140; moon.shadow.bias = -0.0008; moon.shadow.radius = 3;
moon.target.position.set(0, 0, -15); scene.add(moon); scene.add(moon.target);
const cityGlow = new THREE.PointLight(0x7488bd, 90, 120, 2); cityGlow.position.set(0, 20, STREET_Z_MIN - 5); scene.add(cityGlow);

// Tours au bout de la rue. À 130–170 m, le brouillard les effaçait complètement : seules
// leurs fenêtres flottaient dans le vide. Sur le modèle, on devine au contraire de hautes
// SILHOUETTES bleutées dans la brume. Leur matériau calcule donc la couleur du ciel juste
// derrière (mêmes uniformes que la voûte céleste) et la fonce un peu : la silhouette reste
// toujours lisible, plus claire au pied (brume épaisse) qu'au sommet, sans jamais pouvoir
// se découper plus claire que le ciel.
{
  const towerMat = new THREE.ShaderMaterial({
    uniforms: { uHorizon: skyMat.uniforms.uHorizon, uTop: skyMat.uniforms.uTop },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `
      uniform vec3 uHorizon, uTop; varying vec3 vW;
      void main(){
        float h = normalize(vW - cameraPosition).y;
        vec3 sky = mix(uHorizon, uTop, smoothstep(0.08, 0.95, h)) + uHorizon * vec3(0.9, 1.0, 1.25) * (pow(max(0.0, 1.0 - abs(h)), 10.0) + 0.9 * pow(max(0.0, 1.0 - abs(h)), 4.0));   // même formule que la voûte
        float haze = exp(-max(vW.y, 0.0) / 45.0);                 // brume plus épaisse au pied des tours
        gl_FragColor = vec4(sky * vec3(0.86, 0.94, 1.08) * mix(0.5, 0.85, haze), 1.0);
      }`,
  });
  const winGeo = new THREE.PlaneGeometry(1.1, 1.6);
  const wins = [];
  for (let i = 0; i < 13; i++) {
    // plus hautes qu'avant (45–95 m), et un tiers d'entre elles dans l'axe de la rue, là où on les voit
    const w = rnd(14, 26), h = rnd(70, 140), x = i % 3 === 0 ? rnd(-22, 22) : rnd(-80, 80), z = STREET_Z_MIN - rnd(35, 85);
    const t = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), towerMat); t.position.set(x, h / 2, z); scene.add(t);
    const cols = Math.floor(w / 3), rows = Math.floor(h / 3.5);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (Math.random() < 0.35) {
      const m = new THREE.Matrix4().makeTranslation(x - w / 2 + (c + 0.5) * (w / cols), (r + 0.5) * (h / rows), z + w / 2 + 0.05); wins.push(m);
    }
  }
  const inst = new THREE.InstancedMesh(winGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(0.22, 0.2, 0.17), fog: false }), wins.length);
  wins.forEach((m, i) => inst.setMatrixAt(i, m)); scene.add(inst);
}

/* ───────────────────────── src/world/intersection.js ───────────────────────── */
/* =====================================================================
   10 bis. CARREFOUR LOINTAIN : rue transversale + feux de circulation
   Au bout de la rue (z ≈ −96), une transversale enneigée et deux potences
   façon New York : mât d'angle, bras horizontal au-dessus de la voie, caisson
   olive à trois lampes tourné vers le joueur, signal piéton sur le mât.
   Les lampes sont hors brouillard mais volontairement ternes, avec un halo :
   à 100 m dans la tempête, un feu n'est qu'une tache de couleur.
   ===================================================================== */
const CROSS_Z = STREET_Z_MIN - 6;          // axe de la transversale
const CROSS_W = 13;

// chaussée transversale + ses trottoirs, en neige tassée
{
  const road = new THREE.Mesh(new THREE.PlaneGeometry(150, CROSS_W), new THREE.MeshStandardMaterial({ color: 0xb4bdcb, roughness: 1 }));
  road.rotation.x = -Math.PI / 2; road.position.set(0, 0.02, CROSS_Z); road.receiveShadow = true; scene.add(road);
  for (const s of [-1, 1]) {
    const walk = new THREE.Mesh(new THREE.PlaneGeometry(150, 4), MAT.snow);
    walk.rotation.x = -Math.PI / 2; walk.position.set(0, 0.16, CROSS_Z + s * (CROSS_W / 2 + 2)); scene.add(walk);
  }
}

const signalMats = {
  housing: new THREE.MeshStandardMaterial({ color: 0x5a5212, roughness: 0.6, metalness: 0.3 }),
  off: new THREE.MeshBasicMaterial({ color: 0x1a1210, fog: false }),
};
const LAMP_COLORS = { red: new THREE.Color(1.5, 0.12, 0.06), yellow: new THREE.Color(1.5, 0.9, 0.12), green: new THREE.Color(0.1, 1.3, 0.45) };
const signals = [];                         // { lamps: {red, yellow, green}, halos, ped }

function buildSignal(side) {
  const g = new THREE.Group();
  const px = side * (ROAD_HALF + 1.2), pz = CROSS_Z + CROSS_W / 2 + 1.0, armLen = ROAD_HALF + 1.2 - 2.2;
  const pole = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 6.2, 12), MAT.metal)); pole.position.set(px, 3.1, pz); g.add(pole);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.5, 12), MAT.metal); base.position.set(px, 0.25, pz); g.add(base);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, armLen, 10), MAT.metal);
  arm.rotation.z = Math.PI / 2; arm.position.set(px - side * armLen / 2, 5.85, pz); g.add(arm);
  const brace = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, armLen * 0.7, 6), MAT.metal);
  brace.position.set(px - side * armLen * 0.35, 6.2, pz); brace.rotation.z = Math.PI / 2 + side * 0.18; g.add(brace);
  const snowArm = new THREE.Mesh(new THREE.BoxGeometry(armLen, 0.08, 0.14), MAT.snow); snowArm.position.set(px - side * armLen / 2, 5.95, pz); g.add(snowArm);

  // caisson à trois lampes, face au joueur (+Z), avec casquettes
  const hx = px - side * armLen, hy = 5.05;
  const head = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.36, 1.1, 0.3), signalMats.housing)); head.position.set(hx, hy, pz); g.add(head);
  const headSnow = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.34), MAT.snow); headSnow.position.set(hx, hy + 0.6, pz); g.add(headSnow);
  const lamps = {}, halos = {};
  [['red', 0.34], ['yellow', 0], ['green', -0.34]].forEach(([name, dy]) => {
    const lamp = new THREE.Mesh(new THREE.CircleGeometry(0.12, 18), signalMats.off.clone()); lamp.position.set(hx, hy + dy, pz + 0.16); g.add(lamp);
    const visor = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.16, 12, 1, true, Math.PI, Math.PI), signalMats.housing);
    visor.rotation.x = Math.PI / 2; visor.position.set(hx, hy + dy + 0.02, pz + 0.22); g.add(visor);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: flakeTex, color: LAMP_COLORS[name], transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    halo.scale.set(1.6, 1.6, 1); halo.position.set(hx, hy + dy, pz + 0.3); g.add(halo);
    lamps[name] = lamp; halos[name] = halo;
  });

  // signal piéton sur le mât : main orange / silhouette blanche
  const pedBox = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.36, 0.22), signalMats.housing); pedBox.position.set(px - side * 0.05, 2.7, pz + 0.02); g.add(pedBox);
  const ped = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.2), new THREE.MeshBasicMaterial({ color: 0xff7a1a, fog: false })); ped.position.set(px - side * 0.05, 2.7, pz + 0.14); g.add(ped);

  scene.add(g);
  signals.push({ lamps, halos, ped });
  addSubject({ label: 'Les feux du carrefour', value: 0.7, glows: true, object: g,
    moment: () => (trafficState === 'red' ? { pts: 4, why: 'feu au rouge' } : trafficState === 'yellow' ? { pts: 2, why: "feu à l'orange" } : null) });
}
buildSignal(-1);
buildSignal(1);

// Cycle : rouge 9 s → vert 7 s → orange 2,5 s. Les deux caissons regardent le joueur,
// donc affichent la même couleur (c'est le même sens de circulation).
const CYCLE = [['red', 9], ['green', 7], ['yellow', 2.5]], CYCLE_T = CYCLE.reduce((a, c) => a + c[1], 0);
let trafficState = 'red';                 // lu par la notation des photos
function updateTrafficLights(t) {
  let u = t % CYCLE_T, state = 'red';
  for (const [name, d] of CYCLE) { if (u < d) { state = name; break; } u -= d; }
  trafficState = state;
  for (const s of signals) {
    for (const name in s.lamps) {
      const on = name === state;
      s.lamps[name].material.color.copy(on ? LAMP_COLORS[name] : signalMats.off.color);
      s.halos[name].material.opacity = on ? 0.32 : 0;
    }
    s.ped.material.color.setHex(state === 'red' ? 0xf4f4ff : 0xff7a1a);
  }
}

/* ───────────────────────── src/fx/snow.js ───────────────────────── */
/* =====================================================================
   11. BLIZZARD : flocons éclairés par les lampadaires (shader personnalisé)
   ===================================================================== */
const WIND = new THREE.Vector3(1.4, 0, 3.6);
const N_LAMPS = 12;
// on ne garde que les lampes proches du joueur (mises à jour à chaque frame)
const lampPosArr = new Array(N_LAMPS).fill(0).map(() => new THREE.Vector3(0, -100, 0));
const lampColArr = new Array(N_LAMPS).fill(0).map(() => new THREE.Color(0, 0, 0));

const snowUniforms = {
  uMap: { value: flakeTex }, uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() },
  uScale: { value: 1 }, uFogColor: { value: FOG_COLOR }, uFogDensity: { value: FOG_DENSITY },
  uLampPos: { value: lampPosArr }, uLampCol: { value: lampColArr }, uOpacity: { value: 1 },
};
const snowMat = new THREE.ShaderMaterial({
  uniforms: snowUniforms, transparent: true, depthWrite: false,
  vertexShader: `
    attribute float aSize; attribute float aSeed;
    uniform float uPixelRatio, uScale, uFogDensity, uTime;
    uniform vec3 uLampPos[${N_LAMPS}]; uniform vec3 uLampCol[${N_LAMPS}];
    varying vec3 vLight; varying float vFog, vNear, vSeed;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = clamp(aSize * uScale * uPixelRatio / dist, 1.0, 260.0);
      vec3 light = vec3(0.16, 0.20, 0.28);                       // ciel bleuté
      for (int i = 0; i < ${N_LAMPS}; i++) {
        vec3 d = position - uLampPos[i];
        float att = 9.0 / (1.0 + dot(d, d) * 0.22);
        light += uLampCol[i] * att;
      }
      vLight = light;
      vFog = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
      vNear = smoothstep(0.4, 1.6, dist);
      vSeed = aSeed;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D uMap; uniform vec3 uFogColor; uniform float uOpacity, uTime;
    varying vec3 vLight; varying float vFog, vNear, vSeed;
    void main(){
      float a = texture2D(uMap, gl_PointCoord).a;
      float twinkle = 0.75 + 0.25 * sin(uTime * 6.0 + vSeed * 40.0);
      vec3 col = mix(vLight, uFogColor, vFog);
      gl_FragColor = vec4(col, a * vNear * uOpacity * twinkle);
    }`,
});

function makeSnowSystem(count, box, sizeMin, sizeMax, fall, windScale, opacity) {
  const pos = new Float32Array(count * 3), size = new Float32Array(count), seed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random() - 0.5) * box.x + camera.position.x; pos[i*3+1] = Math.random() * box.y; pos[i*3+2] = (Math.random() - 0.5) * box.z + camera.position.z;
    size[i] = rnd(sizeMin, sizeMax); seed[i] = Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = snowMat.clone(); mat.uniforms = THREE.UniformsUtils.clone(snowUniforms); mat.uniforms.uOpacity.value = opacity;
  mat.uniforms.uLampPos.value = lampPosArr; mat.uniforms.uLampCol.value = lampColArr;   // partagés
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  return { pts, pos, seed, count, box, fall, windScale, mat };
}
const snowFar  = makeSnowSystem(15000, new THREE.Vector3(80, 26, 80), 0.045, 0.11, 2.4, 1.0, 0.9);
const snowMid  = makeSnowSystem(3600,  new THREE.Vector3(30, 12, 30),  0.07, 0.14, 3.0, 1.15, 0.75);

/** Force des rafales (≈ 0,2 à 1,8, moyenne 1) : partagée par les flocons et le son du vent. */
function windGust(t) { return 1 + 0.4 * Math.sin(t * 0.6) + 0.25 * Math.sin(t * 2.1 + 1.0) + 0.15 * Math.sin(t * 5.3); }

function updateSnow(sys, dt, t) {
  const { pos, seed, count, box, fall, windScale } = sys;
  const cx = camera.position.x, cz = camera.position.z, hx = box.x / 2, hz = box.z / 2;
  const gust = windGust(t);
  for (let i = 0; i < count; i++) {
    const i3 = i * 3, s = seed[i] * 6.283;
    pos[i3]   += (WIND.x * windScale * gust + Math.sin(t * 1.9 + s) * 1.1) * dt;
    pos[i3+1] -= (fall + Math.sin(s) * 0.7 + Math.sin(t * 3.0 + s) * 0.3) * dt;
    pos[i3+2] += (WIND.z * windScale * gust + Math.cos(t * 1.4 + s) * 0.8) * dt;
    if (pos[i3+1] < -0.5) pos[i3+1] += box.y;
    const dx = pos[i3] - cx, dz = pos[i3+2] - cz;
    if (dx > hx) pos[i3] -= box.x; else if (dx < -hx) pos[i3] += box.x;
    if (dz > hz) pos[i3+2] -= box.z; else if (dz < -hz) pos[i3+2] += box.z;
  }
  sys.pts.geometry.attributes.position.needsUpdate = true;
  sys.mat.uniforms.uTime.value = t;
}
function updateLampUniforms() {
  const sorted = lampPositions.slice().sort((a, b) => a.pos.distanceToSquared(camera.position) - b.pos.distanceToSquared(camera.position));
  for (let i = 0; i < N_LAMPS; i++) {
    if (sorted[i]) { lampPosArr[i].copy(sorted[i].pos); lampColArr[i].copy(sorted[i].col); }
    else { lampPosArr[i].set(0, -1000, 0); lampColArr[i].set(0, 0, 0); }
  }
}

/* ───────────────────────── src/textures/steam.js ───────────────────────── */
/** Bouffée de vapeur : disque très doux, bord irrégulier, quelques trous. */
function makePuffTexture() {
  const S = 128, c = makeCanvas(S, S), ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.7, 'rgba(255,255,255,0.14)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  // grumeaux : on retire des bouts pour casser la rondeur
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * 6.283, r = S * (0.22 + Math.random() * 0.3);
    const gg = ctx.createRadialGradient(S / 2 + Math.cos(a) * r, S / 2 + Math.sin(a) * r, 0, S / 2 + Math.cos(a) * r, S / 2 + Math.sin(a) * r, 8 + Math.random() * 16);
    gg.addColorStop(0, 'rgba(0,0,0,0.6)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, S, S);
  }
  return toTexture(c, true, false);
}

/* ───────────────────────── src/fx/steam.js ───────────────────────── */
/* =====================================================================
   11 bis. VAPEUR DES BOUCHES D'ÉGOUT
   Une plaque en fonte au milieu de la chaussée, une auréole de neige fondue
   autour, et un panache de bouffées qui montent en se dilatant, poussées par
   le vent, éclairées par le lampadaire le plus proche. Toute l'animation est
   dans le vertex shader (phase = fract(temps + décalage)) : le CPU ne fait que
   pousser uTime.
   ===================================================================== */
const puffTex = makePuffTexture();
const steamMats = [];

const STEAM_VERT = `
  attribute float aPhase, aSeed, aSize;
  uniform float uTime, uPixelRatio, uScale, uFogDensity, uHeight;
  uniform vec3 uWind;
  varying float vAlpha, vFog, vSeed;
  void main(){
    float life = fract(uTime * 0.16 + aPhase);              // 0 : sort de la plaque, 1 : dissipé
    float s = aSeed * 6.283;
    // montée ralentie, dérive au vent qui s'accentue, léger tourbillon
    vec3 p = position;
    p.y += uHeight * pow(life, 0.72);
    p.xz += uWind.xz * 0.28 * life * life + vec2(sin(uTime * 0.9 + s), cos(uTime * 0.7 + s)) * (0.15 + 0.5 * life);
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float dist = -mv.z;
    float size = aSize * (0.5 + 2.4 * life);                   // la bouffée se dilate en montant
    gl_PointSize = clamp(size * uScale * uPixelRatio / dist, 2.0, 600.0);
    vAlpha = smoothstep(0.0, 0.12, life) * pow(1.0 - life, 1.6) * smoothstep(0.6, 2.5, dist);
    vFog = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
    vSeed = aSeed;
    gl_Position = projectionMatrix * mv;
  }`;
const STEAM_FRAG = `
  uniform sampler2D uMap; uniform vec3 uColor, uFogColor; uniform float uOpacity;
  varying float vAlpha, vFog, vSeed;
  void main(){
    // rotation de la texture par particule pour éviter les bouffées identiques
    float a = vSeed * 6.283; vec2 c = gl_PointCoord - 0.5;
    vec2 uv = vec2(c.x * cos(a) - c.y * sin(a), c.x * sin(a) + c.y * cos(a)) + 0.5;
    float t = texture2D(uMap, uv).a;
    vec3 col = mix(uColor, uFogColor, vFog);
    gl_FragColor = vec4(col, t * vAlpha * uOpacity);
  }`;

function buildManhole(x, z) {
  addSubject({ label: "La vapeur d'une plaque d'égout", value: 0.8, box: boxAt(x, z, 0.9, 0.9, 0, 2.6), moment: () => ({ pts: 2, why: 'panache de vapeur' }) });
  // plaque en fonte + auréole sombre de neige fondue (la vapeur est chaude)
  const cover = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.04, 28), MAT.iron); cover.position.set(x, 0.025, z); cover.receiveShadow = true; scene.add(cover);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.025, 6, 28), MAT.iron); rim.rotation.x = Math.PI / 2; rim.position.set(x, 0.035, z); scene.add(rim);
  const melt = new THREE.Mesh(new THREE.CircleGeometry(0.85, 28), new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.35, metalness: 0.1, transparent: true, opacity: 0.85 }));
  melt.rotation.x = -Math.PI / 2; melt.position.set(x, 0.008, z); melt.receiveShadow = true; scene.add(melt);

  // teinte : blanc-gris froid réchauffé par le lampadaire le plus proche
  const here = new THREE.Vector3(x, 2, z);
  let best = null, bd = Infinity;
  for (const l of lampPositions) { const d = l.pos.distanceTo(here); if (d < bd) { bd = d; best = l; } }
  const tint = new THREE.Color(0.62, 0.66, 0.72);
  if (best) tint.lerp(best.col, THREE.MathUtils.clamp(1 - bd / 16, 0, 0.55));

  // panache : bouffées réparties dans un petit disque, phases étalées
  const N = 110, pos = new Float32Array(N * 3), phase = new Float32Array(N), seed = new Float32Array(N), size = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 0.3;
    pos[i * 3] = x + Math.cos(a) * r; pos[i * 3 + 1] = 0.07; pos[i * 3 + 2] = z + Math.sin(a) * r;
    phase[i] = i / N; seed[i] = Math.random(); size[i] = 0.55 + Math.random() * 0.5;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uMap: { value: puffTex }, uTime: { value: Math.random() * 100 }, uPixelRatio: { value: renderer.getPixelRatio() }, uScale: { value: 1 },
      uFogColor: { value: FOG_COLOR }, uFogDensity: { value: FOG_DENSITY }, uWind: { value: WIND }, uHeight: { value: 3.2 + Math.random() * 1.2 },
      uColor: { value: tint }, uOpacity: { value: 0.42 },
    },
    vertexShader: STEAM_VERT, fragmentShader: STEAM_FRAG, transparent: true, depthWrite: false,
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  steamMats.push(mat);
}

// Trois plaques au milieu de la chaussée, décalées d'une voie à l'autre
for (const [x, z] of MANHOLES) buildManhole(x, z);   // positions partagées avec le cratère de fonte (ground.js)

function updateSteam(dt) {
  for (const m of steamMats) m.uniforms.uTime.value += dt;
}

/* ───────────────────────── src/fx/facePass.js ───────────────────────── */
/* =====================================================================
   12. POST-TRAITEMENT : bloom + masque "neige sur le visage" (réfraction) + grain
   Le masque est une passe plein écran : les plaques de neige mouillée
   déforment (réfraction) et floutent l'image derrière elles, le givre
   blanchit et brouille les bords, la fine neige voile le centre.
   ===================================================================== */
const faceShader = {
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uAccum: { value: 0.2 }, uGrade: { value: 0.55 },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },   // taille à l'écran (px CSS)
    uBuffer:     { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },   // pixels réellement calculés
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tDiffuse; uniform float uTime, uAccum, uGrade; uniform vec2 uResolution, uBuffer;
    varying vec2 vUv;

    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    vec2  hash2(vec2 p){ float h = hash(p); return vec2(h, hash(p + h + 7.13)); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    // chaque octave est TOURNÉE (~37°) : sans ça les octaves partagent la même grille et, une fois
    // contrasté par smoothstep, le bruit laisse voir des carrés alignés sur l'écran
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = mat2(0.8, -0.6, 0.6, 0.8) * p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return v; }

    // Champ de hauteur des plaques de neige mouillée : chaque cellule héberge une plaque
    // qui apparaît, coule vers le bas en s'étirant, puis fond.
    float plaques(vec2 uv, float scale, float seed, float t, float density, float aspect){
      vec2 p = uv * scale * vec2(aspect, 1.0);
      vec2 id = floor(p), f = fract(p);
      float acc = 0.0;
      for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
        vec2 o = vec2(float(x), float(y));
        vec2 r = hash2(id + o + seed);
        float life = fract(t * 0.06 + r.x * 7.31 + r.y * 3.17);
        float present = 1.0 - smoothstep(density - 0.05, density + 0.05, r.y);
        float env = smoothstep(0.0, 0.1, life) * (1.0 - smoothstep(0.45, 1.0, life));
        vec2 c = o + 0.2 + r * 0.6;
        float drip = life * life;
        vec2 d = f - c;
        d.y += drip * 0.6;
        d.y /= (1.0 + drip * 2.4);
        d.x *= 1.0 + 0.5 * sin(r.x * 20.0);
        float rad = (0.08 + r.x * 0.12) * env;
        float shape = length(d) + (noise(d * 10.0 + r * 30.0) - 0.5) * 0.09;
        float m = 1.0 - smoothstep(rad * 0.35, rad, shape);
        acc = max(acc, m * m * present * env);       // profil bombé (goutte)
      }
      return acc;
    }
    float heightField(vec2 uv, float t, float dens, float aspect){
      float big   = plaques(uv, 6.0, 1.0, t, dens * 0.32, aspect);
      float small = plaques(uv + vec2(0.31, 0.13), 13.0, 2.0, t * 1.25, dens * 0.45, aspect);
      return max(big, small * 0.8);
    }

    void main(){
      vec2 uv = vUv;
      float aspect = uResolution.x / uResolution.y;
      vec2 cuv = (uv - 0.5) * vec2(aspect, 1.0);
      float t = uTime;
      float dens = clamp(uAccum, 0.0, 1.0);

      // Hauteur + gradient (normale) des plaques pour la réfraction
      // Pente des gouttes par DÉRIVÉES ÉCRAN : la carte graphique calcule déjà h chez
      // les pixels voisins, dFdx/dFdy en donnent la différence gratuitement. Avant, on
      // réévaluait tout le champ de hauteur 2 fois de plus par pixel — c'était le poste
      // le plus lourd du post-traitement. Même convention qu'avant : grad = -dh/duv.
      float h  = heightField(uv, t, dens, aspect);
      // dFdx est une différence PAR PIXEL CALCULÉ : on multiplie par la taille du tampon
      // (pas par celle de l'écran), sinon la réfraction changerait avec la résolution adaptative.
      vec2 grad = -vec2(dFdx(h), dFdy(h)) * uBuffer;
      vec2 refr = grad * 0.0022 + vec2(0.0, -0.008) * h;      // déviation + glissement vers le bas

      // Givre sur les bords et voile fin au centre
      float vig = smoothstep(0.2, 0.8, length(cuv));
      // (givre des bords SUPPRIMÉ à la demande de l'utilisateur : deux zones grises quadrillées
      // à gauche et à droite de l'écran, surtout visibles en regardant vers le ciel)
      float veil = fbm(uv * 14.0 * vec2(aspect, 1.0) - vec2(0.0, t * 0.05)) * (1.0 - vig * 0.6);
      veil = smoothstep(0.58, 0.9, veil) * dens * 0.35;

      // Échantillonnage : flou proportionnel à la neige présente
      float blurAmt = (h * 2.2 + veil * 1.0) / uResolution.y * 3.0;
      vec2 suv = uv + refr;
      vec3 col = texture2D(tDiffuse, suv).rgb * 0.36;
      col += texture2D(tDiffuse, suv + vec2( blurAmt,  blurAmt)).rgb * 0.16;
      col += texture2D(tDiffuse, suv + vec2(-blurAmt,  blurAmt)).rgb * 0.16;
      col += texture2D(tDiffuse, suv + vec2( blurAmt, -blurAmt)).rgb * 0.16;
      col += texture2D(tDiffuse, suv + vec2(-blurAmt, -blurAmt)).rgb * 0.16;

      // ÉTALONNAGE « nuit de neige » (image modèle) : ombres et tons sombres tirés vers un
      // gris bleuté DE MÊME LUMINOSITÉ (la nuit ne s'éclaircit pas), hautes lumières intactes :
      // la lumière des lampes reste chaude près des globes, mais sa retombée faible ne
      // teinte plus toute l'image en brun sépia. Valeurs linéaires, avant le tone mapping.
      float lumG = dot(col, vec3(0.2126, 0.7152, 0.0722));
      float shadowW = 1.0 - smoothstep(0.02, 0.35, lumG);
      col = mix(col, lumG * vec3(0.84, 1.0, 1.42), shadowW * uGrade);

      // Blanchiment glacé (plaques translucides, givre opaque, voile léger)
      vec3 ice = vec3(0.80, 0.86, 0.96);
      // max() : la neige collée éclaircit, elle n'ASSOMBRIT jamais — sur le trottoir devenu blanc,
      // « col*0.55 + glace » rendait les plaques en disques gris
      col = mix(col, max(col, col * 0.55 + ice * 0.45), clamp(h * 0.9, 0.0, 1.0));
      col = mix(col, max(col, col * 0.7 + ice * 0.35), veil);
      // reflet spéculaire sur le bord des gouttes
      float rim = clamp(-grad.y * 0.004, 0.0, 1.0) * h;
      col += rim * vec3(0.5, 0.55, 0.65);

      // Vignette optique + grain de pellicule
      col *= 1.0 - 0.35 * smoothstep(0.45, 1.1, length(cuv));
      col += (hash(uv * uResolution + fract(t) * 100.0) - 0.5) * 0.035;

      gl_FragColor = vec4(col, 1.0);
    }`,
};
const facePass = new ShaderPass(faceShader);
/** Neige sur l'objectif, partagée par la boucle (accumulation, main.js) et le jeu photo :
 *  accum 0,1 (propre) → 0,65 (couvert) ; wiping > 0 = essuyage en cours (secondes restantes). */
const lens = { accum: 0.2, wiping: 0 };

/* ───────────────────────── src/fx/postprocessing.js ───────────────────────── */
/* =====================================================================
   12 bis. CHAÎNE DE POST-TRAITEMENT
   RenderPass → UnrealBloomPass → passe « neige sur le visage » → OutputPass
   ===================================================================== */

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.55, 0.95);
composer.addPass(bloom);
composer.addPass(facePass);
composer.addPass(new OutputPass());

/* ───────────────────────── src/fx/adaptiveResolution.js ───────────────────────── */
/* =====================================================================
   14 bis. RÉSOLUTION ADAPTATIVE
   Le jeu est limité par les PIXELS (≈ 15 ms par mégapixel mesurés) : sur un écran
   1080p il tombait autour de 28 ips. Plutôt que de choisir une résolution fixe pour
   tout le monde, le jeu mesure son propre débit d'images et ajuste la résolution
   de rendu interne (entre 50 % et 100 % de la résolution normale, par côté) ; le
   navigateur agrandit ensuite l'image à la taille de la fenêtre.
   Dans cette ambiance (brume, flocons, givre, grain, bloom), l'image un peu plus
   douce est quasi invisible — une saccade, elle, se sent tout de suite.

   Règles :
   - mesure sur des fenêtres d'1 s, après 2,5 s d'échauffement (compilation des
     shaders, premières cartes d'ombre) ; les images de plus de 250 ms (onglet
     masqué, Alt+Tab) ne sont pas des mesures ;
   - sous 52 ips : on baisse d'un coup vers ~58 ips. Le temps d'image vaut à peu
     près un coût fixe (~3 ms : ombres, CPU, passes) + une part proportionnelle au
     nombre de pixels, donc au CARRÉ de l'échelle. D'où l'échelle visée :
     échelle × √((T_visé − 3) / (T_mesuré − 3)). Sans le coût fixe, on tombait
     trop court (1080p : ~52 ips au lieu de 58) ;
   - à 57 ips ou plus (plafond d'un écran 60 Hz) : on remonte de 5 %, à l'essai ;
     si la mesure suivante ne tient pas 55 ips, on redescend aussitôt. Sans ce
     retour, une remontée pouvait se coincer à 52 ips, entre les deux seuils ;
   - un palier qui a fait décrocher devient un plafond (30 s, doublé à chaque essai
     raté, jusqu'à 4 min), sinon on oscillerait sans fin entre deux paliers
     (chaque changement réalloue les tampons de rendu, une petite saccade) ;
   - au moins 1,5 s entre deux changements, le temps que la mesure se stabilise.

   `?res=0.75` dans l'URL fige l'échelle (comparaisons, captures) ; `?res=1` coupe
   l'adaptation.
   ===================================================================== */
const RES_MIN = 0.5, RES_MAX = 1, FPS_LOW = 52, FPS_HIGH = 57, FPS_KEEP = 55, FPS_AIM = 58, FIXED_MS = 3;
const basePixelRatio = renderer.getPixelRatio();          // min(dpr, 1.5), fixé dans core/renderer.js
const resParam = new URLSearchParams(location.search).get('res');
const resFixed = resParam !== null && !isNaN(parseFloat(resParam));

const adaptiveRes = {
  scale: 1,
  onChange: () => {},        // branché par main.js (flocons, vapeur, passe visage)
  set(s) {
    this.scale = s;
    renderer.setPixelRatio(basePixelRatio * s);
    composer.setPixelRatio(basePixelRatio * s);
    this.onChange();
  },
  update(rawDt) {
    if (resFixed) return;
    const st = resState;
    if (st.warm > 0) { st.warm -= rawDt; return; }
    if (rawDt > 0.25) return;
    st.acc += rawDt; st.frames++; st.cooldown -= rawDt; st.ceilingTimer -= rawDt;
    if (st.ceilingTimer <= 0) st.ceiling = RES_MAX;
    if (st.acc < 1) return;
    const fps = st.frames / st.acc; st.acc = 0; st.frames = 0;
    if (st.cooldown > 0) return;
    const q = x => Math.round(x * 20) / 20;                  // paliers de 5 %
    const trial = st.trial; st.trial = false;
    if (trial && fps < FPS_KEEP) {                           // la remontée ne tient pas : retour
      st.ceiling = this.scale - 0.05; st.ceilingTimer = st.backoff; st.backoff = Math.min(240, st.backoff * 2);
      this.set(q(this.scale - 0.05)); st.cooldown = 1.5;
    } else if (fps < FPS_LOW && this.scale > RES_MIN) {
      const ratio = (1000 / FPS_AIM - FIXED_MS) / Math.max(1, 1000 / fps - FIXED_MS);
      const next = Math.max(RES_MIN, Math.min(this.scale - 0.05, q(this.scale * Math.sqrt(ratio))));
      st.ceiling = this.scale - 0.05; st.ceilingTimer = 30;
      this.set(next); st.cooldown = 1.5;
    } else if (fps >= FPS_HIGH && this.scale < st.ceiling - 1e-6) {
      this.set(Math.min(st.ceiling, q(this.scale + 0.05))); st.cooldown = 2; st.trial = true;
    }
  },
};
const resState = { warm: 2.5, acc: 0, frames: 0, cooldown: 0, ceiling: RES_MAX, ceilingTimer: 0, trial: false, backoff: 30 };
if (resFixed) adaptiveRes.set(Math.min(RES_MAX, Math.max(0.25, parseFloat(resParam))));

/* ───────────────────────── src/player/controls.js ───────────────────────── */
/* =====================================================================
   13. CONTRÔLES FPS : PointerLock (avec repli), ZQSD/WASD, head-bobbing, collisions
   ===================================================================== */
const controls = new PointerLockControls(camera, renderer.domElement);
const entry = document.getElementById('entry'), hud = document.getElementById('hud'), entryHint = document.getElementById('entryHint');
// Tant que le mode de jeu n'est pas choisi (boutons de l'écran d'entrée), un clic ailleurs ne lance rien.
let entryGate = () => true;
function setEntryGate(fn) { entryGate = fn; }
let active = false, dragMode = false, lastUnlock = -Infinity, uiOpen = false, moveScale = 1;
const pointerLockAvailable = 'requestPointerLock' in document.documentElement, inIframe = window.self !== window.top;

function enterDragMode(reason) { dragMode = true; active = true; entry.classList.add('hidden'); console.warn('Mode glisser :', reason); }
function leaveGame() { active = false; releaseAll(); entry.classList.remove('hidden'); }   // on ne revient jamais dans la rue avec une touche coincée
entry.addEventListener('click', () => {
  if (!entryGate()) return;
  if (!pointerLockAvailable || inIframe) { entryHint.textContent = 'Verrouillage du curseur indisponible ici : maintenez le clic pour regarder.'; return enterDragMode('iframe/API'); }
  const since = performance.now() - lastUnlock;
  if (since < 1200) { const prev = entryHint.textContent; entryHint.textContent = 'Un instant… recliquez dans une seconde.'; setTimeout(() => (entryHint.textContent = prev), 1300 - since); return; }
  try { controls.lock(); } catch (e) { enterDragMode(e.message); }
});
controls.addEventListener('lock',   () => { active = true; entry.classList.add('hidden'); });
controls.addEventListener('unlock', () => { lastUnlock = performance.now(); if (!dragMode && !uiOpen) leaveGame(); });

/* Interface du jeu (album, édition du matin) : on libère la souris SANS afficher l'écran
   de pause, puis on la reverrouille au retour (appelé depuis un clic ou une touche :
   le navigateur exige un geste de l'utilisateur pour verrouiller). */
function playerActive() { return active; }
function setMoveScale(k) { moveScale = k; }                // marche ralentie au viseur
function openUi() { uiOpen = true; releaseAll(); active = false; if (document.pointerLockElement) controls.unlock(); }
function closeUi(resume = true) {
  uiOpen = false;
  if (!resume) return leaveGame();
  if (dragMode) { active = true; return; }
  try { controls.lock(); } catch (e) { enterDragMode(e.message); }
}
document.addEventListener('pointerlockerror', () => { entryHint.textContent = 'Le navigateur a refusé le verrouillage : maintenez le clic pour regarder.'; enterDragMode('pointerlockerror'); });
const dragEuler = new THREE.Euler(0, 0, 0, 'YXZ'); let dragging = false;
renderer.domElement.addEventListener('mousedown', e => { if (dragMode && e.button === 0) dragging = true; });
window.addEventListener('mouseup', () => (dragging = false));
window.addEventListener('mousemove', e => {
  if (!dragMode || !dragging) return;
  dragEuler.setFromQuaternion(camera.quaternion);
  dragEuler.y -= e.movementX * 0.0022; dragEuler.x = THREE.MathUtils.clamp(dragEuler.x - e.movementY * 0.0022, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05); dragEuler.z = 0;
  camera.quaternion.setFromEuler(dragEuler);
});
window.addEventListener('keydown', e => { if (e.code === 'Escape' && dragMode) { dragMode = false; leaveGame(); } });

/* --- Clavier -----------------------------------------------------------
   On mémorise l'ensemble des TOUCHES PHYSIQUES enfoncées, pas un booléen par
   direction. Deux raisons, chacune corrigeant un blocage réel :

   1. `KeyW` et `KeyZ` (et `KeyA`/`KeyQ`) pointent la même direction pour servir
      AZERTY et QWERTY. Avec un booléen, relâcher l'une remettait la direction à
      faux alors que l'autre était encore tenue — et inversement, un relâchement
      manqué la laissait vraie pour toujours.
   2. Un `keyup` peut ne jamais arriver : touche relâchée pendant que la fenêtre
      a perdu le focus (Alt+Tab), pendant la sortie du verrouillage de souris, ou
      onglet masqué. La direction restait alors enfoncée et le joueur avançait
      tout seul jusqu'au rechargement. D'où le filet `releaseAll` ci-dessous.
   ----------------------------------------------------------------------- */
const keys = { fwd: false, back: false, left: false, right: false };
const KEYMAP = { KeyW: 'fwd', KeyZ: 'fwd', ArrowUp: 'fwd', KeyS: 'back', ArrowDown: 'back', KeyA: 'left', KeyQ: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
const held = new Set();
function refreshKeys() {
  keys.fwd = keys.back = keys.left = keys.right = false;
  for (const code of held) keys[KEYMAP[code]] = true;
}
function releaseAll() { if (held.size) { held.clear(); refreshKeys(); } }
window.addEventListener('keydown', e => { if (KEYMAP[e.code]) { held.add(e.code); refreshKeys(); e.preventDefault(); } });
window.addEventListener('keyup',   e => { if (held.delete(e.code)) refreshKeys(); });
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement) releaseAll(); });
controls.addEventListener('unlock', releaseAll);

const velocity = new THREE.Vector3(), fwdDir = new THREE.Vector3(), rightDir = new THREE.Vector3(), moveDir = new THREE.Vector3(), target = new THREE.Vector3();
let bobPhase = 0, walkAmount = 0, lastSway = 0;
function groundHeightAt(x) {
  const ax = Math.abs(x), k = THREE.MathUtils.smoothstep(ax, ROAD_HALF - 0.3, ROAD_HALF + 0.2);
  const wall = THREE.MathUtils.clamp((ax - ROAD_HALF) / SIDEWALK_W, 0, 1);
  // suit (en lissé) la neige de ground.js : ~10 cm sur la chaussée, congère qui monte vers les murs
  return SIDEWALK_H * k + (0.1 + Math.pow(wall, 2.4) * 0.3) * k + 0.1 * (1 - k) + 0.03;
}
function updatePlayer(dt) {
  camera.getWorldDirection(fwdDir); fwdDir.y = 0; fwdDir.normalize();
  rightDir.crossVectors(fwdDir, camera.up).normalize();
  moveDir.set(0, 0, 0);
  if (keys.fwd) moveDir.add(fwdDir); if (keys.back) moveDir.sub(fwdDir); if (keys.right) moveDir.add(rightDir); if (keys.left) moveDir.sub(rightDir);
  const wants = moveDir.lengthSq() > 0; if (wants) moveDir.normalize();
  target.copy(moveDir).multiplyScalar(WALK_SPEED * moveScale);
  velocity.lerp(target, 1 - Math.exp(-dt * 8));
  if (!active) velocity.set(0, 0, 0);
  const p = camera.position;
  // Déplacement axe par axe (glissement le long des obstacles), puis poussée hors de
  // tout chevauchement résiduel. L'ancien garde-fou « déjà coincé → mouvement libre »
  // était exploitable : le balancement des pas poussait la caméra de 2 cm dans une
  // voiture, et le tour suivant tout passait à travers.
  const nx = p.x + velocity.x * dt; if (!collides(nx, p.z, PLAYER_RADIUS)) p.x = nx; else velocity.x = 0;
  const nz = p.z + velocity.z * dt; if (!collides(p.x, nz, PLAYER_RADIUS)) p.z = nz; else velocity.z = 0;
  const speed = Math.hypot(velocity.x, velocity.z);
  walkAmount = THREE.MathUtils.lerp(walkAmount, Math.min(speed / WALK_SPEED, 1), 1 - Math.exp(-dt * 6));
  // Cadence : bobPhase fait un cycle par ENJAMBÉE (deux pas) — c'est le balancement
  // latéral —, et bobY oscille à 2×, donc un creux par pas. À pleine vitesse on vise
  // ~110 pas/min (1,85 Hz), soit bobPhase à 0,92 Hz ≈ 5,8 rad/s. L'ancien 1,85π
  // donnait 178 pas/min : une cadence de course, pas une marche dans la neige.
  bobPhase += dt * (1.15 * Math.PI) * (0.6 + speed / WALK_SPEED);
  // Head-bobbing : oscillation verticale + léger balancement latéral EN POSITION.
  // On ne touche jamais à la rotation de la caméra (elle appartient à PointerLockControls,
  // et réécrire rotation.z ferait basculer l'horizon) : l'horizon reste toujours droit.
  const bobY = Math.sin(bobPhase * 2) * 0.045 * walkAmount;
  const sway = Math.sin(bobPhase) * 0.025 * walkAmount;
  p.x += rightDir.x * (sway - lastSway); p.z += rightDir.z * (sway - lastSway); lastSway = sway;
  pushOut(p, PLAYER_RADIUS);                              // le balancement ne peut pas nous mettre dans un obstacle
  p.y = groundHeightAt(p.x) + EYE_HEIGHT + bobY;
  return speed;
}

/* ───────────────────────── src/audio/wind.js ───────────────────────── */
/* =====================================================================
   16. SON : VENT LÉGER (optionnel, coupé par défaut)
   Aucun fichier audio : le vent est SYNTHÉTISÉ avec la Web Audio API à partir
   d'un bruit rose (donc ça marche aussi en file://, sans rien télécharger).
   Trois couches filtrées du même bruit :
     - un grondement grave (passe-bas) : le souffle continu de la tempête ;
     - un sifflement (passe-bande étroit, fréquence qui glisse) : le vent dans la rue ;
     - un chuintement aigu très faible : la neige qui crépite.
   Leur volume suit les MÊMES rafales que les flocons (`windGust`) : quand la
   neige accélère à l'écran, le vent monte. Il est plus fort et plus clair face
   au vent, et vient du côté d'où il souffle (panoramique gauche / droite).
   Bouton discret en haut à droite (#sound) ou touche M. Le choix est mémorisé ;
   comme le navigateur interdit de jouer un son avant une action de l'utilisateur,
   un son mémorisé « activé » ne démarre qu'au premier clic ou à la première touche.
   ===================================================================== */
const soundBtn = document.getElementById('sound');
const SOUND_KEY = 'blizzard-son', SOUND_VOL = 0.4;
let audioCtx = null, windNodes = null, soundOn = false, soundStopTimer = 0;
try { soundOn = localStorage.getItem(SOUND_KEY) === '1'; } catch (e) { /* stockage bloqué : son coupé */ }
const windFrom = { x: -WIND.x, z: -WIND.z };                 // direction D'OÙ vient le vent, normalisée
{ const l = Math.hypot(windFrom.x, windFrom.z); windFrom.x /= l; windFrom.z /= l; }

/** Bruit rose stéréo (deux canaux indépendants → son large) qui boucle sans clic :
 *  la fin est fondue dans le début, et la boucle repart juste après ce fondu. */
function pinkNoise(ctx, seconds) {
  const sr = ctx.sampleRate, n = Math.floor(sr * seconds), fade = Math.floor(sr * 0.25);
  const buf = ctx.createBuffer(2, n, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;   // filtre de Paul Kellet
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
    }
    for (let i = 0; i < fade; i++) { const a = i / fade; d[n - fade + i] = d[n - fade + i] * (1 - a) + d[i] * a; }
  }
  return { buf, loopStart: fade / sr };
}

function buildWind() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = audioCtx, { buf, loopStart } = pinkNoise(ctx, 8);
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.loopStart = loopStart; src.loopEnd = buf.duration;
  const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  const layer = (type, freq, q) => {
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.value = 0; src.connect(f); f.connect(g); return { f, g };
  };
  const rumble = layer('lowpass', 320, 0.5), whistle = layer('bandpass', 600, 7), hiss = layer('highpass', 3500, 0.7);
  const pan = ctx.createStereoPanner();
  rumble.g.connect(master); whistle.g.connect(pan); pan.connect(master); hiss.g.connect(master);
  src.start(0, Math.random() * 6);
  windNodes = { master, rumble, whistle, hiss, pan };
}

function refreshButton() {
  if (!soundBtn) return;
  soundBtn.classList.toggle('on', soundOn);
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  soundBtn.title = soundOn ? 'Couper le son (M)' : 'Activer le son (M)';
}

function startSound() {
  if (!audioCtx) buildWind();
  clearTimeout(soundStopTimer);
  audioCtx.resume();
  windNodes.master.gain.setTargetAtTime(SOUND_VOL, audioCtx.currentTime, 0.6);   // montée douce (~2 s)
}

function setSound(on) {
  soundOn = on; refreshButton();
  try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch (e) { /* pas grave */ }
  if (on) startSound();
  else if (audioCtx) {
    windNodes.master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.25);
    soundStopTimer = setTimeout(() => { if (!soundOn) audioCtx.suspend(); }, 1500);   // à l'arrêt : zéro calcul audio
  }
}

refreshButton();
soundBtn?.addEventListener('click', e => { e.stopPropagation(); setSound(!soundOn); soundBtn.blur(); });
window.addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) setSound(!soundOn); });
// son mémorisé « activé » : démarre à la première action (sauf un clic sur le bouton, qui le basculerait aussitôt)
const soundGesture = e => {
  if (e.target?.closest?.('#sound') || e.code === 'KeyM') return;
  window.removeEventListener('pointerdown', soundGesture, true); window.removeEventListener('keydown', soundGesture, true);
  if (soundOn && !audioCtx) startSound();
};
window.addEventListener('pointerdown', soundGesture, true); window.addEventListener('keydown', soundGesture, true);
// onglet masqué : on suspend ; retour : on reprend si le son est activé
document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden) audioCtx.suspend(); else if (soundOn) audioCtx.resume();
});

/** Appelé à chaque image : volumes et filtres suivent les rafales et l'orientation du joueur. */
const windDebug = { get ctx() { return audioCtx; }, get nodes() { return windNodes; } };   // inspection (window.__blizzard.wind)

function updateWind(t, camera) {
  if (!soundOn || !windNodes || audioCtx.state !== 'running') return;
  const { rumble, whistle, hiss, pan } = windNodes, now = audioCtx.currentTime, k = 0.25;
  const gust = Math.min(Math.max((windGust(t) - 0.2) / 1.6, 0), 1);   // 0 = accalmie, 1 = pic de rafale
  const e = camera.matrixWorld.elements;                                 // colonne 0 = droite, colonne 2 = arrière
  const facing = -(e[8] * windFrom.x + e[10] * windFrom.z);             // 1 = face au vent, −1 = dos au vent
  const side = e[0] * windFrom.x + e[2] * windFrom.z;                    // > 0 : le vent vient de la droite
  const face01 = 0.5 + 0.5 * facing;
  rumble.g.gain.setTargetAtTime(0.3 * (0.45 + 0.55 * gust) * (0.8 + 0.2 * face01), now, k);
  rumble.f.frequency.setTargetAtTime(230 + 260 * gust + 180 * face01, now, k);
  whistle.g.gain.setTargetAtTime(0.05 * gust * gust * (0.55 + 0.45 * face01), now, k);
  whistle.f.frequency.setTargetAtTime(470 + 380 * gust + 70 * Math.sin(t * 0.23), now, 0.4);
  hiss.g.gain.setTargetAtTime(0.012 * (0.4 + 0.6 * gust), now, k);
  pan.pan.setTargetAtTime(Math.max(-0.6, Math.min(0.6, side * 0.6)), now, 0.3);
}

/** Déclic d'obturateur (jeu photo) : deux claquements de bruit très courts — miroir qui se
 *  relève, rideau qui se ferme. Seulement si le son est activé (on ne crée pas de contexte audio). */
function playShutter() {
  if (!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  const ctx = audioCtx, t0 = ctx.currentTime, n = Math.floor(ctx.sampleRate * 0.03);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  for (const [dt, vol] of [[0, 0.5], [0.075, 0.35]]) {
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.8; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t0 + dt);
  }
}

/* ───────────────────────── src/game/scoring.js ───────────────────────── */
/* =====================================================================
   18. NOTATION D'UNE PHOTO (0 à 50)
   Évaluée AU DÉCLENCHEMENT, sur l'état exact de la scène à cet instant :
     Sujet        /15  intérêt du sujet principal × qualité de sa présence dans le cadre
                       (taille, entier ou coupé, masqué ou non, noyé dans la brume ou non)
     Composition  /10  sujet près des points / lignes de tiers plutôt que plein centre
     Lumière      /10  « esthétique » lue sur les PIXELS de la photo réelle : exposition,
                       contraste, points lumineux sans zones brûlées, contraste chaud /
                       froid, richesse (autres sujets dans le cadre)
     Netteté      /10  neige sur l'objectif, bougé (rotation de la caméra), marche
     Moment       /5   bonus de l'instant (gyrophares allumés, feu au rouge, rafale…)
   Le sujet principal n'est pas imposé : c'est celui qui « tient » le mieux la photo
   (intérêt × présence). On cherche dans le registre game/subjects.js.
   ===================================================================== */
const SC_F = [0.1, 0.5, 0.9];                            // échantillons dans la boîte (3 × 3 × 3)
const scV = new THREE.Vector3(), scP = new THREE.Vector3(), scC = new THREE.Vector3(), scDir = new THREE.Vector3();
const scRay = new THREE.Raycaster();
const scSmooth = (a, b, x) => THREE.MathUtils.smoothstep(x, a, b);
let scOccluders = null;

/** Objets qui peuvent MASQUER un sujet : tout ce qui est opaque, sauf le sol (le tester
 *  coûterait des centaines de milliers de triangles par rayon, et il ne cache presque rien). */
function occluderList() {
  if (scOccluders) return scOccluders;
  scOccluders = [];
  scene.traverse(o => {
    if (!o.isMesh || o.userData.noOcclude) return;
    const m = o.material;
    if (!Array.isArray(m) && (m.depthWrite === false || m.blending === THREE.AdditiveBlending)) return;   // lueurs, ciel, décalques
    scOccluders.push(o);
  });
  return scOccluders;
}

/** Présence de chaque sujet dans le cadre (sans l'occlusion, qui coûte des rayons). */
function measureSubject(s, camera) {
  const b = subjectBox(s);
  b.getCenter(scC);
  const dist = scC.distanceTo(camera.position);
  if (dist > 110) return null;
  let inside = 0, total = 0, minU = 1, minV = 1, maxU = 0, maxV = 0, su = 0, sv = 0;
  const pts = [];
  for (const fx of SC_F) for (const fy of SC_F) for (const fz of SC_F) {
    scP.set(THREE.MathUtils.lerp(b.min.x, b.max.x, fx), THREE.MathUtils.lerp(b.min.y, b.max.y, fy), THREE.MathUtils.lerp(b.min.z, b.max.z, fz));
    total++;
    scV.copy(scP).applyMatrix4(camera.matrixWorldInverse);
    if (scV.z > -camera.near) continue;                                    // derrière l'objectif
    scV.copy(scP).project(camera);
    if (Math.abs(scV.x) > 1 || Math.abs(scV.y) > 1) continue;             // hors cadre
    const u = scV.x * 0.5 + 0.5, v = 0.5 - scV.y * 0.5;
    inside++; su += u; sv += v; pts.push(scP.clone());
    minU = Math.min(minU, u); maxU = Math.max(maxU, u); minV = Math.min(minV, v); maxV = Math.max(maxV, v);
  }
  if (!inside) return null;
  const completeness = inside / total;
  const area = (maxU - minU) * (maxV - minV);
  const size = scSmooth(0.004, 0.05, area) * (1 - 0.35 * scSmooth(0.55, 0.95, area));   // trop petit = illisible ; plein cadre = étouffant
  const fd = s.glows ? FOG_DENSITY * 0.5 : FOG_DENSITY;                   // un sujet lumineux perce la brume
  const fog = Math.exp(-(fd * dist) * (fd * dist));
  const pre = size * Math.pow(completeness, 0.6) * fog;
  return { s, b, dist, completeness, area, size, fog, pre, cu: su / inside, cv: sv / inside, pts, vis: 1 };
}

/** Part des points visibles du sujet (quelques rayons vers ses échantillons dans le cadre). */
function visibility(m, camera) {
  const list = occluderList(), grow = m.b.clone().expandByScalar(0.2);
  const n = Math.min(5, m.pts.length), step = m.pts.length / n;
  let seen = 0;
  for (let i = 0; i < n; i++) {
    const p = m.pts[Math.floor(i * step)], d = p.distanceTo(camera.position);
