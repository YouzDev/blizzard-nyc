/** Enseigne de boutique : caisson lumineux (rétro-éclairé, tubes inégaux) ou panneau éteint et encrassé.
 *  1024×192 pour une bande d'environ 8 m × 0,8 m : les lettres restent nettes de près. */
function makeSignTexture(text, lit) {
  const W = 1024, H = 192, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const palettes = [['#8f1a12', '#fff2e0'], ['#1a2a6a', '#ffe36a'], ['#f2c21a', '#1a1a1a'], ['#1c1c1c', '#ff5a3a'], ['#2a5a2a', '#f4f4e0'], ['#f4f0e6', '#b3121a'], ['#0e3a6a', '#ffffff']];
  const [bg, fg] = palettes[Math.floor(Math.random() * palettes.length)];

  // fond : caisson rétro-éclairé (centre plus clair, bords qui tombent) ou panneau mat éteint
  if (lit) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.62);
    g.addColorStop(0, bg); g.addColorStop(1, shade(bg, 0.55));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // tubes fatigués : quelques zones plus sombres, une bande faiblarde
    for (let i = 0; i < 3; i++) { ctx.fillStyle = `rgba(0,0,0,${0.08 + Math.random() * 0.14})`; ctx.fillRect(Math.random() * W, 0, 60 + Math.random() * 160, H); }
  } else {
    ctx.fillStyle = shade(bg, 0.28); ctx.fillRect(0, 0, W, H);
  }
  // cadre en aluminium : bord sombre + filet clair
  ctx.strokeStyle = '#1c1c1e'; ctx.lineWidth = 16; ctx.strokeRect(8, 8, W - 16, H - 16);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.strokeRect(17, 17, W - 34, H - 34);

  // nom : taille ajustée à la largeur disponible
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sub = Math.random() < 0.45 ? SUBTITLES[Math.floor(Math.random() * SUBTITLES.length)] : null;
  let size = sub ? 96 : 118;
  do { ctx.font = `bold ${size}px Impact, "Arial Narrow", sans-serif`; size -= 4; } while (ctx.measureText(text).width > W - 120 && size > 40);
  const ty = sub ? H * 0.42 : H / 2;
  ctx.fillStyle = lit ? fg : shade(fg, 0.42);
  if (lit) { ctx.shadowColor = fg; ctx.shadowBlur = 18; }
  ctx.fillText(text, W / 2, ty);
  ctx.shadowBlur = 0;
  if (sub) {
    ctx.font = `bold 34px Arial, Helvetica, sans-serif`;
    ctx.fillStyle = lit ? fg : shade(fg, 0.4);
    ctx.fillText(sub, W / 2, H * 0.78);
  }
  // encrassement : coulures depuis le haut, poussière dans les angles
  ctx.fillStyle = `rgba(0,0,0,${lit ? 0.12 : 0.32})`;
  for (let i = 0; i < 18; i++) ctx.fillRect(Math.random() * W, 16, 3 + Math.random() * 8, 20 + Math.random() * (lit ? 40 : 120));
  addGrain(ctx, W, H, lit ? 10 : 18);
  return toTexture(c, true, false);
}

/** Assombrit / éclaircit une couleur hexa (#rrggbb) d'un facteur. */
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * k | 0), g = Math.min(255, ((n >> 8) & 255) * k | 0), b = Math.min(255, (n & 255) * k | 0);
  return `rgb(${r},${g},${b})`;
}

const SUBTITLES = ['OPEN 24 HOURS', 'WE DELIVER', 'ATM INSIDE', 'SINCE 1979', 'LOTTO • BEER • ICE', 'COLD CUTS • SANDWICHES', 'WASH & FOLD', 'SAME DAY SERVICE', 'KEYS MADE', 'TEL. 212-555-0148'];

const SHOP_NAMES = ['LAUNDROMAT', 'DELI GROCERY', '24 HR PHARMACY', 'NAILS SPA', 'TAILOR', 'LIQUORS', 'BODEGA', 'DRY CLEANERS', 'LOCKSMITH', 'BARBER SHOP', 'DISCOUNT', 'CHECK CASHING',

/* =====================================================================
   PORTES D'IMMEUBLE (brownstones) — textures d'un VANTAIL entier, à l'échelle
   Un vantail de 0,63 × 2,35 m sur 256 × 1024 px (≈ 4,3 px/cm). Découpe classique
   d'une porte new-yorkaise à double vantail :
     - montants de 10 cm, traverse basse 15 cm, traverse haute 35 cm ;
     - panneau bas SURÉLEVÉ (0,15 → 0,65 m) : moulure, gorge, chanfrein, table en relief ;
     - traverse de serrure (0,65 → 0,9 m) ;
     - baie vitrée (0,9 → 2,0 m) bordée d'une moulure saillante — la vitre elle-même
       est un plan posé devant (voir buildEntrance), la texture n'y est pas vue.
   Relief en carte de hauteur → normal map (Sobel) : les moulures accrochent la lumière
   de la lanterne. Couleur : fil du bois vertical sur les montants, horizontal sur les
   traverses, vernis plus sombre dans les creux, usure claire autour de la poignée,
   frottements en bas, et la TRACE DE SEL blanchâtre laissée par la neige au pied.
   Deux variantes : bois verni (chêne teinté) ou peinture (grise, multipliée par la
   couleur du matériau) écaillée sur le bois.

const DOOR_W = 256, DOOR_H = 1024, DPU = DOOR_W / 0.63, DPV = DOOR_H / 2.35;
const dX = m => m * DPU, dY = m => DOOR_H - m * DPV;           // mètres depuis le bas → px depuis le haut

// zones du vantail en mètres : [x0, y0, x1, y1] (depuis le bas à gauche)
const D_STILE = 0.1;
const D_PANEL = [D_STILE, 0.15, 0.63 - D_STILE, 0.65];
const D_GLASS = [D_STILE, 0.9, 0.63 - D_STILE, 2.0];

/** Rectangle en mètres → px, avec un retrait `i` px de chaque côté. */
function dRectPx(ctx, r, i) { const x = dX(r[0]) + i, y = dY(r[3]) + i, w = dX(r[2] - r[0]) - 2 * i, h = (dY(r[1]) - dY(r[3])) - 2 * i; if (w > 0 && h > 0) ctx.fillRect(x, y, w, h); }
const dGrey = v => { const c = Math.max(0, Math.min(255, Math.round(v * 255))); return `rgb(${c},${c},${c})`; };

function makeDoorLeafTextures(kind) {
  const c = makeCanvas(DOOR_W, DOOR_H), ctx = c.getContext('2d');
  const h = makeCanvas(DOOR_W, DOOR_H), hctx = h.getContext('2d');
  const r = makeCanvas(DOOR_W, DOOR_H), rctx = r.getContext('2d');
  const wood = kind === 'wood';

  // ---------- COULEUR : bois (ou sous-couche) avec son fil
  const base = wood ? [118, 72, 42] : [178, 176, 172];
  ctx.fillStyle = `rgb(${base})`; ctx.fillRect(0, 0, DOOR_W, DOOR_H);
  const grain = (x0, y0, x1, y1, vertical) => {
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    const n = vertical ? (x1 - x0) * 0.9 : (y1 - y0) * 0.9;
    for (let i = 0; i < n; i++) {
      const t = Math.random(), dark = Math.random() < 0.55, a = (wood ? 0.1 : 0.035) + Math.random() * (wood ? 0.16 : 0.05);
      ctx.strokeStyle = dark ? `rgba(40,20,8,${a})` : `rgba(150,96,58,${a})`;
      if (!wood) ctx.strokeStyle = dark ? `rgba(90,90,90,${a})` : `rgba(230,230,230,${a})`;
      ctx.lineWidth = 0.6 + Math.random() * 1.8; ctx.beginPath();
      if (vertical) { const x = x0 + t * (x1 - x0), wob = Math.random() * 3; for (let y = y0; y <= y1; y += 16) ctx.lineTo(x + Math.sin(y * 0.02 + i) * wob, y); }
      else { const y = y0 + t * (y1 - y0), wob = Math.random() * 3; for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, y + Math.sin(x * 0.05 + i) * wob); }
      ctx.stroke();
    }
    // quelques nœuds / flammes sur le bois verni
    if (wood) for (let k = 0; k < 2; k++) {
      const cx = x0 + Math.random() * (x1 - x0), cy = y0 + Math.random() * (y1 - y0), g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10 + Math.random() * 14);
      g.addColorStop(0, 'rgba(40,20,8,0.3)'); g.addColorStop(1, 'rgba(40,20,8,0)'); ctx.fillStyle = g; ctx.fillRect(cx - 30, cy - 30, 60, 60);
    }
    ctx.restore();
  };
  const sL = dX(D_STILE), sR = dX(0.63 - D_STILE);
  grain(0, 0, sL, DOOR_H, true); grain(sR, 0, DOOR_W, DOOR_H, true);                               // montants : fil vertical
  for (const [y0, y1] of [[0, 0.15], [0.65, 0.9], [2.0, 2.35]]) grain(sL, dY(y1), sR, dY(y0), false);   // traverses : fil horizontal
  grain(dX(D_PANEL[0]), dY(D_PANEL[3]), dX(D_PANEL[2]), dY(D_PANEL[1]), true);                             // panneau : fil vertical

  // ---------- RELIEF
  hctx.fillStyle = dGrey(0.55); hctx.fillRect(0, 0, DOOR_W, DOOR_H);
  // panneau surélevé : moulure (petite saillie), gorge, chanfrein qui remonte, table plate
  const panelProfile = i => i < 4 ? 0.68 : i < 8 ? 0.28 : i < 30 ? 0.34 + (i - 8) / 22 * 0.4 : 0.74;
  for (let i = 0; i < 60; i++) { hctx.fillStyle = dGrey(panelProfile(i)); dRectPx(hctx, D_PANEL, i); }
  // moulure saillante (bolection) autour de la vitre : bourrelet sur 10 px à l'extérieur de la baie
  for (let i = -10; i <= 0; i++) { const t = (i + 10) / 10; hctx.fillStyle = dGrey(0.55 + 0.3 * Math.sin(t * Math.PI)); dRectPx(hctx, D_GLASS, i); }
  hctx.fillStyle = dGrey(0.3); dRectPx(hctx, D_GLASS, 1);
  // assemblages traverse / montant : fente sombre
  hctx.fillStyle = dGrey(0.42);
  for (const [y0, y1] of [[0, 0.15], [0.65, 0.9], [2.0, 2.35]]) { hctx.fillRect(sL - 1, dY(y1), 2, dY(y0) - dY(y1)); hctx.fillRect(sR - 1, dY(y1), 2, dY(y0) - dY(y1)); }
  // fil du bois à peine en relief
  for (let i = 0; i < 400; i++) { hctx.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},0.05)`; hctx.fillRect(Math.random() * DOOR_W, Math.random() * DOOR_H, 1, 20 + Math.random() * 60); }

  // ---------- Vernis / peinture plus sombre dans les creux (lecture de la hauteur)
  {
    const hd = hctx.getImageData(0, 0, DOOR_W, DOOR_H).data, img = ctx.getImageData(0, 0, DOOR_W, DOOR_H), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = hd[i] / 255, k = 0.72 + 0.5 * Math.min(1, v / 0.55); d[i] *= k; d[i + 1] *= k; d[i + 2] *= k; }
    ctx.putImageData(img, 0, 0);
  }

  // ---------- Usure : écaillures (peinture), poignée, bas de porte, sel
  if (!wood) {
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * DOOR_W, y = DOOR_H * (0.55 + 0.45 * Math.pow(Math.random(), 0.6)), rw = 2 + Math.random() * 7, rh = 1 + Math.random() * 5;
      ctx.fillStyle = 'rgba(58,40,26,0.9)'; ctx.beginPath(); ctx.ellipse(x, y, rw, rh, Math.random() * 3, 0, Math.PI * 2); ctx.fill();   // bois à nu
      rctx.fillStyle = 'rgba(245,245,245,0.9)'; rctx.beginPath(); rctx.ellipse(x, y, rw, rh, 0, 0, Math.PI * 2); rctx.fill();
    }
  }
  // patine des mains autour de la poignée (côté intérieur du vantail, x = 0.63 m)
  const gh = ctx.createRadialGradient(DOOR_W - 18, dY(1.05), 0, DOOR_W - 18, dY(1.05), 60);
  gh.addColorStop(0, wood ? 'rgba(20,10,4,0.45)' : 'rgba(40,40,40,0.35)'); gh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gh; ctx.fillRect(DOOR_W - 90, dY(1.05) - 70, 90, 140);
  // coups de pied et frottements en bas
  for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(20,14,10,${0.08 + Math.random() * 0.15})`; ctx.fillRect(Math.random() * DOOR_W, dY(0.05 + Math.random() * 0.35), 4 + Math.random() * 18, 1 + Math.random() * 2); }
  // trace de sel : liseré blanchâtre irrégulier à 8–22 cm, voile en dessous (la neige fond contre la porte)
  for (let x = 0; x < DOOR_W; x += 2) {
    const yLine = dY(0.12 + 0.07 * Math.sin(x * 0.045) * Math.sin(x * 0.013 + 1.3) + Math.random() * 0.01);
    ctx.fillStyle = 'rgba(225,228,232,0.35)'; ctx.fillRect(x, yLine, 2, 2 + Math.random() * 2);
    ctx.fillStyle = 'rgba(210,214,220,0.12)'; ctx.fillRect(x, yLine, 2, DOOR_H - yLine);
  }
  addGrain(ctx, DOOR_W, DOOR_H, wood ? 10 : 7);

  // ---------- RUGOSITÉ : vernis lustré (0,35), usé mat aux coins et au bas
  rctx.globalCompositeOperation = 'destination-over';
  rctx.fillStyle = dGrey(wood ? 0.38 : 0.5); rctx.fillRect(0, 0, DOOR_W, DOOR_H);
  rctx.globalCompositeOperation = 'source-over';
  const gb = rctx.createLinearGradient(0, dY(0.5), 0, DOOR_H); gb.addColorStop(0, 'rgba(230,230,230,0)'); gb.addColorStop(1, 'rgba(230,230,230,0.7)');
  rctx.fillStyle = gb; rctx.fillRect(0, dY(0.5), DOOR_W, DOOR_H - dY(0.5));

  const map = toTexture(c, true, false), normal = toTexture(heightToNormal(h, 3.5), false, false), rough = toTexture(r, false, false);
  return { map, normal, rough };
}

/** Vitre du hall : verre dépoli éclairé de l'intérieur (plus clair en haut, vers le plafonnier),
 *  liseré gravé à 3 cm du bord, ombres floues de l'escalier et de la rampe derrière. */
function makeHallGlassTexture() {
  const W = 128, H = 256, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fff0d0'); g.addColorStop(0.45, '#d9b88a'); g.addColorStop(1, '#8a6a48');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // silhouettes floues : limon d'escalier en diagonale, barreaux, porte du fond
  ctx.filter = 'blur(6px)';
  ctx.strokeStyle = 'rgba(60,38,20,0.55)'; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(-10, H * 0.95); ctx.lineTo(W * 0.9, H * 0.35); ctx.stroke();
  ctx.lineWidth = 4; for (let k = 0; k < 6; k++) { const x = k * 22; ctx.beginPath(); ctx.moveTo(x, H * 0.95 - x * 0.66); ctx.lineTo(x, H * 0.72 - x * 0.66); ctx.stroke(); }
  ctx.fillStyle = 'rgba(70,45,24,0.4)'; ctx.fillRect(W * 0.62, H * 0.3, W * 0.26, H * 0.62);
  ctx.filter = 'none';
  // verre dépoli : grain fin, liseré gravé (plus clair) et coins ornés
  addGrain(ctx, W, H, 16);
  ctx.strokeStyle = 'rgba(255,248,230,0.55)'; ctx.lineWidth = 2; ctx.strokeRect(10, 10, W - 20, H - 20);
  ctx.strokeStyle = 'rgba(255,248,230,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(15, 15, W - 30, H - 30);
  for (const [x, y] of [[10, 10], [W - 10, 10], [10, H - 10], [W - 10, H - 10]]) { ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.stroke(); }
  return toTexture(c, true, false);
}

/** Imposte : une seule vitre éclairée, le NUMÉRO de l'immeuble peint à la feuille d'or

  addGrain(ctx, W, H, 12);

/* ───────────────────────── src/textures/shop.js ───────────────────────── */
/** Intérieur de boutique vu à travers la vitrine : plafond de néons, rayonnages,
 *  produits, comptoir. Trois ambiances selon le type de commerce. La texture se
 *  répète horizontalement (~4 m par tuile) pour suivre la largeur de la baie. */
// palettes d'emballages : couleurs franches de marques, mais pas l'arc-en-ciel
const GROCERY = ['#c8202a', '#e8b81a', '#1a4fa0', '#efe9dc', '#e2641a', '#2a7a34', '#5a2a7a', '#1c1c1c', '#8a1a22', '#f0e04a'];
const PHARMA = ['#f4f4f0', '#e8eef4', '#d8e8f0', '#f0dce4', '#1a4fa0', '#c8202a', '#f4f4f0', '#dfeadf'];
function makeShopInteriorTexture(kind) {
  const W = 1024, H = 384, c = makeCanvas(W, H), ctx = c.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);

  if (kind === 'laundry') {
    // laverie : murs pâles, lumière froide, rangée de machines blanches à hublot sombre
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#e9f2ee'); g.addColorStop(1, '#a9b8b3');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ceiling(ctx, W, H, '#f4fbff');
    for (let x = 12; x < W; x += 132) {
      ctx.fillStyle = '#f2f4f2'; roundRect(ctx, x, H * 0.36, 118, H * 0.5, 8); ctx.fill();
      ctx.fillStyle = '#c9ced0'; ctx.fillRect(x + 8, H * 0.38, 102, 22);                        // bandeau de commandes
      ctx.fillStyle = '#1a2026'; ctx.beginPath(); ctx.arc(x + 59, H * 0.66, 34, 0, 7); ctx.fill(); // hublot
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x + 48, H * 0.62, 12, 0, 7); ctx.fill();
    }
    floor(ctx, W, H, '#b9c0c4', '#8e979c');
  } else if (kind === 'bright') {
    // pharmacie / ongles / encaissement : blanc clinique, rayonnages clairsemés, affiche promo
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fbfbf7'); g.addColorStop(1, '#c8c6bf');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ceiling(ctx, W, H, '#ffffff');
    for (let y = H * 0.32; y < H * 0.82; y += H * 0.17) shelf(ctx, W, y, 0.6, H * 0.17, PHARMA);
    ctx.fillStyle = Math.random() < 0.5 ? '#c8202a' : '#1a4fa0'; ctx.fillRect(W * 0.7, H * 0.28, W * 0.22, H * 0.36);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 52px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('SALE', W * 0.81, H * 0.5);
    floor(ctx, W, H, '#d9d9d4', '#a9a9a3');
  } else {
    // épicerie / bodega / liquor : chaleur, rayonnages pleins de couleurs, frigo vitré à droite, comptoir
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#b89a78'); g.addColorStop(1, '#4a3424');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ceiling(ctx, W, H, '#fff1c8');
    // rayonnages : remplissage inégal, couleurs d'emballages ternies par la vitre et la distance
    for (let y = H * 0.3; y < H * 0.86; y += H * 0.185) shelf(ctx, W * 0.72, y, 0.85, H * 0.185, GROCERY);
    // ombre portée des étagères et des montants : casse la régularité du motif
    for (let x = 0; x < W * 0.72; x += 170 + Math.random() * 90) { ctx.fillStyle = 'rgba(20,12,6,0.55)'; ctx.fillRect(x, H * 0.18, 10 + Math.random() * 8, H * 0.7); }
    const sh = ctx.createLinearGradient(0, H * 0.16, 0, H * 0.5); sh.addColorStop(0, 'rgba(0,0,0,0.45)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh; ctx.fillRect(0, H * 0.16, W, H * 0.34);
    // vitrine réfrigérée : panneau bleuté lumineux, montants, canettes en lignes
    ctx.fillStyle = '#dff0ff'; ctx.fillRect(W * 0.74, H * 0.22, W * 0.26, H * 0.66);
    for (let y = H * 0.3; y < H * 0.86; y += 36) {                 // bouteilles par rangées d'une même marque
      for (let x = W * 0.75; x < W * 0.99;) {
        const col = GROCERY[Math.floor(Math.random() * GROCERY.length)], n = 2 + Math.floor(Math.random() * 4);
        for (let k = 0; k < n && x < W * 0.99; k++, x += 13) {
          ctx.fillStyle = col; ctx.fillRect(x, y + 8, 10, 24); ctx.fillRect(x + 3, y, 4, 9);
          ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x, y + 16, 10, 6);
        }
        x += 4;
      }
      ctx.fillStyle = 'rgba(200,210,220,0.9)'; ctx.fillRect(W * 0.74, y + 33, W * 0.26, 3);
    }
    ctx.fillStyle = '#2a2f35'; for (const x of [W * 0.74, W * 0.865, W * 0.99]) ctx.fillRect(x - 3, H * 0.22, 6, H * 0.66);
    floor(ctx, W, H, '#7a6a5a', '#3a3028');
    // comptoir au premier plan, à gauche
    ctx.fillStyle = '#3a2a1e'; ctx.fillRect(0, H * 0.7, W * 0.3, H * 0.3);
    ctx.fillStyle = '#8a7a66'; ctx.fillRect(0, H * 0.7, W * 0.3, 10);
  }
  addGrain(ctx, W, H, 10);
  return toTexture(c, true, true);

  function ceiling(ctx, W, H, col) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H * 0.16);
    for (let x = 30; x < W; x += 210) {
      ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.fillStyle = col; ctx.fillRect(x, H * 0.05, 150, 14); ctx.shadowBlur = 0;
    }
  }
  // Une tablette de produits : des LOTS d'articles identiques côte à côte (les
  // « facings » d'un vrai rayon), chacun avec sa forme — canette, boîte, bouteille,
  // sachet — et sa bande d'étiquette ; bande de prix blanche sur le chant. L'ancienne
  // version tirait des rectangles hauts et fins de teinte aléatoire : on lisait une
  // bibliothèque, pas une épicerie.
  function shelf(ctx, W, y, fill, rowH, palette) {
    const sh = ctx.createLinearGradient(0, y - rowH, 0, y - rowH * 0.55);           // ombre sous la tablette du dessus
    sh.addColorStop(0, 'rgba(0,0,0,0.5)'); sh.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = sh; ctx.fillRect(0, y - rowH, W, rowH * 0.45);
    for (let x = 4; x < W;) {
      const type = Math.random(), col = palette[Math.floor(Math.random() * palette.length)];
      const lab = Math.random() < 0.5 ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.35)';
      let w, h, draw;
      if (type < 0.3) { w = rowH * 0.2; h = rowH * 0.34; draw = (px) => { ctx.fillStyle = col; ctx.fillRect(px, y - h, w, h); ctx.fillStyle = lab; ctx.fillRect(px, y - h * 0.7, w, h * 0.35); ctx.fillStyle = 'rgba(220,220,220,0.8)'; ctx.fillRect(px, y - h, w, 2); }; }
      else if (type < 0.6) { w = rowH * rnd(0.28, 0.42); h = rowH * rnd(0.5, 0.72); draw = (px) => { ctx.fillStyle = col; ctx.fillRect(px, y - h, w, h); ctx.fillStyle = lab; ctx.fillRect(px + 2, y - h * 0.75, w - 4, h * 0.3); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(px + w - 3, y - h, 3, h); }; }
      else if (type < 0.8) { w = rowH * 0.16; h = rowH * rnd(0.6, 0.78); draw = (px) => { ctx.fillStyle = col; ctx.fillRect(px, y - h * 0.68, w, h * 0.68); ctx.fillRect(px + w * 0.3, y - h, w * 0.4, h * 0.34); ctx.fillStyle = lab; ctx.fillRect(px, y - h * 0.5, w, h * 0.22); }; }
      else { w = rowH * 0.38; h = rowH * 0.5; draw = (px) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + 2, y - h); ctx.quadraticCurveTo(px + w / 2, y - h - 6, px + w - 2, y - h); ctx.lineTo(px + w, y); ctx.fill(); ctx.fillStyle = lab; ctx.fillRect(px + 4, y - h * 0.6, w - 8, h * 0.28); }; }
      const n = 2 + Math.floor(Math.random() * 5);
      if (Math.random() > fill) { x += w * n * 0.6; continue; }                    // trou dans le rayon
      for (let k = 0; k < n && x + w < W; k++, x += w + 1) draw(x);
      x += 3;
    }
    ctx.fillStyle = 'rgba(30,20,12,0.9)'; ctx.fillRect(0, y, W, 5);                  // tablette
    ctx.fillStyle = 'rgba(235,235,225,0.9)'; ctx.fillRect(0, y + 5, W, 4);           // bande de prix
    for (let x = 10; x < W; x += rnd(40, 90)) { ctx.fillStyle = '#f2d21a'; ctx.fillRect(x, y + 5, 10, 4); }
  }
  function floor(ctx, W, H, a, b) {
    const g = ctx.createLinearGradient(0, H * 0.86, 0, H); g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, H * 0.86, W, H * 0.14);
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
}

/** Petit néon « OPEN » posé dans la vitrine. Couleur > 1 côté matériau pour le bloom. */

/** Planche d'autocollants et de néons de vitrine — ce qui fait qu'une vitrine de
 *  bodega new-yorkaise se reconnaît de loin : LOTTO, ATM, EBT, cartes acceptées,
 *  affiche de promo, et des néons de bière / glace / café. Une seule texture
 *  1024×512 découpée en cases ; `DECALS` donne pour chaque motif sa case (en px),
 *  sa taille réelle (m) et s'il s'agit d'un néon (rendu lumineux, bloom). */
const DECALS = [
  { key: 'lotto',  px: [0, 0, 256, 128],     size: [0.46, 0.23], neon: false },
  { key: 'atm',    px: [256, 0, 128, 128],   size: [0.24, 0.24], neon: false },
  { key: 'ebt',    px: [384, 0, 256, 128],   size: [0.36, 0.18], neon: false },
  { key: 'cards',  px: [640, 0, 256, 128],   size: [0.3, 0.15], neon: false },
  { key: 'promo',  px: [896, 0, 128, 256],   size: [0.42, 0.84], neon: false },
  { key: 'menu',   px: [0, 128, 192, 256],   size: [0.36, 0.48], neon: false },
  { key: 'beer',   px: [192, 128, 320, 128], size: [0.62, 0.25], neon: true },
  { key: 'ice',    px: [512, 128, 192, 128], size: [0.42, 0.28], neon: true },
  { key: 'coffee', px: [704, 128, 192, 128], size: [0.46, 0.3], neon: true },
  { key: 'atmneon',px: [192, 256, 256, 128], size: [0.5, 0.25], neon: true },
];
function makeWindowDecalAtlas() {
  const W = 1024, H = 512, c = makeCanvas(W, H), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const R = k => DECALS.find(d => d.key === k).px;
  const txt = (s, x, y, size, col, font = 'Impact, "Arial Narrow", sans-serif') => { ctx.font = `bold ${size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y); };
  const plate = (k, bg, pad = 6) => { const [x, y, w, h] = R(k); ctx.fillStyle = bg; ctx.fillRect(x + pad, y + pad, w - 2 * pad, h - 2 * pad); return [x, y, w, h]; };
  // autocollants imprimés (fond opaque, un peu passés par le soleil)
  { const [x, y, w, h] = plate('lotto', '#f2c21a'); ctx.fillStyle = '#c8202a'; ctx.fillRect(x + 14, y + 14, w - 28, h - 28); txt('LOTTO', x + w / 2, y + h / 2 + 4, 72, '#ffe24a'); }
  { const [x, y, w, h] = plate('atm', '#1a4fa0'); txt('ATM', x + w / 2, y + h / 2 + 4, 56, '#ffffff'); }
  { const [x, y, w, h] = plate('ebt', '#f4f4ee'); txt('EBT', x + 70, y + h / 2, 60, '#1a6a2a'); txt('ACCEPTED', x + 175, y + h / 2, 30, '#1a1a1a', 'Arial, sans-serif'); }
  { const [x, y, w, h] = plate('cards', '#e8e8e2');
    for (const [i, col] of ['#1a3a8a', '#d8261a', '#f0a018'].entries()) { ctx.fillStyle = col; ctx.fillRect(x + 20 + i * 76, y + 34, 64, 42); }
    txt('WE ACCEPT', x + w / 2, y + 100, 22, '#222', 'Arial, sans-serif'); }
  { const [x, y, w, h] = plate('promo', '#d8261a'); txt('SALE', x + w / 2, y + 60, 44, '#ffffff'); txt('2 FOR', x + w / 2, y + 120, 30, '#ffe24a'); txt('$5', x + w / 2, y + 175, 70, '#ffffff'); }
  { const [x, y, w, h] = plate('menu', '#efe6d0'); txt('MENU', x + w / 2, y + 34, 34, '#8a1a12');
    ctx.fillStyle = 'rgba(40,30,20,0.7)'; for (let k = 0; k < 9; k++) { ctx.fillRect(x + 22, y + 66 + k * 19, 90 + Math.random() * 40, 5); ctx.fillRect(x + w - 50, y + 66 + k * 19, 26, 5); } }
  // néons : tube coloré sur fond transparent, halo par flou
  const neon = (k, lines) => {
    const [x, y, w, h] = R(k);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    for (const [s, dx, dy, size, col] of lines) {
      ctx.font = `bold ${size}px "Brush Script MT", "Segoe Script", cursive`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = col; ctx.shadowBlur = 22; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.strokeText(s, x + w / 2 + dx, y + h / 2 + dy);
      ctx.shadowBlur = 6; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6; ctx.strokeText(s, x + w / 2 + dx, y + h / 2 + dy);
    }
    ctx.restore();
  };
  neon('beer', [['Cold Beer', 0, 4, 76, '#ff9a2a']]);
  neon('ice', [['ICE', 0, 4, 84, '#4ac8ff']]);
  neon('coffee', [['Coffee', 0, 4, 64, '#ff4a8a']]);
  neon('atmneon', [['ATM', 0, 4, 84, '#6aff7a']]);
  return toTexture(c, true, false);
}

/** Lambrequin imprimé : le nom du commerce et un numéro de téléphone en lettres
 *  claires sur la toile, comme sur la quasi-totalité des stores new-yorkais. */
function makeValanceTexture(name, bgHex) {
  const W = 1024, H = 64, c = makeCanvas(W, H), ctx = c.getContext('2d');

/** Toile rayée (deux bandes : couleur / crème) répétée sur la largeur du store. */
function makeStripeTexture(bgHex) {

// carrelage photo (dirty_tiles, tuile de 2,3 m) pour le sol des épiceries : uniformes
// PARTAGÉS par tous les intérieurs, remplis quand la photo est chargée (secours : damier)
const floorPhoto = { uFloorTex: { value: null }, uFloorReady: { value: 0 } };
loadPhotoSet('dirty_tiles').then(set => { floorPhoto.uFloorTex.value = set.map; floorPhoto.uFloorReady.value = 1; }).catch(() => {});

/* =====================================================================
   6 bis. INTÉRIEURS DE BOUTIQUE EN FAUSSE 3D (« interior mapping »)
   L'intérieur était une image plate collée 35 cm derrière la vitre : aucune
   profondeur, et dès qu'on se déplaçait on voyait que c'était un poster. Ici le
   plan derrière la vitre ne montre pas une image, il CALCULE ce qu'on verrait dans
   une pièce de 4 m de profond : pour chaque pixel, on prolonge le rayon de vue
   derrière la vitre et on cherche quelle paroi il touche en premier — sol carrelé,
   plafond à tubes fluorescents, murs latéraux, mur du fond (la texture de rayonnages,
   de machines…) — et, devant le fond, une gondole basse qui passe devant le mur.
   Un seul plan, donc un seul appel de dessin, mais une vraie parallaxe : les
   rayons glissent les uns devant les autres quand on longe la vitrine.
   Repère : celui du plan (x le long de la vitrine, y vers le haut, z vers la rue) ;
   la pièce s'étend vers z < 0.
   ===================================================================== */
const interiorVS = `
  varying vec3 vP, vCam;
  #include <fog_pars_vertex>
  void main(){
    vP = position;
    vCam = (inverse(modelMatrix) * vec4(cameraPosition, 1.0)).xyz;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const interiorFS = `
  uniform sampler2D uWall;
  uniform vec3 uTint, uFloorA, uFloorB, uCeil;
  uniform float uHW, uYF, uYC, uDepth, uGondZ, uGondH, uGondOn, uBright, uFloorReady, uFloorUse;
  uniform sampler2D uFloorTex;
  varying vec3 vP, vCam;
  #include <fog_pars_fragment>
  // un rayon qui part du pixel de la vitre, vers l'intérieur
  void main(){
    vec3 d = normalize(vP - vCam);
    if (d.z >= -1e-4) discard;
    vec3 o = vP;
    float xw = uHW + 0.35;                                      // la pièce déborde un peu la vitrine
    float tx = ((d.x > 0.0 ? xw : -xw) - o.x) / d.x;
    float ty = ((d.y > 0.0 ? uYC : uYF) - o.y) / d.y;
    float tz = (-uDepth - o.z) / d.z;
    float t = min(tx, min(ty, tz));
    vec3 h = o + d * t, col;
    float wallV = (h.y - uYF) / (uYC - uYF);
    if (t == tz) {                                              // mur du fond : rayonnages, machines…
      col = texture2D(uWall, vec2((h.x + xw) / 4.2, wallV)).rgb;
    } else if (t == tx) {                                       // murs latéraux : même décor, en retrait et plus sombre
      col = texture2D(uWall, vec2(-h.z / 4.2 + 0.37 * sign(d.x), wallV)).rgb * 0.62;
    } else if (d.y < 0.0) {                                     // sol : carrelage, reflet laiteux des tubes au fond
      vec2 g = floor(h.xz / 0.3);
      col = mix(uFloorA, uFloorB, mod(g.x + g.y, 2.0));
      if (uFloorReady * uFloorUse > 0.5) col = texture2D(uFloorTex, h.xz / 2.3).rgb * 0.85;   // carrelage photo (épiceries)
      col *= 0.8 + 0.5 * smoothstep(0.0, uDepth, -h.z);
    } else {                                                    // plafond : dalles sombres + tubes fluorescents
      float strip = step(0.84, fract(-h.z / 1.3 + 0.2)) * step(abs(h.x), xw - 0.4);
      col = uCeil * 0.35 + uCeil * 2.2 * strip;
    }
    // gondole basse devant le fond : coupe le rayon si elle est touchée avant la paroi
    if (uGondOn > 0.5) {
      float tg = (-uGondZ - o.z) / d.z;
      vec3 hg = o + d * tg;
      float gap = step(0.9, fract((hg.x + xw) / 3.1));          // allées tous les ~3 m
      if (tg < t && hg.y < uYF + uGondH && gap < 0.5) {
        float gv = (hg.y - uYF) / uGondH;
        col = texture2D(uWall, vec2((hg.x + xw) / 3.3 + 0.5, 0.3 + gv * 0.34)).rgb * 0.9;
        col *= step(gv, 0.97) * 0.85 + 0.15;                    // chant supérieur sombre
        t = tg; h = hg;
      }
    }
    // occlusion aux angles de la pièce, lumière qui baisse vers le fond
    float edge = min(min(h.y - uYF, uYC - h.y), xw - abs(h.x));
    col *= 0.55 + 0.45 * smoothstep(0.0, 0.6, edge);
    col *= mix(1.0, 0.65, clamp(-h.z / (uDepth * 1.4), 0.0, 1.0));
    gl_FragColor = vec4(col * uTint * uBright, 1.0);
    #include <fog_fragment>
  }`;

const KIND_STYLE = {
  grocery: { tint: [1.0, 0.88, 0.72], floorA: [0.36, 0.3, 0.24], floorB: [0.22, 0.18, 0.14], ceil: [1.0, 0.92, 0.75], gond: 1, gondH: 1.35 },
  laundry: { tint: [0.86, 0.96, 1.0], floorA: [0.72, 0.74, 0.74], floorB: [0.5, 0.52, 0.54], ceil: [0.9, 0.97, 1.0], gond: 1, gondH: 0.9 },
  bright:  { tint: [1.0, 0.98, 0.94], floorA: [0.78, 0.78, 0.76], floorB: [0.62, 0.62, 0.6], ceil: [1.0, 1.0, 0.98], gond: 1, gondH: 1.2 },
};

/** Matériau d'intérieur pour une vitrine de largeur `w` (m) et de hauteur `h` (m),
 *  dont le bas est à `floorBelow` m au-dessus du sol intérieur. */
function makeInteriorMaterial(wallTex, kind, w, h, floorBelow) {
  const st = KIND_STYLE[kind] ?? KIND_STYLE.grocery;
  const mat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
      uWall: { value: wallTex },
      uTint: { value: new THREE.Vector3(...st.tint) }, uFloorA: { value: new THREE.Vector3(...st.floorA) },
      uFloorB: { value: new THREE.Vector3(...st.floorB) }, uCeil: { value: new THREE.Vector3(...st.ceil) },
      uHW: { value: w / 2 }, uYF: { value: -h / 2 - floorBelow }, uYC: { value: h / 2 + 0.75 },
      uDepth: { value: 4.0 }, uGondZ: { value: 1.5 + Math.random() * 0.5 }, uGondH: { value: st.gondH }, uGondOn: { value: st.gond },
      uBright: { value: 0.85 },
    }]),
    vertexShader: interiorVS, fragmentShader: interiorFS, fog: true,
  });
  Object.assign(mat.uniforms, floorPhoto);                     // après le merge : objets partagés, pas des copies
  mat.uniforms.uFloorUse = { value: kind === 'grocery' ? 1 : 0 };
  return mat;
}

/* =====================================================================
   17. SUJETS PHOTOGRAPHIABLES
   Chaque élément de la rue qui peut faire l'objet d'une photo s'inscrit ici au
   moment où il est construit (véhicules, néon, lampadaires, vapeur, feux, portes,
   vitrines, escaliers de secours, châteaux d'eau…). La notation (game/scoring.js)
   ne connaît que ce registre : ajouter un sujet, c'est UN appel à addSubject.

   Champs :
     label   nom lisible (« Le néon DELI – PIZZA »)
     value   intérêt du sujet, 0..1 (le néon du deli vaut plus qu'une voiture garée)
     object  objet 3D dont la boîte englobante sert d'emprise (calculée au 1er besoin,
             quand les matrices sont figées) — OU —
     box     emprise explicite (THREE.Box3, coordonnées monde) : obligatoire pour les
             objets dont la boîte serait faussée (lampadaire : sa sphère de diffusion
             de 4,5 m engloberait la moitié de la rue)
     glows   sujet lumineux : il reste visible dans la brume (néon, feux, vitrine)
     moment  () => { pts, why } | null : bonus de l'instant (gyrophares allumés,
             feu au rouge…), évalué AU DÉCLENCHEMENT
     active  () => bool (facultatif) : sujet présent seulement par moments — prévu
             pour les apparitions temporaires (un oiseau pendant 2 minutes…)
   ===================================================================== */
const photoSubjects = [];

function addSubject(s) { photoSubjects.push(s); return s; }

/** Emprise monde du sujet (mise en cache : la scène est statique). */
function subjectBox(s) {
  if (!s._box) s._box = s.box ? s.box.clone() : new THREE.Box3().setFromObject(s.object);
  return s._box;
}

/** Boîte à partir d'un centre (x, z), d'un intervalle de hauteur et de demi-largeurs. */
function boxAt(x, z, hx, hz, y0, y1) {
  return new THREE.Box3(new THREE.Vector3(x - hx, y0, z - hz), new THREE.Vector3(x + hx, y1, z + hz));
}
